ضرة: حُدِّد نوعان من التشوّه، تشوّه الحجم (التكبير) وتشوّه الشكل."}, {"q_en": "Which of the following is listed in the lecture as a factor that affects distortion?", "q_ar": "أيّ مما يلي مذكور في المحاضرة عاملاً يؤثر في التشوّه؟", "options": [{"en": "mA (tube current)", "ar": "الملي أمبير (تيار الأنبوب)"}, {"en": "Exposure time in milliseconds", "ar": "زمن التعرّض بالملي ثانية"}, {"en": "Object to image receptor distance (OID)", "ar": "المسافة بين الجسم ومستقبِل الصورة (OID)"}, {"en": "Pixel brightness on the monitor", "ar": "سطوع البكسل على الشاشة"}], "answer": 2, "why": "العوامل المذكورة: SID، وموضع الأنبوب، وOID."}, {"q_en": "Noise appears in the image as:", "q_ar": "يظهر الضجيج في الصورة على شكل:", "options": [{"en": "A uniform white area", "ar": "منطقة بيضاء متجانسة"}, {"en": "An irregular granular pattern", "ar": "نمط حبيبي غير منتظم"}, {"en": "An enlarged body part", "ar": "جزء مكبَّر من الجسم"}, {"en": "A sharp line that repeats in the same place on every image", "ar": "خط حاد يتكرر في المكان نفسه في كل صورة"}], "answer": 1, "why": "المحاضرة: يظهر الضجيج بنمط حبيبي غير منتظم في جميع الصور ويُضعف معلومات الصورة."}, {"q_en": "How do other artifacts differ from noise?", "q_ar": "كيف تختلف الآثار الصناعية الأخرى عن الضجيج؟", "options": [{"en": "They are part of the desired signal", "ar": "جزء من الإشارة المطلوبة"}, {"en": "They are more random than noise", "ar": "أكثر عشوائية من الضجيج"}, {"en": "They are present in all electronic systems and come from electronic interference", "ar": "موجودة في جميع الأنظمة الإلكترونية ومصدرها التداخل الإلكتروني"}, {"en": "They are less random and should be repeatable in theory", "ar": "أقل عشوائية ويُفترض نظرياً أن تتكرر"}], "answer": 3, "why": "الآثار الصناعية الأخرى أقل عشوائية ويُفترض أن تتكرر، أما الضجيج فعشوائي، مع أنه هو نفسه نوع من الآثار الصناعية."}, {"q_en": "A clinic that images many children wants the system with the lowest amount of x-ray exposure. According to the lecture, which should it choose?", "q_ar": "عيادة تصوّر كثيراً من الأطفال وتريد النظام الأقل في كمية التعرّض للأشعة السينية. وفق المحاضرة، أيّها تختار؟", "options": [{"en": "Film", "ar": "الفيلم"}, {"en": "CR (computed radiography)", "ar": "التصوير المحوسب (CR)"}, {"en": "DR (digital radiography)", "ar": "التصوير الرقمي المباشر (DR)"}, {"en": "All three need the same exposure", "ar": "الثلاثة تحتاج التعرّض نفسه"}], "answer": 2, "why": "تذكر المحاضرة أن كمية التعرّض: الفيلم أكبر من CR، وCR أكبر من DR؛ فالأقل هو DR.", "kind": "apply"}, {"q_en": "A thick body part is under-penetrated on the image. Which exposure factor should be changed first to make the beam more penetrating?", "q_ar": "جزء سميك من الجسم ظهر غير مخترَق كفاية في الصورة. أيّ عامل تعرّض يُغيَّر أولاً لجعل الحزمة أكثر اختراقاً؟", "options": [{"en": "Increase the kVp", "ar": "زيادة ذروة الجهد (kVp)"}, {"en": "Increase the exposure time only", "ar": "زيادة زمن التعرّض فقط"}, {"en": "Increase the mA only", "ar": "زيادة الملي أمبير (mA) فقط"}, {"en": "Increase the OID", "ar": "زيادة المسافة بين الجسم والمستقبِل (OID)"}], "answer": 0, "why": "ذروة الجهد (kVp) هي المتحكم الأساسي في نوعية الحزمة وقدرة اختراقها، أما mA فيغيّر الكمية ولا يغيّر طاقة الإلكترونات.", "kind": "apply"}, {"q_en": "The mA is raised from 200 to 400 while kVp and time stay the same. What happens to the x-ray beam?", "q_ar": "رُفع الملي أمبير من 200 إلى 400 مع بقاء kVp والزمن كما هما. ماذا يحدث لحزمة الأشعة السينية؟", "options": [{"en": "Quality rises and quantity stays the same", "ar": "ترتفع النوعية وتبقى الكمية ثابتة"}, {"en": "Both quantity and penetrability double", "ar": "تتضاعف الكمية وقدرة الاختراق معاً"}, {"en": "Quantity falls by half", "ar": "تنخفض الكمية إلى النصف"}, {"en": "Quantity doubles while quality stays fixed", "ar": "تتضاعف الكمية وتبقى النوعية ثابتة"}], "answer": 3, "why": "العلاقة بين mA وكمية الأشعة طردية مباشرة، وتغيير mA لا يغيّر الطاقة الحركية للإلكترونات، فتبقى النوعية ثابتة.", "kind": "apply"}, {"q_en": "A patient cannot keep still. Which technique gives the same mAs as 100 mA for 0.2 s but with less risk of motion blur?", "q_ar": "مريض لا يستطيع الثبات. أيّ تقنية تعطي ملي أمبير-ثانية مساوياً لـ 100 mA لمدة 0.2 ثانية، لكن مع خطر أقل لضبابية الحركة؟", "options": [{"en": "50 mA for 0.4 s", "ar": "50 mA لمدة 0.4 ثانية"}, {"en": "400 mA for 0.05 s", "ar": "400 mA لمدة 0.05 ثانية"}, {"en": "100 mA for 0.4 s", "ar": "100 mA لمدة 0.4 ثانية"}, {"en": "200 mA for 0.2 s", "ar": "200 mA لمدة 0.2 ثانية"}], "answer": 1, "why": "mA × الزمن = mAs؛ فـ 400 × 0.05 = 20 mAs مثل 100 × 0.2، والزمن الأقصر يقلّل ضبابية حركة المريض، مع زيادة mA بالتناسب.", "kind": "apply"}, {"q_en": "A student marks every high-contrast radiograph as \"better quality\" and every low-contrast one as \"poor\". According to the lecture, what is the correct view?", "q_ar": "طالب يصف كل صورة عالية التباين بأنها «أفضل جودة»، وكل صورة منخفضة التباين بأنها «رديئة». بحسب المحاضرة، ما الرأي الصحيح؟", "options": [{"en": "High contrast is always the better choice", "ar": "التباين العالي هو الخيار الأفضل دائماً"}, {"en": "Contrast is not good or bad by itself", "ar": "التباين ليس جيداً أو سيئاً بذاته"}, {"en": "Low contrast is always the better choice", "ar": "التباين المنخفض هو الخيار الأفضل دائماً"}, {"en": "Contrast does not affect visible detail", "ar": "التباين لا يؤثر في رؤية التفاصيل"}], "answer": 1, "why": "المحاضرة: التباين المنخفض أو العالي ليس جيداً أو سيئاً بذاته، بل يعتمد على الفحص (فالصدر مثلاً يحتاج تبايناً منخفضاً)، والتباين هو ما يسمح برؤية التفاصيل التشريحية.", "kind": "apply"}, {"q_en": "An image shows mostly black and white areas with very few gray steps between them. How is its contrast described?", "q_ar": "صورة تظهر فيها مناطق سوداء وبيضاء غالباً، مع درجات رمادية قليلة جداً بينها. كيف يوصف تباينها؟", "options": [{"en": "High contrast, short-scale", "ar": "تباين عالٍ، قصير المدى"}, {"en": "Low contrast, long-scale", "ar": "تباين منخفض، طويل المدى"}, {"en": "High contrast, long-scale", "ar": "تباين عالٍ، طويل المدى"}, {"en": "No contrast at all", "ar": "لا تباين إطلاقاً"}], "answer": 0, "why": "فرق الكثافة الكبير بين المناطق المتجاورة يعني تبايناً عالياً، وقلة الدرجات الرمادية تعني مدى قصيراً.", "kind": "apply"}, {"q_en": "A digital image taken with very low mAs looks grainy and hides soft-tissue detail. Which change would most likely improve it?", "q_ar": "صورة رقمية التُقطت بملي أمبير-ثانية منخفض جداً، فظهرت محبّبة وأخفت تفاصيل الأنسجة الرخوة. أيّ تغيير يُرجَّح أن يحسّنها؟", "options": [{"en": "Lower the mAs further to reduce the noise", "ar": "خفض mAs أكثر لتقليل الضجيج"}, {"en": "Raise the mAs to increase the signal and the SNR", "ar": "رفع mAs لزيادة الإشارة ونسبة الإشارة إلى الضجيج"}, {"en": "Lower the monitor brightness to hide the grain", "ar": "خفض سطوع الشاشة لإخفاء التحبّب"}, {"en": "Increase the OID to separate the soft tissues", "ar": "زيادة المسافة بين الجسم والمستقبِل لفصل الأنسجة الرخوة"}], "answer": 1, "why": "في مفهوم SNR تُعدّ الأشعة الواصلة للمستقبِل (mAs) هي الإشارة؛ والإشارة المنخفضة مع ضجيج عالٍ تعطي صورة محبّبة، فرفع mAs يرفع النسبة. أما خفض mAs فيزيد التحبّب، وتغيير سطوع الشاشة لا يغيّر نسبة الإشارة إلى الضجيج.", "kind": "apply"}, {"q_en": "Two digital shoulder images on the monitor differ only in how light or dark the pixels appear. Which digital term describes this difference?", "q_ar": "صورتان رقميتان للكتف على الشاشة تختلفان فقط في درجة فتح أو قتامة البكسلات. أيّ مصطلح رقمي يصف هذا الفرق؟", "options": [{"en": "Spatial resolution", "ar": "الدقة المكانية"}, {"en": "Distortion", "ar": "التشوّه"}, {"en": "Brightness", "ar": "السطوع"}, {"en": "Noise", "ar": "الضجيج"}], "answer": 2, "why": "السطوع هو شدة الضوء التي تمثّل البكسلات على الشاشة، وفي التصوير الرقمي حلّ محل مصطلح الكثافة في الفيلم.", "kind": "apply"}, {"q_en": "A department compares an optimized screen-film system with an electronic (digital) detector for showing fine detail. According to the lecture, which statement is correct?", "q_ar": "يقارن قسمٌ نظام الفيلم والشاشة المضبوط جيداً بكاشف إلكتروني (رقمي) في إظهار التفاصيل الدقيقة. بحسب المحاضرة، أيّ عبارة صحيحة؟", "options": [{"en": "Screen-film is limited by pixel size; the detector is not", "ar": "الفيلم والشاشة محدود بحجم البكسل، والكاشف لا"}, {"en": "Both are limited only by the kVp selected", "ar": "كلاهما محدود بالكيلوفولت المختار فقط"}, {"en": "The detector always resolves more lp/mm than film", "ar": "الكاشف يميّز دائماً خطوطاً أكثر لكل ملم من الفيلم"}, {"en": "Screen-film is excellent; the detector is limited by pixel size", "ar": "الفيلم والشاشة ممتاز، والكاشف محدود بحجم البكسل"}], "answer": 3, "why": "المحاضرة: أنظمة الفيلم والشاشة المضبوطة جيداً دقتها المكانية ممتازة، أما الكواشف الإلكترونية فدقتها محدودة بحجم البكسل.", "kind": "apply"}, {"q_en": "System A resolves 5 lp/mm and system B resolves 2.5 lp/mm. Which statement is correct?", "q_ar": "النظام (أ) يميّز 5 أزواج خطوط لكل ملم، والنظام (ب) يميّز 2.5 زوج خطوط لكل ملم. أيّ عبارة صحيحة؟", "options": [{"en": "System B, because its number is smaller", "ar": "النظام (ب)، لأن رقمه أصغر"}, {"en": "System A, because it separates closer objects", "ar": "النظام (أ)، لأنه يميّز أجساماً أقرب"}, {"en": "Both are equal; lp/mm does not compare systems", "ar": "متساويان؛ أزواج الخطوط لا تقارن الأنظمة"}, {"en": "lp/mm measures noise, not resolution", "ar": "أزواج الخطوط لكل ملم تقيس الضجيج لا الدقة"}], "answer": 1, "why": "الدقة المكانية هي قدرة النظام على التمييز بين جسمين متقاربين وتُقاس بأزواج الخطوط لكل ملم؛ فالرقم الأعلى يعني تمييز تفاصيل أدقّ.", "kind": "apply"}, {"q_en": "A technologist wants to reduce the magnification of a hand on the image. Which change helps, according to the factors in the lecture?", "q_ar": "يريد التقني تقليل تكبير صورة اليد. أيّ تغيير يساعد، وفق العوامل المذكورة في المحاضرة؟", "options": [{"en": "Place the hand close to the image receptor (reduce OID)", "ar": "وضع اليد قريبة من مستقبِل الصورة (تقليل OID)"}, {"en": "Raise the hand on a sponge, away from the image receptor", "ar": "رفع اليد على إسفنجة بعيداً عن مستقبِل الصورة"}, {"en": "Increase the mA and shorten the time", "ar": "زيادة الملي أمبير وتقصير الزمن"}, {"en": "Use a larger pixel size", "ar": "استعمال حجم بكسل أكبر"}], "answer": 0, "why": "التكبير موجود دائماً بسبب OID وتباعد الحزمة، لكن يمكن تقليله؛ وتقليل المسافة بين الجسم والمستقبِل يقلّل التكبير.", "kind": "apply"}, {"q_en": "A round object appears elongated on the image because the tube was not placed correctly relative to the part. What type of distortion is this?", "q_ar": "ظهر جسم دائري متطاولاً في الصورة لأن الأنبوب لم يوضع بشكل صحيح بالنسبة للجزء المصوَّر. ما نوع التشوّه هذا؟", "options": [{"en": "Size distortion only", "ar": "تشوّه في الحجم فقط"}, {"en": "Noise", "ar": "ضجيج"}, {"en": "Shape distortion", "ar": "تشوّه في الشكل"}, {"en": "Motion blur", "ar": "ضبابية الحركة"}], "answer": 2, "why": "التشوّه نوعان: حجم (تكبير) وشكل؛ وتغيّر الشكل من دائري إلى متطاول تشوّه في الشكل، ومن عوامله موضع الأنبوب.", "kind": "apply"}, {"q_en": "A student claims a perfect technique can make a radiograph show a bone at exactly its true size. What is the correct reply?", "q_ar": "يقول طالب إن التقنية المثالية يمكن أن تجعل الصورة الشعاعية تُظهر العظم بحجمه الحقيقي تماماً. ما الردّ الصحيح؟", "options": [{"en": "Correct, if the kVp is high enough to penetrate the bone", "ar": "صحيح، إذا كانت ذروة الجهد عالية كفاية لاختراق العظم"}, {"en": "Correct, if a digital flat panel detector is used instead of film", "ar": "صحيح، إذا استُعمل كاشف رقمي مسطّح بدل الفيلم"}, {"en": "Correct, if the exposure time is very short", "ar": "صحيح، إذا كان زمن التعرّض قصيراً جداً"}, {"en": "Not possible; some magnification always exists, but it can be minimized", "ar": "غير ممكن؛ بعض التكبير موجود دائماً، لكن يمكن تقليله"}], "answer": 3, "why": "تذكر المحاضرة أنه لا توجد صورة شعاعية تعيد الحجم الحقيقي بالضبط، لأن التكبير أو التشوّه موجود دائماً بسبب OID وتباعد الحزمة، ويمكن تقليله فقط.", "kind": "apply"}, {"q_en": "Image X has a fine random granular pattern that changes from one exposure to the next; image Y has a line that appears in the same place every time. Which is noise?", "q_ar": "الصورة (س) فيها نمط حبيبي عشوائي ناعم يتغيّر من تعرّض إلى آخر، والصورة (ص) فيها خط يظهر في المكان نفسه كل مرة. أيّهما الضجيج؟", "options": [{"en": "The granular pattern in X, because noise is random", "ar": "النمط الحبيبي في (س)، لأن الضجيج عشوائي"}, {"en": "The line in Y, because it repeats", "ar": "الخط في (ص)، لأنه يتكرر"}, {"en": "Both are noise, since both degrade the image", "ar": "كلاهما ضجيج، لأن كليهما يُضعف الصورة"}, {"en": "Neither; noise never appears on images", "ar": "لا أحد منهما؛ الضجيج لا يظهر في الصور"}], "answer": 0, "why": "الضجيج نمط حبيبي غير منتظم، أما الآثار الصناعية الأخرى فأقل عشوائية ويُفترض أن تتكرر نظرياً.", "kind": "apply"}, {"q_en": "Look at the numbered step scale beside this chest radiograph. How is the contrast of this image described?", "q_ar": "انظر إلى السُّلّم الرمادي المرقّم بجانب صورة الصدر هذه. كيف يوصف تباين هذه الصورة؟", "options": [{"en": "Low contrast (long-scale)", "ar": "تباين منخفض (طويل المدى)"}, {"en": "High contrast (short-scale)", "ar": "تباين عالٍ (قصير المدى)"}, {"en": "Low brightness", "ar": "سطوع منخفض"}, {"en": "High noise", "ar": "ضجيج عالٍ"}], "answer": 0, "why": "شرح الصورة في المحاضرة: هذه الصورة منخفضة التباين طويلة المدى (110 كيلوفولت و10 mAs)، والسُّلّم بجانبها يُظهر درجات رمادية كثيرة؛ والمدى يعني المجال الكلي للكثافات من الأفتح إلى الأغمق.", "kind": "image", "img": {"src": "assets/quiz-img/radiography-t02/radiography-t02-418eef.jpg", "alt_ar": "صورة صدر بجانبها سُلّم رمادي مرقّم", "alt_en": "Chest radiograph with a numbered step scale", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "Compare the three chest images in this row. Which one most likely has the lowest signal-to-noise ratio (SNR)?", "q_ar": "قارن صور الصدر الثلاث في هذا الصف. أيّها يُرجَّح أن نسبة الإشارة إلى الضجيج (SNR) فيها هي الأقل؟", "options": [{"en": "The left image", "ar": "الصورة اليسرى"}, {"en": "The middle image", "ar": "الصورة الوسطى"}, {"en": "The right image", "ar": "الصورة اليمنى"}, {"en": "All three are equal", "ar": "الثلاث متساوية"}], "answer": 2, "why": "المحاضرة: نسبة الإشارة إلى الضجيج المنخفضة (إشارة قليلة مع ضجيج عالٍ) تعطي صورة محبّبة أو مبقّعة تحجب تفاصيل الأنسجة الرخوة؛ وفي هذا الصف يزداد التحبّب من اليسار إلى اليمين، فالصورة اليمنى أقلّها.", "kind": "image", "img": {"src": "assets/quiz-img/radiography-t02/radiography-t02-02cf2b.jpg", "alt_ar": "ثلاث صور صدر متجاورة", "alt_en": "Three chest radiographs side by side", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "This AP shoulder image looks dark on the monitor, although the anatomy is sharp and not grainy. Which digital image property is low?", "q_ar": "هذه الصورة الأمامية الخلفية للكتف تبدو داكنة على الشاشة، مع أن التشريح حادّ وغير محبّب. أيّ خاصية للصورة الرقمية منخفضة؟", "options": [{"en": "Brightness", "ar": "السطوع"}, {"en": "Spatial resolution", "ar": "الدقة المكانية"}, {"en": "Signal-to-noise ratio", "ar": "نسبة الإشارة إلى الضجيج"}, {"en": "Contrast scale", "ar": "مدى التباين"}], "answer": 0, "why": "شرح الصورة في المحاضرة: الصورة الداكنة سطوعها أقل؛ والسطوع هو شدة الضوء التي تمثّل البكسلات على الشاشة. الحدّة تعني أن الدقة المكانية جيدة، وغياب التحبّب يعني أن نسبة الإشارة إلى الضجيج ليست منخفضة.", "kind": "image", "img": {"src": "assets/quiz-img/radiography-t02/radiography-t02-ec3517.jpg", "alt_ar": "صورة أمامية خلفية للكتف تبدو داكنة على الشاشة", "alt_en": "AP shoulder image that looks dark on the monitor", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "The reusable plates on the left of this image do not need a darkroom. What turns their stored information into a digital image?", "q_ar": "الألواح القابلة لإعادة الاستعمال في يسار الصورة لا تحتاج إلى غرفة مظلمة. ما الذي يحوّل المعلومات المخزّنة فيها إلى صورة رقمية؟", "options": [{"en": "The developer and fixer", "ar": "المظهّر والمثبّت"}, {"en": "The X-ray tube itself", "ar": "أنبوب الأشعة نفسه"}, {"en": "Red safelight in the darkroom", "ar": "الضوء الأحمر الآمن في الغرفة المظلمة"}, {"en": "The laser scanner (CR reader)", "ar": "الماسح الليزري (قارئ CR)"}], "answer": 3, "why": "المحاضرة: الألواح الفوسفورية تُمسح بقارئ CR، وLaser scanner (CR-reader) convert the stored information into digital images، ثم يُمسح اللوح قبل الاستعمال التالي.", "kind": "image", "img": {"src": "assets/quiz-img/radiography-t02/radiography-t02-91caf8.jpg", "alt_ar": "يساراً: ألواح تصوير؛ وسطاً: جهاز؛ يميناً: تقني يُدخل الألواح في الجهاز", "alt_en": "Left: imaging plates; middle: a device; right: a technologist loading the plates into it", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/التصوير الشعاعي/نظري/م02 - جودة الصورة وعوامل التعرض"}</script>

document.addEventListener("DOMContentLoaded", () => {
  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)
  const p0 = location.pathname.startsWith(rootP) ? location.pathname.slice(rootP.length) : location.pathname;
  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");
  const L = (() => { try { return JSON.parse(document.body.dataset.lecture || "null"); } catch (e) { return null; } })();

  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {
    let b = h.querySelector(":scope > .nadd");   // ⚡ (30/10) الزر مرسوم بالـ HTML من البناء (بلا قفزة)؛ إذا مو موجود نسوّيه مثل قبل
    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "tnote"; b.textContent = "📝"; b.setAttribute("aria-label", "ملاحظة على المصطلح " + t);
    (pop.querySelector(".pb") || pop).appendChild(b);
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق
      if (!dock) { dock = document.createElement("div"); dock.className = "nqdock"; document.body.appendChild(dock); }
      const sec = document.querySelector(`.tm[data-k="${CSS.escape(k.k)}"]`);
      const ctx = Object.assign(Notes.context(sec) || {}, { kind: L ? "lecture" : "term", key: k.k, title: L ? L.title : t });
      Notes.quick(dock, { into: dock, ctx, links: [{ type: "term", key: k.k, title: t }], prefill: t + ": ", forId: "term:" + k.k, returnTo: document.querySelector(".tm.on") || sec });
    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
