 0, "why": "السطوع شدة ضوء البكسل على الشاشة، وهو في الرقمي يقابل مصطلح الكثافة في الفيلم."}, {"q_en": "In the concept of SNR, the \"signal\" is:", "q_ar": "في مفهوم SNR، «الإشارة» هي:", "options": [{"en": "The electronic interference", "ar": "التداخل الإلكتروني"}, {"en": "The number of x-ray photons that strike the receptor (mAs)", "ar": "عدد فوتونات الأشعة التي تصطدم بالمستقبِل (mAs)"}, {"en": "The pixel size", "ar": "حجم البكسل"}, {"en": "The distance between the tube and the IR", "ar": "المسافة بين الأنبوب والمستقبِل"}], "answer": 1, "why": "المحاضرة: عدد فوتونات الأشعة التي تصطدم بالمستقبِل (mAs) يمكن عدّه «الإشارة»."}, {"q_en": "A low signal (low mAs) with high noise produces:", "q_ar": "الإشارة المنخفضة (mAs منخفض) مع ضجيج عالٍ تُنتج:", "options": [{"en": "Higher spatial resolution", "ar": "دقة مكانية أعلى"}, {"en": "A clearer image of soft tissue", "ar": "صورة أوضح للأنسجة الرخوة"}, {"en": "A magnified image", "ar": "صورة مكبَّرة"}, {"en": "A grainy or mottled image that obscures soft tissue detail", "ar": "صورة محبّبة أو مبقّعة تحجب تفاصيل الأنسجة الرخوة"}], "answer": 3, "why": "SNR المنخفضة غير مرغوبة، لأنها تحجب تفاصيل الأنسجة الرخوة وتُنتج صورة محبّبة أو مبقّعة."}, {"q_en": "Spatial resolution is expressed in:", "q_ar": "يُعبَّر عن الدقة المكانية بوحدة:", "options": [{"en": "Milliampere-seconds (mAs)", "ar": "الملي أمبير-ثانية"}, {"en": "Line pairs per mm (lp/mm)", "ar": "أزواج الخطوط لكل ملم"}, {"en": "Kilovolts (kV)", "ar": "الكيلوفولت"}, {"en": "Milliseconds (ms)", "ar": "الملي ثانية"}], "answer": 1, "why": "الدقة المكانية تُقاس بأزواج الخطوط لكل ملّيمتر lp/mm."}, {"q_en": "The absence of spatial resolution in an image may be referred to as:", "q_ar": "غياب الدقة المكانية في الصورة قد يُسمّى:", "options": [{"en": "Magnification", "ar": "التكبير"}, {"en": "Noise", "ar": "الضجيج"}, {"en": "Blur", "ar": "الضبابية"}, {"en": "Brightness", "ar": "السطوع"}], "answer": 2, "why": "المحاضرة: غياب الدقة المكانية في الصورة قد يُسمّى blur أي الضبابية."}, {"q_en": "In digital imaging, which pixel size resolves two nearby structures better?", "q_ar": "في التصوير الرقمي، أي حجم بكسل يميّز بين تركيبين متقاربين بشكل أفضل؟", "options": [{"en": "A small pixel size", "ar": "البكسل الصغير"}, {"en": "A large pixel size", "ar": "البكسل الكبير"}, {"en": "Pixel size has no effect", "ar": "حجم البكسل لا يؤثر"}, {"en": "Any pixel size equally", "ar": "كل الأحجام بالتساوي"}], "answer": 0, "why": "الدقة في الرقمي تعتمد على حجم البكسل، والبكسل الكبير لا يستطيع التمييز بين تركيبين متقاربين مقارنةً بالصغير."}, {"q_en": "The two types of distortion are:", "q_ar": "نوعا التشوّه هما:", "options": [{"en": "Size distortion (magnification) and shape distortion", "ar": "تشوّه الحجم (التكبير) وتشوّه الشكل"}, {"en": "High and low contrast", "ar": "التباين العالي والمنخفض"}, {"en": "Noise and artifacts", "ar": "الضجيج والآثار الصناعية"}, {"en": "Brightness and density", "ar": "السطوع والكثافة"}], "answer": 0, "why": "المحاضرة: حُدِّد نوعان من التشوّه، تشوّه الحجم (التكبير) وتشوّه الشكل."}, {"q_en": "Which of the following is listed in the lecture as a factor that affects distortion?", "q_ar": "أيّ مما يلي مذكور في المحاضرة عاملاً يؤثر في التشوّه؟", "options": [{"en": "mA", "ar": "الملي أمبير"}, {"en": "Exposure time", "ar": "زمن التعرض"}, {"en": "Object to image receptor distance (OID)", "ar": "المسافة بين الجسم ومستقبِل الصورة (OID)"}, {"en": "Pixel brightness", "ar": "سطوع البكسل"}], "answer": 2, "why": "العوامل المذكورة: SID، وموضع الأنبوب، وOID."}, {"q_en": "Noise appears in the image as:", "q_ar": "يظهر الضجيج في الصورة على شكل:", "options": [{"en": "A uniform white area", "ar": "منطقة بيضاء متجانسة"}, {"en": "An irregular granular pattern", "ar": "نمط حبيبي غير منتظم"}, {"en": "An enlarged body part", "ar": "جزء مكبَّر من الجسم"}, {"en": "A sharp, repeatable line", "ar": "خط حاد يتكرر"}], "answer": 1, "why": "المحاضرة: يظهر الضجيج بنمط حبيبي غير منتظم في جميع الصور ويُضعف معلومات الصورة."}, {"q_en": "How do other artifacts differ from noise?", "q_a
