َي الصدر، الصورة عالية التباين قصيرة المدى أُخذت بـ:", "options": [{"en": "50 kV, 10 mAs", "ar": "50 kV و10 mAs"}, {"en": "110 kV, 10 mAs", "ar": "110 kV و10 mAs"}, {"en": "110 kV, 800 mAs", "ar": "110 kV و800 mAs"}, {"en": "50 kV, 800 mAs", "ar": "50 kV و800 mAs"}], "answer": 3, "why": "التباين العالي قصير المدى: 50 kV و800 mAs، والمنخفض طويل المدى: 110 kV و10 mAs."}, {"q_en": "In digital imaging, the term brightness replaces the film-based term:", "q_ar": "في التصوير الرقمي، حلّ مصطلح السطوع (brightness) محلّ مصطلحٍ كان يُستعمل مع الفيلم، هو:", "options": [{"en": "Density", "ar": "الكثافة"}, {"en": "Contrast", "ar": "التباين"}, {"en": "Distortion", "ar": "التشوّه"}, {"en": "Noise", "ar": "الضجيج"}], "answer": 0, "why": "المحاضرة: In digital imaging, the term brightness replaces the film-based term density — أي أن «السطوع» (شدة ضوء البكسل على الشاشة) حلّ في الرقمي محلّ مصطلح «الكثافة» المستعمل مع الفيلم."}, {"q_en": "In the concept of SNR, the \"signal\" is:", "q_ar": "في مفهوم SNR، «الإشارة» هي:", "options": [{"en": "Information from electronic interference that is not part of the desired image", "ar": "معلومات من التداخل الإلكتروني ليست جزءاً من الصورة المطلوبة"}, {"en": "The number of x-ray photons that strike the receptor (mAs)", "ar": "عدد فوتونات الأشعة التي تصطدم بالمستقبِل (mAs)"}, {"en": "The pixel size", "ar": "حجم البكسل"}, {"en": "The distance between the tube and the IR", "ar": "المسافة بين الأنبوب والمستقبِل"}], "answer": 1, "why": "المحاضرة: عدد فوتونات الأشعة التي تصطدم بالمستقبِل (mAs) يمكن عدّه «الإشارة»."}, {"q_en": "A low signal (low mAs) with high noise produces:", "q_ar": "الإشارة المنخفضة (mAs منخفض) مع ضجيج عالٍ تُنتج:", "options": [{"en": "Higher spatial resolution", "ar": "دقة مكانية أعلى"}, {"en": "A clearer image in which low-contrast soft tissue structures are demonstrated", "ar": "صورة أوضح تُظهر تراكيب الأنسجة الرخوة منخفضة التباين"}, {"en": "A magnified image", "ar": "صورة مكبَّرة"}, {"en": "A grainy or mottled image that obscures soft tissue detail", "ar": "صورة محبّبة أو مبقّعة تحجب تفاصيل الأنسجة الرخوة"}], "answer": 3, "why": "SNR المنخفضة غير مرغوبة، لأنها تحجب تفاصيل الأنسجة الرخوة وتُنتج صورة محبّبة أو مبقّعة."}, {"q_en": "Spatial resolution is expressed in:", "q_ar": "يُعبَّر عن الدقة المكانية بوحدة:", "options": [{"en": "Milliampere-seconds (mAs)", "ar": "الملي أمبير-ثانية"}, {"en": "Line pairs per mm (lp/mm)", "ar": "أزواج الخطوط لكل ملم"}, {"en": "Kilovolts (kV)", "ar": "الكيلوفولت"}, {"en": "Milliseconds (ms)", "ar": "الملي ثانية"}], "answer": 1, "why": "الدقة المكانية تُقاس بأزواج الخطوط لكل ملّيمتر lp/mm."}, {"q_en": "The absence of spatial resolution in an image may be referred to as:", "q_ar": "غياب الدقة المكانية في الصورة قد يُسمّى:", "options": [{"en": "Magnification", "ar": "التكبير"}, {"en": "Noise", "ar": "الضجيج"}, {"en": "Blur", "ar": "الضبابية"}, {"en": "Brightness", "ar": "السطوع"}], "answer": 2, "why": "المحاضرة: غياب الدقة المكانية في الصورة قد يُسمّى blur أي الضبابية."}, {"q_en": "In digital imaging, which pixel size resolves two nearby structures better?", "q_ar": "في التصوير الرقمي، أي حجم بكسل يميّز بين تركيبين متقاربين بشكل أفضل؟", "options": [{"en": "A small pixel size", "ar": "البكسل الصغير"}, {"en": "A large pixel size", "ar": "البكسل الكبير"}, {"en": "Pixel size has no effect", "ar": "حجم البكسل لا يؤثر"}, {"en": "Any pixel size equally", "ar": "كل الأحجام بالتساوي"}], "answer": 0, "why": "الدقة في الرقمي تعتمد على حجم البكسل، والبكسل الكبير لا يستطيع التمييز بين تركيبين متقاربين مقارنةً بالصغير."}, {"q_en": "The two types of distortion are:", "q_ar": "نوعا التشوّه هما:", "options": [{"en": "Size distortion (magnification) and shape distortion", "ar": "تشوّه الحجم (التكبير) وتشوّه الشكل"}, {"en": "High and low contrast", "ar": "التباين العالي والمنخفض"}, {"en": "Noise and artifacts", "ar": "الضجيج والآثار الصناعية"}, {"en": "Brightness distortion and density distortion of the image", "ar": "تشوّه السطوع وتشوّه الكثافة في الصورة"}], "answer": 0, "why": "المحاضرة: حُدِّد نوعان من التشوّه، تشوّه الحجم (التكبير) وتشوّه الشكل."}, {"q_en": "Which of the following is listed in the lecture as a factor that affects distortion?", "q_ar": "أيّ مما يلي مذكور في المحاضرة عاملاً يؤثر في التشوّه؟", "options": [{"en": "mA (tube current)", "ar": "الملي أمبير (تيار الأنبوب)"}, {"en": "Exposure time in milliseconds", "ar": "زمن التعرّض بالملي ثانية"}, {"en": "Object to image receptor distance (OID)", "ar": "المسافة بين الجسم ومستقبِل الصورة (OID)"}, {"en": "Pixel brightness on the monitor", "ar": "سطوع البكسل على الشاشة"}], "answer": 2, "why": "العوامل المذكورة: SID، وموضع الأنبوب، وOID."}, {"q_en": "Noise appears in the image as:", "q_ar": "يظهر الضجيج في الصورة على شكل:", "options": [{"en": "A uniform white area", "ar": "منطقة بيضاء متجانسة"}, {"en": "An irregular granular pattern", "ar": "نمط حبيبي غير منتظم"}, {"en": "An enlarged body part", "ar": "جزء مكبَّر من الجسم"}, {"en": "A sharp line that repeats in the same place on every image", "ar": "خط حاد يتكرر في المكان نفسه في كل صورة"}], "answer": 1, "why": "المحاضرة: يظهر الضجيج بنمط حبيبي غير منتظم في جميع الصور ويُضعف معلومات الصورة."}, {"q_en": "How do other artifacts differ from noise?", "q_ar": "كيف تختلف الآثار الصناعية الأخرى عن الضجيج؟", "options": [{"en": "They are part of the desired signal", "ar": "جزء من الإشارة المطلوبة"}, {"en": "They are more random than noise", "ar": "أكثر عشوائية من الضجيج"}, {"en": "They are present in all electronic systems and come from electronic interference", "ar": "موجودة في جميع الأنظمة الإلكترونية ومصدرها التداخل الإلكتروني"}, {"en": "They are less random and should be repeatable in theory", "ar": "أقل عشوائية ويُفترض نظرياً أن تتكرر"}], "answer": 3, "why": "الآثار الصناعية الأخرى أقل عشوائية ويُفترض أن تتكرر، أما الضجيج فعشوائي، مع أنه هو نفسه نوع من الآثار الصناعية."}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/التصوير الشعاعي/نظري/م02 - جودة الصورة وعوامل التعرض"}</script>

    (pop.querySelector(".pb") || pop).appendChild(b);
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق
      if (!dock) { dock = document.createElement("div"); dock.className = "nqdock"; document.body.appendChild(dock); }
      const sec = document.querySelector(`.tm[data-k="${CSS.escape(k.k)}"]`);
      const ctx = Object.assign(Notes.context(sec) || {}, { kind: L ? "lecture" : "term", key: k.k, title: L ? L.title : t });
      Notes.quick(dock, { into: dock, ctx, links: [{ type: "term", key: k.k, title: t }], prefill: t + ": ", forId: "term:" + k.k, returnTo: document.querySelector(".tm.on") || sec });
    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
