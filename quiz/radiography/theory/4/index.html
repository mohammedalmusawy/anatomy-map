own to midfemur level", "ar": "فوق منطقة الغدد التناسلية حتى منتصف الفخذ"}], "answer": 3, "why": "التدريع: ضع درعاً رصاصياً فوق منطقة الغدد التناسلية، ومُدّه إلى مستوى منتصف عظم الفخذ."}, {"q_en": "For the AP unilateral hip, the affected leg is rotated internally:", "q_ar": "في إسقاط الورك AP من جانب واحد، تُدوَّر الساق المصابة للداخل:", "options": [{"en": "5°", "ar": "5 درجات"}, {"en": "45°", "ar": "45 درجة"}, {"en": "30° to 35°", "ar": "30 إلى 35 درجة"}, {"en": "15° to 20°", "ar": "15 إلى 20 درجة"}], "answer": 3, "why": "وضعية الجزء: دوّر الساق المصابة للداخل 15° إلى 20°."}, {"q_en": "Where is the CR directed for the AP unilateral hip?", "q_ar": "إلى أين يُوجَّه الشعاع المركزي في إسقاط الورك AP؟", "options": [{"en": "1 to 2 inches (2.5 to 5 cm) distal to midfemoral neck", "ar": "1 إلى 2 إنش (2.5 إلى 5 سم) أسفل منتصف عنق الفخذ"}, {"en": "To the iliac crest", "ar": "إلى العرف الحرقفي"}, {"en": "To the symphysis pubis", "ar": "إلى الارتفاق العاني"}, {"en": "To the knee joint", "ar": "إلى مفصل الركبة"}], "answer": 0, "why": "الشعاع المركزي عمودي على IR، ويُوجَّه 1–2 إنش (2.5–5 سم) أسفل منتصف عنق الفخذ."}, {"q_en": "How can the femoral neck be located?", "q_ar": "كيف يُحدَّد موضع عنق عظم الفخذ؟", "options": [{"en": "At the level of the iliac crest", "ar": "عند مستوى العرف الحرقفي"}, {"en": "3-5 cm medial and 8-10 cm distal to ASIS", "ar": "3–5 سم إنسيّ و8–10 سم أسفل ASIS"}, {"en": "2 cm above the symphysis pubis", "ar": "2 سم فوق الارتفاق العاني"}, {"en": "At the level of the ischial tuberosity", "ar": "عند مستوى الحدبة الإسكية"}], "answer": 1, "why": "المحاضرة: عنق الفخذ نحو 1–2 إنش (3–5 سم) إنسيّ و3–4 إنش (8–10 سم) أسفل ASIS."}, {"q_en": "Which part of the femur should be visualized on the AP hip?", "q_ar": "أيّ جزء من عظم الفخذ يجب أن يظهر في إسقاط الورك AP؟", "options": [{"en": "The distal one-third", "ar": "الثلث البعيد"}, {"en": "The entire femur", "ar": "عظم الفخذ كله"}, {"en": "The proximal one-third", "ar": "الثلث القريب"}, {"en": "Only the femoral head", "ar": "رأس الفخذ فقط"}], "answer": 2, "why": "ما تُظهره الصورة: الثلث القريب من عظم الفخذ مع الحُقّ والأجزاء المجاورة."}, {"q_en": "The axiolateral inferosuperior projection is also called:", "q_ar": "يُسمّى الإسقاط الجانبي المحوري السفلي العلوي أيضاً:", "options": [{"en": "Clements-Nakayama method", "ar": "طريقة كليمنتس-ناكاياما"}, {"en": "Danelius-Miller method", "ar": "طريقة دانيليوس-ميلر"}, {"en": "Judet method", "ar": "طريقة جوديه"}, {"en": "Taylor method", "ar": "طريقة تايلور"}], "answer": 1, "why": "عنوان الإسقاط في المحاضرة: الجانبي المحوري السفلي العلوي، طريقة دانيليوس-ميلر."}, {"q_en": "In the Danelius-Miller method, the unaffected leg is:", "q_ar": "في طريقة دانيليوس-ميلر، الساق السليمة:", "options": [{"en": "Extended on the table", "ar": "تُمدّ على الطاولة"}, {"en": "Placed on the x-ray tube", "ar": "توضَع على أنبوب الأشعة"}, {"en": "Flexed and elevated near vertical", "ar": "تُثنى وتُرفع قريباً من العمودي"}, {"en": "Rotated internally 15°", "ar": "تُدوَّر للداخل 15 درجة"}], "answer": 2, "why": "وضعية الجزء: اثنِ الساق السليمة وارفعها بحيث يكون الفخذ قريباً من العمودي وخارج حقل التسديد."}, {"q_en": "In the Danelius-Miller method, the IR is placed:", "q_ar": "في طريقة دانيليوس-ميلر، يوضَع مستقبِل الصورة:", "options": [{"en": "Parallel to the femoral neck and perpendicular to CR", "ar": "موازياً لعنق الفخذ وعمودياً على الشعاع"}, {"en": "Perpendicular to the femoral neck", "ar": "عمودياً على عنق الفخذ"}, {"en": "Flat under the pelvis", "ar": "مسطّحاً تحت الحوض"}, {"en": "Parallel to the CR", "ar": "موازياً للشعاع المركزي"}], "answer": 0, "why": "ضع IR في الثنية فوق العرف الحرقفي وعدّله ليكون موازياً لعنق الفخذ وعمودياً على الشعاع المركزي."}, {"q_en": "Why should the leg NOT be placed on the collimator or x-ray tube?", "q_ar": "لماذا يجب ألا توضَع الساق على المُسدِّد أو أنبوب الأشعة؟", "options": [{"en": "It increases scatter radiation", "ar": "تزيد الإشعاع المتشتّت"}, {"en": "Risk of burns or electrical shock", "ar": "خطر الحروق أو الصدمة الكهربائية"}, {"en": "It causes grid cutoff", "ar": "تسبّب قطع الشبكة"}, {"en": "It foreshortens the femoral neck", "ar": "تقصّر عنق الفخذ"}], "answer": 1, "why": "المحاضرة: لا تضع الساق على المُسدِّد أو الأنبوب لخطر الحروق أو الصدمة الكهربائية."}, {"q_en": "The modified axiolateral projection is known as:", "q_ar": "يُعرف الإسقاط الجانبي المحوري المعدّل بـ:", "options": [{"en": "Danelius-Miller method", "ar": "طريقة دانيليوس-ميلر"}, {"en": "Clements-Nakayama method", "ar": "طريقة كليمنتس-ناكاياما"}, {"en": "Modified Cleaves method", "ar": "طريقة كليفز المعدّلة"}, {"en": "Judet method", "ar": "طريقة جوديه"}], "answer": 1, "why": "عنوان الإسقاط في المحاضرة: الجانبي المحوري المعدّل، طريقة كليمنتس-ناكاياما."}, {"q_en": "In the Clements-Nakayama method, the CR is angled posteriorly from horizontal by:", "q_ar": "في طريقة كليمنتس-ناكاياما، يُمال الشعاع إلى الخلف عن الأفقي بمقدار:", "options": [{"en": "15° to 20°", "ar": "15 إلى 20 درجة"}, {"en": "40°", "ar": "40 درجة"}, {"en": "5°", "ar": "5 درجات"}, {"en": "30° to 45°", "ar": "30 إلى 45 درجة"}], "answer": 0, "why": "الشعاع المركزي: يجب أن يُمال للخلف 15° إلى 20° عن الأفقي."}, {"q_en": "In the Clements-Nakayama method, the leg is kept:", "q_ar": "في طريقة كليمنتس-ناكاياما، تبقى الساق:", "options": [{"en": "Rotated internally 15° to 20°", "ar": "مُدارة للداخل 15 إلى 20 درجة"}, {"en": "In neutral (anatomic) position", "ar": "في الوضع المحايد (التشريحي)"}, {"en": "Flexed 90° and elevated", "ar": "مثنية 90 درجة ومرفوعة"}, {"en": "Abducted 45°", "ar": "مُبعَدة 45 درجة"}], "answer": 1, "why": "وضعية الجزء: أبقِ الساق في الوضع المحايد؛ إمالة الشعاع 15° للخلف تعوّض عن تدوير الساق."}, {"q_en": "Why is the face of the IR kept perpendicular to the CR in the modified axiolateral?", "q_ar": "لماذا يُبقى وجه مستقبِل الصورة عمودياً على الشعاع في الإسقاط المعدّل؟", "options": [{"en": "To prevent fogging", "ar": "لمنع التضبيب"}, {"en": "To prevent grid cutoff", "ar": "لمنع قطع الشبكة"}, {"en": "To reduce patient dose", "ar": "لتقليل جرعة المريض"}, {"en": "To include the knee", "ar": "لشمول الركبة"}], "answer": 1, "why": "وضعية الجزء: أمِل IR نحو 15° وعدّله ليكون عمودياً على الشعاع لمنع قطع الشبكة."}, {"q_en": "For a true AP of the mid- and distal femur, the leg is rotated internally about:", "q_ar": "للحصول على AP حقيقي للجزء الأوسط والبعيد من الفخذ، تُدوَّر الساق للداخل نحو:", "options": [{"en": "5°", "ar": "5 درجات"}, {"en": "15° to 20°", "ar": "15 إلى 20 درجة"}, {"en": "45°", "ar": "45 درجة"}, {"en": "90°", "ar": "90 درجة"}], "answer": 0, "why": "وضعية الجزء: دوّر الساق للداخل نحو 5° لـ AP حقيقي، كما في AP الركبة."}, {"q_en": "For the AP mid- and distal femur, the lower IR margin should be:", "q_ar": "في AP للجزء الأوسط والبعيد من الفخذ، الحافة السفلى لمستقبِل الصورة تكون:", "options": [{"en": "At the level of the knee joint", "ar": "عند مستوى مفصل الركبة"}, {"en": "At the ankle", "ar": "عند الكاحل"}, {"en": "About 2 inches (5 cm) below the knee joint", "ar": "نحو 2 إنش (5 سم) أسفل مفصل الركبة"}, {"en": "At the ASIS", "ar": "عند ASIS"}], "answer": 2, "why": "المحاضرة: الحافة السفلى لـ IR نحو 2 إنش (5 سم) أسفل مفصل الركبة."}, {"q_en": "Why will the knee joint space not appear fully open on the AP femur?", "q_ar": "لماذا لا تظهر مسافة مفصل الركبة مفتوحة بالكامل في AP الفخذ؟", "options": [{"en": "Because of grid cutoff", "ar": "بسبب قطع الشبكة"}, {"en": "Because the knee is flexed 45°", "ar": "لأن الركبة مثنية 45 درجة"}, {"en": "Because of divergent x-ray beam", "ar": "بسبب تباعد حزمة الأشعة"}, {"en": "Because of patient breathing", "ar": "بسبب تنفّس المريض"}], "answer": 2, "why": "ما تُظهره الصورة: مسافة مفصل الركبة لا تظهر مفتوحة بالكامل بسبب تباعد حزمة الأشعة."}, {"q_en": "For the lateral recumbent mid- and distal femur, the knee is flexed about:", "q_ar": "في الإسقاط الجانبي بالاستلقاء الجانبي للجزء الأوسط والبعيد، تُثنى الركبة نحو:", "options": [{"en": "45°", "ar": "45 درجة"}, {"en": "90°", "ar": "90 درجة"}, {"en": "15°", "ar": "15 درجة"}, {"en": "5°", "ar": "5 درجات"}], "answer": 0, "why": "وضعية الجزء: اثنِ الركبة نحو 45° والمريض على جانبه المصاب."}, {"q_en": "Why is the unaffected leg placed behind the affected leg?", "q_ar": "لماذا توضَع الساق السليمة خلف الساق المصابة؟", "options": [{"en": "To include the hip joint", "ar": "لشمول مفصل الورك"}, {"en": "To reduce scatter radiation", "ar": "لتقليل الإشعاع المتشتّت"}, {"en": "To support the IR", "ar": "لدعم مستقبِل الصورة"}, {"en": "To prevent over-rotation", "ar": "لمنع الدوران الزائد"}], "answer": 3, "why": "المحاضرة: ضع الساق السليمة خلف المصابة لمنع الدوران الزائد."}, {"q_en": "In the trauma lateromedial projection of the femur, the beam is:", "q_ar": "في الإسقاط الوحشي الإنسي للإصابات، يكون الشعاع:", "options": [{"en": "Horizontal, directed from the lateral side", "ar": "أفقياً، من الجهة الوحشية"}, {"en": "Vertical, directed from above", "ar": "عمودياً، من الأعلى"}, {"en": "Angled 40° caudad", "ar": "مائلاً 40 درجة للقدمين"}, {"en": "Horizontal, from the medial side", "ar": "أفقياً، من الجهة الإنسية"}], "answer": 0, "why": "المحاضرة: ضع IR على حافته ملاصقاً للجهة الإنسية من الفخذ، مع شعاع أفقي من الجهة الوحشية."}, {"q_en": "When should the lateral recumbent position NOT be attempted?", "q_ar": "متى يجب ألا تُجرى وضعية الاستلقاء الجانبي؟", "options": [{"en": "If the patient is an adult", "ar": "إذا كان المريض بالغاً"}, {"en": "If the knee joint must be included", "ar": "إذا لزم شمول الركبة"}, {"en": "If a grid is used", "ar": "إذا استُعملت شبكة"}, {"en": "If the patient has severe trauma", "ar": "إذا كان المريض مصاباً إصابة شديدة"}], "answer": 3, "why": "التحذير: لا تحاول هذه الوضعية إذا كان المريض مصاباً إصابة شديدة."}, {"q_en": "For the lateral mid- and proximal femur, the patient rolls back (posteriorly) about:", "q_ar": "في الإسقاط الجانبي للجزء الأوسط والقريب، يميل المريض إلى الخلف نحو:", "options": [{"en": "45°", "ar": "45 درجة"}, {"en": "5°", "ar": "5 درجات"}, {"en": "90°", "ar": "90 درجة"}, {"en": "15°", "ar": "15 درجة"}], "answer": 3, "why": "وضعية الجزء: اطلب من المريض أن يميل للخلف نحو 15° لمنع التراكب."}, {"q_en": "Where is the upper IR margin placed for the lateral mid- and proximal femur?", "q_ar": "أين توضَع الحافة العليا لمستقبِل الصورة في الإسقاط الجانبي للجزء الأوسط والقريب؟", "options": [{"en": "At the level of the knee", "ar": "عند مستوى الركبة"}, {"en": "At the level of the ASIS", "ar": "عند مستوى ASIS"}, {"en": "At the iliac crest + 5 cm", "ar": "فوق العرف الحرقفي بـ 5 سم"}, {"en": "At the midshaft of femur", "ar": "عند منتصف جسم الفخذ"}], "answer": 1, "why": "المحاضرة: جُسّ ASIS وضع الحافة العليا لـ IR عند مستوى هذا المعلم."}, {"q_en": "For the lateral mid- and proximal femur, the patient lies:", "q_ar": "في الإسقاط الجانبي للجزء الأوسط والقريب، يستلقي المريض:", "options": [{"en": "Supine with legs extended", "ar": "على ظهره والساقان ممدودتان"}, {"en": "Prone", "ar": "على بطنه"}, {"en": "Lateral, affected side up", "ar": "على جانبه، والجانب المصاب للأعلى"}, {"en": "Lateral recumbent, affected side down", "ar": "على جانبه، والجانب المصاب للأسفل"}], "answer": 3, "why": "وضعية المريض: الاستلقاء الجانبي والجانب المصاب إلى الأسفل."}]}</script>

  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)

  });

  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;

    });
  };

  if (window.Sync) Sync.start();
});
