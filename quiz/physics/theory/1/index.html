تز"}, {"en": "Electron volts", "ar": "الإلكترون فولت"}, {"en": "Seconds", "ar": "الثواني"}], "answer": 3, "why": "المحاضرة: الزمن الدوري هو الوقت لقطع طول موجي واحد ويُقاس بالثانية (s)."}, {"q_en": "In the lecture's list of the electromagnetic spectrum, X-rays are emitted by:", "q_ar": "في قائمة الطيف الكهرومغناطيسي بالمحاضرة، الأشعة السينية تنبعث من:", "options": [{"en": "X-ray tubes", "ar": "أنابيب الأشعة السينية"}, {"en": "Microwave ovens", "ar": "أفران المايكروويف"}, {"en": "Radio antennas", "ar": "هوائيات الراديو"}, {"en": "Light bulbs", "ar": "المصابيح الضوئية"}], "answer": 0, "why": "المحاضرة: الأشعة السينية X-rays (تصدرها أنابيب الأشعة السينية)."}, {"q_en": "Heat is listed in the electromagnetic spectrum as:", "q_ar": "الحرارة مذكورة في الطيف الكهرومغناطيسي على أنها:", "options": [{"en": "Ultraviolet light", "ar": "الأشعة فوق البنفسجية"}, {"en": "Infrared radiation", "ar": "الأشعة تحت الحمراء"}, {"en": "Gamma rays", "ar": "أشعة غاما"}, {"en": "Radio waves", "ar": "موجات الراديو"}], "answer": 1, "why": "المحاضرة: الحرارة (الأشعة تحت الحمراء)."}, {"q_en": "Non-ionizing radiation is:", "q_ar": "الإشعاع غير المؤيِّن هو:", "options": [{"en": "High energy radiation that produces ions", "ar": "إشعاع عالي الطاقة يُنتج أيونات"}, {"en": "Radiation released only by radioactive atoms", "ar": "إشعاع تُطلقه الذرّات المشعّة فقط"}, {"en": "Lower energy radiation not energetic enough to detach electrons", "ar": "إشعاع منخفض الطاقة لا يكفي لفصل الإلكترونات"}, {"en": "Radiation that always causes death", "ar": "إشعاع يسبّب الوفاة دائماً"}], "answer": 2, "why": "المحاضرة: غير المؤيِّن إشعاع منخفض الطاقة لا يكفي لفصل الإلكترونات عن الذرّات أو الجزيئات."}, {"q_en": "Which is an example of non-ionizing radiation mentioned in the lecture?", "q_ar": "أي مما يلي مثال على الإشعاع غير المؤيِّن مذكور بالمحاضرة؟", "options": [{"en": "X-rays", "ar": "الأشعة السينية"}, {"en": "Gamma rays", "ar": "أشعة غاما"}, {"en": "Alpha particles", "ar": "جسيمات ألفا"}, {"en": "Visible light", "ar": "الضوء المرئي"}], "answer": 3, "why": "المحاضرة: الضوء المرئي نوع من الإشعاع غير المؤيِّن تدركه العين البشرية."}, {"q_en": "The term “ionizing” radiation comes from:", "q_ar": "تسمية الإشعاع «المؤيِّن» جاءت من:", "options": [{"en": "The production of ions (electrically charged atoms or molecules)", "ar": "إنتاج أيونات (ذرّات أو جزيئات مشحونة كهربائياً)"}, {"en": "The production of heat only", "ar": "إنتاج الحرارة فقط"}, {"en": "Its long wavelength", "ar": "طوله الموجي الطويل"}, {"en": "Its use in industry", "ar": "استعماله في الصناعة"}], "answer": 0, "why": "المحاضرة: التغيّرات تتضمّن إنتاج أيونات، ومن هنا جاءت تسمية «مؤيِّن»."}, {"q_en": "Radioactive atoms are atoms that are:", "q_ar": "الذرّات المشعّة هي ذرّات:", "options": [{"en": "Stable and release no energy", "ar": "مستقرّة ولا تُطلق طاقة"}, {"en": "Unstable and release ionizing radiation when they decay", "ar": "غير مستقرّة وتُطلق إشعاعاً مؤيِّناً عند تحلّلها"}, {"en": "Without protons", "ar": "بلا بروتونات"}, {"en": "Found only in X-ray tubes", "ar": "موجودة فقط في أنابيب الأشعة"}], "answer": 1, "why": "المحاضرة: الذرّات غير المستقرّة تُسمّى الذرّات المشعّة، وعند تحلّلها تُطلق طاقة على شكل إشعاع مؤيِّن."}, {"q_en": "Alpha particles can often be stopped by:", "q_ar": "جسيمات ألفا غالباً يمكن إيقافها بـ:", "options": [{"en": "Thick walls of concrete", "ar": "جدران خرسانة سميكة"}, {"en": "A few millimeters of aluminum", "ar": "بضعة مليمترات من الألمنيوم"}, {"en": "A single sheet of paper", "ar": "ورقة واحدة"}, {"en": "Large quantities of dense lead", "ar": "كميات كبيرة من الرصاص الكثيف"}], "answer": 2, "why": "المحاضرة: جسيمات ألفا يمكن إيقافها غالباً حتى بورقة واحدة."}, {"q_en": "Beta radiation consists of:", "q_ar": "إشعاع بيتا يتكوّن من:", "options": [{"en": "Heavy positively charged particles", "ar": "جسيمات ثقيلة موجبة الشحنة"}, {"en": "Neutrons with no charge", "ar": "نيوترونات بلا شحنة"}, {"en": "Electromagnetic waves only", "ar": "موجات كهرومغناطيسية فقط"}, {"en": "Smaller particles (electrons)", "ar": "جسيمات أصغر (إلكترونات)"}], "answer": 3, "why": "المحاضرة: في إشعاع بيتا تُطلق النوى جسيمات أصغر (إلكترونات)."}, {"q_en": "Which radiation is electromagnetic radiation similar to X-rays?", "q_ar": "أي إشعاع هو إشعاع كهرومغناطيسي مشابه للأشعة السينية؟", "options": [{"en": "Gamma rays", "ar": "أشعة غاما"}, {"en": "Alpha particles", "ar": "جسيمات ألفا"}, {"en": "Beta particles", "ar": "جسيمات بيتا"}, {"en": "Neutrons", "ar": "النيوترونات"}], "answer": 0, "why": "المحاضرة: أشعة غاما إشعاع كهرومغناطيسي مشابه للأشعة السينية."}, {"q_en": "Neutrons easily penetrate many substances because:", "q_ar": "النيوترونات تخترق كثيراً من المواد بسهولة لأنها:", "options": [{"en": "They are very heavy", "ar": "ثقيلة جداً"}, {"en": "They carry no charge", "ar": "لا تحمل شحنة"}, {"en": "They are positively charged", "ar": "موجبة الشحنة"}, {"en": "They have a long wavelength", "ar": "طولها الموجي طويل"}], "answer": 1, "why": "المحاضرة: لأنها لا تحمل شحنة، تخترق كثيراً من المواد بسهولة."}, {"q_en": "Röntgen observed a glow on a screen coated with:", "q_ar": "لاحظ رونتغن توهّجاً على شاشة مطليّة بـ:", "options": [{"en": "Lead", "ar": "الرصاص"}, {"en": "Tungsten", "ar": "التنغستن"}, {"en": "Barium platinocyanide", "ar": "بلاتينوسيانيد الباريوم"}, {"en": "Aluminum", "ar": "الألمنيوم"}], "answer": 2, "why": "المحاضرة: لاحظ توهّجاً على شاشة قريبة مطليّة ببلاتينوسيانيد الباريوم."}, {"q_en": "In the name “X-rays”, the letter “X” signifies:", "q_ar": "في تسمية «الأشعة السينية» (X-rays)، حرف «X» يدلّ على:", "options": [{"en": "The tenth ray", "ar": "الشعاع العاشر"}, {"en": "Röntgen's wife", "ar": "زوجة رونتغن"}, {"en": "Crossing rays", "ar": "الأشعة المتقاطعة"}, {"en": "The unknown", "ar": "المجهول"}], "answer": 3, "why": "المحاضرة: سمّاها الأشعة السينية، حيث يدلّ «X» على المجهول."}]}</script>
