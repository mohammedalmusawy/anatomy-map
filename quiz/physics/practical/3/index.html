ctual focal spot size ÷ 2", "ar": "حجم البؤرة الفعلية ÷ 2"}, {"en": "Filament length × kVp", "ar": "طول الفتيلة × الكيلوفولت"}, {"en": "Actual focal spot size × sin θ", "ar": "حجم البؤرة الفعلية × sin θ"}], "answer": 3, "why": "المحاضرة: حجم البؤرة الفعّالة = حجم البؤرة الفعلية × جيب الزاوية θ."}, {"q_en": "Compared with the actual focal spot, the effective focal spot seen by the patient and image receptor is:", "q_ar": "مقارنةً بالبؤرة الفعلية، البؤرة الفعّالة التي يراها المريض ومستقبِل الصورة:", "options": [{"en": "Larger, due to the anode angle", "ar": "أكبر بسبب زاوية الأنود"}, {"en": "Exactly the same size", "ar": "بالحجم نفسه تماماً"}, {"en": "Invisible", "ar": "غير مرئية"}, {"en": "Smaller, due to the anode angle", "ar": "أصغر بسبب زاوية الأنود"}], "answer": 3, "why": "المحاضرة: البؤرة الفعلية أكبر، لكن بسبب الزاوية تبدو أصغر (البؤرة الفعّالة) للمريض ومستقبِل الصورة."}, {"q_en": "A small focal spot is used for:", "q_ar": "البؤرة الصغيرة تُستعمل لـ:", "options": [{"en": "Higher power situations (e.g. chest, abdomen)", "ar": "الحالات عالية القدرة (مثل الصدر والبطن)"}, {"en": "Large patients only", "ar": "المرضى كبار الحجم فقط"}, {"en": "Detailed imaging (e.g. extremities, small bones)", "ar": "التصوير التفصيلي (مثل الأطراف والعظام الصغيرة)"}, {"en": "Reducing image resolution", "ar": "تقليل دقة الصورة"}], "answer": 2, "why": "المحاضرة: البؤرة الصغيرة للتصوير التفصيلي، مثل الأطراف والعظام الصغيرة."}, {"q_en": "How do some X-ray tubes provide two different focal spot sizes?", "q_ar": "كيف توفّر بعض الأنابيب حجمين مختلفين للبؤرة؟", "options": [{"en": "By having two filaments in the cathode", "ar": "بوجود فتيلتين في الكاثود"}, {"en": "By having two anodes", "ar": "بوجود أنودين"}, {"en": "By changing the glass envelope", "ar": "بتغيير الغلاف الزجاجي"}, {"en": "By rotating the cathode", "ar": "بتدوير الكاثود"}], "answer": 0, "why": "المحاضرة: بعض الأنابيب فيها فتيلتان في الكاثود لتوفير حجمين مختلفين للبؤرة."}, {"q_en": "In a rotating anode tube, the anode usually rotates at:", "q_ar": "في أنبوب الأنود الدوّار يدور الأنود عادةً بسرعة:", "options": [{"en": "30 – 100 revolutions per minute", "ar": "30–100 دورة في الدقيقة"}, {"en": "3,000 – 10,000 revolutions per minute", "ar": "3,000–10,000 دورة في الدقيقة"}, {"en": "300 – 1,000 revolutions per minute", "ar": "300–1,000 دورة في الدقيقة"}, {"en": "100,000 revolutions per minute", "ar": "100,000 دورة في الدقيقة"}], "answer": 1, "why": "المحاضرة: يدور الأنود عادةً بين 3,000 و10,000 دورة في الدقيقة."}, {"q_en": "The rotating anode is typically made of:", "q_ar": "الأنود الدوّار مصنوع عادةً من:", "options": [{"en": "Aluminum", "ar": "الألمنيوم"}, {"en": "Tungsten", "ar": "التنغستن"}, {"en": "Lead", "ar": "الرصاص"}, {"en": "Glass", "ar": "الزجاج"}], "answer": 1, "why": "المحاضرة: الأنود الدوّار مصنوع عادةً من التنغستن ويعمل هدفاً للإلكترونات."}, {"q_en": "Why does the anode rotate?", "q_ar": "لماذا يدور الأنود؟", "options": [{"en": "To distribute the heat over a larger surface area", "ar": "لتوزيع الحرارة على مساحة سطح أكبر"}, {"en": "To emit more electrons", "ar": "ليبعث إلكترونات أكثر"}, {"en": "To reduce the tube voltage", "ar": "لتقليل جهد الأنبوب"}, {"en": "To cool the filament", "ar": "لتبريد الفتيلة"}], "answer": 0, "why": "المحاضرة: الدوران يوزّع حرارة اصطدام الإلكترونات على مساحة أكبر فيمنع السخونة المفرطة."}, {"q_en": "In a stationary anode, the heat is:", "q_ar": "في الأنود الثابت تكون الحرارة:", "options": [{"en": "Concentrated in one spot (limited X-ray output)", "ar": "مركّزة في نقطة واحدة (ناتج أشعة محدود)"}, {"en": "Distributed over a larger surface area", "ar": "موزّعة على مساحة سطح أكبر"}, {"en": "Converted completely to X-rays", "ar": "متحوّلة كلها إلى أشعة سينية"}, {"en": "Removed by rotation", "ar": "مُزالة بالدوران"}], "answer": 0, "why": "المحاضرة: في الأنود الثابت تتركّز الحرارة في نقطة واحدة، فيكون ناتج الأشعة محدوداً."}, {"q_en": "Which is one of the key benefits of a rotating anode tube?", "q_ar": "أي مما يلي من الفوائد الرئيسية لأنبوب الأنود الدوّار؟", "options": [{"en": "Lower X-ray output", "ar": "ناتج أشعة أقل"}, {"en": "Improved durability (minimizes wear under high load)", "ar": "متانة أفضل (يقلّل التآكل تحت الحمل العالي)"}, {"en": "Heat concentrated in one spot", "ar": "حرارة مركّزة في نقطة واحدة"}, {"en": "More wear over time", "ar": "تآكل أكثر مع الوقت"}], "answer": 1, "why": "المحاضرة: من فوائد الأنود الدوّار المتانة الأفضل، لأن التصميم الدوّار يقلّل التآكل تحت الحمل العالي."}, {"q_en": "Spreading the heat over a rotating surface:", "q_ar": "توزيع الحرارة على سطح دوّار:", "options": [{"en": "Increases wear of the anode", "ar": "يزيد تآكل الأنود"}, {"en": "Reduces image quality", "ar": "يقلّل جودة الصورة"}, {"en": "Prevents damage and prolongs the life of the tube", "ar": "يمنع التلف ويطيل عمر الأنبوب"}, {"en": "Increases the voltage ripple", "ar": "يزيد تموّج الجهد"}], "answer": 2, "why": "المحاضرة: توزيع الحرارة على سطح دوّار يمنع التلف ويطيل عمر الأنبوب."}, {"q_en": "The heat rating refers to:", "q_ar": "التصنيف الحراري يعني:", "options": [{"en": "The temperature of the filament", "ar": "درجة حرارة الفتيلة"}, {"en": "The maximum amount of heat a component can safely handle without damage", "ar": "أقصى كمية حرارة يتحمّلها المكوّن بأمان دون تلف"}, {"en": "The speed of anode rotation", "ar": "سرعة دوران الأنود"}, {"en": "The amount of X-rays produced", "ar": "كمية الأشعة السينية المنتجة"}], "answer": 1, "why": "المحاضرة: التصنيف الحراري هو أقصى كمية حرارة يتحمّلها المكوّن بأمان دون تلف."}, {"q_en": "The heat rating is usually expressed in:", "q_ar": "يُعبَّر عن التصنيف الحراري عادةً بـ:", "options": [{"en": "Heat Units (HU) or kilojoules (kJ)", "ar": "الوحدات الحرارية (HU) أو الكيلوجول (kJ)"}, {"en": "Revolutions per minute (rpm)", "ar": "دورة في الدقيقة"}, {"en": "Millimeters (mm)", "ar": "الملّيمتر"}, {"en": "Hertz (Hz)", "ar": "الهرتز"}], "answer": 0, "why": "المحاضرة: يُعبَّر عن التصنيف الحراري عادةً بالوحدات الحرارية أو الكيلوجول."}, {"q_en": "If the heat is not dissipated efficiently, it can:", "q_ar": "إذ
