ation is correct?", "q_ar": "أي عبارة عن الإشعاع الكهرومغناطيسي صحيحة؟", "options": [{"en": "It needs water or air to travel", "ar": "يحتاج الماء أو الهواء لينتقل"}, {"en": "It stops completely in a vacuum", "ar": "يتوقف تماماً في الفراغ"}, {"en": "It does not need a medium and can move through a vacuum", "ar": "لا يحتاج وسطاً ويمكنه الانتقال عبر الفراغ"}, {"en": "Each type travels at a different speed in a vacuum", "ar": "كل نوع ينتقل بسرعة مختلفة في الفراغ"}], "answer": 2, "why": "المحاضرة: لا يحتاج وسطاً لينتقل ويمكنه الانتقال عبر الفراغ، وكل موجاته بسرعة الضوء."}, {"q_en": "The speed of light in a vacuum is approximately:", "q_ar": "سرعة الضوء في الفراغ تقريباً:", "options": [{"en": "300 km/s", "ar": "300 كم/ث"}, {"en": "3,000 m/s", "ar": "3,000 م/ث"}, {"en": "30,000 km/h", "ar": "30,000 كم/ساعة"}, {"en": "300,000 km/s (3 × 10⁸ m/s)", "ar": "300,000 كم/ث (3 × 10⁸ م/ث)"}], "answer": 3, "why": "المحاضرة: سرعة الضوء ≈ 300,000 كم/ثانية (3 × 10⁸ م/ثانية)."}, {"q_en": "Amplitude (A) is the:", "q_ar": "السعة (A) هي:", "options": [{"en": "Distance of one complete cycle", "ar": "مسافة دورة كاملة"}, {"en": "Height from the midline to the crest", "ar": "الارتفاع من الخط الأوسط إلى القمة"}, {"en": "Time for one complete cycle", "ar": "زمن دورة كاملة"}, {"en": "Number of cycles per second", "ar": "عدد الدورات في الثانية"}], "answer": 1, "why": "المحاضرة: السعة هي الارتفاع من الخط الأوسط إلى القمة، والسعة الأكبر تعني شدة أعلى."}, {"q_en": "A shorter wavelength means:", "q_ar": "الطول الموجي الأقصر يعني:", "options": [{"en": "Higher frequency and higher energy", "ar": "تردداً أعلى وطاقة أعلى"}, {"en": "Lower frequency and lower energy", "ar": "تردداً أقل وطاقة أقل"}, {"en": "Longer period", "ar": "زمناً دورياً أطول"}, {"en": "Lower intensity only", "ar": "شدة أقل فقط"}], "answer": 0, "why": "المحاضرة: طول موجي أقصر ← تردد أعلى، وتردد أعلى ← طاقة أعلى."}, {"q_en": "Wavelength (λ) is measured:", "q_ar": "يُقاس الطول الموجي (λ):", "options": [{"en": "From the midline to the crest", "ar": "من الخط الأوسط إلى القمة"}, {"en": "In seconds", "ar": "بالثواني"}, {"en": "Crest to crest or trough to trough", "ar": "من قمة إلى قمة أو من قاع إلى قاع"}, {"en": "From the source to the patient", "ar": "من المصدر إلى المريض"}], "answer": 2, "why": "المحاضرة: الطول الموجي مسافة دورة كاملة، يُقاس من قمة إلى قمة أو من قاع إلى قاع."}, {"q_en": "Frequency and period are related by:", "q_ar": "العلاقة بين التردد والزمن الدوري:", "options": [{"en": "f = T (directly equal)", "ar": "f = T (متساويان)"}, {"en": "f = 1/T (inversely related)", "ar": "f = 1/T (علاقة عكسية)"}, {"en": "f = T²", "ar": "f = T²"}, {"en": "No relation", "ar": "لا توجد علاقة"}], "answer": 1, "why": "المحاضرة: التردد والزمن الدوري علاقتهما عكسية، والمعادلة f = 1/T."}, {"q_en": "Which is a feature of non-ionizing radiation?", "q_ar": "أي مما يلي من صفات الإشعاع غير المؤيِّن؟", "options": [{"en": "Removes electrons and forms ions", "ar": "ينتزع الإلكترونات ويكوّن أيونات"}, {"en": "High doses damage cells by ion formation", "ar": "الجرعات العالية تتلف الخلايا بتكوين الأيونات"}, {"en": "Low energy that causes vibration / heat", "ar": "طاقة منخفضة تسبّب اهتزازاً / حرارة"}, {"en": "Used in cancer treatment", "ar": "يُستعمل في علاج السرطان"}], "answer": 2, "why": "المحاضرة: غير المؤيِّن طاقته منخفضة، لا ينتزع الإلكترونات، ويسبّب اهتزازاً وحرارة."}, {"q_en": "An example of non-ionizing radiation given in the lecture is:", "q_ar": "مثال الإشعاع غير المؤيِّن الذي ذكرته المحاضرة هو:", "options": [{"en": "Gamma rays", "ar": "أشعة غاما"}, {"en": "X-rays", "ar": "الأشعة السينية"}, {"en": "Alpha particles", "ar": "جسيمات ألفا"}, {"en": "Visible light", "ar": "الضوء المرئي"}], "answer": 3, "why": "المحاضرة: مثال الإشعاع غير المؤيِّن هو الضوء المرئي."}, {"q_en": "Ionizing radiation:", "q_ar": "الإشعاع المؤيِّن:", "options": [{"en": "Has high energy, removes electrons and forms ions", "ar": "طاقته عالية، ينتزع الإلكترونات ويكوّن أيونات"}, {"en": "Has low energy and only causes heating", "ar": "طاقته منخفضة ويسبّب تسخيناً فقط"}, {"en": "Cannot remove electrons", "ar": "لا يستطيع انتزاع الإلكترونات"}, {"en": "Has no beneficial uses", "ar": "ليس له استعمالات مفيدة"}], "answer": 0, "why": "المحاضرة: المؤيِّن طاقته عالية، ينتزع الإلكترونات ويكوّن أيونات."}, {"q_en": "Unstable atoms release energy as ionizing radiation in order to:", "q_ar": "الذرات غير المستقرة تطلق طاقة كإشعاع مؤيِّن لكي:", "options": [{"en": "Become more stable", "ar": "تصبح أكثر استقراراً"}, {"en": "Gain more electrons", "ar": "تكسب إلكترونات أكثر"}, {"en": "Increase their energy", "ar": "تزيد طاقتها"}, {"en": "Become heavier", "ar": "تصبح أثقل"}], "answer": 0, "why": "المحاضرة: الذرات غير المستقرة تطلق طاقة كإشعاع مؤيِّن لكي تصبح أكثر استقراراً."}, {"q_en": "Which radiation is a heavy, positively charged particle stopped by paper or skin?", "q_ar": "أي إشعاع جسيم ثقيل موجب الشحنة توقفه الورقة أو الجلد؟", "options": [{"en": "Beta radiation (β)", "ar": "إشعاع بيتا"}, {"en": "Alpha particle (α)", "ar": "جسيم ألفا"}, {"en": "Gamma rays (γ)", "ar": "أشعة غاما"}, {"en": "Neutrons (n)", "ar": "النيوترونات"}], "answer": 1, "why": "المحاضرة: ألفا جسيم ثقيل موجب الشحنة، اختراقه منخفض، توقفه الورقة أو الجلد."}, {"q_en": "Beta radiation is stopped by:", "q_ar": "يوقف إشعاعَ بيتا:", "options": [{"en": "A sheet of paper", "ar": "ورقة"}, {"en": "A few mm of aluminum", "ar": "بضعة ملّيمترات من الألمنيوم"}, {"en": "Thick concrete only", "ar": "الخرسانة السميكة فقط"}, {"en": "Nothing can stop it", "ar": "لا شيء يوقفه"}], "answer": 1, "why": "المحاضرة: بيتا ينفذ عبر 1–2 سم من الماء، وتوقفه بضعة ملّيمترات من الألمنيوم."}, {"q_en": "Which radiation type has no charge and is produced in fission and fusion?", "q_ar": "أي نوع إشعاع بلا شحنة وينتج في الانشطار والاندماج؟", "options": [{"en": "Alpha particles", "ar": "جسيمات ألفا"}, {"en": "Beta particles", "ar": "جسيمات بيتا"}, {"en": "Visible light", "ar": "الضوء المرئي"}, {"en": "Neutrons", "ar": "النيوترونات"}], "answer": 3, "why": "المحاضرة: النيوترونات تنتج في الانشطار والاندماج، بلا شحنة، وشديدة الاختراق."}, {"q_en": "The correct order of penetration (lowest to highest) is:", "q_ar": "الترتيب الصحيح لقدرة الاختراق (من الأقل إلى الأعلى):", "options": [{"en": "Gamma < Beta < Alpha < Neutron", "ar": "غاما < بيتا < ألفا < النيوترون"}, {"en": "Neutron < Gamma < Beta < Alpha", "ar": "النيوترون < غاما < بيتا < ألفا"}, {"en": "Alpha < Beta < Gamma < Neutron", "ar": "ألفا < بيتا < غاما < النيوترون"}, {"en": "Beta < Alpha < Neutron < Gamma", "ar": "بيتا < ألفا < النيوترون < غاما"}], "answer": 2, "why": "المحاضرة: ترتيب الاختراق: ألفا (الأقل) < بيتا < غاما < النيوترون (الأعلى)."}, {"q_en": "Röntgen discovered X-rays in:", "q_ar": "اكتشف رونتغن الأشعة السينية عام:", "options": [{"en": "1845", "ar": "1845"}, {"en": "1895", "ar": "1895"}, {"en": "1923", "ar": "1923"}, {"en": "1905", "ar": "1905"}], "answer": 1, "why": "المحاضرة: في عام 1895 كان رونتغن يجري تجاربه على أنبوب أشعة الكاثود، و1895 سنة الاكتشاف."}, {"q_en": "Röntgen noticed a glow on a nearby screen made of:", "q_ar": "لاحظ رونتغن توهّجاً على شاشة قريبة مصنوعة من:", "options": [{"en": "Barium platinocyanide", "ar": "بلاتينوسيانيد الباريوم"}, {"en": "Lead glass", "ar": "زجاج الرصاص"}, {"en": "Tungsten", "ar": "التنغستن"}, {"en": "Aluminum", "ar": "الألمنيوم"}], "answer": 0, "why": "المحاضرة: لاحظ توهّجاً على شاشة بلاتينوسيانيد الباريوم القريبة رغم تغطية الأنبوب."}, {"q_en": "Why were they named X-rays?", "q_ar": "لماذا سُمّيت الأشعة السينية (X-rays)؟", "options": [{"en": "Because X = unknown", "ar": "لأن X = مجهول"}, {"en": "After the shape of the tube", "ar": "نسبةً لشكل الأنبوب"}, {"en": "Because they are the tenth type of ray", "ar": "لأنها النوع العاشر من الأشعة"}, {"en": "After the barium screen", "ar": "نسبةً لشاشة الباريوم"}], "answer": 0, "why": "المحاضرة: سمّاها X لأن الإشعاع كان مجهولاً (X = مجهول)."}, {"q_en": "The first radiograph showed:", "q_ar": "أول صورة شعاعية أظهرت:", "options": [{"en": "Röntgen's own chest", "ar": "صدر رونتغن نفسه"}, {"en": "A broken leg", "ar": "ساقاً مكسورة"}, {"en": "The bones of his wife Anna Bertha's hand and a ring", "ar": "عظام يد زوجته آنا بيرتا وخاتماً"}, {"en": "A metal key", "ar": "مفتاحاً معدنياً"}], "answer": 2, "why": "المحاضرة: أول صورة شعاعية أظهرت عظام يد زوجته آنا بيرتا وخاتماً."}]}</script>

document.addEventListener("DOMContentLoaded", () => {

  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)

    });

});
