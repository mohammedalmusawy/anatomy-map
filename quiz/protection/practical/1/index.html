eta particles", "ar": "جسيمات بيتا"}, {"en": "Helium nuclei", "ar": "نوى الهيليوم"}, {"en": "Neutrons", "ar": "النيوترونات"}], "answer": 3, "why": "النيوترونات (وغاما والأشعة السينية) غير مشحونة، فهي مؤيِّنة غير مباشرة. ألفا وبيتا مشحونة."}, {"q_en": "Which barrier is enough to stop alpha particles?", "q_ar": "أيّ حاجز يكفي لإيقاف جسيمات ألفا؟", "options": [{"en": "Lead", "ar": "الرصاص"}, {"en": "Paper", "ar": "الورق"}, {"en": "Concrete", "ar": "الخرسانة"}, {"en": "Water/paraffin", "ar": "الماء أو البارافين"}], "answer": 1, "why": "حسب مخطط قدرة الاختراق، ألفا يوقفها الورق."}, {"q_en": "Beta particles are stopped by:", "q_ar": "جسيمات بيتا يوقفها:", "options": [{"en": "Paper", "ar": "الورق"}, {"en": "Aluminum", "ar": "الألمنيوم"}, {"en": "Air", "ar": "الهواء"}, {"en": "Water/paraffin", "ar": "الماء أو البارافين"}], "answer": 1, "why": "بيتا تعبر الورق ويوقفها الألمنيوم."}, {"q_en": "To shield gamma rays (γ) we need:", "q_ar": "لحجب أشعة غاما (γ) نحتاج إلى:", "options": [{"en": "Paper", "ar": "الورق"}, {"en": "Aluminum only", "ar": "الألمنيوم فقط"}, {"en": "A sheet of plastic", "ar": "لوح بلاستيك"}, {"en": "Lead/concrete", "ar": "الرصاص أو الخرسانة"}], "answer": 3, "why": "غاما تخترق بعمق وتحتاج إلى الرصاص أو الخرسانة."}, {"q_en": "Neutrons are slowed by:", "q_ar": "النيوترونات يُبطئها:", "options": [{"en": "Water/paraffin", "ar": "الماء أو البارافين"}, {"en": "Paper", "ar": "الورق"}, {"en": "Aluminum", "ar": "الألمنيوم"}, {"en": "Air", "ar": "الهواء"}], "answer": 0, "why": "اختراق النيوترونات عالٍ جداً، والمحاضرة تذكر أن الماء أو البارافين يُبطئها."}, {"q_en": "According to the UNSCEAR 2008 chart, natural radiation makes up:", "q_ar": "حسب مخطط تقرير UNSCEAR 2008، يشكّل الإشعاع الطبيعي:", "options": [{"en": "20%", "ar": "20 بالمئة"}, {"en": "42%", "ar": "42 بالمئة"}, {"en": "80%", "ar": "80 بالمئة"}, {"en": "9%", "ar": "9 بالمئة"}], "answer": 2, "why": "الطبيعي 80% والصناعي 20%. أما 42% فهي نسبة الرادون وحده، و9% للطعام والمشروبات."}, {"q_en": "The largest single natural source of radiation is:", "q_ar": "أكبر مصدر طبيعي منفرد للإشعاع هو:", "options": [{"en": "Cosmic rays (13%)", "ar": "الأشعة الكونية (13 بالمئة)"}, {"en": "Buildings/soil (16%)", "ar": "المباني والتربة (16 بالمئة)"}, {"en": "Food/drinks (9%)", "ar": "الطعام والمشروبات (9 بالمئة)"}, {"en": "Radon gas from ground (42%)", "ar": "غاز الرادون من الأرض (42 بالمئة)"}], "answer": 3, "why": "غاز الرادون من الأرض 42%، وهو أكبر نسبة في المخطط."}, {"q_en": "The main man-made source of radiation is:", "q_ar": "المصدر الصناعي الرئيس للإشعاع هو:", "options": [{"en": "Fallout (below 1%)", "ar": "الغبار الذري المتساقط (أقل من 1 بالمئة)"}, {"en": "Medicine (almost 20%)", "ar": "الطب (نحو 20 بالمئة)"}, {"en": "Occupational exposure (below 1%)", "ar": "التعرّض المهني (أقل من 1 بالمئة)"}, {"en": "Nuclear discharges (below 1%)", "ar": "التصريفات النووية (أقل من 1 بالمئة)"}], "answer": 1, "why": "الطب نحو 20%، أما التعرّض المهني والغبار الذري والمنتجات والتصريفات النووية فكلها ضمن «أقل من 1%»."}, {"q_en": "Which of the following is listed as an artificial source of radiation?", "q_ar": "أيّ مما يأتي مذكور مصدراً صناعياً للإشعاع؟", "options": [{"en": "Cosmic rays", "ar": "الأشعة الكونية"}, {"en": "Radon gas from ground", "ar": "غاز الرادون من الأرض"}, {"en": "A smoke detector", "ar": "كاشف الدخان"}, {"en": "Food/drinks", "ar": "الطعام والمشروبات"}], "answer": 2, "why": "كاشف الدخان من المصادر الصناعية في المحاضرة. الخيارات الأخرى مصادر طبيعية."}, {"q_en": "The only type of radiation visible to the human eye is:", "q_ar": "النوع الوحيد من الإشعاع الذي تراه عين الإنسان هو:", "options": [{"en": "Visible light", "ar": "الضوء المرئي"}, {"en": "Radio waves", "ar": "الموجات الراديوية"}, {"en": "Microwaves", "ar": "الموجات الدقيقة"}, {"en": "X-rays", "ar": "الأشعة السينية"}], "answer": 0, "why": "المحاضرة تنص على أن الضوء المرئي هو النوع الوحيد المرئي لعين الإنسان."}, {"q_en": "Internal exposure occurs when:", "q_ar": "يحدث التعرّض الداخلي عندما:", "options": [{"en": "Radioactive material enters the body", "ar": "تدخل مادة مشعّة إلى الجسم"}, {"en": "The source is located outside the body", "ar": "يكون المصدر خارج الجسم"}, {"en": "The patient stands outdoors", "ar": "يقف المريض في الهواء الطلق"}, {"en": "The x-ray beam passes through the body", "ar": "تعبر حزمة الأشعة السينية الجسم"}], "answer": 0, "why": "الداخلي: مادة مشعّة تدخل الجسم. أما المصدر خارج الجسم (ومنه حزمة الأشعة السينية) فهو تعرّض خارجي."}, {"q_en": "The two routes of internal exposure in the lecture are:", "q_ar": "طريقا التعرّض الداخلي في المحاضرة هما:", "options": [{"en": "Indoors and outdoors", "ar": "داخل المباني وخارجها"}, {"en": "Paper and aluminum", "ar": "الورق والألمنيوم"}, {"en": "Ingestion and inhalation", "ar": "الابتلاع والاستنشاق"}, {"en": "Alpha and beta", "ar": "ألفا وبيتا"}], "answer": 2, "why": "الداخلي: ابتلاع واستنشاق. أما داخل المباني وخارجها فهما من التعرّض الخارجي."}, {"q_en": "The approximate dose of a chest X-ray is:", "q_ar": "الجرعة التقريبية لصورة الصدر الشعاعية هي:", "options": [{"en": "5 – 10 mSv", "ar": "من 5 إلى 10 ملّي سيفرت"}, {"en": "0.1 mSv", "ar": "0.1 ملّي سيفرت"}, {"en": "2 – 3 mSv / year", "ar": "من 2 إلى 3 ملّي سيفرت في السنة"}, {"en": "1 – 2 mSv / year", "ar": "من 1 إلى 2 ملّي سيفرت في السنة"}], "answer": 1, "why": "صورة الصدر 0.1 mSv. أما 5 – 10 فهي مفراس البطن، و2 – 3 الخلفية الطبيعية، و1 – 2 الرادون في المنزل."}, {"q_en": "The approximate dose of a CT abdomen is:", "q_ar": "الجرعة التقريبية لمفراس البطن هي:", "options": [{"en": "0.1 mSv", "ar": "0.1 ملّي سيفرت"}, {"en": "~0.3 mSv / year", "ar": "نحو 0.3 ملّي سيفرت في السنة"}, {"en": "1 – 2 mSv / year", "ar": "من 1 إلى 2 ملّي سيفرت في السنة"}, {"en": "5 – 10 mSv", "ar": "من 5 إلى 10 ملّي سيفرت"}], "answer": 3, "why": "مفراس البطن 5 – 10 mSv، وهو أعلى جرعة في الجدول. أما ~0.3 فللأشعة الكونية عند سطح البحر."}]}</script>
