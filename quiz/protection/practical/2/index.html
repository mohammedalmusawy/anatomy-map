 "12 غراي"}], "answer": 0, "why": "D = E / M = 10 / 2 = 5 Gy."}, {"q_en": "An organ of M = 3 kg receives D = 4 Gy. The energy deposited is:", "q_ar": "عضو كتلته M = 3 kg يتلقّى D = 4 Gy. الطاقة المودَعة:", "options": [{"en": "1.33 J", "ar": "1.33 جول"}, {"en": "7 J", "ar": "7 جول"}, {"en": "12 J", "ar": "12 جول"}, {"en": "0.75 J", "ar": "0.75 جول"}], "answer": 2, "why": "E = D × M = 4 × 3 = 12 J."}, {"q_en": "The equivalent dose equation is:", "q_ar": "معادلة الجرعة المكافئة هي:", "options": [{"en": "E = HT × WT", "ar": "E = HT × WT"}, {"en": "HT,R = WR × DT", "ar": "HT,R = WR × DT"}, {"en": "D = E / M", "ar": "D = E / M"}, {"en": "A = λN", "ar": "A = λN"}], "answer": 1, "why": "الجرعة المكافئة = عامل الترجيح الإشعاعي × الجرعة الممتصّة في العضو. أما E = HT × WT فهي الجرعة الفعّالة."}, {"q_en": "In the equivalent dose equation, WR is:", "q_ar": "في معادلة الجرعة المكافئة، WR هو:", "options": [{"en": "The tissue weighting factor", "ar": "عامل الترجيح النسيجي"}, {"en": "The absorbed dose by organ T", "ar": "الجرعة الممتصّة في العضو T"}, {"en": "The decay constant", "ar": "ثابت التحلّل"}, {"en": "The radiation weighting factor", "ar": "عامل الترجيح الإشعاعي"}], "answer": 3, "why": "WR عامل الترجيح الإشعاعي (نوع الإشعاع)، وWT عامل الترجيح النسيجي، وDT الجرعة الممتصّة في العضو."}, {"q_en": "DT = 3 Gy and WR = 5. The equivalent dose is:", "q_ar": "DT = 3 Gy وWR = 5. الجرعة المكافئة:", "options": [{"en": "0.6 Sv", "ar": "0.6 سيفرت"}, {"en": "8 Sv", "ar": "8 سيفرت"}, {"en": "15 Sv", "ar": "15 سيفرت"}, {"en": "15 Gy", "ar": "15 غراي"}], "answer": 2, "why": "HT,R = WR × DT = 5 × 3 = 15 Sv. الوحدة سيفرت وليست غراي."}, {"q_en": "The effective dose takes into account that:", "q_ar": "الجرعة الفعّالة تأخذ بالحسبان أن:", "options": [{"en": "Not all tissues have the same sensitivity to radiation", "ar": "الأنسجة ليست متساوية في حساسيتها للإشعاع"}, {"en": "All tissues have the same sensitivity", "ar": "كل الأنسجة متساوية في الحساسية"}, {"en": "Radiation is measured only in air", "ar"
