 "12 غراي"}], "answer": 0, "why": "D = E / M = 10 / 2 = 5 Gy."}, {"q_en": "An organ of M = 3 kg receives D = 4 Gy. The energy deposited is:", "q_ar": "عضو كتلته M = 3 kg يتلقّى D = 4 Gy. الطاقة المودَعة:", "options": [{"en": "1.33 J", "ar": "1.33 جول"}, {"en": "7 J", "ar": "7 جول"}, {"en": "12 J", "ar": "12 جول"}, {"en": "0.75 J", "ar": "0.75 جول"}], "answer": 2, "why": "E = D × M = 4 × 3 = 12 J."}, {"q_en": "The equivalent dose equation is:", "q_ar": "معادلة الجرعة المكافئة هي:", "options": [{"en": "E = HT × WT", "ar": "E = HT × WT"}, {"en": "HT,R = WR × DT", "ar": "HT,R = WR × DT"}, {"en": "D = E / M", "ar": "D = E / M"}, {"en": "A = λN", "ar": "A = λN"}], "answer": 1, "why": "الجرعة المكافئة = عامل الترجيح الإشعاعي × الجرعة الممتصّة في العضو. أما E = HT × WT فهي الجرعة الفعّالة."}, {"q_en": "In the equivalent dose equation, WR is:", "q_ar": "في معادلة الجرعة المكافئة، WR هو:", "options": [{"en": "The tissue weighting factor", "ar": "عامل الترجيح النسيجي"}, {"en": "The absorbed dose by organ T", "ar": "الجرعة الممتصّة في العضو T"}, {"en": "The decay constant", "ar": "ثابت التحلّل"}, {"en": "The radiation weighting factor", "ar": "عامل الترجيح الإشعاعي"}], "answer": 3, "why": "WR عامل الترجيح الإشعاعي (نوع الإشعاع)، وWT عامل الترجيح النسيجي، وDT الجرعة الممتصّة في العضو."}, {"q_en": "DT = 3 Gy and WR = 5. The equivalent dose is:", "q_ar": "DT = 3 Gy وWR = 5. الجرعة المكافئة:", "options": [{"en": "0.6 Sv", "ar": "0.6 سيفرت"}, {"en": "8 Sv", "ar": "8 سيفرت"}, {"en": "15 Sv", "ar": "15 سيفرت"}, {"en": "15 Gy", "ar": "15 غراي"}], "answer": 2, "why": "HT,R = WR × DT = 5 × 3 = 15 Sv. الوحدة سيفرت وليست غراي."}, {"q_en": "The effective dose takes into account that:", "q_ar": "الجرعة الفعّالة تأخذ بالحسبان أن:", "options": [{"en": "Not all tissues have the same sensitivity to radiation", "ar": "الأنسجة ليست متساوية في حساسيتها للإشعاع"}, {"en": "All tissues have the same sensitivity", "ar": "كل الأنسجة متساوية في الحساسية"}, {"en": "Radiation is measured only in air", "ar": "الإشعاع يُقاس في الهواء فقط"}, {"en": "Activity decreases with time", "ar": "النشاط يقلّ مع الزمن"}], "answer": 0, "why": "لأن الأنسجة تختلف في حساسيتها، تُضرب الجرعة المكافئة في عامل الترجيح النسيجي WT."}, {"q_en": "HT = 10 Sv and WT = 0.2. The effective dose is:", "q_ar": "HT = 10 Sv وWT = 0.2. الجرعة الفعّالة:", "options": [{"en": "50 Sv", "ar": "50 سيفرت"}, {"en": "10.2 Sv", "ar": "10.2 سيفرت"}, {"en": "0.02 Sv", "ar": "0.02 سيفرت"}, {"en": "2 Sv", "ar": "2 سيفرت"}], "answer": 3, "why": "E = HT × WT = 10 × 0.2 = 2 Sv."}, {"q_en": "The SI unit of effective dose is:", "q_ar": "وحدة الجرعة الفعّالة في النظام الدولي هي:", "options": [{"en": "Gray (Gy)", "ar": "الغراي (Gy)"}, {"en": "Sievert (Sv)", "ar": "السيفرت (Sv)"}, {"en": "Becquerel (Bq)", "ar": "البيكريل (Bq)"}, {"en": "Joule (J)", "ar": "الجول (J)"}], "answer": 1, "why": "الجرعتان المكافئة والفعّالة كلتاهما بالسيفرت."}, {"q_en": "The committed equivalent dose is the total equivalent dose received by a specific organ:", "q_ar": "الجرعة المكافئة الملتزَم بها هي مجموع الجرعة المكافئة التي يتلقّاها عضو محدّد:", "options": [{"en": "During one chest X-ray only", "ar": "خلال صورة صدر واحدة فقط"}, {"en": "Over a specified period of time following the intake of radioactive material", "ar": "خلال مدة محدّدة بعد دخول مادة مشعّة إلى الجسم"}, {"en": "From outdoor exposure only", "ar": "من التعرّض خارج المباني فقط"}, {"en": "Before the intake of radioactive material", "ar": "قبل دخول المادة المشعّة"}], "answer": 1, "why": "«الملتزَم بها» تخص المادة المشعّة التي دخلت الجسم، وتُحسب خلال مدة زمنية محدّدة بعد دخولها."}, {"q_en": "In the committed equivalent dose equation HT(τ), τ is:", "q_ar": "في معادلة HT(τ)، الرمز τ هو:", "options": [{"en": "The tissue weighting factor", "ar": "عامل الترجيح النسيجي"}, {"en": "The equivalent dose rate", "ar": "معدّل الجرعة المكافئة"}, {"en": "The decay constant", "ar": "ثابت التحلّل"}, {"en": "The integration time", "ar": "زمن التكامل"}], "answer": 3, "why": "τ زمن التكامل، وḢT(t) معدّل الجرعة المكافئة عند الزمن t."}, {"q_en": "The committed effective dose is the sum of the committed equivalent doses to all organs and tissues, each multiplied by:", "q_ar": "الجرعة الفعّالة الملتزَم بها هي مجموع الجرعات المكافئة الملتزَم بها لكل الأعضاء، كلٌّ منها مضروب في:", "options": [{"en": "Its tissue weighting factor WT", "ar": "عامل الترجيح النسيجي الخاص به WT"}, {"en": "The decay constant λ", "ar": "ثابت التحلّل λ"}, {"en": "The mass of the organ", "ar": "كتلة العضو"}, {"en": "The number of nuclei N", "ar": "عدد النوى N"}], "answer": 0, "why": "E(τ) = Σ WT HT(τ): كل جرعة مكافئة ملتزَم بها تُضرب في WT ثم تُجمع."}, {"q_en": "KERMA stands for:", "q_ar": "KERMA اختصار لـ:", "options": [{"en": "Kinetic Energy Radiation Measurement Area", "ar": "منطقة قياس طاقة الإشعاع الحركية"}, {"en": "Kilogram Energy Released per Minute of Activity", "ar": "طاقة الكيلوغرام المتحرّرة لكل دقيقة نشاط"}, {"en": "Kinetic Energy Released per unit Mass", "ar": "الطاقة الحركية المتحرّرة لكل وحدة كتلة"}, {"en": "Known Equivalent Radiation Mass Absorbed", "ar": "الكتلة الممتصّة المكافئة المعروفة"}], "answer": 2, "why": "KERMA = Kinetic Energy Released per unit Mass."}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/أساسيات الوقاية من الإشعاع/عملي/م02 - وحدات قياس الإشعاع والوحدات الدولية"}</script>
