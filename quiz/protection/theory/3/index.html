 is part of the optimization (ALARA) principle?", "q_ar": "أيّ مما يأتي جزء من مبدأ الأمثَلة (Optimization / ALARA)؟", "options": [{"en": "Increasing the time spent near the source", "ar": "زيادة الوقت الذي يُقضى قرب المصدر"}, {"en": "Using the least amount of radiation necessary for the task", "ar": "استعمال أقل كمية من الإشعاع تكفي للمهمة"}, {"en": "Removing shielding to improve image quality", "ar": "إزالة التدريع لتحسين جودة الصورة"}, {"en": "Using a higher dose than needed to ensure diagnostic quality", "ar": "استعمال جرعة أعلى من اللازم لضمان الجودة التشخيصية"}], "answer": 1, "why": "الأمثَلة (Optimization) تشمل تقليل التعرّض غير الضروري، واستعمال أقل كمية إشعاع لازمة، وتحسين تصميم المصادر والمرافق."}, {"q_en": "According to the lecture, the intensity of radiation decreases with:", "q_ar": "حسب المحاضرة، تنخفض شدة الإشعاع مع:", "options": [{"en": "The time spent standing near the source", "ar": "الوقت الذي يُقضى واقفاً قرب المصدر"}, {"en": "The age of the exposed worker", "ar": "عمر العامل المعرَّض"}, {"en": "The size of the X-ray room", "ar": "حجم غرفة الأشعة"}, {"en": "The square of the distance from the source", "ar": "مربع المسافة من المصدر"}], "answer": 3, "why": "الشدة تنخفض مع مربع المسافة (قانون التربيع العكسي): مضاعفة المسافة تجعل الشدة ربع ما كانت."}, {"q_en": "The choice of shielding material and thickness depends on:", "q_ar": "يعتمد اختيار مادة التدريع وسُمكها على:", "options": [{"en": "The type and energy of the radiation", "ar": "نوع الإشعاع وطاقته"}, {"en": "The age of the patient", "ar": "عمر المريض"}, {"en": "The patient's weight and height", "ar": "وزن المريض وطوله"}, {"en": "The number of workers in the department", "ar": "عدد العاملين في القسم"}], "answer": 0, "why": "المحاضرة تقول إن اختيار مادة التدريع وسُمكها يعتمد على نوع الإشعاع وطاقته."}, {"q_en": "Dose limits are typically expressed in terms of:", "q_ar": "يُعبَّر عن حدود الجرعة عادةً بـ:", "options": [{"en": "Activity", "ar": "النشاط الإشعاعي"}, {"en": "Effective dose", "ar": "الجرعة الفعّالة"}, {"en": "Exposure in roentgen", "ar": "التعرّض بالرونتجن"}, {"en": "Kerma", "ar": "الكيرما"}], "answer": 1, "why": "حدود الجرعة تُعبَّر عادةً بالجرعة الفعّالة، وهي مصممة لمنع الآثار الصحية المرتبطة بالإشعاع."}, {"q_en": "Compared with the general public, occupational exposure limits are:", "q_ar": "مقارنةً بعامة الناس، حدود التعرّض المهني:", "options": [{"en": "Lower, to provide an additional margin of safety for workers", "ar": "أقل، لتوفير هامش أمان إضافي للعاملين"}, {"en": "Exactly the same", "ar": "متساوية تماماً"}, {"en": "Higher, but still subject to the ALARA principle", "ar": "أعلى، لكنها تبقى خاضعة لمبدأ ALARA"}, {"en": "Not subject to any principle", "ar": "غير خاضعة لأي مبدأ"}], "answer": 2, "why": "حدود العاملين أعلى عموماً من حدود عامة الناس، لكنها تبقى خاضعة لـ ALARA."}, {"q_en": "The public dose limit is set much lower than the occupational limit to:", "q_ar": "يُحدَّد حد جرعة عامة الناس أقل بكثير من الحد المهني من أجل:", "options": [{"en": "Allow more medical procedures", "ar": "السماح بمزيد من الإجراءات الطبية"}, {"en": "Avoid the need for dosimeters for members of the public", "ar": "الاستغناء عن مقاييس الجرعة لعامة الناس"}, {"en": "Provide an additional margin of safety", "ar": "توفير هامش أمان إضافي"}, {"en": "Simplify dose measurement", "ar": "تبسيط قياس الجرعة"}], "answer": 2, "why": "عامة الناس غير معرَّضين مهنياً، فيكون حدّهم أقل بكثير لتوفير هامش أمان إضافي."}, {"q_en": "Whole-body dose limits refer to the maximum permissible exposure to the entire body over a specified period, typically:", "q_ar": "حدود جرعة الجسم كله هي أقصى تعرّض مسموح للجسم كله خلال فترة محددة، عادةً:", "options": [{"en": "A day", "ar": "يوم"}, {"en": "A year", "ar": "سنة"}, {"en": "A week", "ar": "أسبوع"}, {"en": "A lifetime", "ar": "العمر كله"}], "answer": 1, "why": "المحاضرة تقول: خلال فترة محددة، عادةً في السنة."}, {"q_en": "Maximum permissible occupational doses can vary depending on:", "q_ar": "الجرعات المهنية القصوى المسموح بها قد تختلف بحسب:", "options": [{"en": "The country and the regulatory authority", "ar": "البلد والجهة الرقابية"}, {"en": "The number of examinations performed per day", "ar": "عدد الفحوصات المنجزة في اليوم"}, {"en": "The age of the X-ray equipment in the department", "ar": "عمر أجهزة الأشعة في القسم"}, {"en": "The size of the hospital", "ar": "حجم المستشفى"}], "answer": 0, "why": "الحدود المحددة قد تختلف باختلاف البلد والجهة الرقابية، لكنها مبنية عموماً على توصيات ICRP."}, {"q_en": "Dose limits for tissues and organs are typically set by:", "q_ar": "حدود الجرعة للأنسجة والأعضاء تضعها عادةً:", "options": [{"en": "UNSCEAR and WHO", "ar": "UNSCEAR و WHO"}, {"en": "Each hospital alone", "ar": "كل مستشفى بمفرده"}, {"en": "ICRP and the United States NRC", "ar": "ICRP و NRC الأمريكية"}, {"en": "X-ray equipment manufacturers and suppliers", "ar": "الشركات المصنّعة والمورّدة لأجهزة الأشعة"}], "answer": 2, "why": "المحاضرة تذكر ICRP وهيئة التنظيم النووي الأمريكية (NRC)."}, {"q_en": "According to the lecture, dose limits can vary depending on:", "q_ar": "حسب المحاضرة، قد تختلف حدود الجرعة بحسب:", "options": [{"en": "The patient's height, weight and body mass index only", "ar": "طول المريض ووزنه ومؤشر كتلة جسمه فقط"}, {"en": "The kVp and mAs selected, the image receptor used, and the number of exposures taken per day", "ar": "قيم kVp و mAs المختارة، ومستقبِل الصورة المستعمل، وعدد التعريضات في اليوم"}, {"en": "The film size and the type of cassette", "ar": "حجم الفيلم ونوع الكاسيت"}, {"en": "The circumstances, the type of radiation, and the individual's age and exposure history", "ar": "الظروف، ونوع الإشعاع، وعمر الفرد وتاريخ تعرّضه"}], "answer": 3, "why": "الحدود تختلف بحسب الظروف المحددة ونوع الإشعاع وعمر الفرد وتاريخ تعرّضه للإشعاع."}, {"q_en": "A radiologic technologist exposed to radiation during work receives:", "q_ar": "تقنيّ الأشعة الذي يتعرّض للإشعاع في أثناء عمله يتلقى:", "options": [{"en": "Occupational exposure", "ar": "تعرّضاً مهنياً"}, {"en": "Medical exposure", "ar": "تعرّضاً طبياً"}, {"en": "Public exposure", "ar": "تعرّض عامة الناس"}, {"en": "Natural exposure only", "ar": "تعرّضاً طبيعياً فقط"}], "answer": 0, "why": "التعرّض المهني هو الذي يحدث في أثناء العمل، ويشمل الأطباء وتقنيّي الأشعة وعمال المحطات النووية."}, {"q_en": "Occupational workers wear dosimeters to:", "q_ar": "يرتدي العاملون المعرَّضون مهنياً مقاييس الجرعة من أجل:", "options": [{"en": "Shield the body from radiation", "ar": "حماية الجسم من الإشعاع"}, {"en": "Increase image quality", "ar": "تحسين جودة الصورة"}, {"en": "Reduce the time of exposure", "ar": "تقليل زمن التعرّض"}, {"en": "Monitor their radiation dose", "ar": "مراقبة الجرعة الإشعاعية التي يتلقونها"}], "answer": 3, "why": "مقياس الجرعة يراقب الجرعة ولا يحمي منها؛ أما الحماية فبمعدات مثل مآزر الرصاص والقفازات."}, {"q_en": "Medical exposure is radiation received:", "q_ar": "التعرّض الطبي هو الإشعاع الذي يُتلقّى:", "options": [{"en": "From nuclear power plants", "ar": "من محطات الطاقة النووية"}, {"en": "During medical procedures such as X-rays, CT scans, or radiation therapy", "ar": "في أثناء الإجراءات الطبية مثل الأشعة السينية و CT والعلاج الإشعاعي"}, {"en": "During work activities in a nuclear power plant or an industrial radiography site", "ar": "في أثناء العمل في محطة طاقة نووية أو في موقع للتصوير الصناعي"}, {"en": "From radiological incidents", "ar": "من الحوادث الإشعاعية"}], "answer": 1, "why": "التعرّض الطبي يكون في أثناء الإجراءات الطبية. محطات الطاقة والحوادث الإشعاعية مصادر لتعرّض عامة الناس، والعمل في المحطة تعرّض مهني."}, {"q_en": "Radiation that members of the public may receive from nuclear power plants or radiological incidents is called:", "q_ar": "الإشعاع الذي قد يتلقاه أفراد عامة الناس من محطات الطاقة النووية أو الحوادث الإشعاعية يُسمّى:", "options": [{"en": "Occupational exposure", "ar": "التعرّض المهني"}, {"en": "Medical exposure", "ar": "التعرّض الطبي"}, {"en": "Public exposure", "ar": "تعرّض عامة الناس"}, {"en": "Committed dose", "ar": "الجرعة الملتزَم بها"}], "answer": 2, "why": "تعرّض عامة الناس مصادره محطات الطاقة النووية والإشعاع البيئي والحوادث الإشعاعية، والسلطات تضع حدوداً آمنة لحماية الجميع."}, {"q_en": "A technologist avoids repeat exposures and uses the lowest exposure that still gives a diagnostic image. Which principle is being applied?", "q_ar": "تقنيّ أشعة يتجنب إعادة التعريض ويستعمل أقل تعريض يعطي صورة تشخيصية. أي مبدأ يطبّق؟", "options": [{"en": "Optimization (ALARA)", "ar": "الأمثَلة (Optimization / ALARA)"}, {"en": "Justification", "ar": "التبرير"}, {"en": "Dose limitation", "ar": "تحديد الجرعة"}, {"en": "Classification of exposure", "ar": "تصنيف التعرّض"}], "answer": 0, "why": "المحاضرة: الأمثَلة (Optimization / ALARA) تعني تقليل التعرّض غير الضروري واستعمال أقل كمية من الإشعاع لازمة للمهمة.", "kind": "apply"}, {"q_en": "A CT scan is requested although ultrasound, which uses no ionizing radiation, can give the same diagnostic answer. Which principle is NOT met?", "q_ar": "طُلب فحص مفراس مع أن السونار، وهو بلا إشعاع مؤين، يعطي نفس الجواب التشخيصي. أي مبدأ لم يتحقق؟", "options": [{"en": "Optimization (ALARA)", "ar": "الأمثَلة (Optimization / ALARA)"}, {"en": "Justification", "ar": "التبرير"}, {"en": "Dose limitation", "ar": "تحديد الجرعة"}, {"en": "Shielding", "ar": "التدريع"}], "answer": 1, "why": "المحاضرة: الإجراء الطبي بالإشعاع يُجرى فقط إذا كان ضرورياً ولا توجد طريقة بديلة بلا إشعاع تحقق النتيجة التشخيصية نفسها، وهذا هو التبرير.", "kind": "apply"}, {"q_en": "A worker moves from 1 m to 2 m away from a radiation source. Since intensity decreases with the square of the distance, the intensity becomes about:", "q_ar": "عامل يبتعد عن مصدر الإشعاع من 1 م إلى 2 م. بما أن الشدة تقل مع مربع المسافة، تصبح الشدة تقريباً:", "options": [{"en": "One half of the original", "ar": "نصف الشدة الأصلية"}, {"en": "Twice the original", "ar": "ضعف الشدة الأصلية"}, {"en": "One quarter of the original", "ar": "ربع الشدة الأصلية"}, {"en": "Unchanged, as the source is the same", "ar": "لا تتغير لأن المصدر نفسه"}], "answer": 2, "why": "المحاضرة: شدة الإشعاع تقل مع مربع المسافة من المصدر؛ مضاعفة المسافة (2² = 4) تجعل الشدة ربع ما كانت.", "kind": "apply"}, {"q_en": "Which person is the best example of public exposure?", "q_ar": "أي شخص هو أفضل مثال على تعرّض عامة الناس؟", "options": [{"en": "A radiologic technologist in the X-ray room", "ar": "تقنيّ أشعة في غرفة الأشعة"}, {"en": "A patient having a CT scan of the abdomen", "ar": "مريض يجري مفراس للبطن"}, {"en": "An industrial radiographer during a shift", "ar": "مصوّر صناعي في أثناء نوبة عمله"}, {"en": "A resident living near a nuclear power plant", "ar": "ساكن قرب محطة طاقة نووية"}], "answer": 3, "why": "المحاضرة: تعرّض عامة الناس هو ما قد يتلقاه أفراد الجمهور من مصادر مثل محطات الطاقة النووية أو الحوادث الإشعاعية؛ تقنيّ الأشعة والمصوّر الصناعي تعرّضهم مهني، والمريض تعرّضه طبي.", "kind": "apply"}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/أساسيات الوقاية من الإشعاع/نظري/م03 - مبادئ الوقاية من الإشعاع وحدود الجرعة"}</script>

document.addEventListener("DOMContentLoaded", () => {
  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)
  const p0 = location.pathname.startsWith(rootP) ? location.pathname.slice(rootP.length) : location.pathname;
  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");

  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {

    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "tnote"; b.textContent = "📝"; b.setAttribute("aria-label", "ملاحظة على المصطلح " + t);
    (pop.querySelector(".pb") || pop).appendChild(b);

      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق

    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
