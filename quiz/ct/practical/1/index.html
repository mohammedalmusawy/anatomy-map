, {"q_en": "CT is described in the lecture as:", "q_ar": "يوصف المفراس في المحاضرة بأنه:", "options": [{"en": "Non-invasive and painless", "ar": "غير باضع وغير مؤلم"}, {"en": "Invasive but painless", "ar": "باضع لكنه غير مؤلم"}, {"en": "Radiation-free", "ar": "خالٍ من الإشعاع"}, {"en": "Suitable for all patients without exception", "ar": "مناسب لكل المرضى بلا استثناء"}], "answer": 0, "why": "«Non-Invasive and Painless» من المزايا، أما الإشعاع وعدم مناسبته لكل المرضى فمن العيوب."}, {"q_en": "The first way CT differs from conventional radiography is that CT:", "q_ar": "الفرق الأول بين المفراس والتصوير الشعاعي التقليدي أن المفراس:", "options": [{"en": "Uses no x-rays, relying on magnetic fields to form the image", "ar": "لا يستعمل أشعة سينية، بل مجالات مغناطيسية لتكوين الصورة"}, {"en": "Forms cross-sectional images without superimposition of structures", "ar": "يكوّن صوراً مقطعية بلا تراكب للتراكيب"}, {"en": "Records the image directly on screen-film like conventional radiography", "ar": "يسجّل الصورة مباشرةً على الفيلم والشاشة مثل التصوير التقليدي"}, {"en": "Forms a single projection image in which structures overlap", "ar": "يكوّن صورة إسقاطية واحدة تتراكب فيها التراكيب"}], "answer": 1, "why": "المفراس يكوّن صورة مقطعية، فلا تتراكب التراكيب فوق بعضها كما في الصورة العادية."}, {"q_en": "The sensitivity of CT to subtle differences in x-ray attenuation, compared with screen-film systems, is:", "q_ar": "حساسية المفراس للفروق الدقيقة في توهين الأشعة، مقارنةً بأنظمة الفيلم والشاشة، أعلى بـ:", "options": [{"en": "Two times higher", "ar": "مرتين"}, {"en": "Five times higher", "ar": "خمس مرات"}, {"en": "Ten times higher", "ar": "عشر مرات"}, {"en": "A hundred times higher", "ar": "مئة مرة"}], "answer": 2, "why": "المحاضرة تقول إن الحساسية ten times higher من أنظمة screen-film."}, {"q_en": "The higher sensitivity of CT is because of:", "q_ar": "سبب الحساسية العالية للمفراس هو:", "options": [{"en": "The use of a larger film", "ar": "استعمال فيلم أكبر"}, {"en": "Higher patient dose only", "ar": "زيادة جرعة المريض فقط"}, {"en": "The superimposition of structures", "ar": "تراكب التراكيب"}, {"en": "The virtual elimination of scatter", "ar": "الإزالة شبه الكاملة للإشعاع المتشتّت"}], "answer": 3, "why": "المحاضرة تربط الحساسية العالية بـ virtual elimination of scatter."}, {"q_en": "On a chest radiograph, a rib overlies a small lung lesion and hides it. Which CT property solves this problem?", "q_ar": "في صورة صدر تقليدية يغطي ضلعٌ آفةً صغيرة في الرئة ويخفيها. أي خاصية في المفراس تحلّ هذه المشكلة؟", "options": [{"en": "CT forms cross-sectional images, eliminating superimposition", "ar": "المفراس يكوّن صوراً مقطعية فيلغي التراكب"}, {"en": "CT uses a larger film that shows more of the chest", "ar": "المفراس يستعمل فيلماً أكبر يُظهر الصدر أكثر"}, {"en": "CT gives a higher patient dose that brightens the lesion", "ar": "المفراس يعطي جرعة أعلى تُبرز الآفة"}, {"en": "CT adds more scatter to outline the edges of the lesion", "ar": "المفراس يضيف تشتتاً أكثر يحدّد حواف الآفة"}], "answer": 0, "why": "المحاضرة: أول فرق بين المفراس والتصوير التقليدي أن المفراس «يكوّن صورة مقطعية فيلغي تراكب التراكيب».", "kind": "apply"}, {"q_en": "A surgeon wants to study a complex fracture from all angles before the operation. Which CT advantage helps most?", "q_ar": "جرّاح يريد دراسة كسر معقّد من كل الزوايا قبل العملية. أي ميزة للمفراس تفيده أكثر؟", "options": [{"en": "Low examination cost", "ar": "قلة كلفة الفحص"}, {"en": "Three-dimensional imaging", "ar": "التصوير ثلاثي الأبعاد"}, {"en": "No radiation exposure", "ar": "عدم التعرّض للإشعاع"}, {"en": "Better soft tissue contrast than any method", "ar": "تباين للأنسجة الرخوة أفضل من أي طريقة"}], "answer": 1, "why": "المحاضرة: من مزايا المفراس «التصوير ثلاثي الأبعاد»، وهو مهم في التخطيط للعمليات؛ أما الإشعاع والكلفة ومحدودية تباين الأنسجة الرخوة فمن عيوبه.", "kind": "apply"}, {"q_en": "During a CT scan the detectors stop working. Which step is lost?", "q_ar": "أثناء فحص المفراس توقفت الكواشف عن العمل. أي خطوة تُفقد؟", "options": [{"en": "Producing the X-ray beam inside the tube", "ar": "إنتاج حزمة الأشعة داخل الأنبوب"}, {"en": "Housing the X-ray source inside the gantry", "ar": "احتواء مصدر الأشعة داخل الـ Gantry"}, {"en": "Measuring the X-rays after they pass through the patient", "ar": "قياس الأشعة بعد مرورها عبر المريض"}, {"en": "Moving the patient table through the gantry opening", "ar": "تحريك سرير المريض عبر فتحة الـ Gantry"}], "answer": 2, "why": "المحاضرة: الكواشف «تقيس الأشعة بعد مرورها عبر المريض»؛ أما إنتاج الأشعة فمن المصدر، والـ Gantry يحتوي المصدر والكواشف، والحاسوب يعيد بناء الصور.", "kind": "apply"}, {"q_en": "Using the meaning of «Tomo» and «Graphy», a CT image is best described as:", "q_ar": "بالاعتماد على معنى «Tomo» و«Graphy»، أفضل وصف لصورة المفراس هو:", "options": [{"en": "A slice of tissue removed for examination", "ar": "شريحة نسيج تُستأصل للفحص"}, {"en": "A calculation of the patient's total dose", "ar": "حساب للجرعة الكلية للمريض"}, {"en": "A flat image of overlapping structures", "ar": "صورة مسطّحة لتراكيب متراكبة"}, {"en": "A recorded image of a body slice", "ar": "صورة مسجّلة لشريحة من الجسم"}], "answer": 3, "why": "المحاضرة: Tomo = شريحة، وGraphy = يكتب/يسجّل؛ فالتصوير المقطعي تسجيل لشرائح من الجسم.", "kind": "apply"}, {"q_en": "Which statement about CT is NOT correct according to the lecture?", "q_ar": "أي عبارة عن المفراس غير صحيحة حسب المحاضرة؟", "options": [{"en": "CT is suitable for all patients", "ar": "المفراس مناسب لكل المرضى"}, {"en": "CT is non-invasive and painless", "ar": "المفراس غير تداخلي وغير مؤلم"}, {"en": "CT involves radiation exposure", "ar": "المفراس فيه تعرّض للإشعاع"}, {"en": "CT has limited soft tissue contrast", "ar": "تباين الأنسجة الرخوة في المفراس محدود"}], "answer": 0, "why": "المحاضرة: من عيوب المفراس أنه «غير مناسب لكل المرضى»، إضافة إلى التعرّض للإشعاع والكلفة ومحدودية تباين الأنسجة الرخوة؛ وهو غير تداخلي وغير مؤلم.", "kind": "apply"}, {"q_en": "Why can CT detect subtle differences in tissue attenuation that a screen-film radiograph misses?", "q_ar": "لماذا يكشف المفراس فروقاً دقيقة في توهين الأنسجة لا يكشفها التصوير بالفيلم والشاشة؟", "options": [{"en": "It uses a lower patient dose than conventional radiography", "ar": "يستعمل جرعة أقل للمريض من التصوير التقليدي"}, {"en": "Scatter is virtually eliminated, so sensitivity is ~10× higher", "ar": "يُلغى التشتت تقريباً فتصبح الحساسية أعلى بنحو 10 مرات"}, {"en": "It records all structures superimposed on one film", "ar": "يسجّل كل التراكيب متراكبة على فيلم واحد"}, {"en": "It uses magnetic fields that are sensitive to water", "ar": "يستعمل مجالات مغناطيسية حساسة للماء"}], "answer": 1, "why": "المحاضرة: حساسية المفراس للفروق الدقيقة في التوهين «أعلى بعشر مرات» من أنظمة الفيلم والشاشة «بسبب الإلغاء شبه التام للتشتت».", "kind": "apply"}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/أجهزة التصوير المقطعي/عملي/م01 - مقدمة المفراس وحدود الأشعة التقليدية"}</script>
