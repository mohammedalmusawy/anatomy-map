<script type="application/json" id="quiz-data">{"subject": "الفحوصات الشعاعية", "slug": "فحوصات", "type": "نظري", "num": 7, "title_ar": "المفراس للجهاز الهضمي", "title_en": "Lecture 7: Computed tomography of the GI tract", "about": "المفراس للجهاز الهضمي: دواعيه، وعوامل التباين الفموية والوريدية، والتقنية والنهج متعدد الأطوار، ثم تصوير القولون بالمفراس (تنظير القولون الافتراضي) ودواعيه وموانعه وتحضيره وتقنيته ومزاياه وعيوبه ومضاعفاته والرعاية اللاحقة.", "questions": [{"q_en": "Which is an indication of GI CT?", "q_ar": "أي مما يلي من دواعي مفراس الجهاز الهضمي؟", "options": [{"en": "Hearing loss", "ar": "فقدان السمع"}, {"en": "Location of bleeding", "ar": "تحديد موضع النزف"}, {"en": "Dental caries", "ar": "نخر الأسنان"}, {"en": "Skin rash", "ar": "طفح جلدي"}], "answer": 1, "why": "المحاضرة: من الدواعي تحديد موضع النزف."}, {"q_en": "FACT is a focused CT of the:", "q_ar": "FACT هو مفراس مركّز على:", "options": [{"en": "Appendix", "ar": "الزائدة الدودية"}, {"en": "Stomach", "ar": "المعدة"}, {"en": "Liver", "ar": "الكبد"}, {"en": "Spleen", "ar": "الطحال"}], "answer": 0, "why": "المحاضرة: التهاب الزائدة الدودية: التصوير المقطعي المحوسب المركّز على الزائدة (FACT)."}, {"q_en": "Positive oral contrast is used to:", "q_ar": "يُستعمل التباين الفموي الموجب من أجل:", "options": [{"en": "Warm the patient", "ar": "تدفئة المريض"}, {"en": "Shorten the scan", "ar": "تقصير الفحص"}, {"en": "Reduce the dose", "ar": "تقليل الجرعة"}, {"en": "Outline the bowel", "ar": "تحديد الأمعاء"}], "answer": 3, "why": "المحاضرة: يُستعمل لتحديد الأمعاء عن الآفات المرضية في مفراس البطن والحوض."}, {"q_en": "Positive contrast is low in density to avoid:", "q_ar": "كثافة التباين الموجب منخفضة لتجنّب:", "options": [{"en": "Motion blur", "ar": "عدم الوضوح الحركي"}, {"en": "Nausea", "ar": "الغثيان"}, {"en": "Beam hardening", "ar": "تصلّب الحزمة"}, {"en": "Film fogging", "ar": "ضبابية الفيلم"}], "answer": 2, "why": "المحاضرة: كثافته منخفضة لتجنّب أثر تصلّب الحزمة."}, {"q_en": "Negative oral contrast suits the:", "q_ar": "يناسب التباين الفموي السالب:", "options": [{"en": "Brain and spine", "ar": "الدماغ والعمود"}, {"en": "Oesophagus and stomach", "ar": "المريء والمعدة"}, {"en": "Heart and lungs", "ar": "القلب والرئتين"}, {"en": "Hands and feet", "ar": "اليدين والقدمين"}], "answer": 1, "why": "المحاضرة: يُوصى به لتقييم المريء والمعدة."}, {"q_en": "Serosal calcification is best seen with:", "q_ar": "يُرى التكلّس المصلي أفضل مع:", "options": [{"en": "Water contrast", "ar": "التباين المائي"}, {"en": "Positive contrast", "ar": "التباين الموجب"}, {"en": "Iodine only", "ar": "اليود فقط"}, {"en": "Air only", "ar": "الهواء فقط"}], "answer": 0, "why": "المحاضرة: يُفضَّل التباين المائي لأن التباين الموجب يحجب الرواسب."}, {"q_en": "Water is started how long before the scan?", "q_ar": "يبدأ شرب الماء قبل الفحص بـ:", "options": [{"en": "1 min", "ar": "دقيقة"}, {"en": "1 hour", "ar": "ساعة"}, {"en": "1 day", "ar": "يوم"}, {"en": "5-10 min", "ar": "5–10 دقائق"}], "answer": 3, "why": "المحاضرة: يبدأ الماء قبل الفحص بـ 5–10 دقائق."}, {"q_en": "Full-fat milk delays gastric:", "q_ar": "الحليب كامل الدسم يؤخّر:", "options": [{"en": "Filling", "ar": "امتلاء المعدة"}, {"en": "Secretion", "ar": "الإفراز"}, {"en": "Emptying", "ar": "إفراغ المعدة"}, {"en": "Colour", "ar": "اللون"}], "answer": 2, "why": "المحاضرة: يستفيد من تأخّر إفراغ المعدة لتوسيعها."}, {"q_en": "Milk needs caution in:", "q_ar": "الحليب يحتاج حذراً عند:", "options": [{"en": "Hypertension", "ar": "ارتفاع الضغط"}, {"en": "Lactose intolerance", "ar": "عدم تحمّل اللاكتوز"}, {"en": "Asthma", "ar": "الربو"}, {"en": "Diabetes", "ar": "السكري"}], "answer": 1, "why": "المحاضرة: يُحذر منه في المجتمعات التي ترتفع فيها نسبة عدم تحمّل اللاكتوز."}, {"q_en": "Water alone is limited because it is:", "q_ar": "الماء وحده محدود لأنه:", "options": [{"en": "Rapidly resorbed", "ar": "يُمتَصّ بسرعة"}, {"en": "Too cold", "ar": "بارد جداً"}, {"en": "Too thick", "ar": "ثخين جداً"}, {"en": "Toxic", "ar": "سام"}], "answer": 0, "why": "المحاضرة: تمدّد الأمعا
