<script type="application/json" id="quiz-data">{"subject": "الفحوصات الشعاعية", "slug": "فحوصات", "type": "نظري", "num": 2, "title_ar": "طرق تصوير الجهاز الهضمي", "title_en": "Methods of Imaging the GIT", "about": "تشريح الجهاز الهضمي، ووسائل تصويره، والصورة البسيطة، ومواد التباين الذائبة في الماء والباريوم: خواصها واستعمالاتها ومضاعفاتها، والتباين المفرد والمزدوج.", "questions": [{"q_en": "Which of the following is part of the upper GI tract according to the lecture?", "q_ar": "أيّ مما يأتي من الجهاز الهضمي العلوي بحسب المحاضرة؟", "options": [{"en": "Jejunum", "ar": "الصائم"}, {"en": "Duodenum", "ar": "الاثنا عشري"}, {"en": "Ileum", "ar": "اللفائفي"}, {"en": "Colon", "ar": "القولون"}], "answer": 1, "why": "العلوي = المريء والمعدة والاثنا عشري، والصائم واللفائفي والقولون من السفلي."}, {"q_en": "The small intestine consists of:", "q_ar": "تتكون الأمعاء الدقيقة من:", "options": [{"en": "Cecum & appendix", "ar": "الأعور والزائدة"}, {"en": "Jejunum & ileum", "ar": "الصائم واللفائفي"}, {"en": "Fundus & body", "ar": "القاع والجسم"}, {"en": "Pyloric antrum & pyloric canal", "ar": "الغار البوابي والقناة البوابية"}], "answer": 1, "why": "المحاضرة: Small intestine: jejunum & ileum."}, {"q_en": "Which is NOT listed in the lecture as a contrast study of the GIT?", "q_ar": "أيّ مما يأتي ليس من فحوصات التباين للجهاز الهضمي المذكورة في المحاضرة؟", "options": [{"en": "Barium swallow", "ar": "بلع الباريوم"}, {"en": "Angiography", "ar": "تصوير الأوعية الدموية"}, {"en": "Barium follow-through", "ar": "متابعة مرور الباريوم"}, {"en": "Small bowel enema", "ar": "حقنة الأمعاء الدقيقة"}], "answer": 1, "why": "تصوير الأوعية طريقة مستقلة (رقم 6)، أما البقية فمن فحوصات التباين."}, {"q_en": "In which position can we see air under the diaphragm, which indicates perforation?", "q_ar": "في أي وضعية نستطيع رؤية الهواء تحت الحجاب الحاجز الذي يدل على الانثقاب؟", "options": [{"en": "Erect", "ar": "الوضع القائم"}, {"en": "Supine", "ar": "الاستلقاء على الظهر"}, {"en": "Prone", "ar": "الانبطاح"}, {"en": "Lateral decubitus with the right side down", "ar": "الاضطجاع الجانبي على الجهة اليمنى"}], "answer": 0, "why": "المحاضرة تقول: in the erect position we can see if there is air under the diaphragm."}, {"q_en": "Rigler's sign is:", "q_ar": "علامة ريغلر هي:", "options": [{"en": "Fluid between bowel loops", "ar": "سائل بين عُرى الأمعاء"}, {"en": "A filling defect in the esophagus", "ar": "عيب امتلاء في المريء"}, {"en": "Calcification in the bowel wall", "ar": "تكلّس في جدار الأمعاء"}, {"en": "Air outlining both the inside and outside walls of the bowel", "ar": "هواء يحدّد الجدارين الداخلي والخارجي للأمعاء"}], "answer": 3, "why": "Rigler's sign: air outlining both the inside and outside walls of the bowel."}, {"q_en": "Rigler's sign is seen with large amounts of pneumoperitoneum, more than:", "q_ar": "تُرى علامة ريغلر مع كميات كبيرة من استرواح الصفاق، أكثر من:", "options": [{"en": "100 mL", "ar": "100 مل"}, {"en": "1000 mL", "ar": "1000 مل"}, {"en": "250 mL", "ar": "250 مل"}, {"en": "50 mL", "ar": "50 مل"}], "answer": 1, "why": "المحاضرة: large amounts of pneumoperitoneum (> 1000 mL)."}, {"q_en": "Which of the following can be shown on an abdominal plain film?", "q_ar": "أيّ مما يأتي يمكن أن تُظهره صورة البطن البسيطة؟", "options": [{"en": "The mucosal pattern of the colon", "ar": "نمط الغشاء المخاطي للقولون"}, {"en": "The length of a lesion inside a stricture", "ar": "طول الآفة داخل التضيّق"}, {"en": "Radiopaque calculi", "ar": "الحصى الظليلة"}, {"en": "The inside wall lining of the esophagus", "ar": "بطانة الجدار الداخلي للمريء"}], "answer": 2, "why": "الحصى الظليلة من قائمة ما تُظهره الصورة البسيطة، أما تفاصيل الجدار والغشاء المخاطي فتحتاج مادة تباين."}, {"q_en": "Which is something the endoscope cannot do, according to the lecture?", "q_ar": "أيّ مما يأتي لا يستطيعه المنظار بحسب المحاضرة؟", "options": [{"en": "See the inside of the stomach", "ar": "رؤية داخل المعدة"}, {"en": "Take a direct look at the mucosa", "ar": "النظر مباشرة إلى الغشاء المخاطي"}, {"en": "See outside of the bowel lumen", "ar": "رؤية ما خارج تجويف الأمعاء"}, {"en": "Examine the esophagus", "ar": "فحص المريء"}], "answer": 2, "why": "المنظار لا يرى خارج التجويف، ولا يتجاوز التضيّقات الشديدة، ولا يحدّد طول الآفة، ولا يصل لبعض أجزاء الأمعاء."}, {"q_en": "Gastrografin is:", "q_ar": "مادة Gastrografin هي:", "options": [{"en": "An orange-flavored, low osmolarity agent", "ar": "مادة منخفضة الأسمولية بنكهة البرتقال"}, {"en": "A barium sulfate suspension", "ar": "معلّق كبريتات الباريوم"}, {"en": "An aniseed-tasting, high osmolarity contrast agent", "ar": "مادة تباين بطعم اليانسون عالية الأسمولية"}, {"en": "A negative contrast gas", "ar": "غاز تباين سالب"}], "answer": 2, "why": "Gastrografin عالي الأسمولية بطعم اليانسون، أما Gastromiro فمنخفض الأسمولية بنكهة البرتقال."}, {"q_en": "Gastromiro contains:", "q_ar": "مادة Gastromiro تحتوي على:", "options": [{"en": "Barium sulfate", "ar": "كبريتات الباريوم"}, {"en": "Carbon dioxide", "ar": "ثاني أكسيد الكربون"}, {"en": "A high osmolarity agent with aniseed taste", "ar": "مادة عالية الأسمولية بطعم اليانسون"}, {"en": "Iopamidol", "ar": "الأيوباميدول"}], "answer": 3, "why": "Gastromiro مادة منخفضة الأسمولية تحتوي على iopamidol."}, {"q_en": "If the patient is vulnerable to aspiration, which contrast is advised?", "q_ar": "إذا كان المريض معرّضاً للاستنشاق، أي مادة تباين يُنصح بها؟", "options": [{"en": "High osmolar contrast media (HOCM)", "ar": "مواد تباين عالية الأسمولية"}, {"en": "Low osmolar contrast media (LOCM)", "ar": "مواد تباين منخفضة الأسمولية"}, {"en": "Gastrografin undiluted", "ar": "غاستروغرافين غير مخفّف"}, {"en": "Gas only", "ar": "غاز فقط"}], "answer": 1, "why": "LOCM يُنصح به عند خطر الاستنشاق، لأن HOCM المستنشقة قد تسبّب وذمة رئوية."}, {"q_en": "HOCM can cause hypovolemia because:", "q_ar": "قد تسبّب HOCM نقص حجم الدم لأن:", "options": [{"en": "Its hyperosmolality draws fluid into the bowel", "ar": "أسموليتها العالية تسحب السوائل إلى الأمعاء"}, {"en": "It is absorbed into the blood", "ar": "تُمتص إلى الدم"}, {"en": "It precipitates in the lungs", "ar": "تترسّب في الرئتين"}, {"en": "It contains barium", "ar": "تحتوي على الباريوم"}], "answer": 0, "why": "السبب كما في المحاضرة: hyperosmolality of the contrast media drawing fluid into the bowel."}, {"q_en": "Diluted Gastrografin (30 mL in 1 L of flavored drink) is used on CT to:", "q_ar": "يُستعمل Gastrografin المخفّف (30 مل في لتر شراب منكّه) في المفراس من أجل:", "options": [{"en": "Increase the radiation dose", "ar": "زيادة جرعة الإشعاع"}, {"en": "Coat the mucosa better than barium", "ar": "تغطية الغشاء المخاطي أفضل من الباريوم"}, {"en": "Treat constipation", "ar": "علاج الإمساك"}, {"en": "Minimize beam hardening artifact", "ar": "تقليل تشوّه تصلّب الحزمة"}], "answer": 3, "why": "التخفيف يُستعمل لتحديد تجويف الأمعاء مع تقليل beam hardening artifact."}, {"q_en": "The atomic number of barium is:", "q_ar": "العدد الذري للباريوم هو:", "options": [{"en": "53", "ar": "53"}, {"en": "20", "ar": "20"}, {"en": "74", "ar": "74"}, {"en": "56", "ar": "56"}], "answer": 3, "why": "العدد الذري 56، وهذا يجعل الباريوم ظليلاً للأشعة السينية."}, {"q_en": "Barium suspension needs shaking before use because:", "q_ar": "يجب رجّ معلّق الباريوم قبل الاستعمال لأن:", "options": [{"en": "The suspension settles", "ar": "المعلّق يترسّب"}, {"en": "It dissolves in water", "ar": "يذوب في الماء"}, {"en": "It is toxic", "ar": "سام"}, {"en": "It is absorbed quickly", "ar": "يُمتص بسرعة"}], "answer": 0, "why": "الباريوم لا يذوب، فهو معلّق يترسّب، لذلك يُرجّ قبل الاستعمال."}, {"q_en": "Why is barium used in GI series rather than iodinated contrast?", "q_ar": "لماذا يُستعمل الباريوم في فحوصات الجهاز الهضمي بدل المادة اليودية؟", "options": [{"en": "It is water soluble", "ar": "يذوب في الماء"}, {"en": "It is absorbed by the mucosa", "ar": "يمتصّه الغشاء المخاطي"}, {"en": "It has better coating properties, forming thin layers over the gut lining", "ar": "تغطيته أفضل، ويكوّن طبقات رقيقة على بطانة الأمعاء"}, {"en": "It appears black on X-ray", "ar": "يظهر أسود على الصورة"}], "answer": 2, "why": "المحاضرة (مهم جداً): الباريوم له better coating properties من المواد اليودية."}, {"q_en": "Barium meal is used for investigation of the:", "q_ar": "تُستعمل وجبة الباريوم لفحص:", "options": [{"en": "Stomach", "ar": "المعدة"}, {"en": "Esophagus", "ar": "المريء"}, {"en": "Large bowel", "ar": "الأمعاء الغليظة"}, {"en": "Small bowel only", "ar": "الأمعاء الدقيقة فقط"}], "answer": 0, "why": "البلع للمريء، والوجبة للمعدة، والمتابعة للمعدة والأمعاء الدقيقة، والحقنة الشرجية للأمعاء الغليظة."}, {"q_en": "Barium enema is used for investigation of the:", "q_ar": "تُستعمل حقنة الباريوم الشرجية لفحص:", "options": [{"en": "Stomach", "ar": "المعدة"}, {"en": "Esophagus", "ar": "المريء"}, {"en": "Large bowel", "ar": "الأمعاء الغليظة"}, {"en": "Duodenum", "ar": "الاثنا عشري"}], "answer": 2, "why": "Barium enema = large bowel investigation."}, {"q_en": "100% W/V means:", "q_ar": "100% W/V تعني:", "options": [{"en": "100 mL barium in 1 L of water", "ar": "100 مل باريوم في لتر ماء"}, {"en": "10 g barium in 100 mL", "ar": "10 غرامات باريوم في 100 مل"}, {"en": "100 g barium in 1 L", "ar": "100 غرام باريوم في لتر"}, {"en": "100 g barium in 100 mL of solution", "ar": "100 غرام باريوم في 100 مل من المحلول"}], "answer": 3, "why": "W/V = وزن/حجم، و100% = 100 غرام في 100 مل."}, {"q_en": "Which barium preparation is 250% W/V, used for the esophagus, stomach and duodenum (double contrast)?", "q_ar": "أي مستحضر باريوم تركيزه 250% W/V ويُستعمل للمريء والمعدة والاثني عشري (تباين مزدوج)؟", "options": [{"en": "Baritop", "ar": "Baritop"}, {"en": "E-Z Paque", "ar": "E-Z Paque"}, {"en": "Polibar rapid", "ar": "Polibar rapid"}, {"en": "E-Z HD", "ar": "E-Z HD"}], "answer": 3, "why": "E-Z HD تركيزه 250% للتباين المزدوج، والبقية 100%."}, {"q_en": "Why is it advised that CT and/or US be performed before the barium study?", "q_ar": "لماذا يُنصح بإجراء المفراس و/أو السونار قبل فحص الباريوم؟", "options": [{"en": "Barium is absorbed by the liver", "ar": "الكبد يمتص الباريوم"}, {"en": "Barium precludes accurate CT interpretation, with delays up to 2 weeks", "ar": "الباريوم يمنع القراءة الدقيقة للمفراس، وقد يؤخّره إلى أسبوعين"}, {"en": "CT dissolves the barium", "ar": "المفراس يذيب الباريوم"}, {"en": "US makes barium radiolucent", "ar": "السونار يجعل الباريوم شفافاً"}], "answer": 1, "why": "الباريوم المتبقي يمنع قراءة المفراس بدقة حتى يخرج (قد يحتاج أسبوعين)."}, {"q_en": "Barium intravasation may result in a barium pulmonary embolus with a mortality of:", "q_ar": "دخول الباريوم إلى الأوعية قد يسبّب انصماماً رئوياً بالباريوم نسبة الوفاة فيه:", "options": [{"en": "8%", "ar": "8%"}, {"en": "50%", "ar": "50%"}, {"en": "80%", "ar": "80%"}, {"en": "20%", "ar": "20%"}], "answer": 2, "why": "دخول الباريوم إلى الأوعية قد يسبّب انصماماً رئوياً بالباريوم، ونسبة الوفاة فيه 80%."}, {"q_en": "Aspirated barium is:", "q_ar": "الباريوم المستنشق:", "options": [{"en": "Always fatal", "ar": "قاتل دائماً"}, {"en": "Relatively harmless; physiotherapy is the only treatment required", "ar": "غير ضار نسبياً، والعلاج الطبيعي هو العلاج الوحيد"}, {"en": "The cause of severe hypovolemic shock", "ar": "سبب صدمة شديدة بنقص حجم الدم"}, {"en": "Treated by surgery", "ar": "يُعالج جراحياً"}], "answer": 1, "why": "Aspirated barium is relatively harmless، والصدمة من مضاعفات الانثقاب."}, {"q_en": "In suspected perforation or aspiration, which contrast is used?", "q_ar": "عند الاشتباه بانثقاب أو استنشاق، أي مادة تباين تُستعمل؟", "options": [{"en": "Water-soluble contrast media", "ar": "مواد التباين الذائبة في الماء"}, {"en": "Barium sulfate", "ar": "كبريتات الباريوم"}, {"en": "High-density barium 250%", "ar": "باريوم عالي الكثافة 250%"}, {"en": "Barium paste", "ar": "معجون الباريوم"}], "answer": 0, "why": "الباريوم ممنوع أو أعلى خطورة في هذه الحالات، فنستعمل المادة الذائبة في الماء."}, {"q_en": "Gases (air, CO2) used with barium are:", "q_ar": "الغازات (الهواء، CO2) المستعملة مع الباريوم هي:", "options": [{"en": "Negative contrast agents (radiolucent)", "ar": "مواد تباين سالبة (شفافة للأشعة)"}, {"en": "Positive contrast agents (radiopaque)", "ar": "مواد تباين موجبة (ظليلة)"}, {"en": "Iodinated contrast agents", "ar": "مواد تباين يودية"}, {"en": "Absorbers of X-rays that appear white", "ar": "ماصّة للأشعة وتظهر بيضاء"}], "answer": 0, "why": "الغاز سالب وشفاف للأشعة، والباريوم موجب وظليل."}, {"q_en": "A double contrast study uses:", "q_ar": "الفحص بالتباين المزدوج يستعمل:", "options": [{"en": "Barium with gas producing agent, 200-250% w/v", "ar": "الباريوم مع مادة مولّدة للغاز، 200–250% وزن/حجم"}, {"en": "Only barium, 60-100% w/v", "ar": "الباريوم فقط، 60–100% وزن/حجم"}, {"en": "Two water-soluble agents", "ar": "مادتين ذائبتين في الماء"}, {"en": "Gas only", "ar": "الغاز فقط"}], "answer": 0, "why": "المزدوج = باريوم + غاز بتركيز 200–250%، والمفرد = باريوم فقط 60–100%."}, {"q_en": "Which study is best for detail viewing of the mucosal pattern?", "q_ar": "أي فحص هو الأفضل لرؤية تفاصيل نمط الغشاء المخاطي؟", "options": [{"en": "Single contrast study", "ar": "الفحص بالتباين المفرد"}, {"en": "Plain film", "ar": "الصورة البسيطة"}, {"en": "Double contrast study", "ar": "الفحص بالتباين المزدوج"}, {"en": "Water-soluble contrast study", "ar": "الفحص بمادة ذائبة في الماء"}], "answer": 2, "why": "المزدوج يُظهر نمط الغشاء المخاطي، ولذلك ظهرت السليلة فيه ولم تظهر في المفرد."}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/الفحوصات الشعاعية/نظري/م02 - طرق تصوير الجهاز الهضمي"}</script>

});
