": "It precipitates in the lungs", "ar": "تترسّب في الرئتين"}, {"en": "It contains barium", "ar": "تحتوي على الباريوم"}], "answer": 0, "why": "السبب كما في المحاضرة: hyperosmolality of the contrast media drawing fluid into the bowel."}, {"q_en": "Diluted Gastrografin (30 mL in 1 L of flavored drink) is used on CT to:", "q_ar": "يُستعمل Gastrografin المخفّف (30 مل في لتر شراب منكّه) في المفراس من أجل:", "options": [{"en": "Increase the radiation dose", "ar": "زيادة جرعة الإشعاع"}, {"en": "Coat the mucosa better than barium", "ar": "تغطية الغشاء المخاطي أفضل من الباريوم"}, {"en": "Treat constipation", "ar": "علاج الإمساك"}, {"en": "Minimize beam hardening artifact", "ar": "تقليل تشوّه تصلّب الحزمة"}], "answer": 3, "why": "التخفيف يُستعمل لتحديد تجويف الأمعاء مع تقليل beam hardening artifact."}, {"q_en": "The atomic number of barium is:", "q_ar": "العدد الذري للباريوم هو:", "options": [{"en": "53", "ar": "53"}, {"en": "20", "ar": "20"}, {"en": "74", "ar": "74"}, {"en": "56", "ar": "56"}], "answer": 3, "why": "العدد الذري 56، وهذا يجعل الباريوم ظليلاً للأشعة السينية."}, {"q_en": "Barium suspension needs shaking before use because:", "q_ar": "يجب رجّ معلّق الباريوم قبل الاستعمال لأن:", "options": [{"en": "The suspension settles", "ar": "المعلّق يترسّب"}, {"en": "It dissolves in water", "ar": "يذوب في الماء"}, {"en": "It is toxic", "ar": "سام"}, {"en": "It is absorbed quickly", "ar": "يُمتص بسرعة"}], "answer": 0, "why": "الباريوم لا يذوب، فهو معلّق يترسّب، لذلك يُرجّ قبل الاستعمال."}, {"q_en": "Why is barium used in GI series rather than iodinated contrast?", "q_ar": "لماذا يُستعمل الباريوم في فحوصات الجهاز الهضمي بدل المادة اليودية؟", "options": [{"en": "It is water soluble", "ar": "يذوب في الماء"}, {"en": "It is absorbed by the mucosa", "ar": "يمتصّه الغشاء المخاطي"}, {"en": "It has better coating properties, forming thin layers over the gut lining", "ar": "تغطيته أفضل، ويكوّن طبقات رقيقة على بطانة الأمعاء"}, {"en": "It appears black on X-ray", "ar": "يظهر أسود على الصورة"}], "answer": 2, "why": "المحاضرة (مهم جداً): الباريوم له better coating properties من المواد اليودية."}, {"q_en": "Barium meal is used for investigation of the:", "q_ar": "تُستعمل وجبة الباريوم لفحص:", "options": [{"en": "Stomach", "ar": "المعدة"}, {"en": "Esophagus", "ar": "المريء"}, {"en": "Large bowel", "ar": "الأمعاء الغليظة"}, {"en": "Small bowel only", "ar": "الأمعاء الدقيقة فقط"}], "answer": 0, "why": "البلع للمريء، والوجبة للمعدة، والمتابعة للمعدة والأمعاء الدقيقة، والحقنة الشرجية للأمعاء الغليظة."}, {"q_en": "Barium enema is used for investigation of the:", "q_ar": "تُستعمل حقنة الباريوم الشرجية لفحص:", "options": [{"en": "Stomach", "ar": "المعدة"}, {"en": "Esophagus", "ar": "المريء"}, {"en": "Large bowel", "ar": "الأمعاء الغليظة"}, {"en": "Duodenum", "ar": "الاثنا عشري"}], "answer": 2, "why": "Barium enema = large bowel investigation."}, {"q_en": "100% W/V means:", "q_ar": "100% W/V تعني:", "options": [{"en": "100 mL barium in 1 L of water", "ar": "100 مل باريوم في لتر ماء"}, {"en": "10 g barium in 100 mL", "ar": "10 غرامات باريوم في 100 مل"}, {"en": "100 g barium in 1 L", "ar": "100 غرام باريوم في لتر"}, {"en": "100 g barium in 100 mL of solution", "ar": "100 غرام باريوم في 100 مل من المحلول"}], "answer": 3, "why": "W/V = وزن/حجم، و100% = 100 غرام في 100 مل."}, {"q_en": "Which barium preparation is 250% W/V, used for the esophagus, stomach and duodenum (double contrast)?", "q_ar": "أي مستحضر باريوم تركيزه 250% W/V ويُستعمل للمريء والمعدة والاثني عشري (تباين مزدوج)؟", "options": [{"en": "Baritop", "ar": "Baritop"}, {"en": "E-Z Paque", "ar": "E-Z Paque"}, {"en": "Polibar rapid", "ar": "Polibar rapid"}, {"en": "E-Z HD", "ar": "E-Z HD"}], "answer": 3, "why": "E-Z HD تركيزه 250% للتباين المزدوج، والبقية 100%."}, {"q_en": "Why is it advised that CT and/or US be performed before the barium study?", "q_ar": "لماذا يُنصح بإجراء المفراس و/أو السونار قبل فحص الباريوم؟", "options": [{"en": "Barium is absorbed by the liver", "ar": "الكبد يمتص الباريوم"}, {"en": "Barium precludes accurate CT interpretation, with delays up to 2 weeks", "ar": "الباريوم يمنع القراءة الدقيقة للمفراس، وقد يؤخّره إلى أسبوعين"}, {"en": "CT dissolves the barium", "ar": "المفراس يذيب الباريوم"}, {"en": "US makes barium radiolucent", "ar": "السونار يجعل الباريوم شفافاً"}], "answer": 1, "why": "الباريوم المتبقي يمنع قراءة المفراس بدقة حتى يخرج (قد يحتاج أسبوعين)."}, {"q_en": "Barium intravasation may result in a barium pulmonary embolus with a mortality of:", "q_ar": "دخول الباريوم إلى الأوعية قد يسبّب انصماماً رئوياً بالباريوم نسبة الوفاة فيه:", "options": [{"en": "8%", "ar": "8%"}, {"en": "50%", "ar": "50%"}, {"en": "80%", "ar": "80%"}, {"en": "20%", "ar": "20%"}], "answer": 2, "why": "دخول الباريوم إلى الأوعية قد يسبّب انصماماً رئوياً بالباريوم، ونسبة الوفاة فيه 80%."}, {"q_en": "Aspirated barium is:", "q_ar": "الباريوم المستنشق:", "options": [{"en": "Always fatal", "ar": "قاتل دائماً"}, {"en": "Relatively harmless; physiotherapy is the only treatment required", "ar": "غير ضار نسبياً، والعلاج الطبيعي هو العلاج الوحيد"}, {"en": "The cause of severe hypovolemic shock", "ar": "سبب صدمة شديدة بنقص حجم الدم"}, {"en": "Treated by surgery", "ar": "يُعالج جراحياً"}], "answer": 1, "why": "Aspirated barium is relatively harmless، والصدمة من مضاعفات الانثقاب."}, {"q_en": "In suspected perforation or aspiration, which contrast is used?", "q_ar": "عند الاشتباه بانثقاب أو استنشاق، أي مادة تباين تُستعمل؟", "options": [{"en": "Water-soluble contrast media", "ar": "مواد التباين الذائبة في الماء"}, {"en": "Barium sulfate", "ar": "كبريتات الباريوم"}, {"en": "High-density barium 250%", "ar": "باريوم عالي الكثافة 250%"}, {"en": "Barium paste", "ar": "معجون الباريوم"}], "answer": 0, "why": "الباريوم ممنوع أو أعلى خطورة في هذه الحالات، فنستعمل المادة الذائبة في الماء."}, {"q_en": "Gases (air, CO2) used with barium are:", "q_ar": "الغازات (الهواء، CO2) المستعملة مع الباريوم هي:", "options": [{"en": "Negative contrast agents (radiolucent)", "ar": "مواد تباين سالبة (شفافة للأشعة)"}, {"en": "Positive contrast agents (radiopaque)", "ar": "مواد تباين موجبة (ظليلة)"}, {"en": "Iodinated contrast agents", "ar": "مواد تباين يودية"}, {"en": "Absorbers of X-rays that appear white", "ar": "ماصّة للأشعة وتظهر بيضاء"}], "answer": 0, "why": "الغاز سالب وشفاف للأشعة، والباريوم موجب وظليل."}, {"q_en": "A double contrast study uses:", "q_ar": "الفحص بالتباين المزدوج يستعمل:", "options": [{"en": "Barium with gas producing agent, 200-250% w/v", "ar": "الباريوم مع مادة مولّدة للغاز، 200–250% وزن/حجم"}, {"en": "Only barium, 60-100% w/v", "ar": "الباريوم فقط، 60–100% وزن/حجم"}, {"en": "Two water-soluble agents", "ar": "مادتين ذائبتين في الماء"}, {"en": "Gas only", "ar": "الغاز فقط"}], "answer": 0, "why": "المزدوج = باريوم + غاز بتركيز 200–250%، والمفرد = باريوم فقط 60–100%."}, {"q_en": "Which study is best for detail viewing of the mucosal pattern?", "q_ar": "أي فحص هو الأفضل لرؤية تفاصيل نمط الغشاء المخاطي؟", "options": [{"en": "Single contrast study", "ar": "الفحص بالتباين المفرد"}, {"en": "Plain film", "ar": "الصورة البسيطة"}, {"en": "Double contrast study", "ar": "الفحص بالتباين المزدوج"}, {"en": "Water-soluble contrast study", "ar": "الفحص بمادة ذائبة في الماء"}], "answer": 2, "why": "المزدوج يُظهر نمط الغشاء المخاطي، ولذلك ظهرت السليلة فيه ولم تظهر في المفرد."}]}</script>
