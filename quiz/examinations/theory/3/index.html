<script type="application/json" id="quiz-data">{"subject": "الفحوصات الشعاعية", "slug": "فحوصات", "type": "نظري", "num": 3, "title_ar": "بلع ووجبة التباين", "title_en": "Lecture 3: Contrast Swallow/ Meal", "about": "بلع مادة التباين: تشريح المريء، والدواعي، وأنواع الدراسة، والمادة، والتحضير، والتقنية والوضعيات، وتقييم العاصرة، وبلع الباريوم الموقوت، والتباين المزدوج. ثم وجبة التباين: تشريح المعدة والاثني عشري، والدواعي والموانع، والتباين المزدوج والمفرد، والصور الموضعية، والرعاية اللاحقة والمضاعفات.", "questions": [{"q_en": "Contrast swallow is used to assess the upper GI tract including:", "q_ar": "يُستعمل بلع مادة التباين لتقييم الجهاز الهضمي العلوي بما فيه:", "options": [{"en": "Colon & rectum", "ar": "القولون والمستقيم"}, {"en": "Esophagus & GE junction", "ar": "المريء والوصل المعدي المريئي"}, {"en": "Jejunum & ileum", "ar": "الصائم واللفائفي"}, {"en": "Kidneys & ureters", "ar": "الكليتين والحالبين"}], "answer": 1, "why": "التعريف: يُقيّم تشريح الجهاز الهضمي العلوي ووظيفته وأمراضه، بما فيه المريء والوصل المعدي المريئي."}, {"q_en": "According to the lecture, the esophagus is normally:", "q_ar": "بحسب المحاضرة، طول المريء عادةً:", "options": [{"en": "25 cm long and 2-3 cm wide", "ar": "25 سم وعرضه 2–3 سم"}, {"en": "10 cm long and 1 cm wide", "ar": "10 سم وعرضه 1 سم"}, {"en": "40 cm long and 5 cm wide", "ar": "40 سم وعرضه 5 سم"}, {"en": "15 cm long and 4 cm wide", "ar": "15 سم وعرضه 4 سم"}], "answer": 0, "why": "المحاضرة: المريء أنبوب عضلي طوله عادةً 25 سم وعرضه 2–3 سم."}, {"q_en": "The esophagus finishes at the lower oesophageal sphincter at the level of:", "q_ar": "ينتهي المريء عند العاصرة المريئية السفلية عند مستوى:", "options": [{"en": "T4", "ar": "الفقرة T4"}, {"en": "L3", "ar": "الفقرة L3"}, {"en": "C1", "ar": "الفقرة C1"}, {"en": "T11", "ar": "الفقرة T11"}], "answer": 3, "why": "المحاضرة: ينتهي عند العاصرة المريئية السفلية عند الفقرة T11."}, {"q_en": "The esophagus is divided into how many segments?", "q_ar": "ينقسم المريء إلى كم جزء؟", "options": [{"en": "Two: upper and lower", "ar": "اثنان: علوي وسفلي"}, {"en": "Four: oral, cervical, thoracic, abdominal", "ar": "أربعة: فموي وعنقي وصدري وبطني"}, {"en": "Three: cervical, thoracic, abdominal", "ar": "ثلاثة: عنقي وصدري وبطني"}, {"en": "Five segments", "ar": "خمسة أجزاء"}], "answer": 2, "why": "المحاضرة: ينقسم المريء إلى ثلاثة أجزاء: عنقي وصدري وبطني."}, {"q_en": "The middle constriction of the esophagus is where it is crossed by:", "q_ar": "التضيّق الأوسط للمريء هو مكان عبور:", "options": [{"en": "The cricoid cartilage", "ar": "الغضروف الحلقي"}, {"en": "The aorta and left main bronchus", "ar": "الأبهر والقصبة الرئيسية اليسرى"}, {"en": "The diaphragm", "ar": "الحجاب الحاجز"}, {"en": "The right atrium", "ar": "الأذين الأيمن"}], "answer": 1, "why": "المحاضرة: التضيّق الأوسط حيث يعبر الأبهر والقصبة الرئيسية اليسرى."}, {"q_en": "Which of the following is an indication for contrast swallow?", "q_ar": "أيّ مما يأتي من دواعي بلع مادة التباين؟", "options": [{"en": "Assessment of trachea-oesophageal fistulae", "ar": "تقييم النواسير الرغامية المريئية"}, {"en": "Renal stones", "ar": "حصى الكلى"}, {"en": "Fracture of the ribs", "ar": "كسر الأضلاع"}, {"en": "Pregnancy follow-up", "ar": "متابعة الحمل"}], "answer": 0, "why": "من الدواعي: تقييم النواسير الرغامية المريئية، وأيضاً فشل التنظير وتعذّر الارتخاء والتهاب المريء الارتجاعي والسرطان."}, {"q_en": "Timed barium swallow is used to monitor therapies of:", "q_ar": "يُستعمل بلع الباريوم الموقوت لمتابعة علاجات:", "options": [{"en": "Peptic ulcer", "ar": "القرحة الهضمية"}, {"en": "Pyloric stenosis", "ar": "تضيّق البوّاب"}, {"en": "Gastric carcinoma", "ar": "سرطان المعدة"}, {"en": "Achalasia", "ar": "تعذّر الارتخاء"}], "answer": 3, "why": "المحاضرة: بلع الباريوم الموقوت لمتابعة علاجات تعذّر الارتخاء."}, {"q_en": "A double contrast study is used to detect:", "q_ar": "دراسة التباين المزدوج تُستعمل للكشف عن:", "options": [{"en": "Gross lesion only", "ar": "الآفات الكبيرة فقط"}, {"en": "Bone lesion", "ar": "آفات العظم"}, {"en": "Mucosal lesion", "ar": "آفات الغشاء المخاطي"}, {"en": "Renal function", "ar": "وظيفة الكلى"}], "answer": 2, "why": "المحاضرة: التباين المفرد للآفات الكبيرة، والمزدوج لآفات الغشاء المخاطي."}, {"q_en": "If perforation is suspected, which contrast should be used?", "q_ar": "إذا اشتُبه بوجود انثقاب، أي مادة تباين تُستعمل؟", "options": [{"en": "Barium sulphate paste", "ar": "معجون كبريتات الباريوم"}, {"en": "Water-soluble contrast agent", "ar": "مادة تباين ذائبة في الماء"}, {"en": "Dense barium 250%", "ar": "باريوم كثيف 250%"}, {"en": "Oil-based contrast", "ar": "مادة تباين زيتية"}], "answer": 1, "why": "المحاضرة: مادة ذائبة في الماء عند الاشتباه بالانثقاب، ولا يُستعمل الباريوم في البداية."}, {"q_en": "Which contrast is safest if there is a risk of aspiration?", "q_ar": "أي مادة تباين هي الأكثر أماناً عند خطر الرشف؟", "options": [{"en": "LOCM", "ar": "مادة التباين منخفضة الأسمولية LOCM"}, {"en": "Gastrografin", "ar": "غاستروغرافين"}, {"en": "Barium 250%", "ar": "باريوم 250%"}, {"en": "Air", "ar": "الهواء"}], "answer": 0, "why": "المحاضرة: LOCM هي الأكثر أماناً عند خطر الرشف، ولا يُستعمل الغاستروغرافين عند احتمال الرشف."}, {"q_en": "Before a contrast swallow, the patient should have nothing by mouth for:", "q_ar": "قبل بلع مادة التباين، يجب ألّا يتناول المريض شيئاً عن طريق الفم لمدة:", "options": [{"en": "1 hour", "ar": "ساعة واحدة"}, {"en": "24 hours", "ar": "24 ساعة"}, {"en": "3 days", "ar": "3 أيام"}, {"en": "6 hours", "ar": "6 ساعات"}], "answer": 3, "why": "المحاضرة: لا شيء عن طريق الفم لمدة 6 ساعات قبل الفحص."}, {"q_en": "The technique starts with the patient erect in which position?", "q_ar": "تبدأ التقنية والمريض قائم بأي وضعية؟", "options": [{"en": "Left anterior oblique (LAO)", "ar": "المائل الأمامي الأيسر LAO"}, {"en": "Prone", "ar": "الانبطاح"}, {"en": "Right anterior oblique (RAO)", "ar": "المائل الأمامي الأيمن RAO"}, {"en": "Left lateral decubitus", "ar": "الاستلقاء على الجانب الأيسر"}], "answer": 2, "why": "المحاضرة: ابدأ والمريض قائم بوضعية RAO لإظهار المريء بعيداً عن ال document.addEventListener("DOMContentLoaded", () => {
  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)
  const p0 = location.pathname.startsWith(rootP) ? location.pathname.slice(rootP.length) : location.pathname;
  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");
  const L = (() => { try { return JSON.parse(document.body.dataset.lecture || "null"); } catch (e) { return null; } })();

  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {

    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }

  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";

      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق

    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
