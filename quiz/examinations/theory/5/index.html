{"q_en": "Which is a contraindication to barium enema?", "q_ar": "أي مما يأتي مانع لحقنة الباريوم الشرجية؟", "options": [{"en": "Rectal bleeding", "ar": "نزيف شرجي"}, {"en": "Toxic megacolon", "ar": "تضخم القولون السام"}, {"en": "History of polyp", "ar": "تاريخ سليلة"}, {"en": "Presence of obstruction", "ar": "وجود انسداد"}], "answer": 1, "why": "المحاضرة: تضخم القولون السام من الموانع، أما الباقي فمن الدواعي."}, {"q_en": "Which is an indication for barium enema?", "q_ar": "أي مما يأتي من دواعي حقنة الباريوم الشرجية؟", "options": [{"en": "Rectal bleeding", "ar": "نزيف شرجي"}, {"en": "Toxic megacolon", "ar": "تضخم القولون السام"}, {"en": "Recent biopsy", "ar": "خزعة حديثة"}, {"en": "Patient frailty", "ar": "ضعف المريض"}], "answer": 0, "why": "المحاضرة: النزيف الشرجي هو الأول بين الدواعي، أما الباقي فموانع."}, {"q_en": "Multiple air-fluid levels on an upright film suggest:", "q_ar": "مستويات الهواء–السائل المتعددة في صورة الوقوف تدل على:", "options": [{"en": "Normal bowel", "ar": "أمعاء طبيعية"}, {"en": "Gallstones", "ar": "حصى المرارة"}, {"en": "Pneumonia", "ar": "ذات الرئة"}, {"en": "Bowel obstruction", "ar": "انسداد الأمعاء"}], "answer": 3, "why": "المحاضرة: مستويات الهواء–السائل المتعددة تدل على انسداد الأمعاء."}, {"q_en": "The transverse lines seen in the dilated large intestine are called:", "q_ar": "تُسمّى الخطوط العرضية في الأمعاء الغليظة المتوسعة:", "options": [{"en": "Villi", "ar": "الزغابات"}, {"en": "Rugae", "ar": "الطيّات المعدية"}, {"en": "Haustra", "ar": "الجيوب القولونية"}, {"en": "Valves", "ar": "الصمامات"}], "answer": 2, "why": "المحاضرة: الخطوط العرضية تُسمّى haustra."}, {"q_en": "The diet for 3 days before the examination is:", "q_ar": "الغذاء في الأيام الثلاثة قبل الفحص:", "options": [{"en": "High fiber", "ar": "عالي الألياف"}, {"en": "Fatty fried foods", "ar": "أطعمة مقلية دسمة"}, {"en": "Low residue", "ar": "قليل الفضلات"}, {"en": "Fruits and vegetables", "ar": "فواكه وخضراوات"}], "answer": 2, "why": "المحاضرة: نظام غذائي قليل الفضلات (قليل الألياف) بلا أطعمة مقلية دسمة ولا خضراوات ولا فواكه."}, {"q_en": "On the day prior to the examination the patient takes:", "q_ar": "في اليوم السابق للفحص يتناول المريض:", "options": [{"en": "Solid food", "ar": "طعاماً صلباً"}, {"en": "Fluids only", "ar": "سوائل فقط"}, {"en": "Fatty meals", "ar": "وجبات دسمة"}, {"en": "Vegetables", "ar": "خضراوات"}], "answer": 1, "why": "المحاضرة: في اليوم السابق للفحص سوائل فقط."}, {"q_en": "Which purgative is used before barium enema?", "q_ar": "أي مسهّل يُستعمل قبل حقنة الباريوم الشرجية؟", "options": [{"en": "Castor oil", "ar": "زيت الخروع"}, {"en": "Aspirin", "ar": "الأسبرين"}, {"en": "Insulin", "ar": "الإنسولين"}, {"en": "Glucagon", "ar": "الغلوكاغون"}], "answer": 0, "why": "المحاضرة: مسهّل مثل زيت الخروع (30 مل) أو البيساكوديل."}, {"q_en": "Bowel wash is repeated until the efflux is clear of:", "q_ar": "يُكرَّر غسل الأمعاء حتى يصفو الخارج من:", "options": [{"en": "Barium", "ar": "الباريوم"}, {"en": "Air", "ar": "الهواء"}, {"en": "Buscopan", "ar": "البوسكوبان"}, {"en": "Fecal matter", "ar": "المادة البرازية"}], "answer": 3, "why": "المحاضرة: يُكرَّر ذلك حتى يصبح الخارج خالياً من أي مادة برازية."}, {"q_en": "Preparation is not done in children less than:", "q_ar": "لا يُحضَّر الأطفال الأقل من عمر:", "options": [{"en": "2 years", "ar": "سنتين"}, {"en": "5 years", "ar": "5 سنوات"}, {"en": "12 years", "ar": "12 سنة"}, {"en": "8 years", "ar": "8 سنوات"}], "answer": 3, "why": "المحاضرة: لا يُحضَّر المريض عند الأطفال الأقل من 8 سنوات."}, {"q_en": "Who should be placed first on the list?", "q_ar": "من يُوضع أولاً في القائمة؟", "options": [{"en": "Children", "ar": "الأطفال"}, {"en": "Infants", "ar": "الرُّضّع"}, {"en": "Diabetics", "ar": "مرضى السكري"}, {"en": "Smokers", "ar": "المدخنون"}], "answer": 2, "why": "المحاضرة: يُنصح بوضع مرضى السكري أولاً في القائمة."}, {"q_en": "The method of choice to show the mucosal pattern is:", "q_ar": "الطريقة المختارة لإظهار نمط الغشاء المخاطي هي:", "options": [{"en": "Single contrast", "ar": "التباين المفرد"}, {"en": "Double contrast", "ar": "التباين المزدوج"}, {"en": "Plain film", "ar": "الصورة البسيطة"}, {"en": "Air enema", "ar": "حقنة الهواء"}], "answer": 1, "why": "المحاضرة: التباين المزدوج هو الطريقة المختارة لإظهار نمط الغشاء المخاطي."}, {"q_en": "To localize an obstructing colonic lesion, use:", "q_ar": "لتحديد موقع آفة قولونية مسدِّدة نستعمل:", "options": [{"en": "Water-soluble contrast", "ar": "تبايناً ذائباً في الماء"}, {"en": "Thick barium 95%", "ar": "باريوم أثخن 95%"}, {"en": "Air only", "ar": "الهواء فقط"}, {"en": "Oil contrast", "ar": "تبايناً زيتياً"}], "answer": 0, "why": "المحاضرة: التباين المفرد لتحديد الآفة المسدِّدة، ويُستعمل فيه تباين ذائب في الماء."}, {"q_en": "The barium used for double contrast is:", "q_ar": "الباريوم المستعمل في التباين المزدوج:", "options": [{"en": "75% to 95% or more", "ar": "75% إلى 95% أو أكثر"}, {"en": "5% to 10%", "ar": "5% إلى 10%"}, {"en": "15% to 25%", "ar": "15% إلى 25%"}, {"en": "1% only", "ar": "1% فقط"}], "answer": 0, "why": "المحاضرة: الباريوم الأثخن في التباين المزدوج بين 75% و95% أو أكثر، أما 15–25% فللتباين المفرد."}, {"q_en": "The negative contrast in double contrast enema is:", "q_ar": "التباين السلبي في الحقنة ذات التباين المزدوج هو:", "options": [{"en": "Barium", "ar": "الباريوم"}, {"en": "Urografin", "ar": "اليوروغرافين"}, {"en": "Water", "ar": "الماء"}, {"en": "Air or CO2", "ar": "الهواء أو CO2"}], "answer": 3, "why": "المحاضرة: يُضاف الهواء أو ثاني أكسيد الكربون كتباين سلبي."}, {"q_en": "For catheter insertion the patient lies on the:", "q_ar": "لإدخال القسطرة يستلقي المريض على الجانب:", "options": [{"en": "Right side", "ar": "الأيمن"}, {"en": "Back", "ar": "الظهر"}, {"en": "Left side", "ar": "الأيسر"}, {"en": "Stomach", "ar": "البطن"}], "answer": 2, "why": "المحاضرة: يستلقي المريض على جانبه الأيسر وتُدخَل القسطرة برفق."}, {"q_en": "The i.v. dose of Buscopan is:", "q_ar": "الجرعة الوريدية من البوسكوبان:", "options": [{"en": "1 mg", "ar": "1 ملغ"}, {"en": "20 mg", "ar": "20 ملغ"}, {"en": "5 mg", "ar": "5 ملغ"}, {"en": "100 mg", "ar": "100 ملغ"}], "answer": 1, "why": "المحاضرة: حقنة وريدية من Buscopan (20 ملغ) أو glucagon (1 ملغ)."}, {"q_en": "The table tilt during barium infusion is:", "q_ar": "إمالة الطاولة أثناء حقن الباريوم:", "options": [{"en": "30 degrees head up", "ar": "30 درجة والرأس مرتفع"}, {"en": "10 degrees head down", "ar": "10 درجات والرأس منخفض"}, {"en": "No tilt", "ar": "بلا إمالة"}, {"en": "45 degrees head down", "ar": "45 درجة والرأس منخفض"}], "answer": 1, "why": "المحاضرة: مع إمالة الطاولة 10 درجات برأس منخفض."}, {"q_en": "Which gas reduces severe pain after the enema?", "q_ar": "أي غاز يقلل الألم الشديد بعد الحقنة؟", "options": [{"en": "CO2", "ar": "ثاني أكسيد الكربون"}, {"en": "Room air", "ar": "هواء الغرفة"}, {"en": "Oxygen", "ar": "الأكسجين"}, {"en": "Nitrogen", "ar": "النيتروجين"}], "answer": 0, "why": "المحاضرة: CO2 يقلل الألم الشديد بعد الحقنة، لذا يُفضَّل على هواء الغرفة."}, {"q_en": "All films in barium enema are taken on:", "q_ar": "تؤخذ كل أفلام حقنة الباريوم الشرجية عند:", "options": [{"en": "Inspiration", "ar": "الشهيق"}, {"en": "Deep inspiration", "ar": "الشهيق العميق"}, {"en": "Any phase", "ar": "أي طور"}, {"en": "Expiration", "ar": "الزفير"}], "answer": 3, "why": "المحاضرة: تؤخذ كل الأفلام عند الزفير."}, {"q_en": "The usual film size (except rectum views) is:", "q_ar": "حجم الفيلم المعتاد (عدا صور المستقيم):", "options": [{"en": "8 x 10 inch", "ar": "8 × 10 إنش"}, {"en": "10 x 12 inch", "ar": "10 × 12 إنش"}, {"en": "14 x 17 inch", "ar": "14 × 17 إنش"}, {"en": "11 x 14 inch", "ar": "11 × 14 إنش"}], "answer": 2, "why": "المحاضرة: الأفلام 14 × 17 إنش، وصور المستقيم 10 × 12 إنش."}, {"q_en": "The kVp used for adults is:", "q_ar": "الجهد kVp المستعمل للبالغين:", "options": [{"en": "50", "ar": "50"}, {"en": "70", "ar": "70"}, {"en": "110", "ar": "110"}, {"en": "90", "ar": "90"}], "answer": 2, "why": "المحاضرة: يُستعمل 110 kVp للبالغين و90 للرُّضّع."}, {"q_en": "The central ray for the scout film is at:", "q_ar": "الشعاع المركزي لفيلم ية:", "options": [{"en": "Perforation", "ar": "الانثقاب"}, {"en": "Cardiac arrhythmias", "ar": "اضطرابات نظم القلب"}, {"en": "Bacteraemia", "ar": "تجرثم الدم"}, {"en": "Dehydration", "ar": "الجفاف"}], "answer": 1, "why": "المحاضرة: اضطرابات نظم القلب هي السبب الأكثر شيوعاً للوفاة بعد الحقنة."}, {"q_en": "Barium pulmonary embolus carries a mortality risk of:", "q_ar": "الصمّة الرئوية بالباريوم تحمل خطر وفاة بنسبة:", "options": [{"en": "80%", "ar": "80%"}, {"en": "8%", "ar": "8%"}, {"en": "20%", "ar": "20%"}, {"en": "50%", "ar": "50%"}], "answer": 0, "why": "المحاضرة: الصمّة الرئوية بالباريوم تحمل خطر وفاة 80%."}, {"q_en": "Bowel perforation is often related to:", "q_ar": "يرتبط انثقاب الأمعاء غالباً بـ:", "options": [{"en": "Manipulation of the catheter balloon", "ar": "تحريك بالون القسطرة"}, {"en": "Low-residue diet", "ar": "الغذاء قليل الفضلات"}, {"en": "Using CO2", "ar": "استعمال CO2"}, {"en": "Bowel wash", "ar": "غسل الأمعاء"}], "answer": 0, "why": "المحاضرة: الانثقاب غالباً مرتبط بتحريك بالون القسطرة الشرجية."}, {"q_en": "The instant enema uses:", "q_ar": "تستعمل الحقنة «الفورية»:", "options": [{"en": "Thick barium", "ar": "باريوماً أثخن"}, {"en": "Oil-based contrast", "ar": "تبايناً زيتياً"}, {"en": "Air only", "ar": "الهواء فقط"}, {"en": "Water-soluble contrast", "ar": "تبايناً ذائباً في الماء"}], "answer": 3, "why": "المحاضرة: مادة تباين ذائبة في الماء مثل Urografin 150."}, {"q_en": "In the instant enema, air insufflation is:", "q_ar": "في الحقنة «الفورية» نفخ الهواء:", "options": [{"en": "Always required", "ar": "لازم دائماً"}, {"en": "Done first", "ar": "يُجرى أولاً"}, {"en": "Not required", "ar": "غير لازم"}, {"en": "Done twice", "ar": "يُجرى مرتين"}], "answer": 2, "why": "المحاضرة: لا يلزم نفخ الهواء (تقنية التباين المفرد)."}, {"q_en": "Which is a contraindication to the instant enema?", "q_ar": "أي مما يأتي مانع للحقنة «الفورية»؟", "options": [{"en": "Large bowel obstruction", "ar": "انسداد الأمعاء الغليظة"}, {"en": "Toxic megacolon", "ar": "تضخم القولون
