م"}, {"en": "Three iodine atoms", "ar": "ثلاث ذرات يود"}, {"en": "Six iodine atoms", "ar": "ست ذرات يود"}], "answer": 2, "why": "المحاضرة: تعتمد على حلقة بنزين ترتبط بها ثلاث ذرات يود."}, {"q_en": "A dimer contains:", "q_ar": "الديمر يحتوي على:", "options": [{"en": "One benzene ring tri-iodinated", "ar": "حلقة بنزين واحدة ثلاثية اليود"}, {"en": "Two benzene rings tri-iodinated", "ar": "حلقتي بنزين ثلاثيتي اليود"}, {"en": "Two iodine atoms only", "ar": "ذرتي يود فقط"}, {"en": "No benzene ring", "ar": "بلا حلقة بنزين"}], "answer": 1, "why": "المحاضرة: الديمر فيه حلقتا بنزين ثلاثيتا اليود، والمونومر حلقة واحدة."}, {"q_en": "Compared with ionic CM, non-ionic CM have:", "q_ar": "مقارنةً بالمواد الأيونية، مواد التباين غير الأيونية:", "options": [{"en": "Lower risk and high cost", "ar": "خطرها أقل وكلفتها عالية"}, {"en": "Higher risk and low cost", "ar": "خطرها أعلى وكلفتها قليلة"}, {"en": "Electrical charge", "ar": "تحمل شحنة كهربائية"}, {"en": "More side effects", "ar": "آثار جانبية أكثر"}], "answer": 0, "why": "جدول المحاضرة: غير الأيونية خطرها أقل وكلفتها عالية."}, {"q_en": "In ionic CM, what is responsible for the side effect?", "q_ar": "في المواد الأيونية، ما المسؤول عن الآثار الجانبية؟", "options": [{"en": "The low cost", "ar": "الكلفة القليلة"}, {"en": "The benzene ring", "ar": "حلقة البنزين"}, {"en": "The low osmolality", "ar": "الأسمولية المنخفضة"}, {"en": "The electrical charge", "ar": "الشحنة الكهربائية"}], "answer": 3, "why": "المحاضرة: المواد الأيونية مشحونة، وهذه الشحنة مسؤولة عن الآثار الجانبية."}, {"q_en": "Which of the following is a non-ionic contrast medium according to the lecture?", "q_ar": "أيّ مما يأتي مادة تباين غير أيونية بحسب المحاضرة؟", "options": [{"en": "Urografin", "ar": "يوروغرافين"}, {"en": "Gastrografin", "ar": "غاستروغرافين"}, {"en": "Omnipaque (Iohexol)", "ar": "أومنيباك (أيوهيكسول)"}, {"en": "Conray", "ar": "كونراي"}], "answer": 2, "why": "المحاضرة: من غير الأيونية أومنيباك (أيوهيكسول) وألترافيست (أيوبروميد)، والباقي أيونية."}, {"q_en": "The osmolality of high osmolality CM is up to:", "q_ar": "أسمولية المواد عالية الأسمولية تصل إلى:", "options": [{"en": "2X serum", "ar": "ضعف المصل"}, {"en": "5X serum", "ar": "5 أضعاف المصل"}, {"en": "Equal to serum", "ar": "مساوية للمصل"}, {"en": "10X serum", "ar": "10 أضعاف المصل"}], "answer": 1, "why": "الجدول: أسمولية المواد عالية الأسمولية تصل إلى 5 أضعاف المصل."}, {"q_en": "Low osmolality CM are preferred for:", "q_ar": "المواد منخفضة الأسمولية مفضّلة للإعطاء:", "options": [{"en": "Intravascular and intrathecal administration", "ar": "داخل الأوعية الدموية وداخل القراب"}, {"en": "Oral use only", "ar": "عن طريق الفم فقط"}, {"en": "Rectal use only", "ar": "عن طريق المستقيم فقط"}, {"en": "Skin application", "ar": "على الجلد"}], "answer": 0, "why": "الجدول: منخفضة الأسمولية مفضّلة للإعطاء داخل الأوعية وداخل القراب، أما العالية فمفضّلة للفم."}, {"q_en": "Which contrast medium is given as an example of iso-osmolality CM?", "q_ar": "أيّ مادة ذُكرت مثالاً على المواد متساوية الأسمولية؟", "options": [{"en": "Gastrografin", "ar": "غاستروغرافين"}, {"en": "Urografin", "ar": "يوروغرافين"}, {"en": "Ultravist", "ar": "ألترافيست"}, {"en": "Visipaque", "ar": "فيزيباك"}], "answer": 3, "why": "الجدول: من أمثلة متساوية الأسمولية فيزيباك وأيزوفيست."}, {"q_en": "Low- and iso-osmolality contrast media are safer than HOCM by:", "q_ar": "المواد منخفضة ومتساوية الأسمولية أكثر أماناً من عالية الأسمولية بمقدار:", "options": [{"en": "2 times", "ar": "مرتين"}, {"en": "100 times", "ar": "100 مرة"}, {"en": "5-10 times", "ar": "5–10 مرات"}, {"en": "They are equally safe", "ar": "متساوية في الأمان"}], "answer": 2, "why": "المحاضرة: منخفضة ومتساوية الأسمولية أكثر أماناً بـ 5–10 مرات من عالية الأسمولية."}, {"q_en": "Gastrografin is used for GIT evaluation in cases of:", "q_ar": "يُستعمل الغاستروغرافين لتقييم الجهاز الهضمي في حالات:", "options": [{"en": "Suspected kidney stones", "ar": "الاشتباه بحصى الكلية"}, {"en": "Suspected perforation", "ar": "الاشتباه بوجود انثقاب"}, {"en": "Suspected brain tumour", "ar": "الاشتباه بورم الدماغ"}, {"en": "Suspected fracture", "ar": "الاشتباه بكسر"}], "answer": 1, "why": "المحاضرة: يُستعمل عند الاشتباه بالانثقاب، أو تسرّب المفاغرة، أو انسداد الأمعاء."}, {"q_en": "Intravenous urography is an x-ray examination of:", "q_ar": "تصوير الجهاز البولي الوريدي فحص بالأشعة السينية لـ:", "options": [{"en": "The kidneys, ureters and urinary bladder", "ar": "الكليتين والحالبين والمثانة البولية"}, {"en": "The salivary glands", "ar": "الغدد اللعابية"}, {"en": "The uterus and tubes", "ar": "الرحم والأنابيب"}, {"en": "The stomach and duodenum", "ar": "المعدة والاثنا عشري"}], "answer": 0, "why": "المحاضرة: فحص بالأشعة السينية للكليتين والحالبين والمثانة بمادة تباين يودية تُحقن في الوريد."}, {"q_en": "Evaluation of the salivary gland with water soluble contrast is called:", "q_ar": "تقييم الغدة اللعابية بمادة تباين ذائبة في الماء يُسمّى:", "options": [{"en": "Fistulography", "ar": "تصوير الناسور"}, {"en": "Cysto urethrography", "ar": "تصوير المثانة والإحليل"}, {"en": "Hystro salpengography", "ar": "تصوير الرحم والأنابيب"}, {"en": "Sialography", "ar": "تصوير الغدد اللعابية"}], "answer": 3, "why": "المحاضرة: تقييم الغدد اللعابية يُسمّى تصوير الغدد اللعابية."}, {"q_en": "Injection in any external opening in the skin is called:", "q_ar": "الحقن في أي فتحة خارجية في الجلد يُسمّى:", "options": [{"en": "Sialography", "ar": "تصوير الغدد اللعابية"}, {"en": "Arthrography", "ar": "تصوير المفصل"}, {"en": "Fistulography", "ar": "تصوير الناسور"}, {"en": "Urography", "ar": "تصوير الجهاز البولي"}], "answer": 2, "why": "المحاضرة: الحقن في فتحة خارجية في الجلد يُسمّى تصوير الناسور."}, {"q_en": "Acute adverse reactions are defined as reactions occurring within:", "q_ar": "التفاعلات الضارة الحادة تُعرَّف بأنها التي تحدث خلال:", "options": [{"en": "The first week", "ar": "الأسبوع الأول"}, {"en": "The first hour following the contrast medium injection", "ar": "الساعة الأولى بعد حقن مادة التباين"}, {"en": "The first 24 hours", "ar": "الـ 24 ساعة الأولى"}, {"en": "The first month", "ar": "الشهر الأول"}], "answer": 1, "why": "المحاضرة: التفاعلات الحادة هي التي تحدث خلال الساعة الأولى بعد حقن مادة التباين."}, {"q_en": "Allergy-like (anaphylactic) reactions are:", "q_ar": "التفاعلات الشبيهة بالحساسية (التأقّية):", "options": [{"en": "Unpredictable and unrelated to the amount of contrast", "ar": "لا يمكن توقّعها ولا ترتبط بكمية مادة التباين"}, {"en": "Dose-dependent", "ar": "تعتمد على الجرعة"}, {"en": "Caused only by oral contrast", "ar": "تحدث فقط مع التباين الفموي"}, {"en": "Always severe", "ar": "شديدة دائماً"}], "answer": 0, "why": "المحاضرة: التفاعلات الشبيهة بالحساسية لا يمكن توقّعها ولا ترتبط بكمية المادة."}, {"q_en": "Non-allergy-like (chemotoxic) reactions such as pain or a sensation of heat are:", "q_ar": "التفاعلات غير الشبيهة بالحساسية (السمّية الكيميائية) مثل الألم والإحساس بالحرارة:", "options": [{"en": "Unpredictable", "ar": "لا يمكن توقّعها"}, {"en": "Unrelated to the amount", "ar": "لا ترتبط بالكمية"}, {"en": "Caused by air contrast", "ar": "تسبّبها مادة التباين الهوائية"}, {"en": "Dose-dependent", "ar": "تعتمد على الجرعة"}], "answer": 3, "why": "المحاضرة: التفاعلات غير الشبيهة بالحساسية (السمّية الكيميائية) تعتمد على الجرعة."}, {"q_en": "Adverse reactions after non-ionic iodinated contrast media occur in:", "q_ar": "التفاعلات الضارة بعد مواد التباين اليودية غير الأيونية تحدث في:", "options": [{"en": "About 10% of patients", "ar": "نحو 10% من المرضى"}, {"en": "About 50% of patients", "ar": "نحو 50% من المرضى"}, {"en": "Less than 1% of all patients", "ar": "أقل من 1% من جميع المرضى"}, {"en": "All patients", "ar": "جميع المرضى"}], "answer": 2, "why": "المحاضرة: التفاعلات الضارة بعد المواد غير الأيونية نادرة، في أقل من 1% من المرضى."}, {"q_en": "Which of the following is listed as a reaction to IV contrast media?", "q_ar": "أيّ مما يأتي ذُكر من التفاعلات مع مادة التباين الوريدية؟", "options": [{"en": "Bone fracture", "ar": "كسر العظم"}, {"en": "Skin rash", "ar": "طفح جلدي"}, {"en": "Hair loss", "ar": "تساقط الشعر"}, {"en": "Hearing loss", "ar": "فقدان السمع"}], "answer": 1, "why": "قائمة المحاضرة: الغثيان والتقيؤ، والطفح الجلدي، وضيق التنفس وتسرّع القلب، وانخفاض الضغط والصدمة، وتوقّف القلب."}, {"q_en": "Injection into the left ventricle or aorta causes:", "q_ar": "الحقن في البطين الأيسر أو الأبهر يسبّب:", "options": [{"en": "Brief systemic hypertension", "ar": "ارتفاعاً قصيراً في ضغط الدم الجهازي"}, {"en": "Systemic hypotension", "ar": "انخفاض ضغط الدم الجهازي"}, {"en": "Skin sloughing", "ar": "تقشّر الجلد"}, {"en": "Renal failure", "ar": "فشلاً كلوياً"}], "answer": 0, "why": "المحاضرة: الحقن في البطين الأيسر أو الأبهر يسبّب ارتفاعاً قصيراً في الضغط، أما الجانب الأيمن والشريان الرئوي فانخفاضاً."}, {"q_en": "The treatment of contrast extravasation should consist of:", "q_ar": "علاج تسرّب مادة التباين خارج الوعاء يجب أن يتضمّن:", "options": [{"en": "Hot packs and lowering of the limb", "ar": "الكمّادات الحارّة وإنزال الطرف"}, {"en": "Immediate surgery", "ar": "جراحة فورية"}, {"en": "More contrast injection", "ar": "حقن مزيد من مادة التباين"}, {"en": "Cold packs and elevation of the limb", "ar": "الكمّادات الباردة ورفع الطرف"}], "answer": 3, "why": "المحاضرة: العلاج كمّادات باردة ورفع الطرف."}, {"q_en": "The single most important risk factor for contrast-induced nephropathy is:", "q_ar": "أهم عامل خطر لاعتلال الكلية الناتج عن مادة التباين هو:", "options": [{"en": "Age less than 20 years", "ar": "العمر أقل من 20 سنة"}, {"en": "Normal renal function", "ar": "وظيفة كلوية طبيعية"}, {"en": "Pre-existing impairment of renal function", "ar": "القصور السابق في وظيفة الكلى"}, {"en": "Small doses of contrast", "ar": "الجرعات الصغيرة من مادة التباين"}], "answer": 2, "why": "المحاضرة: أهم عامل خطر هو القصور السابق في وظيفة الكلى."}, {"q_en": "Serum creatinine should be measured before contrast administration within:", "q_ar": "يجب قياس الكرياتينين في المصل قبل إعطاء مادة التباين خلال:", "options": [{"en": "1 hour", "ar": "ساعة واحدة"}, {"en": "1 week", "ar": "أسبوع واحد"}, {"en": "1 month", "ar": "شهر واحد"}, {"en": "1 year", "ar": "سنة واحدة"}], "answer": 1, "why": "المحاضرة: يُقاس الكرياتينين خلال أسبوع واحد قبل إعطاء مادة التباين."}, {"q_en": "According to the lecture, after iodinated contrast during lactation:", "q_ar": "بحسب المحاضرة، بعد إعطاء مادة التباين اليودية خلال الرضاعة:", "options": [{"en": "It is considered safe to continue breastfeeding", "ar": "يُعدّ الاستمرار في الرضاعة الطبيعية آمناً"}, {"en": "Breastfeeding must stop for one month", "ar": "يجب إيقاف الرضاعة شهراً"}, {"en": "Breastfeeding must stop forever", "ar": "يجب إيقاف الرضاعة نهائياً"}, {"en": "Only formula milk is allowed for one week", "ar": "يُسمح بالحليب الصناعي فقط أسبوعاً"}], "answer": 0, "why": "المحاضرة: يُعدّ آمناً للأم والرضيع الاستمرار في الرضاعة بعد مادة التباين اليودية."}, {"q_en": "During pregnancy, exposure to x-radiation or contrast media is:", "q_ar": "خلال الحمل، تعريض الحامل للأشعة السينية أو لمواد التباين:", "options": [{"en": "Recommended", "ar": "مستحسن"}, {"en": "Always required", "ar": "مطلوب دائماً"}, {"en": "Safe without limits", "ar": "آمن بلا حدود"}, {"en": "Not recommended", "ar": "غير مستحسن"}], "answer": 3, "why": "المحاضرة: لا يُنصح بتعريض الحامل للأشعة السينية أو لمواد التباين."}]}</script>

  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");
  const L = (() => { try { return JSON.parse(document.body.dataset.lecture || "null"); } catch (e) { return null; } })();
  if (/^(learn|quiz)\/[^/]+\/[^/]+\/\d+\/$/.test(rel) || /^atlas\/[^/]+\/[^/]+\/$/.test(rel))   // 📍 وين وصلت (نفس شكل tools.js)
    try { localStorage.setItem("t:last", JSON.stringify({ url: rel, title: (L && L.title) || document.title.split("—")[0].trim(), sub: L ? L.sub : "", tab: rel.startsWith("quiz") ? "quiz" : "read", t: Date.now() })); } catch (e) {}
  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {
    let b = h.querySelector(":scope > .nadd");   // ⚡ (30/10) الزر مرسوم بالـ HTML من البناء (بلا قفزة)؛ إذا مو موجود نسوّيه مثل قبل
    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "tnote"; b.textContent = "📝"; b.setAttribute("aria-label", "ملاحظة على المصطلح " + t);
    (pop.querySelector(".pb") || pop).appendChild(b);
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق
      if (!dock) { dock = document.createElement("div"); dock.className = "nqdock"; document.body.appendChild(dock); }
      const sec = document.querySelector(`.tm[data-k="${CSS.escape(k.k)}"]`);
      const ctx = Object.assign(Notes.context(sec) || {}, { kind: L ? "lecture" : "term", key: k.k, title: L ? L.title : t });
      Notes.quick(dock, { into: dock, ctx, links: [{ type: "term", key: k.k, title: t }], prefill: t + ": ", forId: "term:" + k.k, returnTo: document.querySelector(".tm.on") || sec });
    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
</script><!--/me-hook--><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../../../sw.js", { updateViaCache: "none" });</script></body></html>
