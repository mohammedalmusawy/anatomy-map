wer": 2, "why": "المحاضرة: الصورة القائمة أظهرت عدة مستويات هواء–سائل تشخّص انسداد الأمعاء الدقيقة."}, {"q_en": "The usual contrast for follow-through is E-Z Paque 100% w/v 300 mL given divided over:", "q_ar": "المادة المعتادة لمتابعة المرور هي E-Z Paque 100% بحجم 300 مل تُعطى مقسّمة على:", "options": [{"en": "2 min", "ar": "دقيقتين"}, {"en": "20 min", "ar": "20 دقيقة"}, {"en": "2 hours", "ar": "ساعتين"}, {"en": "24 hours", "ar": "24 ساعة"}], "answer": 1, "why": "المحاضرة: 300 مل تُعطى عادةً مقسّمة على 20 دقيقة."}, {"q_en": "Adding 10 mL of Gastrografin to the barium:", "q_ar": "إضافة 10 مل من الغاستروغرافين إلى الباريوم:", "options": [{"en": "Reduces the transit time through the small bowel", "ar": "تقلّل زمن المرور عبر الأمعاء الدقيقة"}, {"en": "Increases flocculation", "ar": "تزيد التلبّد"}, {"en": "Increases the transit time", "ar": "تزيد زمن المرور"}, {"en": "Replaces the need for barium", "ar": "تغني عن الباريوم"}], "answer": 0, "why": "المحاضرة: إضافة 10 مل غاستروغرافين تقلّل زمن المرور، وتحسّن التوسّع وتقلّل التلبّد."}, {"q_en": "Water-soluble small bowel studies are rarely diagnostic because:", "q_ar": "دراسات الأمعاء الدقيقة بالمادة الذائبة في الماء نادراً ما تكون تشخيصية لأن:", "options": [{"en": "The contrast is too dense", "ar": "المادة كثيفة جداً"}, {"en": "It is toxic to the bowel", "ar": "سامّة للأمعاء"}, {"en": "It moves too slowly", "ar": "تتحرّك ببطء شديد"}, {"en": "The contrast becomes diluted in small bowel fluid", "ar": "المادة تتخفّف في سوائل الأمعاء الدقيقة"}], "answer": 3, "why": "المحاضرة: لأن المادة تتخفّف في سوائل الأمعاء الدقيقة فتضعف التفاصيل المخاطية والتشريحية."}, {"q_en": "Metoclopramide is given before or during the examination to:", "q_ar": "يُعطى الميتوكلوبراميد قبل الفحص أو أثناءه لـ:", "options": [{"en": "Relax the stomach", "ar": "إرخاء المعدة"}, {"en": "Anaesthetize the pharynx", "ar": "تخدير البلعوم"}, {"en": "Enhance gastric emptying", "ar": "تحسين إفراغ المعدة"}, {"en": "Empty the bladder", "ar": "إفراغ المثانة"}], "answer": 2, "why": "المحاضرة: يُعطى الميتوكلوبراميد قبل الفحص بـ 20 دقيقة أو أثناءه لتحسين إفراغ المعدة."}, {"q_en": "The patient's bladder must be empty to avoid:", "q_ar": "يجب أن تكون مثانة المريض فارغة لتجنّب:", "options": [{"en": "Barium aspiration", "ar": "رشف الباريوم"}, {"en": "Displacing or compressing the ileum", "ar": "إزاحة اللفائفي أو الضغط عليه"}, {"en": "Gastric reflux", "ar": "الارتجاع المعدي"}, {"en": "Allergic reaction", "ar": "التفاعل التحسّسي"}], "answer": 1, "why": "المحاضرة: المثانة فارغة لتجنّب إزاحة اللفائفي أو الضغط عليه."}, {"q_en": "Which technique of S.B.F.T. is normally adopted?", "q_ar": "أي تقنية من متابعة مرور الأمعاء الدقيقة هي المعتمدة عادةً؟", "options": [{"en": "Double contrast", "ar": "التباين المزدوج"}, {"en": "Single contrast", "ar": "التباين المفرد"}, {"en": "Water-soluble only", "ar": "المادة الذائبة في الماء فقط"}, {"en": "Plain film only", "ar": "الصورة البسيطة فقط"}], "answer": 0, "why": "المحاضرة: تقنية التباين المزدوج هي المعتمدة عادةً."}, {"q_en": "After drinking the barium, the patient is put in the right side dependent position to:", "q_ar": "بعد شرب الباريوم يوضع المريض على جانبه الأيمن لـ:", "options": [{"en": "Separate the bowel loops", "ar": "فصل عرى الأمعاء"}, {"en": "Show the fundus", "ar": "إظهار القاع"}, {"en": "Reduce the dose", "ar": "تقليل الجرعة"}, {"en": "Aid rapid gastric emptying", "ar": "مساعدة الإفراغ السريع للمعدة"}], "answer": 3, "why": "المحاضرة: يوضع على جانبه الأيمن لمساعدة الإفراغ السريع للمعدة إلى الاثني عشري."}, {"q_en": "After 15 to 20 minutes, the PA film is taken with the patient:", "q_ar": "بعد 15–20 دقيقة تُؤخذ صورة PA والمريض:", "options": [{"en": "Supine", "ar": "مستلقٍ على ظهره"}, {"en": "Erect", "ar": "قائم"}, {"en": "Prone", "ar": "منبطح"}, {"en": "Left lateral", "ar": "على جانبه الأيسر"}], "answer": 2, "why": "المحاضرة: بعد 15–20 دقيقة تُؤخذ صورة PA والمريض منبطح لفصل عرى الأمعاء."}, {"q_en": "The best position to demonstrate the ileocecal junction is:", "q_ar": "أفضل وضعية لإظهار الوصل ال "}, {"en": "Gastric emptying", "ar": "إفراغ المعدة"}], "answer": 1, "why": "المحاضرة: الصورة القائمة تُستعمل أحياناً لإظهار مستويات السائل بسبب مادة التباين المحتبسة في الرتوج."}, {"q_en": "To separate loops of the small bowel, oblique views are taken in particular with:", "q_ar": "لفصل عرى الأمعاء الدقيقة تُؤخذ لقطات مائلة خاصةً مع:", "options": [{"en": "The right side raised for terminal ileum views", "ar": "رفع الجانب الأيمن للقطات اللفائفي النهائي"}, {"en": "The left side raised for the fundus", "ar": "رفع الجانب الأيسر للقاع"}, {"en": "The patient sitting", "ar": "جلوس المريض"}, {"en": "The bladder full", "ar": "امتلاء المثانة"}], "answer": 0, "why": "المحاضرة: الوضعيات المائلة خاصةً برفع الجانب الأيمن للقطات اللفائفي النهائي."}, {"q_en": "Another name for small bowel enema is:", "q_ar": "الاسم الآخر لحقنة الأمعاء الدقيقة:", "options": [{"en": "Pneumocolon", "ar": "نفخ القولون"}, {"en": "Barium meal", "ar": "وجبة الباريوم"}, {"en": "Cystography", "ar": "تصوير المثانة"}, {"en": "Enteroclysis", "ar": "Enteroclysis"}], "answer": 3, "why": "المحاضرة: الاسم الآخر لحقنة الأمعاء الدقيقة هو Enteroclysis."}, {"q_en": "Compared with barium follow-through, enteroclysis gives:", "q_ar": "مقارنةً بمتابعة مرور الباريوم، حقنة الأمعاء الدقيقة تعطي:", "options": [{"en": "Lower radiation dose", "ar": "جرعة إشعاع أقل"}, {"en": "Shorter room time", "ar": "وقتاً أقصر في الغرفة"}, {"en": "Better distension and visualization of the proximal small bowel", "ar": "توسّعاً ورؤية أفضل للأمعاء الدقيقة القريبة"}, {"en": "More comfort for the patient", "ar": "راحة أكثر للمريض"}], "answer": 2, "why": "المحاضرة: تعطي توسّعاً ورؤية أفضل للأمعاء الدقيقة القريبة من متابعة مرور الباريوم."}, {"q_en": "Which is a disadvantage of small bowel enema?", "q_ar": "أيّ مما يأتي من عيوب حقنة الأمعاء الدقيقة؟", "options": [{"en": "Poor distension of the proximal bowel", "ar": "ضعف توسّع الأمعاء القريبة"}, {"en": "Potentially higher radiation dose to the patient", "ar": "احتمال جرعة إشعاع أعلى للمريض"}, {"en"
