{"q_en": "The most commonly used gadolinium form is:", "q_ar": "الشكل الأكثر استعمالاً للغادولينيوم هو:", "options": [{"en": "Liver agents", "ar": "عوامل الكبد"}, {"en": "ECF agents", "ar": "عوامل ECF"}, {"en": "Blood pool agents", "ar": "عوامل تجمّع الدم"}, {"en": "Oral agents", "ar": "العوامل الفموية"}], "answer": 1, "why": "المحاضرة: عوامل السائل خارج الخلية هي الشكل الأكثر استعمالاً بفارق كبير."}, {"q_en": "Liver gadolinium agents are taken up by:", "q_ar": "تلتقط عوامل الغادولينيوم الكبدية:", "options": [{"en": "Erythrocytes", "ar": "الكريات الحمر"}, {"en": "Lymphocytes", "ar": "اللمفاويات"}, {"en": "Osteocytes", "ar": "الخلايا العظمية"}, {"en": "Hepatocytes", "ar": "خلايا الكبد"}], "answer": 3, "why": "المحاضرة: تلتقطها خلايا الكبد وتُطرح سليمة عبر الجهاز الكبدي الصفراوي."}, {"q_en": "The usual ECF gadolinium dose is:", "q_ar": "الجرعة المعتادة لـ ECF غادولينيوم:", "options": [{"en": "0.01 mmol/kg", "ar": "0.01 ملي مول/كغ"}, {"en": "1.0 mmol/kg", "ar": "1.0 ملي مول/كغ"}, {"en": "0.1 mmol/kg", "ar": "0.1 ملي مول/كغ"}, {"en": "5.0 mmol/kg", "ar": "5.0 ملي مول/كغ"}], "answer": 2, "why": "المحاضرة: عادةً 0.1 ملي مول/كغ من وزن الجسم، وتصل إلى 0.2 في المغانط منخفضة المجال."}, {"q_en": "Buscopan or glucagon helps minimize:", "q_ar": "يساعد بوسكوبان أو الغلوكاغون في تقليل:", "options": [{"en": "Peristalsis artefacts", "ar": "تشوهات الحركة الدودية"}, {"en": "Respiration artefacts", "ar": "تشوهات التنفس"}, {"en": "Metal artefacts", "ar": "تشوهات المعادن"}, {"en": "Wrap-around artefacts", "ar": "تشوهات الالتفاف"}], "answer": 0, "why": "المحاضرة: يمكن استخدام بوسكوبان أو الغلوكاغون لمحاولة تقليل الحركة الدودية."}, {"q_en": "Respiratory motion of the abdominal wall is reduced by:", "q_ar": "تُقلَّل الحركة التنفسية لجدار البطن بـ:", "options": [{"en": "A standing erect position", "ar": "وضعية الوقوف"}, {"en": "Prone or compression band", "ar": "الانبطاح أو شريط الضغط"}, {"en": "Deep held inspiration", "ar": "الشهيق العميق المحبوس"}, {"en": "Rectal air insufflation", "ar": " تقيم المنخفضة."}, {"q_en": "Anal cancer staging needs to include the:", "q_ar": "يجب أن يشمل تحديد مرحلة سرطان الشرج:", "options": [{"en": "Axillae", "ar": "الإبطين"}, {"en": "Neck", "ar": "الرقبة"}, {"en": "Groins", "ar": "منطقة الأربية"}, {"en": "Thorax", "ar": "الصدر"}], "answer": 2, "why": "المحاضرة: يجب أن يشمل تحديد مرحلة سرطان الشرج منطقة الأربية."}, {"q_en": "In MR enteroclysis the Bilbao-Dotter tube is passed to the:", "q_ar": "في حقنة الأمعاء الدقيقة بالرنين يُمرَّر أنبوب بلباو–دوتر إلى:", "options": [{"en": "Pylorus", "ar": "البواب"}, {"en": "DJ flexure", "ar": "الثنية الاثني عشرية الصائمية"}, {"en": "Caecum", "ar": "الأعور"}, {"en": "Sigmoid colon", "ar": "القولون السيني"}], "answer": 1, "why": "المحاضرة: يُمرَّر الأنبوب إلى الثنية الاثني عشرية الصائمية (DJ flexure) باستخدام التنظير الشعاعي."}, {"q_en": "The oral contrast infusion rate is:", "q_ar": "معدل حقن التباين الفموي:", "options": [{"en": "5–10 mL/min", "ar": "5–10 مل/دقيقة"}, {"en": "200–300 mL/min", "ar": "200–300 مل/دقيقة"}, {"en": "500 mL/min", "ar": "500 مل/دقيقة"}, {"en": "80–100 mL/min", "ar": "80–100 مل/دقيقة"}], "answer": 3, "why": "المحاضرة: احقن (80–100 مل/دقيقة) من مادة التباين الفموية."}, {"q_en": "The infusion is stopped when contrast reaches the:", "q_ar": "يُوقَف الحقن عندما يصل التباين إلى:", "options": [{"en": "Stomach", "ar": "المعدة"}, {"en": "Colon", "ar": "القولون"}, {"en": "Duodenum", "ar": "الاثني عشري"}, {"en": "Jejunum", "ar": "الصائم"}], "answer": 1, "why": "المحاضرة: أوقف الحقن عندما يصل التباين إلى القولون."}, {"q_en": "The Buscopan dose in enteroclysis is:", "q_ar": "جرعة بوسكوبان في حقنة الأمعاء الدقيقة:", "options": [{"en": "2 mg i.v.", "ar": "2 ملغ وريدياً"}, {"en": "200 mg i.v.", "ar": "200 ملغ وريدياً"}, {"en": "2 g i.v.", "ar": "2 غرام وريدياً"}, {"en": "20 mg i.v.", "ar": "20 ملغ وريدياً"}], "answer": 3, "why": "المحاضرة: أعطِ بوسكوبان 20 ملغ عن طريق الوريد."}, {"q_en": "In MR enterography the patient drinks oral contrast, ideally:", "q_ar": "في تصوير الأمعاء ا       const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق
      if (!dock) { dock = document.createElement("div"); dock.className = "nqdock"; document.body.appendChild(dock); }
      const sec = document.querySelector(`.tm[data-k="${CSS.escape(k.k)}"]`);
      const ctx = Object.assign(Notes.context(sec) || {}, { kind: L ? "lecture" : "term", key: k.k, title: L ? L.title : t });
      Notes.quick(dock, { into: dock, ctx, links: [{ type: "term", key: k.k, title: t }], prefill: t + ": ", forId: "term:" + k.k, returnTo: document.querySelector(".tm.on") || sec });
    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
</script><!--/me-hook--><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../../../sw.js", { updateViaCache: "none" });</script></body></html>
