روغرافين لفحص CT للبطن والحوض."}, {"q_en": "Gastrographin is used for GIT evaluation in cases of suspected:", "q_ar": "يُستعمل الغاستروغرافين لتقييم الجهاز الهضمي عند الاشتباه بـ:", "options": [{"en": "Anastomotic leakage", "ar": "تسرّب المفاغرة"}, {"en": "Kidney stones", "ar": "حصى الكلى"}, {"en": "Myelopathy", "ar": "اعتلال النخاع"}, {"en": "Carotid stenosis", "ar": "تضيّق الشريان السباتي"}], "answer": 0, "why": "حالات الغاستروغرافين بالمحاضرة: الاشتباه بالانثقاب، وتسرّب المفاغرة، وانسداد الأمعاء."}, {"q_en": "Water soluble contrast for IV use is divided in the lecture into:", "q_ar": "تقسّم المحاضرة مواد التباين الذائبة للاستعمال الوريدي إلى:", "options": [{"en": "Oral and rectal", "ar": "فموية وشرجية"}, {"en": "Ionic and non ionic", "ar": "أيونية وغير أيونية"}, {"en": "Positive and negative", "ar": "موجبة وسالبة"}, {"en": "Single and double", "ar": "مفردة ومزدوجة"}], "answer": 1, "why": "المخطط يقسم المواد الذائبة للاستعمال الوريدي إلى أيونية وغير أيونية."}, {"q_en": "IV water soluble contrast is used for:", "q_ar": "تُستعمل مادة التباين الوريدية الذائبة في الماء في:", "options": [{"en": "Myelography only", "ar": "تصوير النخاع الشوكي فقط"}, {"en": "Barium swallow", "ar": "بلع الباريوم"}, {"en": "All CT examination using contrast material", "ar": "كل فحوص CT التي تستعمل مادة التباين"}, {"en": "Plain abdominal film", "ar": "صورة البطن البسيطة"}], "answer": 2, "why": "المحاضرة: تُستعمل المادة الوريدية في كل فحوص CT التي تحتاج مادة تباين (الصدر، البطن، الدماغ...)."}, {"q_en": "Which vessel is listed for CT angiography in the lecture?", "q_ar": "أيّ وعاء مذكور لتصوير الأوعية بالمفراس في المحاضرة؟", "options": [{"en": "Portal vein only", "ar": "الوريد البابي فقط"}, {"en": "Retinal vessels", "ar": "أوعية الشبكية"}, {"en": "Lymphatic vessels", "ar": "الأوعية اللمفية"}, {"en": "Carotid", "ar": "الشريان السباتي"}], "answer": 3, "why": "قائمة تصوير الأوعية بالمفراس في المحاضرة: الشريان السباتي، والأوعية الرئوية، والأبهر، وأوعية الطرف السفلي، والأوعية التاجية."}, {"q_en": "Which of the following is a reaction to contrast media injected intravenously?", "q_ar": "أيّ مما يأتي من التفاعلات مع مادة التباين المحقونة في الوريد؟", "options": [{"en": "Skin rash", "ar": "الطفح الجلدي"}, {"en": "Hair loss", "ar": "تساقط الشعر"}, {"en": "Fracture", "ar": "الكسر"}, {"en": "Cataract", "ar": "الساد (الماء الأبيض)"}], "answer": 0, "why": "قائمة التفاعلات: الغثيان والتقيؤ، الطفح الجلدي، ضيق التنفس وتسرّع القلب، انخفاض الضغط والصدمة، توقّف القلب."}, {"q_en": "The most severe reaction listed for IV contrast media is:", "q_ar": "أشدّ تفاعل مذكور لمادة التباين الوريدية هو:", "options": [{"en": "Nausea", "ar": "الغثيان"}, {"en": "Skin rash", "ar": "الطفح الجلدي"}, {"en": "Cardiac arrest", "ar": "توقّف القلب"}, {"en": "Vomiting", "ar": "التقيؤ"}], "answer": 2, "why": "توقّف القلب آخر بند في قائمة التفاعلات، وهو أخطرها سريرياً."}, {"q_en": "\"Dyspnea and tachycardia\" are listed in the lecture as:", "q_ar": "«ضيق التنفس وتسرّع القلب» مذكوران في المحاضرة على أنهما:", "options": [{"en": "Indications for barium", "ar": "دواعي استعمال الباريوم"}, {"en": "Reactions to IV contrast media", "ar": "تفاعلات مع مادة التباين الوريدية"}, {"en": "Signs of stricture", "ar": "علامات التضيّق"}, {"en": "Uses of Gastrographin", "ar": "استعمالات الغاستروغرافين"}], "answer": 1, "why": "هما من قائمة التفاعلات مع مادة التباين المحقونة في الوريد."}, {"q_en": "Which contrast is shown for intra-thecal injection?", "q_ar": "أيّ مادة تباين معروضة للحقن داخل القراب؟", "options": [{"en": "Gastrographin", "ar": "غاستروغرافين"}, {"en": "Barium sulphate", "ar": "كبريتات الباريوم"}, {"en": "Telebrix", "ar": "تيليبريكس"}, {"en": "Omnipaque", "ar": "أومنيباك"}], "answer": 3, "why": "الشريحة: مادة التباين الذائبة في الماء للحقن داخل القراب هي أومنيباك."}, {"q_en": "Intra-thecal contrast (Omnipaque) is used for:", "q_ar": "تُستعمل مادة التباين داخل القراب (أومنيباك) في:", "options": [{"en": "Myelography (cervical, dorsal, lumbar)", "ar": "تصوير النخاع الشوكي (العنقي والظهري والقطني)"}, {"en": "Barium enema", "ar": "حقنة الباريوم الشرجية"}, {"en": "CT of abdomen and pelvis", "ar": "CT للبطن والحوض"}, {"en": "Coronary angiography", "ar": "تصوير الأوعية التاجية"}], "answer": 0, "why": "المحاضرة: يُستعمل أومنيباك لتصوير النخاع الشوكي العنقي والظهري والقطني."}, {"q_en": "Barium suspension is made up from:", "q_ar": "يُصنع معلّق الباريوم من:", "options": [{"en": "Barium carbonate", "ar": "كربونات الباريوم"}, {"en": "Pure barium sulphate", "ar": "كبريتات الباريوم النقية"}, {"en": "Barium chloride", "ar": "كلوريد الباريوم"}, {"en": "Iodine", "ar": "اليود"}], "answer": 1, "why": "المحاضرة: يُصنع معلّق الباريوم من كبريتات الباريوم النقية، أما كربونات الباريوم فسامّة."}, {"q_en": "According to the lecture, barium carbonate is:", "q_ar": "بحسب المحاضرة، كربونات الباريوم:", "options": [{"en": "Used for myelography", "ar": "تُستعمل لتصوير النخاع الشوكي"}, {"en": "The best oral contrast", "ar": "أفضل مادة تباين فموية"}, {"en": "Poisonous", "ar": "سامّة"}, {"en": "Water soluble for IV use", "ar": "ذائبة في الماء للحقن الوريدي"}], "answer": 2, "why": "المحاضرة: كربونات الباريوم سامّة."}, {"q_en": "The barium particles must be small, about:", "q_ar": "يجب أن تكون دقائق الباريوم صغيرة، بحدود:", "options": [{"en": "10–30 mm", "ar": "10–30 ملم"}, {"en": "1–3 cm", "ar": "1–3 سم"}, {"en": "50–100 µm", "ar": "50–100 µm"}, {"en": "0.1–3 µm", "ar": "0.1–3 µm"}], "answer": 3, "why": "المحاضرة: يجب أن تكون دقائق الباريوم صغيرة (0.1–3 µm) لأن ذلك يجعلها أكثر ثباتاً في المعلّق."}, {"q_en": "Why is a non-ionic suspension medium used for barium?", "q_ar": "لماذا يُستعمل وسط تعليق غير أيوني للباريوم؟", "options": [{"en": "Otherwise the barium particles would aggregate into clumps", "ar": "وإلّا تتجمّع دقائق الباريوم على شكل كتل"}, {"en": "To make it water soluble", "ar": "لجعله ذائباً في الماء"}, {"en": "To allow IV injection", "ar": "للسماح بحقنه في الوريد"}, {"en": "To make it poisonous", "ar": "لجعله سامّاً"}], "answer": 0, "why": "المحاضرة: يُستعمل وسط تعليق غير أيوني، وإلّا تتجمّع دقائق الباريوم على شكل كتل."}, {"q_en": "The barium solution has a pH of 5.3, which makes it:", "q_ar": "درجة حموضة محلول الباريوم 5.3، وهذا يجعله:", "options": [{"en": "Poisonous", "ar": "سامّاً"}, {"en": "Stable in gastric acid", "ar": "ثابتاً في حامض المعدة"}, {"en": "Soluble in water", "ar": "ذائباً في الماء"}, {"en": "Suitable for intrathecal use", "ar": "مناسباً للحقن داخل القراب"}], "answer": 1, "why": "المحاضرة: درجة حموضة المحلول 5.3، وهذا يجعله ثابتاً في حامض المعدة."}, {"q_en": "Barium should NOT be used if which of the following is suspected?", "q_ar": "لا يجب استعمال الباريوم إذا اشتُبه بأيّ مما يأتي؟", "options": [{"en": "Swallowing difficulty", "ar": "صعوبة البلع"}, {"en": "Large abnormalities", "ar": "التغيّرات المرضية الكبيرة"}, {"en": "Perforation", "ar": "الانثقاب"}, {"en": "Stricture", "ar": "التضيّق"}], "answer": 2, "why": "المحاضرة: لا يُستعمل الباريوم إذا اشتُبه بالانثقاب أو الانسداد."}, {"q_en": "Barium is used to outline:", "q_ar": "يُستعمل الباريوم لإظهار:", "options": [{"en": "Bone density", "ar": "كثافة العظم"}, {"en": "Blood flow in vessels", "ar": "جريان الدم في الأوعية"}, {"en": "The spinal cord", "ar": "الحبل الشوكي"}, {"en": "Structure, lumen, large abnormalities", "ar": "حدود التركيب وتجويفه والتغيّرات المرضية الكبيرة"}], "answer": 3, "why": "المحاضرة: يُستعمل الباريوم لإظهار حدود التركيب وتجويفه والتغيّرات المرضية الكبيرة."}, {"q_en": "Which of the following findings is shown on the barium images of the lecture?", "q_ar": "أيّ من الموجودات الآتية معروض في صور الباريوم بالمحاضرة؟", "options": [{"en": "Filling defect", "ar": "عيب الامتلاء"}, {"en": "Pneumothorax", "ar": "استرواح الصدر"}, {"en": "Fracture", "ar": "الكسر"}, {"en": "Kidney stone", "ar": "حصاة الكلية"}], "answer": 0, "why": "صور الباريوم في المحاضرة معنونة: التضيّق، وعيب الامتلاء، والرتج."}, {"q_en": "The barium image showing a round outpouching from the oesophagus is labelled:", "q_ar": "صورة الباريوم التي تُظهر جيباً مدوّراً بارزاً من المريء معنونة بـ:", "options": [{"en": "Stricture", "ar": "التضيّق"}, {"en": "Diverticulum", "ar": "الرتج"}, {"en": "Perforation", "ar": "الانثقاب"}, {"en": "Obstruction", "ar": "الانسداد"}], "answer": 1, "why": "الصورة في المحاضرة معنونة بالرتج."}, {"q_en": "Case 3: a patient with suspected GI perforation. According to the lecture, which contrast is appropriate?", "q_ar": "الحالة 3: مريض يُشتبه بانثقاب الجهاز الهضمي لديه. بحسب المحاضرة، أيّ مادة تباين مناسبة؟", "options": [{"en": "Barium sulphate", "ar": "كبريتات الباريوم"}, {"en": "Barium carbonate", "ar": "كربونات الباريوم"}, {"en": "Gastrographin", "ar": "غاستروغرافين"}, {"en": "Omnipaque intrathecal", "ar": "أومنيباك داخل القراب"}], "answer": 2, "why": "الغاستروغرافين للاشتباه بالانثقاب، والباريوم لا يُستعمل إذا اشتُبه بالانثقاب."}, {"q_en": "Case 2: a patient with suspected small bowel obstruction. Which contrast should be avoided according to the lecture?", "q_ar": "الحالة 2: مريض يُشتبه بانسداد الأمعاء الدقيقة لديه. أيّ مادة تباين يجب تجنّبها بحسب المحاضرة؟", "options": [{"en": "Gastrographin", "ar": "غاستروغرافين"}, {"en": "Urographin", "ar": "يوروغرافين"}, {"en": "Telebrix", "ar": "تيليبريكس"}, {"en": "Barium", "ar": "الباريوم"}], "answer": 3, "why": "الباريوم لا يُستعمل إذا اشتُبه بالانسداد، والغاستروغرافين يُستعمل عند الاشتباه بانسداد الأمعاء."}, {"q_en": "The last slide of the lecture compares:", "q_ar": "الشريحة الأخيرة في المحاضرة تقارن بين:", "options": [{"en": "Ionic and non ionic contrast", "ar": "التباين الأيوني وغير الأيوني"}, {"en": "Single and double contrast", "ar": "التباين المفرد والمزدوج"}, {"en": "Oral and IV contrast", "ar": "التباين الفموي والوريدي"}, {"en": "Cervical and lumbar myelography", "ar": "تصوير النخاع العنقي والقطني"}], "answer": 1, "why": "عنوان الشريحة الأخيرة: التباين المفرد مقابل التباين المزدوج."}]}</script>

// 👤 «مساحتي»: تتبّع خفيف + 📝 ملاحظة من مكانها + مزامنة الحساب إذا الطالب مسجّل.
document.addEventListener("DOMContentLoaded", () => {
  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)
  const p0 = location.pathname.startsWith(rootP) ? location.pathname.slice(rootP.length) : location.pathname;
  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");
  const L = (() => { try { return JSON.parse(document.body.dataset.lecture || "null"); } catch (e) { return null; } })();
  if (/^(learn|quiz)\/[^/]+\/[^/]+\/\d+\/$/.test(rel) || /^atlas\/[^/]+\/[^/]+\/$/.test(rel))   // 📍 وين وصلت (نفس شكل tools.js)
    try { localStorage.setItem("t:last", JSON.stringify({ url: rel, title: (L && L.title) || document.title.split("—")[0].trim(), sub: L ? L.sub : "", tab: rel.startsWith("quiz") ? "quiz" : "read", t: Date.now() })); } catch (e) {}
  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {
    let b = h.querySelector(":scope > .nadd");   // ⚡ (30/10) الزر مرسوم بالـ HTML من البناء (بلا قفزة)؛ إذا مو موجود نسوّيه مثل قبل
    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "tnote"; b.textContent = "📝"; b.setAttribute("aria-label", "ملاحظة على المصطلح " + t);
    (pop.querySelector(".pb") || pop).appendChild(b);
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق
      if (!dock) { dock = document.createElement("div"); dock.className = "nqdock"; document.body.appendChild(dock); }
      const sec = document.querySelector(`.tm[data-k="${CSS.escape(k.k)}"]`);
      const ctx = Object.assign(Notes.context(sec) || {}, { kind: L ? "lecture" : "term", key: k.k, title: L ? L.title : t });
      Notes.quick(dock, { into: dock, ctx, links: [{ type: "term", key: k.k, title: t }], prefill: t + ": ", forId: "term:" + k.k, returnTo: document.querySelector(".tm.on") || sec });
    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
