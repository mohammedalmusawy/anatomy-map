es", "ar": "المتابعة الروتينية لحصى الكلى"}], "answer": 1, "why": "المحاضرة: من دواعي رنين الحوض النخر اللاوعائي لرأس عظم الفخذ."}, {"q_en": "Pelvic MRI is indicated when:", "q_ar": "يُطلب رنين الحوض عندما:", "options": [{"en": "The patient has a pacemaker", "ar": "يكون للمريض جهاز تنظيم ضربات القلب"}, {"en": "X-ray or CT is inconclusive", "ar": "تكون الأشعة السينية أو المفراس غير حاسمة"}, {"en": "Only bone age is needed", "ar": "يُراد قياس العمر العظمي فقط"}, {"en": "The X-ray is completely normal and there are no symptoms", "ar": "تكون الأشعة طبيعية تماماً ولا أعراض"}], "answer": 1, "why": "المحاضرة: يُطلب الرنين عندما تكون الأشعة السينية أو المفراس غير حاسمة."}, {"q_en": "Which fractures are listed as an indication for pelvic MRI?", "q_ar": "أيّ الكسور مذكورة من دواعي رنين الحوض؟", "options": [{"en": "Skull fractures", "ar": "كسور الجمجمة"}, {"en": "Open fractures", "ar": "الكسور المفتوحة"}, {"en": "Rib fractures", "ar": "كسور الأضلاع"}, {"en": "Occult fractures", "ar": "الكسور الخفية"}], "answer": 3, "why": "المحاضرة: الكسور الخفية أول دواعي رنين الحوض في القائمة."}, {"q_en": "On the axial pelvic MRI at the level of the femoral heads, which organ is labelled anteriorly in the midline?", "q_ar": "في الرنين المحوري للحوض بمستوى رأسي الفخذ، ما العضو المؤشَّر عليه في الأمام وفي الوسط؟", "options": [{"en": "Urinary bladder", "ar": "المثانة"}, {"en": "Stomach", "ar": "المعدة"}, {"en": "Kidney", "ar": "الكلية"}, {"en": "Liver", "ar": "الكبد"}], "answer": 0, "why": "على صورة الرنين المحوري بمستوى رأسي الفخذ في المحاضرة: المثانة في الأمام، والمستقيم والعصعص في الخلف."}]}</script>
