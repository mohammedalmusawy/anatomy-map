<script type="application/json" id="quiz-data">{"subject": "تشريح", "slug": "تشريح", "type": "نظري", "num": 2, "title_ar": "عظم الفخذ", "title_en": "Normal Anatomy of the Femur, Radiological Features of Femur Bone & Ossification Centers", "about": "عظم الفخذ بأجزائه الثلاثة (القريب والجسم والبعيد) ومعالمه، ومظاهره في الأشعة والمفراس، ومراكز تعظّمه، وأنواع كسور الورك وجسم الفخذ ونهايته البعيدة.", "questions": [{"q_en": "Which bone is the longest bone in the body?", "q_ar": "ما أطول عظم في الجسم؟", "options": [{"en": "Fibula", "ar": "الشظية"}, {"en": "Tibia", "ar": "الظنبوب"}, {"en": "Humerus", "ar": "عظم العضد"}, {"en": "Femur", "ar": "عظم الفخذ"}], "answer": 3, "why": "المحاضرة: عظم الفخذ هو العظم الوحيد في الفخذ وأطول عظم في الجسم."}, {"q_en": "Into how many parts can the femur be divided?", "q_ar": "إلى كم جزءاً يمكن تقسيم عظم الفخذ؟", "options": [{"en": "Two: head and shaft", "ar": "جزءان: الرأس والجسم"}, {"en": "Three: proximal, shaft and distal", "ar": "ثلاثة: القريب، والجسم، والبعيد"}, {"en": "Four: head, neck, shaft and condyles", "ar": "أربعة: الرأس، والعنق، والجسم، واللقمتان"}, {"en": "Five", "ar": "خمسة"}], "answer": 1, "why": "المحاضرة: يمكن تقسيم عظم الفخذ إلى ثلاثة أجزاء: القريب، والجسم، والبعيد."}, {"q_en": "The head of the femur articulates with the acetabulum to form the:", "q_ar": "يتمفصل رأس عظم الفخذ مع الحُقّ ليكوّن:", "options": [{"en": "Hip joint", "ar": "مفصل الورك"}, {"en": "Sacroiliac joint", "ar": "المفصل العجزي الحرقفي"}, {"en": "Knee joint", "ar": "مفصل الركبة"}, {"en": "Pubic symphysis", "ar": "الارتفاق العاني"}], "answer": 0, "why": "المحاضرة: الرأس يتمفصل مع الحُقّ في الحوض ليكوّن مفصل الورك."}, {"q_en": "Which part of the femoral head is NOT covered with articular cartilage?", "q_ar": "أيّ جزء من رأس عظم الفخذ غير مغطّى بالغضروف المفصلي؟", "options": [{"en": "The greater trochanter", "ar": "المدوّر الكبير"}, {"en": "The quadrate tubercle", "ar": "الحديبة المربعة"}, {"en": "The fovea", "ar": "النُّقَيرة"}, {"en": "The neck", "ar": "العنق"}], "answer": 2, "why": "المحاضرة: الرأس مغطّى بالغضروف المفصلي ما عدا انخفاضاً صغيراً هو النُّقَيرة، حيث يرتكز رباط رأس الفخذ."}, {"q_en": "What attaches to the fovea of the femoral head?", "q_ar": "ماذا يرتكز في نُقَيرة رأس عظم الفخذ؟", "options": [{"en": "Adductor magnus", "ar": "العضلة المقرِّبة الكبرى"}, {"en": "Ligamentum teres", "ar": "رباط رأس الفخذ"}, {"en": "Quadratus femoris", "ar": "العضلة المربعة الفخذية"}, {"en": "Gluteus maximus", "ar": "العضلة الألوية الكبرى"}], "answer": 1, "why": "المحاضرة: النُّقَيرة هي المكان الذي يرتكز فيه رباط رأس الفخذ (الرباط المدوّر)."}, {"q_en": "The femoral neck is set at an angle of approximately ___ to the shaft.", "q_ar": "يميل عنق عظم الفخذ على الجسم بزاوية تقارب:", "options": [{"en": "45 degrees", "ar": "45 درجة"}, {"en": "90 degrees", "ar": "90 درجة"}, {"en": "135 degrees", "ar": "135 درجة"}, {"en": "180 degrees", "ar": "180 درجة"}], "answer": 2, "why": "المحاضرة: العنق يميل على الجسم بزاوية تقارب 135 درجة، وهذا يزيد مدى حركة مفصل الورك."}, {"q_en": "What does the angle of the femoral neck allow?", "q_ar": "ما فائدة زاوية ميل عنق عظم الفخذ؟", "options": [{"en": "Protection of the knee joint", "ar": "حماية مفصل الركبة"}, {"en": "Attachment of the gluteus maximus", "ar": "ارتكاز العضلة الألوية الكبرى"}, {"en": "Formation of the popliteal fossa", "ar": "تكوين الحفرة المأبضية"}, {"en": "Increased range of movement at the hip joint", "ar": "زيادة مدى الحركة في مفصل الورك"}], "answer": 3, "why": "المحاضرة: زاوية الميل هذه تسمح بزيادة مدى الحركة في مفصل الورك."}, {"q_en": "Which is the most lateral palpable projection of bone of the proximal femur?", "q_ar": "ما أكثر بروز عظمي جانبي (وحشي) يمكن جسّه في الجزء القريب من عظم الفخذ؟", "options": [{"en": "Greater trochanter", "ar": "المدوّر الكبير"}, {"en": "Femoral head", "ar": "رأس الفخذ"}, {"en": "Lesser trochanter", "ar": "المدوّر الصغير"}, {"en": "Quadrate tubercle", "ar": "الحديبة المربعة"}], "answer": 0, "why": "المحاضرة: المدوّر الكبير هو أكثر بروز عظمي وحشي يمكن جسّه."}, {"q_en": "The lesser trochanter projects from which side of the femur?", "q_ar": "من أيّ جهة لعظم الفخذ يبرز المدوّر الصغير؟", "options": [{"en": "Anterolateral side", "ar": "الجهة الأمامية الوحشية"}, {"en": "Posteromedial side", "ar": "الجهة الخلفية الإنسية"}, {"en": "Lateral side of the condyles", "ar": "الجهة الوحشية للقمتين"}, {"en": "Superior side of the head", "ar": "الجهة العلوية للرأس"}], "answer": 1, "why": "المحاضرة: المدوّر الصغير يبرز من الجهة الخلفية الإنسية لعظم الفخذ، أسفل ملتقى العنق بالجسم مباشرةً."}, {"q_en": "Which ridge connects the two trochanters on the anterior surface of the femur?", "q_ar": "أيّ حرف عظمي يصل بين المدوّرين على السطح الأمامي لعظم الفخذ؟", "options": [{"en": "Intertrochanteric line", "ar": "الخط بين المدوّرين"}, {"en": "Intertrochanteric crest", "ar": "العرف بين المدوّرين"}, {"en": "Supracondylar line", "ar": "الخط فوق اللقمة"}, {"en": "Linea aspera", "ar": "الخط الخشن"}], "answer": 0, "why": "المحاضرة: الخط بين المدوّرين من الأمام، والعرف (المدوّري) من الخلف."}, {"q_en": "The quadrate tubercle, where quadratus femoris attaches, is found on the:", "q_ar": "الحديبة المربعة (مرتكز العضلة المربعة الفخذية) توجد على:", "options": [{"en": "Intertrochanteric line", "ar": "الخط بين المدوّرين"}, {"en": "Femoral head", "ar": "رأس الفخذ"}, {"en": "Medial condyle", "ar": "اللقمة الإنسية"}, {"en": "Intertrochanteric crest", "ar": "العرف بين المدوّرين"}], "answer": 3, "why": "المحاضرة: في النصف العلوي من العرف بين المدوّرين حديبة مستديرة هي الحديبة المربعة، ترتكز عليها العضلة المربعة الفخذية."}, {"q_en": "After the intertrochanteric line passes the lesser trochanter on the posterior surface, it is known as the:", "q_ar": "بعد أن يتجاوز الخط بين المدوّرين المدوّرَ الصغير على السطح الخلفي يُسمّى:", "options": [{"en": "Gluteal tuberosity", "ar": "الحدبة الألوية"}, {"en": "Adductor tubercle", "ar": "الحديبة المقرِّبة"}, {"en": "Pectineal line", "ar": "الخط المشطي"}, {"en": "Soleal line", "ar": "الخط النعلي"}], "answer": 2, "why": "المحاضرة:  years", "ar": "نحو 18 سنة"}], "answer": 1, "why": "ملاحظات الأستاذ على الصورة: مركز النهاية البعيدة يظهر بالأسبوع 36 من الحمل ومركز الرأس بعمر سنة، فالعمر من الولادة إلى نحو 6 أشهر."}, {"q_en": "Which of the following is a type of femoral neck fracture?", "q_ar": "أيّ ممّا يأتي نوع من كسور عنق عظم الفخذ؟", "options": [{"en": "Subtrochanteric fracture", "ar": "كسر تحت المدوّرين"}, {"en": "Subcapital fracture", "ar": "كسر تحت الرأس"}, {"en": "Hoffa fracture", "ar": "كسر هوفا"}, {"en": "Segmental fracture", "ar": "كسر قِطعي"}], "answer": 1, "why": "المحاضرة: كسر عنق الفخذ (تحت الرأس، وعبر العنق)، ثم الكسر بين المدوّرين، والكسر تحت المدوّرين."}, {"q_en": "In a sub-capital hip fracture on the frontal view, the abnormal overlapping of the femoral head and neck is due to:", "q_ar": "في كسر الورك تحت الرأس، التراكب غير الطبيعي لرأس الفخذ وعنقه في المنظر الأمامي سببه:", "options": [{"en": "Dislocation of the hip", "ar": "خلع الورك"}, {"en": "Enchondroma", "ar": "الورم الغضروفي"}, {"en": "Impaction", "ar": "الانحشار"}, {"en": "Open fracture", "ar": "الكسر المفتوح"}], "answer": 2, "why": "المحاضرة: تراكب غير طبيعي لرأس الفخذ وعنقه (الأسهم البيضاء) بسبب الانحشار."}, {"q_en": "In which fracture is the break a straight horizontal line going across the femoral shaft?", "q_ar": "في أيّ كسر يكون خط الكسر أفقياً مستقيماً يعبر جسم عظم الفخذ؟", "options": [{"en": "Transverse fracture", "ar": "الكسر المستعرض"}, {"en": "Comminuted fracture", "ar": "الكسر المفتّت"}, {"en": "Spiral fracture", "ar": "الكسر الحلزوني"}, {"en": "Oblique fracture", "ar": "الكسر المائل"}], "answer": 0, "why": "المحاضرة: الكسر المستعرض خطه أفقي مستقيم يعبر الجسم."}, {"q_en": "A twisting force to the thigh causes which type of fracture?", "q_ar": "قوة التواء على الفخذ تسبّب أيّ نوع من الكسور؟", "options": [{"en": "Segmental fracture", "ar": "الكسر القِطعي"}, {"en": "Transverse fracture", "ar": "الكسر المستعرض"}, {"en": "Open fracture", "ar": "الكسر المفتوح"}, {"en": "Spiral fracture", "ar": "الكسر الحلزوني"}], "a بسيط (A)"}, {"en": "Simple oblique fracture (C)", "ar": "الكسر المائل البسيط (C)"}], "answer": 0, "why": "المحاضرة: النوع E كسر حلزوني مع إسفين انثناء (قطعة الفراشة)."}, {"q_en": "Type A distal femoral fractures are:", "q_ar": "كسور الجزء البعيد من عظم الفخذ من النوع A هي:", "options": [{"en": "Partial articular", "ar": "مفصلية جزئية"}, {"en": "Femoral neck fractures", "ar": "كسور عنق الفخذ"}, {"en": "Intra-articular", "ar": "داخل المفصل"}, {"en": "Extra-articular", "ar": "خارج المفصل"}], "answer": 3, "why": "المحاضرة: النوع A خارج المفصل، والنوع B مفصلي جزئي، والنوع C داخل المفصل."}, {"q_en": "Which distal femoral fracture is known as the Hoffa type?", "q_ar": "أيّ كسر في الجزء البعيد من عظم الفخذ يُعرف بنوع هوفا؟", "options": [{"en": "B3 – frontal or coronal condyle fracture", "ar": "B3: كسر اللقمة في المستوى الجبهي أو الإكليلي"}, {"en": "A2 – metaphyseal butterfly", "ar": "A2: فراشة الكردوس"}, {"en": "A1 – simple or two-part", "ar": "A1: بسيط أو من جزأين"}, {"en": "C3 – comminuted articular", "ar": "C3: مفصلي مفتّت"}], "answer": 0, "why": "المحاضرة: النوع B3 أيّ كسر جبهي أو إكليلي في اللقمة (نوع هوفا)."}, {"q_en": "Type C distal femoral fractures are:", "q_ar": "كسور الجزء البعيد من عظم الفخذ من النوع C هي:", "options": [{"en": "Shaft fractures", "ar": "كسور الجسم"}, {"en": "Intra-articular", "ar": "داخل المفصل"}, {"en": "Partial articular", "ar": "مفصلية جزئية"}, {"en": "Extra-articular", "ar": "خارج المفصل"}], "answer": 1, "why": "المحاضرة: النوع C داخل المفصل (C1 انشقاق بسيط أو شكل Y، وC2، وC3 مفتّت)."}, {"q_en": "In the lecture’s case, the distal femoral fracture was fixed after closed reduction using:", "q_ar": "في حالة المحاضرة، ثُبّت كسر الفخذ البعيد بعد الردّ المغلق باستعمال:", "options": [{"en": "Plaster cast only", "ar": "جبيرة فقط"}, {"en": "Hip replacement", "ar": "استبدال مفصل الورك"}, {"en": "Retrograde intramedullary nail", "ar": "مسمار نقوي راجع"}, {"en": "External fixator", "ar": "مثبّت خارجي"}], "answer": 2, "why": "المحاضرة: الصورتان (C) و(D) بعد الردّ المغلق والتثبيت بمسمار نقوي راجع (يُدخَل من جهة الركبة)."}]}</script>
