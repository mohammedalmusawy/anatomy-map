أي عظم رصغي هو الأكثر وحشية في الصف البعيد، بجانب العظم الإسفيني الوحشي؟", "options": [{"en": "Cuboid", "ar": "النردي"}, {"en": "Navicular", "ar": "الزورقي"}, {"en": "Talus", "ar": "الكاحل"}, {"en": "Medial cuneiform", "ar": "الإسفيني الإنسي"}], "answer": 0, "why": "المحاضرة: النردي (Cuboid) أكثر عظام الصف البعيد للرصغ وحشيةً، ويظهر في المنظر المائل مع الإسفيني الوحشي والمشطين الرابع والخامس.", "kind": "apply", "perr": null}, {"q_en": "A runner has foot pain without any injury, and the X-ray shows an incomplete fracture of the 2nd metatarsal neck. The most likely mechanism is:", "q_ar": "عدّاء يشكو ألماً في القدم بلا إصابة، والصورة تُظهر كسراً غير كامل في عنق المشط الثاني. الآلية الأرجح هي:", "options": [{"en": "Direct blow from a heavy object", "ar": "ضربة مباشرة من جسم ثقيل"}, {"en": "Stress fracture from repeated stress", "ar": "كسر إجهادي من الإجهاد المتكرر"}, {"en": "Inversion injury with avulsion", "ar": "إصابة انقلاب مع اقتلاع"}, {"en": "Axial loading from a fall from height", "ar": "تحميل محوري من سقوط من مكان مرتفع"}], "answer": 1, "why": "المحاضرة: Stress fracture كسر غير كامل من إجهاد متكرر، شائع عند الرياضيين، ويصيب غالباً عنق المشطين الثاني والثالث.", "kind": "apply", "perr": null}, {"q_en": "On the lateral foot X-ray of a 7-year-old, the back of the calcaneus has a separate, irregular-looking bony part. How does the lecture explain this?", "q_ar": "في صورة جانبية لقدم طفل عمره 7 سنوات، يظهر في مؤخرة العقب جزء عظمي منفصل غير منتظم الشكل. كيف تفسّر المحاضرة ذلك؟", "options": [{"en": "A fracture from axial loading", "ar": "كسر بسبب التحميل المحوري"}, {"en": "A normal secondary ossification centre", "ar": "مركز تعظّم ثانوي طبيعي"}, {"en": "A heel spur from plantar fascia strain", "ar": "شوكة عقب بسبب إجهاد اللفافة الأخمصية"}, {"en": "Bone death after loss of blood supply", "ar": "موت العظم بعد انقطاع التروية الدموية"}], "answer": 1, "why": "للعقب مركز تعظّم ثانوي يظهر نحو عمر 5 سنوات ويلتحم عند البلوغ، وقد يبدو غير منتظم لكنه طبيعي؛ فلا يُقرأ كسراً ولا شوكة عقب ولا نخراً.", "kind": "apply", "perr": null}, {"q_en": "A footprint shows the whole sole touching the ground, with no inner curve on the medial side. This matches:", "q_ar": "أثر قدم يُظهر باطن القدم كله ملامساً للأرض، بلا انحناء داخلي في الجهة الإنسية. هذا يوافق:", "options": [{"en": "A normal arch", "ar": "قوساً طبيعياً"}, {"en": "A high arch (hollow foot)", "ar": "قوساً مرتفعاً (القدم المجوّفة)"}, {"en": "A flat foot (fallen arch)", "ar": "القدم المسطّحة (القوس الهابط)"}, {"en": "A normal transverse arch only", "ar": "قوساً مستعرضاً طبيعياً فقط"}], "answer": 2, "why": "القوس الطولي أوضح في الجهة الإنسية، فإذا لامس الأثر الأرض كاملاً بلا انحناء إنسي فهذا يوافق القدم المسطّحة (القوس الهابط) كما في صور المحاضرة.", "kind": "apply", "perr": null}, {"q_en": "On the lateral foot X-ray of a 3-year-old, the talus is steeper than in an adult, and a line along it passes beneath the first metatarsal instead of through it. How should this be read?", "q_ar": "في صورة جانبية لقدم طفل عمره 3 سنوات، يبدو عظم الكاحل أشدّ ميلاً منه عند البالغ، والخط المرسوم على امتداده يمرّ تحت المشط الأول لا عبره. كيف تُقرأ هذه الصورة؟", "options": [{"en": "As expected for a child under 5 years", "ar": "متوقّع لطفل عمره أقل من 5 سنوات"}, {"en": "As a fracture of the talus neck", "ar": "كسر في عنق عظم الكاحل"}, {"en": "As a high (hollow) arch deformity", "ar": "تشوّه القوس المرتفع (القدم المجوّفة)"}, {"en": "As abnormal at any age", "ar": "غير طبيعي في أي عمر"}], "answer": 0, "why": "في الأطفال الأصغر من 5 سنوات يكون عظم الكاحل أكثر عمودية ويتجه محوره أسفل المشط الأول، وبعد عمر 5 سنوات يصطف مع المشط الأول.", "kind": "apply", "perr": null}, {"q_en": "A patient with chronic plantar fascia strain has heel pain. The lateral X-ray shows a bony growth on the underside of the calcaneus. What is it?", "q_ar": "مريض لديه إجهاد مزمن في اللفافة الأخمصية ويشكو ألم العقب. تُظهر الصورة الجانبية نتوءاً عظمياً على السطح السفلي للعقب. ما هو؟", "options": [{"en": "Calcaneal tuberosity", "ar": "حدبة العقب"}, {"en": "Sesamoid bone", "ar": "عظم سمسماني"}, {"en": "Sinus tarsi", "ar": "الجيب الرصغي"}, {"en": "Heel spur (plantar spur)", "ar": "شوكة العقب (الشوكة الأخمصية)"}], "answer": 3, "why": "شوكات العقب نتوءات عظمية على السطح السفلي لعظم العقب، وسببها غالباً الإجهاد أو الالتهاب المزمن في اللفافة الأخمصية.", "kind": "apply", "perr": null}, {"q_en": "A young man jumped from a first-floor balcony and landed on his feet. The X-ray shows a fracture through the body of the talus, not the neck. Which mechanism does the lecture link to this type of talus fracture?", "q_ar": "قفز شاب من شرفة الطابق الأول وهبط على قدميه، وتُظهر الصورة كسراً في جسم عظم الكاحل لا في عنقه. أيّ آلية تربطها المحاضرة بهذا النوع من كسور الكاحل؟", "options": [{"en": "Forced dorsiflexion against a pedal", "ar": "الثني الظهري القسري على الدوّاسة"}, {"en": "A violent inward twist on landing", "ar": "التواء عنيف للقدم إلى الداخل عند الهبوط"}, {"en": "Falling or jumping from a height", "ar": "السقوط أو القفز من مكان مرتفع"}, {"en": "Repeated stress without injury", "ar": "إجهاد متكرر بلا إصابة"}], "answer": 2, "why": "المحاضرة: كسر جسم عظم الكاحل يحدث غالباً من السقوط أو القفز من مكان مرتفع، أما كسر العنق (الأشيع) فيحدث مع الثني الظهري القسري عالي الطاقة؛ والالتواء للداخل والإجهاد المتكرر آليتا كسور الأمشاط.", "kind": "apply", "perr": null}, {"q_en": "Months after a comminuted calcaneus fracture, the subtalar joint has been assessed. According to the lecture, which other joint should also be checked on the follow-up images?", "q_ar": "بعد أشهر من كسر متفتّت في عظم العقب، قُيّم المفصل تحت الكاحل. بحسب المحاضرة، أيّ مفصل آخر يجب فحصه أيضاً في صور المتابعة؟", "options": [{"en": "The calcaneocuboid joint", "ar": "المفصل العقبي النردي"}, {"en": "The first metatarsophalangeal joint", "ar": "المفصل المشطي السلامي الأول"}, {"en": "The sacroiliac joint", "ar": "المفصل العجزي الحرقفي"}, {"en": "The interphalangeal joints", "ar": "المفاصل بين السلاميات"}], "answer": 0, "why": "المحاضرة: من مضاعفات كسر العقب تضرّر المفصل تحت الكاحل (التهاب مفصل وألم مع الحركة الجانبية)، وقد يتأثر المفصل العقبي النردي أيضاً لأنه يقع على الحافة الأمامية للعقب.", "kind": "apply", "perr": null}, {"q_en": "A driver's foot was forced upward (dorsiflexed) against the pedal in a high-energy crash. Which fracture is most likely?", "q_ar": "في حادث سير عالي الطاقة انثنت قدم السائق بقوة إلى الأعلى (الثني الظهري) على الدوّاسة. أيّ كسر هو الأرجح؟", "options": [{"en": "Stress fracture of the 2nd metatarsal", "ar": "كسر إجهاد في المشط الثاني"}, {"en": "Avulsion of the base of the 5th metatarsal", "ar": "اقتلاع قاعدة المشط الخامس"}, {"en": "Fracture of the talus neck", "ar": "كسر عنق عظم الكاحل"}, {"en": "Fracture of the cuboid", "ar": "كسر العظم النردي"}], "answer": 2, "why": "كسر عظم الكاحل غالباً إصابة عالية الطاقة عند الثني الظهري القسري للقدم، وأكثر مواضعه العنق (نحو 50%).", "kind": "apply", "perr": null}, {"q_en": "A talus fracture is seen on plain films, but the surgeon cannot decide on treatment until he knows whether it is comminuted, reaches the dome, or is displaced. Which imaging should be requested next, based on the lecture?", "q_ar": "ظهر كسر في عظم الكاحل بالصور البسيطة، لكن الجرّاح لا يستطيع اختيار العلاج حتى يعرف هل الكسر متفتّت، وهل يصل إلى القبّة، وهل القطع مزاحة. أيّ تصوير يُطلب بعد ذلك بحسب المحاضرة؟", "options": [{"en": "A repeat lateral weight-bearing film", "ar": "إعادة الصورة الجانبية بوضع حمل الوزن"}, {"en": "A heel pad thickness measurement", "ar": "قياس سُمك وسادة العقب"}, {"en": "An ultrasound of the plantar fascia", "ar": "سونار للّفافة الأخمصية"}, {"en": "A transverse CT of the injured talus", "ar": "مقطع مفراس مستعرض لعظم الكاحل المصاب"}], "answer": 3, "why": "في المحاضرة، مقطع المفراس المستعرض لعظم الكاحل المصاب هو الذي بيّن أن الكسر متفتّت ويمتد عبر القبّة بلا إزاحة كبيرة للقطع، وهي التفاصيل اللازمة لقرار العلاج.", "kind": "apply", "perr": null}, {"q_en": "A worker fell from a ladder and landed on his heels. The calcaneus looks shorter and wider on the X-ray. Which additional reques , "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}, "perr": null}, {"q_en": "The arrow on the left radiograph points to a fracture. Which tarsal bone is fractured?", "q_ar": "السهم في الصورة اليسرى يشير إلى كسر. أيّ عظم من عظام الرصغ هو المكسور؟", "options": [{"en": "Calcaneus", "ar": "العقب"}, {"en": "Talus", "ar": "عظم الكاحل"}, {"en": "Navicular", "ar": "الزورقي"}, {"en": "Cuboid", "ar": "النردي"}], "answer": 1, "why": "شرح الصورة في المحاضرة: الصورة اليسرى تُظهر كسراً في عظم الكاحل، وهو العظم الواقع بين الظنبوب والعقب، واليمنى تُظهره مثبّتاً بمسامير.", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t04/anatomy-t04-f51119.jpg", "alt_ar": "يساراً: صورة جانبية للكاحل والقدم فيها سهم على كسر؛ يميناً: الكسر نفسه مثبّت بمسامير", "alt_en": "Left: lateral ankle and foot radiograph with an arrow on a fracture; right: the same fracture fixed with screws", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}, "perr": null}, {"q_en": "The curve marked on this lateral foot radiograph is the longitudinal arch. Its medial part is formed by the calcaneus, talus, three cuneiforms and:", "q_ar": "المنحنى المعلَّم في هذه الصورة الجانبية للقدم هو القوس الطولي. جزؤه الإنسي يتكوّن من العقب وعظم الكاحل والإسفينيات الثلاثة و:", "options": [{"en": "The first three metatarsals", "ar": "الأمشاط الثلاثة الأولى"}, {"en": "The 4th and 5th metatarsals", "ar": "المشطان الرابع والخامس"}, {"en": "All five metatarsals", "ar": "الأمشاط الخمسة كلها"}, {"en": "The cuboid and 1st metatarsal", "ar": "النردي والمشط الأول"}], "answer": 0, "why": "المحاضرة: القوس الإنسي يتكوّن من العقب وعظم الكاحل والإسفينيات الثلاثة والأمشاط الثلاثة الأولى، أما القوس الوحشي فمن العقب والنردي والمشطين الرابع والخامس.", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t04/anatomy-t04-b87290.jpg", "alt_ar": "صورة جانبية للقدم عليها منحنى معلَّم وتسميات عامة", "alt_en": "Lateral foot radiograph with a marked curve and general labels", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}, "perr document.addEventListener("DOMContentLoaded", () => {
  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)

  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");

  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {
    let b = h.querySelector(":scope > .nadd");   // ⚡ (30/10) الزر مرسوم بالـ HTML من البناء (بلا قفزة)؛ إذا مو موجود نسوّيه مثل قبل
    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "tnote"; b.textContent = "📝"; b.setAttribute("aria-label", "ملاحظة على المصطلح " + t);
    (pop.querySelector(".pb") || pop).appendChild(b);

      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق

    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
