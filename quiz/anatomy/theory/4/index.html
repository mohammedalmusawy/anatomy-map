<script type="application/json" id="quiz-data">{"subject": "تشريح", "slug": "تشريح", "type": "نظري", "num": 4, "title_ar": "عظام القدم: الرصغ والأمشاط والسلاميات", "title_en": "Anatomy and Radiology of the Foot: Tarsals, Metatarsals & Phalanges", "about": "عظام القدم (الرصغ والأمشاط والسلاميات) ومفاصلها وتعظّمها وأقواسها، ومظاهرها في الأشعة والمفراس والرنين، وكسور الكاحل والعقب والأمشاط.", "questions": [{"q_en": "How many tarsal bones are there in the foot?", "q_ar": "كم عدد عظام الرصغ في القدم؟", "options": [{"en": "Seven", "ar": "سبعة"}, {"en": "Five", "ar": "خمسة"}, {"en": "Eight", "ar": "ثمانية"}, {"en": "Fourteen", "ar": "أربعة عشر"}], "answer": 0, "why": "المحاضرة: عظام الرصغ مجموعة من سبعة عظام غير منتظمة الشكل. أما الخمسة فهي عدد الأمشاط."}, {"q_en": "How many phalanges does the big toe have?", "q_ar": "كم سلامية في الإصبع الكبير (الإبهام)؟", "options": [{"en": "One", "ar": "واحدة"}, {"en": "Two", "ar": "اثنتان"}, {"en": "Four", "ar": "أربع"}, {"en": "Three", "ar": "ثلاث"}], "answer": 1, "why": "كل إصبع له ثلاث سلاميات ما عدا الإبهام، فله سلاميتان فقط: قريبة وبعيدة."}, {"q_en": "The hindfoot consists of:", "q_ar": "يتكوّن مؤخّر القدم من:", "options": [{"en": "Tibia and fibula", "ar": "الظنبوب والشظية"}, {"en": "Navicular, cuboid and cuneiforms", "ar": "الزورقي والنردي والإسفينية"}, {"en": "Talus and calcaneus", "ar": "عظم الكاحل وعظم العقب"}, {"en": "Metatarsals and phalanges", "ar": "الأمشاط والسلاميات"}], "answer": 2, "why": "مؤخّر القدم = الكاحل والعقب، ومنتصفها = الزورقي والنردي والإسفينية، ومقدّمها = الأمشاط والسلاميات."}, {"q_en": "The navicular, cuboid and cuneiforms form the:", "q_ar": "العظم الزورقي والنردي والإسفينية تكوّن:", "options": [{"en": "Hindfoot", "ar": "مؤخّر القدم"}, {"en": "Forefoot", "ar": "مقدّم القدم"}, {"en": "Ankle joint", "ar": "مفصل الكاحل"}, {"en": "Midfoot", "ar": "منتصف القدم"}], "answer": 3, "why": "المحاضرة: منتصف القدم يتكوّن من الزورقي والنردي والإسفينية."}, {"q_en": "Which tarsal bone is the most superior and transmits the weight of the entire body to the foot?", "q_ar": "أي عظم رصغي هو الأعلى وينقل وزن الجسم كله إلى القدم؟", "options": [{"en": "Talus", "ar": "عظم الكاحل"}, {"en": "Navicular", "ar": "العظم الزورقي"}, {"en": "Cuboid", "ar": "العظم النردي"}, {"en": "Calcaneus", "ar": "عظم العقب"}], "answer": 0, "why": "عظم الكاحل أعلى عظام الرصغ وينقل وزن الجسم كله إلى القدم، أما العقب فهو الأكبر."}, {"q_en": "The subtalar joint is between the talus and the:", "q_ar": "المفصل تحت الكاحلي يقع بين عظم الكاحل و:", "options": [{"en": "Cuboid", "ar": "العظم النردي"}, {"en": "Calcaneus", "ar": "عظم العقب"}, {"en": "Medial cuneiform", "ar": "العظم الإسفيني الإنسي"}, {"en": "Tibia", "ar": "الظنبوب"}], "answer": 1, "why": "من الأسفل: المفصل تحت الكاحلي بين الكاحل والعقب. ومع الزورقي يكون المفصل الكاحلي الزورقي، ومع الظنبوب مفصل الكاحل."}, {"q_en": "The talonavicular joint is located on which side of the talus?", "q_ar": "في أي جهة من عظم الكاحل يقع المفصل الكاحلي الزورقي؟", "options": [{"en": "Superiorly", "ar": "من الأعلى"}, {"en": "Inferiorly", "ar": "من الأسفل"}, {"en": "Anteriorly", "ar": "من الأمام"}, {"en": "Posteriorly", "ar": "من الخلف"}], "answer": 2, "why": "مفاصل الكاحل: من الأعلى مفصل الكاحل، ومن الأسفل المفصل تحت الكاحلي، ومن الأمام المفصل الكاحلي الزورقي."}, {"q_en": "The largest tarsal bone is the:", "q_ar": "أكبر عظام الرصغ هو:", "options": [{"en": "Cuboid", "ar": "العظم النردي"}, {"en": "Medial cuneiform", "ar": "الإسفيني الإنسي"}, {"en": "Talus", "ar": "عظم الكاحل"}, {"en": "Calcaneus", "ar": "عظم العقب"}], "answer": 3, "why": "المحاضرة: عظم العقب أكبر عظام الرصغ، ويقع تحت عظم الكاحل ويكوّن العقب."}, {"q_en": "The Achilles tendon attaches to the:", "q_ar": "يرتكز وتر العرقوب (وتر أخيل) على:", "options": [{"en": "Calcaneal tuberosity", "ar": "حدبة العقب"}, {"en": "Medial cuneiform", "ar": "الإسفيني الإنسي"}, {"en": "Navicular tuberosity", "ar": "حدبة العظم الزورقي"}, {"en": "Base of the 5th metatarsal", "ar": "قاعدة المشط الخامس"}], "answer": 0, "why": "الجانب الخلفي لعظم العقب فيه حدبة العقب، وعليها يرتكز وتر العرقوب."}, {"q_en": "Heel spurs are usually caused by:", "q_ar": "سبب شوكة العقب عادةً:", "options": [{"en": "A heavy object falling on the foot", "ar": "سقوط جسم ثقيل على القدم"}, {"en": "Chronic strain or inflammation of the plantar fascia", "ar": "الإجهاد المزمن أو التهاب اللفافة الأخمصية"}, {"en": "Disrupted blood supply of the talus after a neck fracture", "ar": "انقطاع التروية الدموية للكاحل بعد كسر عنقه"}, {"en": "Multiple ossification centers", "ar": "تعدّد مراكز التعظّم"}], "answer": 1, "why": "شوكة العقب نموّات عظمية تحت العقب، سببها عادةً الإجهاد المزمن أو التهاب اللفافة الأخمصية."}, {"q_en": "The intermediate row of the tarsal bones contains:", "q_ar": "الصف المتوسط من عظام الرصغ يحتوي على:", "options": [{"en": "The talus and calcaneus", "ar": "الكاحل والعقب"}, {"en": "The three cuneiforms only", "ar": "الإسفينية الثلاثة فقط"}, {"en": "The navicular only", "ar": "العظم الزورقي فقط"}, {"en": "The cuboid and three cuneiforms", "ar": "النردي والإسفينية الثلاثة"}], "answer": 2, "why": "الصف المتوسط فيه عظم واحد هو الزورقي، والصف البعيد فيه النردي والإسفينية الثلاثة."}, {"q_en": "The navicular bone is named so because it is shaped like a:", "q_ar": "سُمّي العظم الزورقي بهذا الاسم لأنه على شكل:", "options": [{"en": "Sesame seed", "ar": "بذرة سمسم"}, {"en": "Cube", "ar": "مكعّب"}, {"en": "Wedge", "ar": "إسفين"}, {"en": "Boat", "ar": "زورق"}], "answer": 3, "why": "المحاضرة: سُمّي الزورقي لأنه على شكل زورق. المكعّب للنردي، والإسفين للإسفينية."}, {"q_en": "The most lateral bone of the distal tarsal row is the:", "q_ar": "العظم الأبعد في الجهة الوحشية من الصف البعيد لعظام الرصغ هو:", "options": [{"en": "Cuboid", "ar": "العظم النردي"}, {"en": "Lateral cuneiform", "ar": "الإسفيني الوحشي"}, {"en": "Navicular", "ar": "العظم الزورقي"}, {"en": "Medial cuneiform", "ar": "الإسفيني الإنسي"}], "answer": 0, "why": "النردي هو الأبعد وحشياً، يقع أمام العقب وخلف المشطين الرابع والخامس."}, {"q_en": "The groove on the plantar surface of the cuboid is for the tendon of:", "q_ar": "الأخدود على السطح الأخمصي للعظم النردي هو لوتر:", "options": [{"en": "Flexor hallucis brevis", "ar": "العضلة القابضة القصيرة لإبهام القدم"}, {"en": "Fibularis longus", "ar": "العضلة الشظوية الطويلة"}, {"en": "Achilles", "ar": "وتر العرقوب"}, {"en": "Tibialis anterior", "ar": "العضلة الظنبوبية الأمامية"}], "answer": 1, "why": "المحاضرة: السطح السفلي للنردي فيه أخدود لوتر العضلة الشظوية الطويلة."}, {"q_en": "The shape of the cuneiform bones helps form the:", "q_ar": "شكل العظام الإسفينية يساعد على تكوين:", "options": [{"en": "Heel", "ar": "العقب"}, {"en": "Lateral longitudinal arch", "ar": "القوس الطولي الوحشي"}, {"en": "Transverse arch across the foot", "ar": "القوس المستعرض عبر القدم"}, {"en": "Ankle joint", "ar": "مفصل الكاحل"}], "answer": 2, "why": "العظام الإسفينية على شكل إسفين، وشكلها يساعد على تكوين القوس المستعرض عبر القدم."}, {"q_en": "Flexor hallucis brevis attaches to the:", "q_ar": "العضلة القابضة القصيرة لإبهام القدم ترتكز على:", "options": [{"en": "Medial cuneiform", "ar": "الإسفيني الإنسي"}, {"en": "Cuboid", "ar": "العظم النردي"}, {"en": "Navicular", "ar": "العظم الزورقي"}, {"en": "Lateral cuneiform", "ar": "الإسفيني الوحشي"}], "answer": 3, "why": "المحاضرة: الإسفيني الوحشي ترتكز عليه القابضة القصيرة لإبهام القدم، والإسفيني الإنسي ترتكز عليه الظنبوبية الأمامية والشظوية الطويلة."}, {"q_en": "The metatarsals are numbered I–V from:", "q_ar": "تُرقَّم الأمشاط من I إلى V من:", "options": [{"en": "Medial to lateral", "ar": "الإنسي إلى الوحشي"}, {"en": "Distal to proximal", "ar": "البعيد إلى القريب"}, {"en": "Proximal to distal", "ar": "القريب إلى البعيد"}, {"en": "Lateral to medial", "ar": "الوحشي إلى الإنسي"}], "answer": 0, "why": "المحاضرة: الأمشاط مرقّمة I–V من الإنسي إلى الوحشي، فالمشط الأول في جهة الإبهام."}, {"q_en": "The joint between the metatarsal head and the proximal phalanx is the:", "q_ar": "المفصل بين رأس المشط والسلامية القريبة هو:", "options": [{"en": "Calcaneocuboid joint", "ar": "المفصل العقبي النردي"}, {  measured on a lateral X-ray. This measurement is:", "q_ar": "بعد سقوط من مكان مرتفع، تُقاس على صورة جانبية الزاوية بين خطين على السطح العلوي للعقب. هذا القياس هو:", "options": [{"en": "Heel pad thickness", "ar": "سُمك وسادة الكعب"}, {"en": "Talus alignment axis", "ar": "محور اصطفاف الكاحل"}, {"en": "Böhler's angle", "ar": "زاوية بولر"}, {"en": "Subpubic (pubic arch) angle", "ar": "الزاوية تحت العانة (القوس العاني)"}], "answer": 2, "why": "المحاضرة: زاوية بولر تتكوّن بين خطين على السطح العلوي للعقب وتُرسم على الصورة الجانبية؛ والسقوط من مكان مرتفع (تحميل محوري) هو الآلية المعتادة لكسر العقب.", "kind": "apply"}, {"q_en": "Which radiographic view of the adult foot shows the sinus tarsi and, when taken erect, the longitudinal arch?", "q_ar": "أي منظر شعاعي لقدم البالغ يُظهر الجيب الرصغي، ويُظهر القوس الطولي عند أخذه واقفاً؟", "options": [{"en": "AP (dorsoplantar) view", "ar": "المنظر الأمامي الخلفي (الظهري الأخمصي)"}, {"en": "Oblique view of the foot", "ar": "المنظر المائل للقدم"}, {"en": "Mortise view of the ankle", "ar": "منظر النقرة للكاحل"}, {"en": "Lateral view", "ar": "المنظر الجانبي"}], "answer": 3, "why": "المحاضرة: المنظر الجانبي للقدم يُظهر الجيب الرصغي (sinus tarsi)، والمنظر الجانبي الحامل للوزن (واقفاً) يُظهر القوس الطولي.", "kind": "apply"}, {"q_en": "On an oblique foot radiograph, which tarsal bone is the most lateral bone of the distal row, next to the lateral cuneiform?", "q_ar": "في صورة القدم المائلة، أي عظم رصغي هو الأكثر وحشية في الصف البعيد، بجانب العظم الإسفيني الوحشي؟", "options": [{"en": "Cuboid", "ar": "النردي"}, {"en": "Navicular", "ar": "الزورقي"}, {"en": "Talus", "ar": "الكاحل"}, {"en": "Medial cuneiform", "ar": "الإسفيني الإنسي"}], "answer": 0, "why": "المحاضرة: النردي (Cuboid) أكثر عظام الصف البعيد للرصغ وحشيةً، ويظهر في المنظر المائل مع الإسفيني الوحشي والمشطين الرابع والخامس.", "kind": "apply"}, {"q_en": "A runner has foot pain without any injury, and the X-ray shows an incomplete fracture of the 2nd metatarsal neck. The most likely mechanism is:", "q_ar": "عدّاء يشكو ألماً في القدم بلا إصابة، والصورة تُظهر كسراً غير كامل في عنق المشط الثاني. الآلية الأرجح هي:", "options": [{"en": "Direct blow from a heavy object", "ar": "ضربة مباشرة من جسم ثقيل"}, {"en": "Stress fracture from repeated stress", "ar": "كسر إجهادي من الإجهاد المتكرر"}, {"en": "Inversion injury with avulsion", "ar": "إصابة انقلاب مع اقتلاع"}, {"en": "Axial loading from a fall from height", "ar": "تحميل محوري من سقوط من مكان مرتفع"}], "answer": 1, "why": "المحاضرة: Stress fracture كسر غير كامل من إجهاد متكرر، شائع عند الرياضيين، ويصيب غالباً عنق المشطين الثاني والثالث.", "kind": "apply"}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/تشريح/نظري/م04 - عظام القدم: الرصغ والأمشاط والسلاميات"}</script>
