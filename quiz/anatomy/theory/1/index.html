لذكر فأضيق وأطول وأثقل، وقوسه أقل من 70°.", "kind": "apply"}, {"q_en": "On an axial CT at the level of the iliac wings, the joint seen between the sacrum and the ilium is the:", "q_ar": "في مقطع مفراس محوري بمستوى جناحي الحرقفة، المفصل الظاهر بين العجز والحرقفة هو:", "options": [{"en": "Pubic symphysis", "ar": "الارتفاق العاني"}, {"en": "Sacroiliac joint", "ar": "المفصل العجزي الحرقفي"}, {"en": "Hip joint", "ar": "مفصل الورك"}, {"en": "Sacrococcygeal joint", "ar": "المفصل العجزي العصعصي"}], "answer": 1, "why": "المحاضرة: صورة المفراس بمستوى جناحي الحرقفة تُظهر العجز والمفصل العجزي الحرقفي والحرقفة؛ والمفصل العجزي الحرقفي هو تمفصل الحرقفة مع العجز.", "kind": "apply"}, {"q_en": "On the pelvis radiograph of a 12-year-old, the ilium, pubis and ischium are still separate. What separates them?", "q_ar": "في صورة حوض لطفل عمره 12 سنة، الحرقفة والعانة والإسك ما زالت منفصلة. ما الذي يفصلها؟", "options": [{"en": "The pubic symphysis, which fuses at 15–17", "ar": "الارتفاق العاني الذي يلتحم في 15–17"}, {"en": "The sacroiliac joint cartilage before puberty", "ar": "غضروف المفصل العجزي الحرقفي قبل البلوغ"}, {"en": "The triradiate cartilage (not yet fused)", "ar": "الغضروف ثلاثي الشعب (لم يلتحم بعد)"}, {"en": "The articular cartilage of the acetabulum", "ar": "الغضروف المفصلي للحُقّ"}], "answer": 2, "why": "المحاضرة: قبل البلوغ يفصل الغضروف ثلاثي الشعب (triradiate cartilage) أجزاء عظم الورك الثلاثة، ولا يبدأ الالتحام إلا في عمر 15–17.", "kind": "apply"}, {"q_en": "On a lateral view of the lower spine, which bone is seen directly below the lumbar vertebrae, and which bone ends the column?", "q_ar": "في صورة جانبية لأسفل العمود الفقري، أيّ عظم يظهر مباشرة تحت الفقرات القطنية، وأيّ عظم ينتهي به العمود؟", "options": [{"en": "Coccyx, then sacrum", "ar": "العصعص، ثم العجز"}, {"en": "Sacrum, then coccyx", "ar": "العجز، ثم العصعص"}, {"en": "Ilium, then ischium", "ar": "الحرقفة، ثم الإسك"}, {"en": "Sacrum, then pubis", "ar": "العجز، ثم العانة"}], "answer": 1, "why": "العجز يقع أسفل الفقرات القطنية، والعصعص يقع تحت العجز وهو الجزء الأخير من العمود الفقري.", "kind": "apply"}, {"q_en": "A radiology report describes a fracture of the apex of the coccyx. On the lateral coccyx radiograph, where should you look for it?", "q_ar": "يصف تقرير شعاعي كسراً في قمّة العصعص. أين تبحث عنه في الصورة الجانبية للعصعص؟", "options": [{"en": "At the upper end, where it meets the sacrum", "ar": "في الطرف العلوي حيث يلتقي بالعجز"}, {"en": "At the small transverse process of Co1", "ar": "عند الناتئ المستعرض الصغير للفقرة Co1"}, {"en": "At the lowest tip of the vertebral column", "ar": "في الطرف السفلي الذي ينتهي به العمود الفقري"}, {"en": "At the cornua that meet the sacral cornua", "ar": "عند القرنين اللذين يلتقيان بالقرنين العجزيين"}], "answer": 2, "why": "المحاضرة: قمّة العصعص تقع في الأسفل وتكوّن نهاية العمود الفقري؛ أما الطرف العلوي الذي يتمفصل مع العجز فهو القاعدة، والقرنان العصعصيان يتمفصلان مع القرنين العجزيين.", "kind": "apply"}, {"q_en": "After a car crash, an AP pelvis shows the left femoral head lying outside its socket. Which joint is dislocated?", "q_ar": "بعد حادث سيارة، تُظهر صورة الحوض الأمامية الخلفية رأس الفخذ الأيسر خارج تجويفه. أيّ مفصل هو المخلوع؟", "options": [{"en": "The sacroiliac joint", "ar": "المفصل العجزي الحرقفي"}, {"en": "The pubic symphysis", "ar": "الارتفاق العاني"}, {"en": "The sacrococcygeal joint", "ar": "المفصل العجزي العصعصي"}, {"en": "The hip joint", "ar": "مفصل الورك"}], "answer": 3, "why": "المحاضرة: مفصل الورك هو تمفصل عظم الورك مع رأس الفخذ، إذ يستقر رأس الفخذ في الحُقّ؛ فخروج الرأس من تجويفه خلع في مفصل الورك. أما العجزي الحرقفي فبين العجز والحرقفة، والارتفاق بين عظمي الورك.", "kind": "apply"}, {"q_en": "A patient lies prone for a sacroiliac joint view, and the technologist follows the iliac crest backward to its end near the sacrum to place the centring point. Which landmark is reached?", "q_ar": "مريض منبطح لصورة المفصل العجزي الحرقفي، ويتتبّع التقني العرف الحرقفي إلى الخلف حتى نهايته قرب العجز ليضع نقطة التسديد. إلى أيّ معلم يصل؟", "options": [{"en": "Anterior superior iliac spine (ASIS)", "ar": "الشوكة الحرقفية الأمامية العلوية (ASIS)"}, {"en": "Posterior superior iliac spine (PSIS)", "ar": "الشوكة الحرقفية الخلفية العلوية (PSIS)"}, {"en": "Ischial spine", "ar": "الشوكة الإسكية"}, {"en": "Pubic tubercle", "ar": "الحديبة العانية"}], "answer": 1, "why": "المحاضرة: يمتد العرف الحرقفي من الشوكة الحرقفية الأمامية العلوية في الأمام إلى الشوكة الحرقفية الخلفية العلوية في الخلف؛ فنهايته الخلفية قرب العجز هي PSIS.", "kind": "apply"}, {"q_en": "An injury involves the convex outer surface of the iliac wing. Which muscles attach to this surface?", "q_ar": "إصابة تشمل السطح الخارجي المحدّب لجناح الحرقفة. أيّ العضلات ترتكز على هذا السطح؟", "options": [{"en": "The iliacus muscle", "ar": "العضلة الحرقفية"}, {"en": "The gluteal muscles", "ar": "العضلات الألوية"}, {"en": "The psoas major muscle", "ar": "العضلة القطنية الكبرى"}, {"en": "The adductor muscles", "ar": "العضلات المقرِّبة"}], "answer": 1, "why": "السطح الخارجي (الألوي) لجناح الحرقفة محدّب وترتكز عليه العضلات الألوية؛ أما السطح الداخلي فمقعّر ويكوّن الحفرة الحرقفية التي تنشأ منها العضلة الحرقفية، والقطنية الكبرى والمقرِّبة لا ترتكز على هذا السطح.", "kind": "apply"}, {"q_en": "A fracture of the superior pubic ramus may extend laterally into which part of the hip bone?", "q_ar": "كسر في الفرع العاني العلوي قد يمتد وحشياً إلى أيّ جزء من عظم الورك؟", "options": [{"en": "The sacroiliac joint", "ar": "المفصل العجزي الحرقفي"}, {"en": "The iliac crest", "ar": "العرف الحرقفي"}, {"en": "The acetabulum", "ar": "الحُقّ"}, {"en": "The ischial tuberosity", "ar": "الحدبة الإسكية"}], "answer": 2, "why": "يمتد الفرع العاني العلوي وحشياً من جسم العانة ليكوّن جزءاً من الحُقّ.", "kind": "apply"}, {"q_en": "A report describes a fracture of the ischial spine. Where on the AP pelvis radiograph should you look for it?", "q_ar": "يصف تقرير كسراً في الشوكة الإسكية. أين تبحث عنه في صورة الحوض الأمامية الخلفية؟", "options": [{"en": "Near the junction of the superior ischial ramus and body", "ar": "قرب ملتقى الفرع الإسكي العلوي بجسم الإسك"}, {"en": "At the lowest posterior part of the ischium", "ar": "في أسفل الجزء الخلفي من الإسك"}, {"en": "Along the thickened upper margin of the iliac wing", "ar": "على الحافة العلوية المتثخّنة لجناح الحرقفة"}, {"en": "In the midline where the pubic bodies meet", "ar": "في الخط الأوسط حيث يلتقي جسما العانة"}], "answer": 0, "why": "المحاضرة: الشوكة الإسكية نتوء عظمي خلفي إنسي قرب ملتقى الفرع العلوي بجسم الإسك؛ أما أسفل الجزء الخلفي فالحدبة الإسكية، والحافة العلوية لجناح الحرقفة العرف الحرقفي، والتقاء جسمي العانة الارتفاق العاني.", "kind": "apply"}, {"q_en": "A pelvic X-ray shows a fracture of the ischiopubic ramus. Which opening of the hip bone does this fracture line most likely border?", "q_ar": "تُظهر صورة الحوض كسراً في الفرع الإسكي العاني. أيّ فتحة في عظم الورك يُرجَّح أن يحدّها خط هذا الكسر؟", "options": [{"en": "The greater sciatic notch", "ar": "الثلمة الوركية الكبرى"}, {"en": "The obturator foramen", "ar": "الثقبة السدّادية"}, {"en": "The posterior sacral foramina", "ar": "الثقوب العجزية الخلفية"}, {"en": "The pelvic inlet", "ar": "مدخل الحوض"}], "answer": 1, "why": "المحاضرة: يلتقي الفرع الإسكي السفلي بالفرع العاني السفلي فيكوّنان الفرع الإسكي العاني الذي يحيط بجزء من الثقبة السدّادية؛ أما الثلمة الوركية الكبرى فعلى الوجه الخلفي للحرقفة.", "kind": "apply"}, {"q_en": "A pelvis radiograph shows a narrow pubic arch (less than 70°), a narrow greater sciatic notch and a rounder obturator foramen. These features suggest:", "q_ar": "تُظهر صورة حوض قوساً عانياً ضيقاً (أقل من 70 درجة)، وثلمة وركية كبرى ضيقة، وثقبة سدّادية أكثر استدارة. تشير هذه الصفات إلى:", "options": [{"en": "A male pelvis", "ar": "حوض ذكر"}, {"en": "A female pelvis", "ar": "حوض أنثى"}, {"en": "A child's pelvis before fusion", "ar": "حوض طفل قبل الالتحام"}, {"en": "A normal finding in any pelvis", "ar": "موجودة في أي حوض"}], "answer": 0, "why": "القوس العاني الضيق (أقل من 70°) والثلمة الوركية الأضيق والثقبة السدّادية الأكثر استدارة من صفات حوض الذكر.", "kind": "apply"}, {"q_en": "A patient fell hard onto his buttocks and has pain in the bone he sits on. Which structure should be checked, and at which axial CT level from the lecture does it appear?", "q_ar": "سقط مريض بقوة على مقعدته ويشكو ألماً في العظم الذي يجلس عليه. أيّ تركيب يجب فحصه، وفي أيّ مستوى من مقاطع المفراس المحورية في المحاضرة يظهر؟", "options": [{"en": "Ischial spine, at the iliac wings", "ar": "الشوكة الإسكية، بمستوى جناحي الحرقفة"}, {"en": "Coccyx, at the iliac wings", "ar": "العصعص، بمستوى جناحي الحرقفة"}, {"en": "Ischial tuberosity, at the pubic symphysis", "ar": "الحدبة الإسكية، بمستوى الارتفاق العاني"}, {"en": "Iliac crest, at the hip joints", "ar": "العرف الحرقفي، بمستوى مفصلي الورك"}], "answer": 2, "why": "المحاضرة: الجزء الخلفي السفلي من الإسك يكوّن الحدبتين الإسكيتين، وعليهما يقع وزن الجسم عند الجلوس؛ وشرح صور المفراس يذكر الحدبة الإسكية في المقطع المحوري بمستوى الارتفاق العاني.", "kind": "apply"}, {"q_en": "On this numbered AP pelvis radiograph, which structure carries the number 16?", "q_ar": "في هذه الصورة الشعاعية الأمامية الخلفية المرقّمة للحوض، ما التركيب الذي يحمل الرقم 16؟", "options": [{"en": "Ischial spine", "ar": "الشوكة الإسكية"}, {"en": "Ischial tuberosity", "ar": "الحدبة الإسكية"}, {"en": "Inferior pubic ramus", "ar": "الفرع العاني السفلي"}, {"en": "Greater trochanter", "ar": "المدوّر الكبير"}], "answer": 1, "why": "مفتاح الأرقام في المحاضرة تحت هذه الصورة: الرقم 16 هو Ischial tuberosity (الحدبة الإسكية)، و14 هو الشوكة الإسكية، و18 الفرع العاني السفلي.", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t01/anatomy-t01-70712b.jpg", "alt_ar": "صورة شعاعية أمامية خلفية للحوض عليها أرقام من 1 إلى 28", "alt_en": "Numbered AP radiograph of the pelvis (1–28)", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "In the numbered AP pelvis radiograph, the midline joint marked 20 is the:", "q_ar": "في صورة الحوض الأمامية الخلفية المرقّمة، المفصل الواقع على الخط الأوسط والمعلَّم بالرقم 20 هو:", "options": [{"en": "Sacroiliac joint", "ar": "المفصل العجزي الحرقفي"}, {"en": "Hip joint", "ar": "مفصل الورك"}, {"en": "Sacrococcygeal joint", "ar": "المفصل العجزي العصعصي"}, {"en": "Pubic symphysis", "ar": "الارتفاق العاني"}], "answer": 3, "why": "حسب مفتاح الأرقام في المحاضرة: الرقم 20 هو Pubic symphysis (الارتفاق العاني)، أما المفصل العجزي الحرقفي فرقمه 6.", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t01/anatomy-t01-70712b.jpg", "alt_ar": "صورة شعاعية أمامية خلفية للحوض عليها أرقام من 1 إلى 28", "alt_en": "Numbered AP radiograph of the pelvis (1–28)", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "On the numbered AP pelvis radiograph, which joint is marked 6?", "q_ar": "في صورة الحوض الأمامية الخلفية المرقّمة، أيّ مفصل يحمل الرقم 6؟", "options": [{"en": "Sacroiliac joint", "ar": "المفصل العجزي الحرقفي"}, {"en": "Pubic symphysis", "ar": "الارتفاق العاني"}, {"en": "Hip joint", "ar": "مفصل الورك"}, {"en": "Sacrococcygeal joint", "ar": "المفصل العجزي العصعصي"}], "answer": 0, "why": "مفتاح الأرقام في المحاضرة: الرقم 6 هو Sacroiliac joint (المفصل العجزي الحرقفي).", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t01/anatomy-t01-70712b.jpg", "alt_ar": "صورة شعاعية أمامية خلفية للحوض عليها أرقام من 1 إلى 28", "alt_en": "Numbered AP radiograph of the pelvis (1–28)", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "On this pelvic radiograph numbered 1–19, which structure is marked 16?", "q_ar": "في صورة الحوض المرقّمة من 1 إلى 19، ما التركيب المعلَّم بالرقم 16؟", "options": [{"en": "Lesser trochanter", "ar": "المدوّر الصغير"}, {"en": "Femoral neck", "ar": "عنق الفخذ"}, {"en": "Greater trochanter", "ar": "المدوّر الكبير"}, {"en": "Femoral head", "ar": "رأس الفخذ"}], "answer": 2, "why": "مفتاح هذه الصورة في المحاضرة: 15 المدوّر الصغير، و16 Greater trochanter (المدوّر الكبير)، و17 عنق الفخذ، و18 رأس الفخذ.", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t01/anatomy-t01-a3084d.jpg", "alt_ar": "صورة شعاعية للحوض عليها أرقام صفراء من 1 إلى 19", "alt_en": "Pelvic radiograph numbered 1–19", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "On the pelvic radiograph numbered 1–19, which structure is marked 3?", "q_ar": "في صورة الحوض المرقّمة من 1 إلى 19، ما التركيب المعلَّم بالرقم 3؟", "options": [{"en": "Obturator foramen", "ar": "الثقبة السدّادية"}, {"en": "Anterior sacral foramina", "ar": "الثقوب العجزية الأمامية"}, {"en": "Sacroiliac joint", "ar": "المفصل العجزي الحرقفي"}, {"en": "Acetabulum", "ar": "الحُقّ"}], "answer": 1, "why": "مفتاح الصورة في المحاضرة: الرقم 3 هو Anterior sacral foramina (الثقوب العجزية الأمامية).", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t01/anatomy-t01-a3084d.jpg", "alt_ar": "صورة شعاعية للحوض عليها أرقام صفراء من 1 إلى 19", "alt_en": "Pelvic radiograph numbered 1–19", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "Comparing these two pelvic radiographs, which feature of the female pelvis (left) is described in the lecture?", "q_ar": "بمقارنة صورتي الحوض الشعاعيتين، أيّ صفة لحوض الأنثى (اليسار) تذكرها المحاضرة؟", "options": [{"en": "Smaller, heart-shaped pelvic inlet", "ar": "مدخل حوض أصغر على شكل قلب"}, {"en": "Narrow pubic arch (less than 70°)", "ar": "قوس عاني ضيق (أقل من 70 درجة)"}, {"en": "Longer, narrower, more curved sacrum", "ar": "عجز أطول وأضيق وأكثر انحناءً"}, {"en": "Larger, round/oval pelvic inlet", "ar": "مدخل حوض أكبر دائري أو بيضوي"}], "answer": 3, "why": "المحاضرة: مدخل حوض الأنثى Larger, round/oval, more spacious، أما مدخل الذكر فأصغر وعلى شكل قلب، وقوسه العاني ضيق.", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t01/anatomy-t01-5018ac.jpg", "alt_ar": "صورتان شعاعيتان للحوض: أنثى يساراً وذكر يميناً", "alt_en": "Radiographs of a female pelvis (left) and a male pelvis (right)", "credit": "محاضرة الأستاذ (والمصدر المطبوع على الصورة: radiologypics.com)", "credit_en": "the lecture (source printed on the image: radiologypics.com)"}}, {"q_en": "This axial CT shows each femoral head sitting in its socket. According to the lecture, the body of which bone forms the roof of this socket?", "q_ar": "يُظهر هذا المقطع المحوري للمفراس رأس كل فخذ داخل تجويفه. بحسب المحاضرة، جسمُ أيّ عظم يكوّن سقف هذا التجويف؟", "options": [{"en": "Ischium", "ar": "الإسك"}, {"en": "Pubis", "ar": "العانة"}, {"en": "Ilium", "ar": "الحرقفة"}, {"en": "Sacrum", "ar": "العجز"}], "answer": 2, "why": "المحاضرة: جسم الحرقفة يكوّن الجزء العلوي من الحُقّ (سقف الحُقّ)، والحُقّ هو التجويف الذي يستقر فيه رأس الفخذ في هذا المقطع.", "kind": "image", "img": {"src": "assets/quiz-img/anatomy-t01/anatomy-t01-d079a5.jpg", "alt_ar": "مقطع مفراس محوري للحوض يظهر رأسي الفخذ وجداري الحُقّ", "alt_en": "Axial CT of the pelvis showing both femoral heads and the acetabular walls", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/تشريح/نظري/م01 - الحوض العظمي"}</script>

  const p0 = location.pathname.startsWith(rootP) ? location.pathname.slice(rootP.length) : location.pathname;
  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");
  const L = (() => { try { return JSON.parse(document.body.dataset.lecture || "null"); } catch (e) { return null; } })();
  if (/^(learn|quiz)\/[^/]+\/[^/]+\/\d+\/$/.test(rel) || /^atlas\/[^/]+\/[^/]+\/$/.test(rel))   // 📍 وين وصلت (نفس شكل tools.js)
    try { localStorage.setItem("t:last", JSON.stringify({ url: rel, title: (L && L.title) || document.title.split("—")[0].trim(), sub: L ? L.sub : "", tab: rel.startsWith("quiz") ? "quiz" : "read", t: Date.now() })); } catch (e) {}
  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {
    let b = h.querySelector(":scope > .nadd");   // ⚡ (30/10) الزر مرسوم بالـ HTML من البناء (بلا قفزة)؛ إذا مو موجود نسوّيه مثل قبل
    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "tnote"; b.textContent = "📝"; b.setAttribute("aria-label", "ملاحظة على المصطلح " + t);
    (pop.querySelector(".pb") || pop).appendChild(b);
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق
      if (!dock) { dock = document.createElement("div"); dock.className = "nqdock"; document.body.appendChild(dock); }
      const sec = document.querySelector(`.tm[data-k="${CSS.escape(k.k)}"]`);
      const ctx = Object.assign(Notes.context(sec) || {}, { kind: L ? "lecture" : "term", key: k.k, title: L ? L.title : t });
      Notes.quick(dock, { into: dock, ctx, links: [{ type: "term", key: k.k, title: t }], prefill: t + ": ", forId: "term:" + k.k, returnTo: document.querySelector(".tm.on") || sec });
    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
</script><!--/me-hook--><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../../../sw.js", { updateViaCache: "none" });</script></body></html>
