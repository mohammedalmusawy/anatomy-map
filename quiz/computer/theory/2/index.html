<script type="application/json" id="quiz-data">{"subject": "الحاسوب والذكاء الاصطناعي", "slug": "حاسوب", "type": "نظري", "num": 2, "title_ar": "الذكاء الاصطناعي في الهواتف الذكية", "title_en": "The Role of AI in Modern Smartphones", "about": "دور الذكاء الاصطناعي في الهواتف الذكية الحديثة: التصوير الحسابي، وإدارة الطاقة والأداء التكيفي، ووحدة المعالجة العصبية NPU ومقارنتها بـ CPU وGPU، والمساعدون الافتراضيون، وثورة الوكلاء الأذكياء المستقلين.", "questions": [{"q_en": "", "q_ar": "حسب المحاضرة، انتقلت الهواتف المحمولة من أدوات اتصال تقليدية إلى:", "options": [{"en": "", "ar": "منصات حوسبة إدراكية متكاملة"}, {"en": "", "ar": "أجهزة تنفذ برمجيات خطية ثابتة القواعد"}, {"en": "", "ar": "كاميرات DSLR احترافية"}, {"en": "", "ar": "خوادم سحابية"}], "answer": 0, "why": "«إلى منصات حوسبة إدراكية متكاملة تعتمد بشكل أساسي على خوارزميات الذكاء الاصطناعي (AI)»."}, {"q_en": "", "q_ar": "عند التصوير في مكان مظلم وخلفك إضاءة قوية، يقوم الهاتف بـ:", "options": [{"en": "", "ar": "تقليل إضاءة الشاشة"}, {"en": "", "ar": "دمج الإطارات"}, {"en": "", "ar": "قص الصورة"}, {"en": "", "ar": "التقاط إطار واحد بطيء فقط"}], "answer": 1, "why": "المثال الواقعي: «يقوم الهاتف بـ دمج الإطارات»: لقطة سريعة للشمس ولقطة بطيئة للوجه ثم يدمجهما."}, {"q_en": "", "q_ar": "في تقنية Advanced HDR، كم إطاراً يلتقط الهاتف خفيةً لدمجها؟", "options": [{"en": "", "ar": "إطار واحد حقيقي"}, {"en": "", "ar": "إطاران فقط"}, {"en": "", "ar": "من 3 إلى أكثر من 10 إطارات"}, {"en": "", "ar": "من 50 إلى 100 إطار"}], "answer": 2, "why": "«يلتقط الهاتف خفيةً من 3 إلى أكثر من 10 إطارات بسرعات غلق وتصحيحات إضاءة مختلفة»."}, {"q_en": "", "q_ar": "التقنية التي يتعرف فيها الذكاء الاصطناعي على عناصر الصورة (السماء، العشب، البشرة) ويعالج كل عنصر بشكل مستقل هي:", "options": [{"en": "", "ar": "التكبير الرقمي الفائق"}, {"en": "", "ar": "تقليل الضوضاء"}, {"en": "", "ar": "محاكاة العدسات الاحترافية"}, {"en": "", "ar": "الدمج الدلالي (Semantic Rendering)"}], "answer": 3, "why": "«الدمج الدلالي (Semantic Rendering): يتعرف الذكاء الاصطناعي على عناصر الصورة بشكل منفصل… يعالج كل عنصر بشكل مستقل»."}, {"q_en": "", "q_ar": "تأثير ضبابي (Blur) تدريجي على الخلفية يزداد كلما ابتعدت الأشياء عن نقطة التركيز يسمى:", "options": [{"en": "", "ar": "محاكاة العدسات الاحترافية (Bokeh Simulation)"}, {"en": "", "ar": "دمج الإطارات المتعددة"}, {"en": "", "ar": "التكبير الرقمي الفائق"}, {"en": "", "ar": "إعادة بناء الألوان المفقودة"}], "answer": 0, "why": "«محاكاة العدسات الاحترافية (Bokeh Simulation): يقوم المعالج بتطبيق تأثير ضبابي (Blur) تدريجي على الخلفية»."}, {"q_en": "", "q_ar": "حسب جدول المقارنة، آلية اللقطة في التصوير التقليدي هي:", "options": [{"en": "", "ar": "دمج إطارات متعددة"}, {"en": "", "ar": "إطار واحد حقيقي (Single Frame)"}, {"en": "", "ar": "تعديل فوري تلقائي"}, {"en": "", "ar": "معالجة في الخلفية"}], "answer": 1, "why": "في جدول المقارنة: آلية اللقطة في التقليدي «إطار واحد حقيقي (Single Frame)»، وفي الحسابي «دمج إطارات متعددة»."}, {"q_en": "", "q_ar": "في التكبير الرقمي الفائق، تستخدم ميزة Super Resolution خوارزميات الذكاء الاصطناعي لـ:", "options": [{"en": "", "ar": "ملء البكسلات المفقودة"}, {"en": "", "ar": "قص الصورة فقط"}, {"en": "", "ar": "تقليل الإضاءة"}, {"en": "", "ar": "دمج الإطارات المظلمة"}], "answer": 0, "why": "«بل تستخدم ميزة Super Resolution خوارزميات الذكاء الاصطناعي لملء البكسلات المفقودة وإعادة رسم الحواف والنصوص»."}, {"q_en": "", "q_ar": "في التخصيص التنبؤي للتطبيقات، إذا كنت تفتح تطبيق الخرائط دائماً الساعة 8 صباحاً، فإن النظام:", "options": [{"en": "", "ar": "يحذف التطبيق من الهاتف"}, {"en": "", "ar": "يحضّره في الذاكرة العشوائية (RAM) مسبقاً"}, {"en": "", "ar": "يضعه في وضع السبات العميق"}, {"en": "", "ar": "يرسله إلى الخوادم السحابية"}], "answer": 1, "why": "«يقوم النظام بتحضيره في الذاكرة العشوائية (RAM) مسبقاً ليعمل بسلاسة»."}, {"q_en": "", "q_ar": "في الشحن التكيفي، يشحن الهاتف سريعاً حتى نسبة معينة ثم يوقف الشحن مؤقتاً، وهذه النسبة هي:", "options": [{"en": "", "ar": "50%"}, {"en": "", "ar": "100%"}, {"en": "", "ar": "80%"}, {"en": "", "ar": "20%"}], "answer": 2, "why": "«سيقوم بشحن الهاتف سريعاً حتى 80%، ثم يوقف الشحن مؤقتاً، ولا يكمل الـ 20% المتبقية إلا قبيل استيقاظك»."}, {"q_en": "", "q_ar": "إذا كنت تقرأ مقالاً أو تتصفح بريدك، يوجه النظام هذه المهمة البسيطة إلى:", "options": [{"en": "", "ar": "الأنوية الفائقة الأداء"}, {"en": "", "ar": "معالج الرسوميات"}, {"en": "", "ar": "الخوادم السحابية"}, {"en": "", "ar": "الأنوية الموفرة للطاقة"}], "answer": 3, "why": "«توزيع المهام الذكي: إذا كنت تقرأ مقالاً أو تتصفح بريدك، يوجه النظام هذه المهمة البسيطة إلى الأنوية الموفرة للطاقة»."}, {"q_en": "", "q_ar": "خفض أداء المعالج بنسب غير ملحوظة للمستخدم للحفاظ على برودة الهاتف يسمى:", "options": [{"en": "", "ar": "Thermal Throttling"}, {"en": "", "ar": "Adaptive Charging"}, {"en": "", "ar": "Predictive Resource Allocation"}, {"en": "", "ar": "Semantic Rendering"}], "answer": 0, "why": "الإدارة الحرارية التكيفية: «فتقوم بخفض أداء المعالج بنسب غير ملحوظة للمستخدم (Thermal Throttling)»."}, {"q_en": "", "q_ar": "التقنية الأساسية التي تعتمدها أبل (iOS) في إدارة الطاقة حسب جدول الشركات هي:", "options": [{"en": "", "ar": "البطارية التكيفية"}, {"en": "", "ar": "المحرك العصبي (Neural Engine)"}, {"en": "", "ar": "معالجات Google Tensor"}, {"en": "", "ar": "وضع الخمول الصارم"}], "answer": 1, "why": "في جدول الشركات: أبل (iOS) ← المحرك العصبي (Neural Engine)، وسامسونج ← البطارية التكيفية، وجوجل ← Google Tensor."}, {"q_en": "", "q_ar": "صُممت معمارية وحدة المعالجة العصبية NPU هندسياً لتسريع:", "options": [{"en": "", "ar": "العمليات الحسابية المتسلسلة الخطية"}, {"en": "", "ar": "حساب فيزياء الألعاب"}, {"en": "", "ar": "ضرب المصفوفات الرياضية والجمع المتراكم (MAC Operations)"}, {"en": "", "ar": "رندرة الرسوميات ثلاثية الأبعاد فقط"}], "answer": 2, "why": "«مفهوم الـ NPU: هي وحدات معالجة مخصصة… لتسريع عمليات ضرب المصفوفات الرياضية والجمع المتراكم (MAC Operations)»."}, {"q_en": "", "q_ar": "الوحدة التي تُشبه «مجموعة مدربة من الرسامين ينجزون آلاف المهام البصرية البسيطة بالتوازي» هي:", "options": [{"en": "", "ar": "المعالج المركزي (CPU)"}, {"en": "", "ar": "وحدة المعالجة العصبية (NPU)"}, {"en": "", "ar": "الذاكرة العشوائية (RAM)"}, {"en": "", "ar": "معالج الرسوميات (GPU)"}], "answer": 3, "why": "في جدول المقارنة: وصف الـ GPU «مجموعة مدربة من الرسامين ينجزون آلاف المهام البصرية البسيطة بالتوازي»."}, {"q_en": "", "q_ar": "في مثال اللعبة الثقيلة، الوحدة التي دورها «المدير العام» وتتولى حساب فيزياء اللعبة هي:", "options": [{"en": "", "ar": "المعالج المركزي (CPU)"}, {"en": "", "ar": "معالج الرسوميات (GPU)"}, {"en": "", "ar": "وحدة المعالجة العصبية (NPU)"}, {"en": "", "ar": "المحرك العصبي"}], "answer": 0, "why": "«المعالج المركزي (CPU)… دوره: هو المدير العام. يتولى حساب فيزياء اللعبة»."}, {"q_en": "", "q_ar": "وحدة TOPS التي تُقاس بها قوة الـ NPU تعني:", "options": [{"en": "", "ar": "ألف عملية في الثانية"}, {"en": "", "ar": "تريليون عملية في الثانية"}, {"en": "", "ar": "عدد الأنوية في المعالج"}, {"en": "", "ar": "عدد الإطارات في الثانية"}], "answer": 1, "why": "«TOPS، وهي اختصار لـ (Trillions of Operations Per Second) أو تريليون عملية في الثانية»."}, {"q_en": "", "q_ar": "المرحلة التي تلتقط الموجات الصوتية وتصفيها من الضجيج ثم تحوّلها إلى سلاسل نصية رقمية هي:", "options": [{"en": "", "ar": "TTS"}, {"en": "", "ar": "NLU"}, {"en": "", "ar": "ASR"}, {"en": "", "ar": "NPU"}], "answer": 2, "why": "«التعرف التلقائي على الكلام ASR: التقاط الموجات الصوتية وتصفيتها من الضجيج، ثم تحويلها إلى سلاسل نصية رقمية»."}, {"q_en": "", "q_ar": "المرحلة التي وصفتها المحاضرة بأنها «نواة الذكاء» وتبحث عن النوايا والكيانات هي:", "options": [{"en": "", "ar": "التعرف التلقائي على الكلام"}, {"en": "", "ar": "تحويل النص إلى كلام"}, {"en": "", "ar": "التكبير الرقمي الفائق"}, {"en": "", "ar": "فهم اللغات الطبيعية (NLU)"}], "answer": 3, "why": "«فهم اللغات الطبيعية NLU: هذه هي نواة الذكاء؛ حيث تبحث الخوارزمية عن النوايا (Intents) والكيانات (Entities)»."}, {"q_en": "", "q_ar": "المساعد الافتراضي الذي فلسفته الهندسية «التركيز المطلق على الخصوصية والمعالجة المحلية» هو:", "options": [{"en": "", "ar": "Apple Siri"}, {"en": "", "ar": "Google Assistant"}, {"en": "", "ar": "Amazon Alexa"}, {"en": "", "ar": "Gemini Nano"}], "answer": 0, "why": "في جدول المساعدين: Apple Siri ← «التركيز المطلق على الخصوصية والمعالجة المحلية (On-Device)»."}, {"q_en": "", "q_ar": "الوكلاء الأذكياء المستقلون (AI Agents) ينقلوننا من مرحلة الذكاء الاصطناعي التوليدي إلى مرحلة:", "options": [{"en": "", "ar": "الذكاء الاصطناعي الضيق"}, {"en": "", "ar": "الذكاء الاصطناعي التنفيذي"}, {"en": "", "ar": "المساعد الصوتي التلقيني"}, {"en": "", "ar": "الحوسبة السحابية الكاملة"}], "answer": 1, "why": "«ننتقل الآن من مرحلة الذكاء الاصطناعي التوليدي… إلى مرحلة الذكاء الاصطناعي التنفيذي الذي يمكنه التصرف والقيام بمهام معقدة نيابة عنك»."}, {"q_en": "", "q_ar": "مع الوكيل المستقل (AI Agent)، بدلاً من إعطائه أوامر خطوة بخطوة، أنت تعطيه:", "options": [{"en": "", "ar": "أمراً واحداً لفتح تطبيق"}, {"en": "", "ar": "كلمة مرور فقط"}, {"en": "", "ar": "صورة للشاشة"}, {"en": "", "ar": "هدفاً عاماً"}], "answer": 3, "why": "«من تأدية الأوامر إلى تحقيق الأهداف… مع الوكيل المستقل (AI Agent): تعطيه هدفاً عاماً»."}, {"q_en": "", "q_ar": "الخطوات الثلاث لدورة ReAct التي يعمل بها الوكلاء المستقلون هي:", "options": [{"en": "", "ar": "التصفية، التدوين، التنبؤ"}, {"en": "", "ar": "الاستدعاء، التجميد، الشحن"}, {"en": "", "ar": "التحليل، العمل، الملاحظة"}, {"en": "", "ar": "الدمج، التنعيم، القص"}], "answer": 2, "why": "«التحليل (Reason)… العمل (Act)… الملاحظة (Observe)»."}]}</script>

  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {

  let dock = null;

    });
