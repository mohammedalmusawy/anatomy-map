By the energy of the x-rays they produce or their purpose", "ar": "بطاقة الأشعة التي تنتجها أو بالغرض منها"}, {"en": "By the type of film and cassette they are loaded with", "ar": "بنوع الفيلم والكاسيت المستعمل فيها"}], "answer": 2, "why": "حسب المحاضرة: تُميَّز إمّا بطاقة الأشعة التي تنتجها أو بالغرض الذي تُستعمل له."}, {"q_en": "Why are carbon fiber examination couches preferred?", "q_ar": "لماذا يُفضَّل سرير الفحص المصنوع من ألياف الكربون؟", "options": [{"en": "They are curved to fit the patient's body and keep the patient still", "ar": "مقوّسة لتناسب جسم المريض وتثبّته"}, {"en": "They are always motor driven and cannot be unlocked by hand", "ar": "تتحرك بالمحرّك دائماً ولا يمكن فكّها باليد"}, {"en": "They are heavy and absorb scatter, which improves image contrast", "ar": "ثقيلة وتمتص الإشعاع المتشتّت فتحسّن التباين"}, {"en": "They are strong and absorb little x-radiation, reducing patient dose", "ar": "لأنه قوي ويمتص قليلاً من الأشعة فيقلّل جرعة المريض"}], "answer": 3, "why": "المحاضرة: أسرّة ألياف الكربون قوية وتمتص قليلاً من الأشعة، وهذا يقلّل جرعة المريض."}, {"q_en": "What is the primary function of the x-ray machine?", "q_ar": "ما الوظيفة الأساسية لجهاز الأشعة السينية؟", "options": [{"en": "To provide a controlled electron flow to produce a beam of desired quantity and quality", "ar": "توفير سريان إلكترونات مسيطَر عليه لإنتاج حزمة بالكمية والنوعية المطلوبتين"}, {"en": "To develop the exposed x-ray film and store the images for reporting", "ar": "تحميض الفيلم المعرّض وحفظ الصور لكتابة التقرير"}, {"en": "To cool the x-ray tube and protect the patient from scattered radiation", "ar": "تبريد أنبوب الأشعة وحماية المريض من الإشعاع المتشتّت"}, {"en": "To convert the signal from the image receptor into a digital image of the desired brightness", "ar": "تحويل إشارة مستقبِل الصورة إلى صورة رقمية بالسطوع المطلوب"}], "answer": 0, "why": "هذا نص تعريف وظيفة الجهاز في المحاضرة."}, {"q_en": "Which system is described as a mobile fluoroscopy machine used in operating rooms?", "q_ar": "أي جهاز يوصف بأنه جهاز تنظير متنقّل يُستعمل في صالات العمليات؟", "options": [{"en": "DEXA scanner", "ar": "جهاز DEXA"}, {"en": "C-arm system", "ar": "جهاز C-arm"}, {"en": "Mammography system", "ar": "جهاز تصوير الثدي"}, {"en": "Fixed X-ray system", "ar": "الجهاز الثابت"}], "answer": 1, "why": "المحاضرة: C-arm أجهزة تنظير متنقّلة تُستعمل في صالات العمليات."}, {"q_en": "Which X-ray system uses digital sensors for immediate image acquisition?", "q_ar": "أي منظومة تستعمل مستشعرات رقمية فتظهر الصورة فوراً؟", "options": [{"en": "Traditional/Analog", "ar": "التقليدي (التناظري)"}, {"en": "Mechanical system", "ar": "المنظومة الميكانيكية"}, {"en": "Digital Radiography (DR)", "ar": "التصوير الشعاعي الرقمي DR"}, {"en": "Portable film system", "ar": "المنظومة المحمولة بالفيلم"}], "answer": 2, "why": "حسب التصنيف بالتقنية: DR يستعمل مستشعرات رقمية للحصول الفوري على الصورة."}, {"q_en": "Which of the following is NOT one of the three principal parts of every x-ray machine?", "q_ar": "أي مما يلي ليس من الأجزاء الرئيسية الثلاثة لكل جهاز أشعة؟", "options": [{"en": "The control console", "ar": "لوحة التحكم"}, {"en": "The high-voltage generator", "ar": "مولّد الجهد العالي"}, {"en": "The x-ray tube", "ar": "أنبوب الأشعة السينية"}, {"en": "The carbon fiber couch", "ar": "سرير ألياف الكربون"}], "answer": 3, "why": "الأجزاء الثلاثة بالمحاضرة: لوحة التحكم، مولّد الجهد العالي، أنبوب الأشعة."}, {"q_en": "In which x-ray machines are the three principal parts housed compactly?", "q_ar": "في أي أجهزة تكون الأجزاء الرئيسية الثلاثة مجمّعة معاً؟", "options": [{"en": "Dental and portable machines", "ar": "أجهزة الأسنان والأجهزة المحمولة"}, {"en": "CT scanners", "ar": "أجهزة المفراس"}, {"en": "Fixed ceiling-mounted systems", "ar": "الأجهزة الثابتة المعلّقة بالسقف"}, {"en": "Fluoroscopy rooms", "ar": "غرف التنظير"}], "answer": 0, "why": "المحاضرة تذكر أجهزة الأسنان والمحمولة مثالاً على الأجهزة المجمّعة."}, {"q_en": "Which parameters are adjusted at the console to control x-ray energy and quantity?", "q_ar": "ما العوامل التي تُضبط من لوحة التحكم للتحكم بطاقة الأشعة وكميتها؟", "options": [{"en": "Focal spot, grid ratio and film speed", "ar": "البقعة البؤرية ونسبة الشبكة وسرعة الفيلم"}, {"en": "kV, mA and exposure time", "ar": "الكيلوفولت والملي أمبير وزمن التعرّض"}, {"en": "Couch height and tube angle", "ar": "ارتفاع السرير وزاوية الأنبوب"}, {"en": "Line voltage, rotor speed and anode angle", "ar": "جهد الخط وسرعة الدوّار وزاوية الأنود"}], "answer": 1, "why": "المحاضرة: التحكم بالطاقة والكمية يكون بضبط الكيلوفولت والملي أمبير وزمن التعرّض بالثواني."}, {"q_en": "In the console, beam quality refers to:", "q_ar": "نوعية الحزمة (quality) في لوحة التحكم تعني:", "options": [{"en": "The number of x-ray photons", "ar": "عدد فوتونات الأشعة"}, {"en": "The exposure time", "ar": "زمن التعرّض"}, {"en": "The effective energy of x-ray photons", "ar": "الطاقة الفعّالة لفوتونات الأشعة"}, {"en": "The size of the image receptor", "ar": "حجم مستقبِل الصورة"}], "answer": 2, "why": "المحاضرة: الكمية = عدد الفوتونات، والنوعية = الطاقة الفعّالة للفوتونات."}, {"q_en": "What is the function of the line compensator?", "q_ar": "ما وظيفة معوّض الخط؟", "options": [{"en": "To increase the tube current", "ar": "زيادة تيار الأنبوب"}, {"en": "To shorten the exposure time so patient motion does not blur the image", "ar": "تقصير زمن التعرّض حتى لا تُغبّش حركة المريض الصورة"}, {"en": "To raise the incoming 220 V to the kilovoltage used during exposure", "ar": "رفع الـ 220 فولت الداخلة إلى الكيلوفولت المستعمل أثناء التعرّض"}, {"en": "To keep the incoming voltage constant during exposure", "ar": "إبقاء الجهد الداخل ثابتاً أثناء التعرّض"}], "answer": 3, "why": "هذا تعريف معاوضة الخط بالمحاضرة؛ ويضبط الجهد إلى 220 فولت بالضبط."}, {"q_en": "What happens when a higher kilovoltage is employed?", "q_ar": "ماذا يحدث عند استعمال كيلوفولت أعلى؟", "options": [{"en": "Electrons travel faster and the X-rays have a shorter wavelength", "ar": "الإلكترونات تسرع أكثر والأشعة طولها الموجي أقصر"}, {"en": "El
