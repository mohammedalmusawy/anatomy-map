ar": "99%"}], "answer": 2, "why": "المحاضرة: إضافة 1%–2% ثوريوم تزيد كفاءة الانبعاث وتطيل عمر الأنبوب."}, {"q_en": "The most common cause of tube failure related to the filament is:", "q_ar": "أشيع سبب لعطل الأنبوب متعلّق بالفتيلة هو:", "options": [{"en": "Rotation of the anode above 5,000 rpm, which wears the rotor", "ar": "دوران الأنود فوق 5,000 دورة/دقيقة الذي يُتلف الدوّار"}, {"en": "Low mA", "ar": "انخفاض mA"}, {"en": "Oil in the housing", "ar": "الزيت في الغطاء"}, {"en": "Tungsten vaporization coating the inside of the tube", "ar": "تبخّر التنغستن وتغطيته داخل الأنبوب"}], "answer": 3, "why": "المحاضرة: لو تبخّر التنغستن يصير الأنبوب غازياً وتتغطّى أجزاؤه، وهذا أشيع سبب للعطل."}, {"q_en": "Increasing the mA results in:", "q_ar": "زيادة mA تؤدّي إلى:", "options": [{"en": "A greater number of x-rays", "ar": "عدد أكبر من الأشعة"}, {"en": "A smaller focal spot", "ar": "بؤرة أصغر"}, {"en": "A lower melting point", "ar": "درجة انصهار أقل"}, {"en": "A larger heel effect", "ar": "تأثير كعب أكبر"}], "answer": 0, "why": "المحاضرة والشكل (3): mA منخفض = أشعة أقل، وmA عالٍ = أشعة أكثر."}, {"q_en": "Why must the focusing cup be negatively charged?", "q_ar": "لماذا يجب أن يكون كأس التركيز مشحوناً سلبياً؟", "options": [{"en": "To heat the filament so electrons boil off faster", "ar": "تسخين الفتيلة حتى تتحرر الإلكترونات أسرع"}, {"en": "To condense the electron beam to a small area of the anode", "ar": "لتجميع حزمة الإلكترونات في منطقة صغيرة من الأنود"}, {"en": "To rotate the anode", "ar": "لتدوير الأنود"}, {"en": "To absorb scattered x-rays before they leave the tube window", "ar": "امتصاص الإشعاع المتشتّت قبل خروجه من نافذة الأنبوب"}], "answer": 1, "why": "المحاضرة: الإلكترونات تتنافر وتنتشر، فكأس التركيز السالب يجمعها على منطقة صغيرة من الأنود."}, {"q_en": "Stationary anodes are used in:", "q_ar": "الأنود الثابت يُستعمل في:", "options": [{"en": "General purpose x-ray tubes that need high-intensity beams", "ar": "أنابيب الأغراض العامة التي تحتاج حزماً عالية الشدة"}, {"en": "High-output CT tubes", "ar": "أنابيب المفراس عالية الناتج"}, {"en": "Dental x-ray machines and some portable machines", "ar": "أجهزة الأسنان وبعض الأجهزة المحمولة"}, {"en": "All fluoroscopy units", "ar": "كل أجهزة التنظير"}], "answer": 2, "why": "المحاضرة: الأنود الثابت للأسنان وبعض المحمولة والوحدات التي لا تحتاج تياراً وقدرة عاليين."}, {"q_en": "Why is the rotating anode preferred in general diagnostic tubes?", "q_ar": "لماذا يُفضَّل الأنود الدوّار في أنابيب التشخيص العامة؟", "options": [{"en": "Its lower atomic number makes x-ray production more efficient and lowers the heat load", "ar": "عدده الذري الأقل يجعل إنتاج الأشعة أكفأ ويقلّل الحمل الحراري"}, {"en": "It needs no motor", "ar": "لأنه لا يحتاج محرّكاً"}, {"en": "It removes the anode heel effect, so beam intensity is uniform across the field", "ar": "يزيل تأثير الكعب فتصبح شدة الحزمة متجانسة على المجال"}, {"en": "It spreads heat over a large area and produces high-intensity beams in a short time", "ar": "لأنه يوزّع الحرارة على مساحة كبيرة وينتج حزماً عالية الشدة بوقت قصير"}], "answer": 3, "why": "المحاضرة: الدوران يوزّع الحرارة ويسمح بإنتاج فوتونات أكثر بوحدة الزمن."}, {"q_en": "The usual rotor speed for standard technique settings is about:", "q_ar": "سرعة الدوّار الاعتيادية لعوامل التعرّض القياسية حوالي:", "options": [{"en": "3,200 rpm", "ar": "3200 دورة/دقيقة"}, {"en": "60 rpm", "ar": "60 دورة/دقيقة"}, {"en": "500 rpm", "ar": "500 دورة/دقيقة"}, {"en": "50,000 rpm", "ar": "50000 دورة/دقيقة"}], "answer": 0, "why": "المحاضرة: عادةً 3200 دورة/دقيقة، وقد تتجاوز 5000 مع العوامل العالية."}, {"q_en": "Tungsten’s high atomic number (74) results in:", "q_ar": "العدد الذري العالي للتنغستن (74) يؤدّي إلى:", "options": [{"en": "Lower-energy x-rays that are absorbed in the glass envelope", "ar": "أشعة أقل طاقة تُمتص في الغلاف الزجاجي"}, {"en": "Higher-efficiency x-ray production and higher-energy x-rays", "ar": "إنتاج أشعة أكفأ وأشعة أعلى طاقة"}, {"en": "Easier vaporization", "ar": "تبخّر أسهل"}, {"en": "A lower melting point, so the target must be cooled with oil", "ar": "درجة انصهار أقل، فيجب تبريد الهدف بالزيت"}], "answer": 1, "why": "المحاضرة: العدد الذري 74 يعطي إنتاجاً أكفأ وأشعة أعلى طاقة."}, {"q_en": "When electrons strike the anode, how much of their kinetic energy becomes heat?", "q_ar": "عندما تصطدم الإلكترونات بالأنود، كم من طاقتها الحركية يتحوّل إلى حرارة؟", "options": [{"en": "About 1%", "ar": "حوالي 1%"}, {"en": "About half (50%)", "ar": "نحو النصف (50%)"}, {"en": "More than 99%", "ar": "أكثر من 99%"}, {"en": "None", "ar": "لا شيء"}], "answer": 2, "why": "المحاضرة: أكثر من 99% من الطاقة الحركية يتحوّل إلى حرارة."}, {"q_en": "Which principle explains how angling the anode makes the effective focal spot smaller than the actual focal spot?", "q_ar": "أي مبدأ يفسّر كيف تجعل إمالة الأنود البؤرة الفعّالة أصغر من الفعلية؟", "options": [{"en": "Heel effect", "ar": "تأثير الكعب"}, {"en": "Inverse square law", "ar": "قانون التربيع العكسي"}, {"en": "Thermionic emission", "ar": "الانبعاث الحراري للإلكترونات"}, {"en": "Line focus principle", "ar": "مبدأ البؤرة الخطية"}], "answer": 3, "why": "المحاضرة: إمالة هدف الأنود تصغّر البؤرة الفعّالة، وهذا مبدأ البؤرة الخطية."}, {"q_en": "The most common target angle is:", "q_ar": "زاوية الهدف الأشيع هي:", "options": [{"en": "12 degrees", "ar": "12 درجة"}, {"en": "24 degrees", "ar": "24 درجة"}, {"en": "45 degrees or more", "ar": "45 درجة أو أكثر"}, {"en": "90 degrees", "ar": "90 درجة"}], "answer": 0, "why": "المحاضرة: أي زاوية أقل من 45° تصغّر البؤرة الفعّالة، والأشيع 12°."}, {"q_en": "Typical nominal size of a small focal spot is:", "q_ar": "المقاس الاسمي النموذجي للبؤرة الصغيرة:", "options": [{"en": "1.0–1.2 mm", "ar": "1.0–1.2 ملم"}, {"en": "0.3–0.6 mm", "ar": "0.3–0.6 ملم"}, {"en": "2–3 mm", "ar": "2–3 ملم"}, {"en": "0.05–0.1 mm", "ar": "0.05–0.1 ملم"}], "answer": 1, "why": "المحاضرة: الكبيرة 1.0–1.2 ملم، والصغيرة 0.3–0.6 ملم."}, {"q_en": "Which focal spot is the area of the target actually bombarded by electrons?", "q_ar": "أي بؤرة ه  {"en": "Space charge", "ar": "الشحنة الفراغية"}], "answer": 1, "why": "المحاضرة: خطران: التعرّض المفرط للإشعاع والصدمة الكهربائية."}, {"q_en": "Which factor primarily determines the focal spot size?", "q_ar": "ما العامل الذي يحدّد حجم البؤرة بالدرجة الأولى؟", "options": [{"en": "The kVp selected on the console", "ar": "قيمة kVp المختارة في لوحة التحكم"}, {"en": "The rotation speed of the anode disc", "ar": "سرعة دوران قرص الأنود"}, {"en": "The filament in use (small or large)", "ar": "الفتيلة المستعملة (الصغيرة أو الكبيرة)"}, {"en": "The thickness of the tube window", "ar": "سُمك نافذة الأنبوب"}], "answer": 2, "why": "المحاضرة (سؤال مقترح من الأستاذ): الفتيلة الصغيرة توجّه تيار إلكتروناتها إلى البؤرة الصغيرة، والفتيلة الكبيرة إلى البؤرة الأكبر؛ والكوب البؤري يركّز الإلكترونات على البؤرة.", "kind": "suggested"}, {"q_en": "What the unit of measure for tube current selected by the technologist?", "q_ar": "ما وحدة قياس تيار الأنبوب الذي يختاره تقنيّ الأشعة؟", "options": [{"en": "Milliampere (mA)", "ar": "الملي أمبير (mA)"}, {"en": "Kilovolt peak (kVp)", "ar": "ذروة الكيلوفولت (kVp)"}, {"en": "Revolutions per minute (rpm)", "ar": "دورة في الدقيقة (rpm)"}, {"en": "Degrees Celsius (°C)", "ar": "الدرجة المئوية (°C)"}], "answer": 0, "why": "المحاضرة (سؤال مقترح من الأستاذ): «mA وحدة قياس للتيار الكهربائي يستعملها تقنيّ الأشعة عند اختيار عوامل التعرّض».", "kind": "suggested"}, {"q_en": "A small body part is imaged and fine detail is the priority. Which choice gives the best detail?", "q_ar": "يُصوَّر جزء صغير من الجسم والأولوية للتفاصيل الدقيقة. أي اختيار يعطي أفضل تفاصيل؟", "options": [{"en": "The large filament, because it gives a higher x-ray output", "ar": "الفتيلة الكبيرة، لأنها تعطي إنتاج أشعة أعلى"}, {"en": "The small filament, giving a small focal spot and less blurring", "ar": "الفتيلة الصغيرة، فتعطي بؤرة صغيرة وتغبيشاً أقل"}, {"en": "A larger anode angle of 24° to enlarge the effective focal spot", "ar": "زاوية أنود أكبر (24°) لتكبير البؤرة الفعّالة"}, {"en": "A stationary anode so the focal spot does not move", "ar": "أنود ثابت حتى لا تتحرك البؤرة"}], "answer": 1, "why": "المحاضرة: الفتيلة الصغيرة للأجزاء الصغيرة، والبؤرة الصغيرة تقلّل التغبيش الهندسي، و«كلما صغرت البؤرة كانت التفاصيل أفضل».", "kind": "apply"}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/أجهزة الأشعة التقليدية/نظري/م03 - أنبوب الأشعة السينية"}</script>

document.addEventListener("DOMContentLoaded", () => {
  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)
  const p0 = location.pathname.startsWith(rootP) ? location.pathname.slice(rootP.length) : location.pathname;
  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");

  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {

    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;

    });

  if (window.Sync) Sync.start();
});
