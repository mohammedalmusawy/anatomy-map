يم"}, {"en": "Thermionic emission", "ar": "الانبعاث الحراري"}, {"en": "Mutual induction with two windings", "ar": "الحثّ المتبادل بملفّين"}, {"en": "Self-induction with a single winding", "ar": "الحثّ الذاتي بملف واحد"}], "answer": 3, "why": "المحاضرة: ملف واحد حول قلب حديدي تعمل بمبدأ الحثّ الذاتي."}, {"q_en": "Why is the kVp varied at the autotransformer rather than after the high-voltage transformer?", "q_ar": "لماذا يُغيَّر الكيلوفولت عند المحوّل الذاتي وليس بعد محوّل الجهد العالي؟", "options": [{"en": "It is safer and easier to vary a low voltage and then increase it", "ar": "لأن تغيير الجهد المنخفض ثم رفعه أأمن وأسهل"}, {"en": "The high-voltage transformer works only on DC", "ar": "لأن محوّل الجهد العالي يعمل بالمستمر فقط"}, {"en": "It increases the turns ratio", "ar": "لأنه يزيد نسبة اللفّات"}, {"en": "It reduces the number of diodes", "ar": "لأنه يقلّل عدد الثنائيات"}], "answer": 0, "why": "المحاضرة: هندسياً أأمن وأسهل تغيير الجهد المنخفض ثم رفعه."}, {"q_en": "The turns ratio of the high-voltage transformer is usually between:", "q_ar": "نسبة اللفّات في محوّل الجهد العالي عادةً بين:", "options": [{"en": "2 and 10", "ar": "2 و10"}, {"en": "500 and 1000", "ar": "500 و1000"}, {"en": "100 and 400", "ar": "100 و400"}, {"en": "10 and 12", "ar": "10 و12"}], "answer": 1, "why": "المحاضرة: عادةً بين 500 و1000."}, {"q_en": "In a step-up transformer, when the voltage increases, the current:", "q_ar": "في المحوّل الرافع، عندما يزيد الجهد فإن التيار:", "options": [{"en": "Increases by the same ratio", "ar": "يزيد بنفس النسبة"}, {"en": "Stays the same", "ar": "يبقى نفسه"}, {"en": "Is reduced proportionately", "ar": "يقل بنفس النسبة"}, {"en": "Becomes direct current", "ar": "يصير مستمراً"}], "answer": 2, "why": "المحاضرة: زيادة الجهد تتناسب مع نسبة اللفّات، والتيار يقل بنفس النسبة."}, {"q_en": "Rectification is the process of converting:", "q_ar": "التقويم هو تحويل:", "options": [{"en": "Low voltage to high voltage", "ar": "الجهد المنخفض إلى عالٍ"}, {"en": "Heat to light", document.addEventListener("DOMContentLoaded", () => {
  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)
  const p0 = location.pathname.startsWith(rootP) ? location.pathname.slice(rootP.length) : location.pathname;
  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");
  const L = (() => { try { return JSON.parse(document.body.dataset.lecture || "null"); } catch (e) { return null; } })();

  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {

  });

  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";

      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق

    });

});
