s the process of converting:", "q_ar": "التقويم هو تحويل:", "options": [{"en": "Low voltage into high voltage by induction", "ar": "جهد منخفض إلى جهد عالٍ بالحثّ"}, {"en": "Heat to light", "ar": "الحرارة إلى ضوء"}, {"en": "Direct current to alternating current", "ar": "التيار المستمر إلى متناوب"}, {"en": "Alternating current to direct current", "ar": "التيار المتناوب إلى مستمر"}], "answer": 3, "why": "المحاضرة: التقويم تحويل الجهد المتناوب إلى مستمر، وبالتالي التيار."}, {"q_en": "A full-wave rectified x-ray machine contains at least:", "q_ar": "جهاز الأشعة بتقويم الموجة الكاملة يحتوي على الأقل:", "options": [{"en": "Four diodes", "ar": "أربعة ثنائيات"}, {"en": "One diode", "ar": "ثنائياً واحداً"}, {"en": "Two diodes", "ar": "ثنائيين"}, {"en": "Twelve diodes", "ar": "اثني عشر ثنائياً"}], "answer": 0, "why": "المحاضرة: أربعة ثنائيات على الأقل في دائرة الجهد العالي."}, {"q_en": "Single-phase full-wave rectified generators produce:", "q_ar": "المولّدات أحادية الطور بتقويم الموجة الكاملة تنتج:", "options": [{"en": "Six pulsations per cycle with about 13% ripple", "ar": "ست نبضات في الدورة بتموّج نحو 13%"}, {"en": "Two pulsations per cycle with 100% ripple", "ar": "نبضتين بالدورة وتموّج 100%"}, {"en": "Twelve pulses per cycle with 3% ripple", "ar": "12 نبضة بالدورة وتموّج 3%"}, {"en": "A constant potential with < 1% ripple", "ar": "جهداً ثابتاً وتموّجاً أقل من 1%"}], "answer": 1, "why": "المحاضرة: نبضتان بالدورة (120 بالثانية) مع تموّج 100%."}, {"q_en": "Single-phase generators are common in which type of radiography?", "q_ar": "المولّدات أحادية الطور شائعة في أي نوع من التصوير؟", "options": [{"en": "Chest radiography", "ar": "تصوير الصدر"}, {"en": "CT scanning", "ar": "المفراس"}, {"en": "Dental radiography", "ar": "تصوير الأسنان"}, {"en": "Mammography", "ar": "تصوير الثدي"}], "answer": 2, "why": "المحاضرة: شائعة لتصوير الأسنان لأن الأسنان رقيقة ويُتحمّل زمن تعرّض أطول."}, {"q_en": "A 12-pulse three-phase generator reduces voltage ripple to about:", "q_ar": "المولّد ثلاثي الطور بـ 12 نبضة يقلّل التموّج إلى حوالي:", "options": [{"en": "100% of kVp", "ar": "100% من kVp"}, {"en": "13% of kVp", "ar": "13% من kVp"}, {"en": "50% of kVp", "ar": "50% من kVp"}, {"en": "3% of kVp", "ar": "3% من kVp"}], "answer": 3, "why": "المحاضرة: 6 نبضات = 13%، و12 نبضة = 3% من kVp. (الرسم بالمحاضرة يذكر 4% للـ 12 نبضة و14% للـ 6 نبضات — احتمال خطأ: النص 3% والرسم 4%؛ جواب الأستاذ المعتمد من النص.)"}, {"q_en": "The voltage drop from kVp is called:", "q_ar": "انخفاض الجهد عن kVp يُسمّى:", "options": [{"en": "Ripple", "ar": "التموّج"}, {"en": "Turns ratio", "ar": "نسبة اللفّات"}, {"en": "Rectification", "ar": "التقويم"}, {"en": "Line compensation", "ar": "معاوضة الخط"}], "answer": 0, "why": "المحاضرة: انخفاض الجهد عن kVp اسمه ripple، وكلما زاد قلّت كفاءة الإنتاج."}, {"q_en": "Which is a reason high-frequency generators are the most widely used?", "q_ar": "أي مما يلي سبب لكون المولّدات عالية التردد الأكثر استعمالاً؟", "options": [{"en": "They rely on costly three-phase power line installations and cabling", "ar": "تعتمد على تمديدات خطوط قدرة ثلاثية الطور مكلفة"}, {"en": "Nearly constant potential waveform and shortest exposure time", "ar": "موجة جهد شبه ثابتة وأقصر زمن تعرّض"}, {"en": "They produce more soft radiation and a higher ripple", "ar": "تُنتج إشعاعاً ليّناً أكثر وتموّجاً أعلى"}, {"en": "They are larger in design but cheaper to install", "ar": "تصميمها أكبر لكن تركيبها أرخص"}], "answer": 1, "why": "من أسباب المحاضرة: موجة شبه ثابتة، تصميم أصغر، أقصر زمن تعرّض، وجرعة ليّنة أقل."}, {"q_en": "The filament step-down transformer delivers about:", "q_ar": "محوّل الفتيلة الخافض يعطي حوالي:", "options": [{"en": "40–150 kV", "ar": "40–150 كيلوفولت"}, {"en": "100–400 V", "ar": "100–400 فولت"}, {"en": "10–12 V and 3–5 A", "ar": "10–12 فولت و3–5 أمبير"}, {"en": "220 V and 200–1000 mA", "ar": "220 فولت و200–1000 mA"}], "answer": 2, "why": "المحاضرة: يخفّض الجهد إلى 10–12 فولت ويرفع التيار إلى 3–5 أمبير لتسخين الفتيلة."}, {"q_en": "Which component belongs to the secondary circuit?", "q_ar": "أي مكوّن يتبع الدائرة الثانوية؟", "options": [{"en": "Line voltage compensator", "ar": "معوّض جهد الخط"}, {"en": "mA selector", "ar": "منتقي mA"}, {"en": "Exposure timer", "ar": "مؤقّت التعرّض"}, {"en": "Rectifier unit", "ar": "وحدة التقويم"}], "answer": 3, "why": "الدائرة الثانوية بالمحاضرة: المحوّل الرافع ووحدة التقويم."}, {"q_en": "Why do high-frequency generators reduce patient dose?", "q_ar": "لماذا المولّدات عالية التردد تقلّل جرعة المريض؟", "options": [{"en": "They produce fewer low-energy (soft) X-rays", "ar": "لأنها تنتج أشعة ليّنة منخفضة الطاقة أقل"}, {"en": "They use longer exposure times per image", "ar": "لأنها تستعمل زمن تعرّض أطول لكل صورة"}, {"en": "They have 100% ripple in their voltage", "ar": "لأن تموّج جهدها 100%"}, {"en": "They lower the mean photon energy", "ar": "لأنها تخفّض معدّل طاقة الفوتونات"}], "answer": 0, "why": "المحاضرة: تنتج أشعة ليّنة أقل، فتقل الجرعة الواصلة للمريض."}, {"q_en": "In single-phase units, the large amount of soft X-rays is:", "q_ar": "في الأجهزة أحادية الطور، الكمية الكبيرة من الأشعة الليّنة:", "options": [{"en": "Used by the detector to improve image contrast and detail", "ar": "يستعمله الكاشف لتحسين تباين الصورة وتفاصيلها"}, {"en": "Absorbed by the patient rather than contributing to the image", "ar": "يمتصها المريض ولا تساهم في الصورة"}, {"en": "Removed by the rectifier", "ar": "يزيلها المقوّم"}, {"en": "Converted to hard X-rays by the filtration in the tube housing", "ar": "يتحوّل إلى أشعة صلبة بالترشيح في غلاف الأنبوب"}], "answer": 1, "why": "المحاضرة: الأشعة الليّنة يمتصها المريض بدل أن تساهم في الصورة."}, {"q_en": "What is the main disadvantage of a Single-phase generator compared to a Three-phase generator in clinical practice?", "q_ar": "ما العيب الرئيسي لمولّد الطور الواحد مقارنةً بمولّد الأطوار الثلاثة في الممارسة السريرية؟", "options": [{"en": "High cost and the need for costly power line installations", "ar": "الكلفة العالية والحاجة إلى تمديدات خطوط قدرة مكلفة"}, {"en": "Lower voltage ripple, which narrows the energy spectrum", "ar": "تموّج جهد أقل يضيّق طيف الطاقة"}, {"en": "Longer exposure time and greater patient dose from soft X-rays", "ar": "زمن تعرّض أطول وجرعة أكبر للمريض من الأشعة الليّنة"}, {"en": "Higher average photon energy, which lowers subject contrast", "ar": "متوسط طاقة فوتونات أعلى يقلّل التباين"}], "answer": 2, "why": "المحاضرة (سؤال مقترح): الحزمة النابضة لمولّد الطور الواحد تؤدي إلى «زمن تعرّض أطول وجرعة أكبر للمريض من الأشعة الليّنة منخفضة الطاقة». الكلفة العالية عيب مولّد الأطوار الثلاثة.", "kind": "suggested"}, {"q_en": "High-frequency generators are often preferred for mobile (portable) X-ray units because:", "q_ar": "تُفضَّل مولّدات التردد العالي غالباً في أجهزة الأشعة المتنقّلة لأنها:", "options": [{"en": "They need a costly three-phase power line installation", "ar": "تحتاج تمديد خط قدرة ثلاثي الطور مكلفاً"}, {"en": "They produce two pulsations per cycle with 100% ripple", "ar": "تُنتج نبضتين في الدورة بتموّج 100%"}, {"en": "They work directly on the 220 V supply without any transformer", "ar": "تعمل مباشرةً على 220 فولت دون أي محوّل"}, {"en": "They are smaller and more efficient than three-phase generators", "ar": "أصغر حجماً وأكثر كفاءة من مولّدات الأطوار الثلاثة"}], "answer": 3, "why": "المحاضرة (سؤال مقترح): مولّدات التردد العالي «أصغر وأكثر كفاءة من مولّدات الأطوار الثلاثة»، ومن أسباب انتشارها «أصغر تصميماً» (Smaller in design).", "kind": "suggested"}, {"q_en": "When using a Three-phase or High-frequency generator, the exposure time can be significantly reduced because:", "q_ar": "عند استعمال مولّد ثلاثي الطور أو عالي التردد يمكن تقليل زمن التعرّض كثيراً لأن:", "options": [{"en": "The voltage stays nearly constant, giving more photon output per mAs", "ar": "الجهد يبقى شبه ثابت، فيعطي إنتاجاً أكبر من الفوتونات لكل mAs"}, {"en": "The voltage drops to zero 120 times per second, as in single-phase", "ar": "الجهد يهبط إلى الصفر 120 مرة في الثانية كما في الطور الواحد"}, {"en": "More low-energy soft X-rays are produced, darkening the image faster", "ar": "تُنتج أشعة ليّنة منخفضة الطاقة أكثر فتُعتّم الصورة أسرع"}, {"en": "The filament is heated by a lower current, so less heat is produced", "ar": "الفتيلة تُسخَّن بتيار أقل، فتتولّد حرارة أقل"}], "answer": 0, "why": "المحاضرة (سؤال مقترح): بالطاقة ثلاثية الطور يبقى الجهد شبه ثابت ولا يهبط إلى الصفر، فيزيد إنتاج الفوتونات لكل وحدة كهربائية (mR/mAs)؛ والتردد العالي جهده شبه ثابت ويتيح أقصر زمن تعرّض.", "kind": "suggested"}, {"q_en": "How does a High-frequency generator affect the \"Mean Photon Energy\" of the X-ray beam compared to a Single-phase unit?", "q_ar": "كيف يؤثر مولّد التردد العالي في متوسط طاقة فوتونات الحزمة مقارنةً بمولّد الطور الواحد؟", "options": [{"en": "It is lower, because more soft X-rays are produced", "ar": "يكون أقل، لأن أشعة ليّنة أكثر تُنتج"}, {"en": "It is higher, giving a more penetrating beam", "ar": "يكون أعلى، فتصبح الحزمة أعلى قدرة اختراق"}, {"en": "It stays the same, because the selected kVp is the same", "ar": "يبقى كما هو، لأن kVp المختار نفسه"}, {"en": "It falls to zero between the voltage pulses", "ar": "يهبط إلى الصفر بين نبضات الجهد"}], "answer": 1, "why": "المحاضرة (سؤال مقترح): مولّدات التردد العالي تعطي «أعلى متوسط طاقة (فعّالة) للأشعة» وحزمة أعلى طاقة تزيد قدرة الاختراق.", "kind": "suggested"}, {"q_en": "High-frequency generators allow for significantly shorter exposure times (ms). How does this technical capability specifically impact \"Image Detail\" in chest or pediatric radiography?", "q_ar": "تتيح مولّدات التردد العالي أزمنة تعرّض قصيرة جداً (ملي ثانية). كيف يؤثر هذا في تفاصيل الصورة بتصوير الصدر أو الأطفال؟", "options": [{"en": "It increases geometric blurring from the focal spot", "ar": "يزيد التغبيش الهندسي من البؤرة"}, {"en": "It increases scatter and so lowers image contrast", "ar": "يزيد الإشعاع المتشتّت فيقلّ التباين"}, {"en": "It reduces motion blur from patient movement", "ar": "يقلّل التغبيش الناتج عن حركة المريض"}, {"en": "It has no effect, since detail depends only on kVp", "ar": "لا يؤثر، لأن التفاصيل تعتمد على kVp فقط"}], "answer": 2, "why": "سؤال مقترح من الأستاذ بهذه المحاضرة، لكن جوابه مكتوب في المحاضرة الأولى (لوحة التحكم، قسم المؤقّت): زمن التعرّض القصير يقلّل آثار حركة المريض الإرادية واللاإرادية فيحافظ على تفاصيل الصورة. أما هذه المحاضرة فتذكر فقط أن مولّدات التردد العالي تعطي «أقصر زمن تعرّض». والصدر يتحرك بالتنفس والقلب، والأطفال يتحركون.", "kind": "suggested"}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/أجهزة الأشعة التقليدية/نظري/م02 - مولّدات الجهد العالي"}</script>
