s the process of converting:", "q_ar": "التقويم هو تحويل:", "options": [{"en": "Low voltage into high voltage by induction", "ar": "جهد منخفض إلى جهد عالٍ بالحثّ"}, {"en": "Heat to light", "ar": "الحرارة إلى ضوء"}, {"en": "Direct current to alternating current", "ar": "التيار المستمر إلى متناوب"}, {"en": "Alternating current to direct current", "ar": "التيار المتناوب إلى مستمر"}], "answer": 3, "why": "المحاضرة: التقويم تحويل الجهد المتناوب إلى مستمر، وبالتالي التيار."}, {"q_en": "A full-wave rectified x-ray machine contains at least:", "q_ar": "جهاز الأشعة بتقويم الموجة الكاملة يحتوي على الأقل:", "options": [{"en": "Four diodes", "ar": "أربعة ثنائيات"}, {"en": "One diode", "ar": "ثنائياً واحداً"}, {"en": "Two diodes", "ar": "ثنائيين"}, {"en": "Twelve diodes", "ar": "اثني عشر ثنائياً"}], "answer": 0, "why": "المحاضرة: أربعة ثنائيات على الأقل في دائرة الجهد العالي."}, {"q_en": "Single-phase full-wave rectified generators produce:", "q_ar": "المولّدات أحادية الطور بتقويم الموجة الكاملة تنتج:", "options": [{"en": "Six pulsations per cycle with about 13% ripple", "ar": "ست نبضات في الدورة بتموّج نحو 13%"}, {"en": "Two pulsations per cycle with 100% ripple", "ar": "نبضتين بالدورة وتموّج 100%"}, {"en": "Twelve pulses per cycle with 3% ripple", "ar": "12 نبضة بالدورة وتموّج 3%"}, {"en": "A constant potential with < 1% ripple", "ar": "جهداً ثابتاً وتموّجاً أقل من 1%"}], "answer": 1, "why": "المحاضرة: نبضتان بالدورة (120 بالثانية) مع تموّج 100%."}, {"q_en": "Single-phase generators are common in which type of radiography?", "q_ar": "المولّدات أحادية الطور شائعة في أي نوع من التصوير؟", "options": [{"en": "Chest radiography", "ar": "تصوير الصدر"}, {"en": "CT scanning", "ar": "المفراس"}, {"en": "Dental radiography", "ar": "تصوير الأسنان"}, {"en": "Mammography", "ar": "تصوير الثدي"}], "answer": 2, "why": "المحاضرة: شائعة لتصوير الأسنان لأن الأسنان رقيقة ويُتحمّل زمن تعرّض أطول."}, {"q_en": "A 12-pulse three-phase generator reduces voltage ripple to about:", "q_ar": "المولّد ثلاثي الطور بـ 12 نبضة يقلّل التموّج إلى حوالي:", "options": [{"en": "100% of kVp", "ar": "100% من kVp"}, {"en": "13% of kVp", "ar": "13% من kVp"}, {"en": "50% of kVp", "ar": "50% من kVp"}, {"en": "3% of kVp", "ar": "3% من kVp"}], "answer": 3, "why": "المحاضرة: 6 نبضات = 13%، و12 نبضة = 3% من kVp. (الرسم بالمحاضرة يذكر 4% للـ 12 نبضة و14% للـ 6 نبضات — احتمال خطأ: النص 3% والرسم 4%؛ جواب الأستاذ المعتمد من النص.)"}, {"q_en": "The voltage drop from kVp is called:", "q_ar": "انخفاض الجهد عن kVp يُسمّى:", "options": [{"en": "Ripple", "ar": "التموّج"}, {"en": "Turns ratio", "ar": "نسبة اللفّات"}, {"en": "Rectification", "ar": "التقويم"}, {"en": "Line compensation", "ar": "معاوضة الخط"}], "answer": 0, "why": "المحاضرة: انخفاض الجهد عن kVp اسمه ripple، وكلما زاد قلّت كفاءة الإنتاج."}, {"q_en": "Which is a reason high-frequency generators are the most widely used?", "q_ar": "أي مما يلي سبب لكون المولّدات عالية التردد الأكثر استعمالاً؟", "options": [{"en": "They rely on costly three-phase power line installations and cabling", "ar": "تعتمد على تمديدات خطوط قدرة ثلاثية الطور مكلفة"}, {"en": "Nearly constant potential waveform and shortest exposure time", "ar": "موجة جهد شبه ثابتة وأقصر زمن تعرّض"}, {"en": "They produce more soft radiation and a higher ripple", "ar": "تُنتج إشعاعاً ليّناً أكثر وتموّجاً أعلى"}, {"en": "They are larger in design but cheaper to install", "ar": "تصميمها أكبر لكن تركيبها أرخص"}], "answer": 1, "why": "من أسباب المحاضرة: موجة شبه ثابتة، تصميم أصغر، أقصر زمن تعرّض، وجرعة ليّنة أقل."}, {"q_en": "The filament step-down transformer delivers about:", "q_ar": "محوّل الفتيلة الخافض يعطي حوالي:", "options": [{"en": "40–150 kV", "ar": "40–150 كيلوفولت"}, {"en": "100–400 V", "ar": "100–400 فولت"}, {"en": "10–12 V and 3–5 A", "ar": "10–12 فولت و3–5 أمبير"}, {"en": "220 V and 200–1000 mA", "ar": "220 فولت و200–1000 mA"}], "answer": 2, "why": "المحاضرة: يخفّض الجهد إلى 10–12 فولت ويرفع التيار إلى 3–5 أمبير لتسخين الفتيلة."}, {"q_en": "Which component belongs to the secondary circuit?", "q_ar": "أي مكوّن يتبع الدائرة الثانوية؟", "options": [{"en": "Line voltage compensator", "ar": "معوّض جهد الخط"}, {"en": "mA selector", "ar": "منتقي mA"}, {"en": "Exposure timer", "ar": "مؤقّت التعرّض"}, {"en": "Rectifier unit", "ar": "وحدة التقويم"}], "answer": 3, "why": "الدائرة الثانوية بالمحاضرة: المحوّل الرافع ووحدة التقويم."}, {"q_en": "Why do high-frequency generators reduce patient dose?", "q_ar": "لماذا المولّدات عالية التردد تقلّل جرعة المريض؟", "options": [{"en": "They produce fewer low-energy (soft) X-rays", "ar": "لأنها تنتج أشعة ليّنة منخفضة الطاقة أقل"}, {"en": "They use longer exposure times per image", "ar": "لأنها تستعمل زمن تعرّض أطول لكل صورة"}, {"en": "They have 100% ripple in their voltage", "ar": "لأن تموّج جهدها 100%"}, {"en": "They lower the mean photon energy", "ar": "لأنها تخفّض معدّل طاقة الفوتونات"}], "answer": 0, "why": "المحاضرة: تنتج أشعة ليّنة أقل، فتقل الجرعة الواصلة للمريض."}, {"q_en": "In single-phase units, the large amount of soft X-rays is:", "q_ar": "في الأجهزة أحادية الطور، الكمية الكبيرة من الأشعة الليّنة:", "options": [{"en": "Used by the detector to improve image contrast and detail", "ar": "يستعمله الكاشف لتحسين تباين الصورة وتفاصيلها"}, {"en": "Absorbed by the patient rather than contributing to the image", "ar": "يمتصها المريض ولا تساهم في الصورة"}, {"en": "Removed by the rectifier", "ar": "يزيلها المقوّم"}, {"en": "Converted to hard X-rays by the filtration in the tube housing", "ar": "يتحوّل إلى أشعة صلبة بالترشيح في غلاف الأنبوب"}], "answer": 1, "why": "المحاضرة: الأشعة الليّنة يمتصها المريض بدل أن تساهم في الصورة."}, {"q_en": "What is the main disadvantage of a Single-phase generator compared to a Three-phase generator in clinical practice?", "q_ar": "ما العيب الرئيسي لمولّد الطور الواحد مقارنةً بمولّد الأطوار الثلاثة في الممارسة السريرية؟", "options": [{"en": "High cost and the need for costly power line installations", "ar": "الكلفة العالية والحاجة إلى تمديدات خطوط قدرة مكلفة"}, {"en": "Lower voltage ripple, which narrows the energy spectrum", "ar": "تموّج جهد أقل يضيّق طيف الطاقة"}, {"en": "Longer exposure time and greater patient dose from soft X-rays", "ar": "زمن تعرّض أطول وجرعة أكبر للمريض من الأشعة الليّنة"}, {"en": "Higher average photon energy, which lowers subject contrast", "ar": "متوسط طاقة فوتونات أعلى يقلّل التباين"}], "answer": 2, "why": "المحاضرة (سؤال مقترح): الحزمة النابضة لمولّد الطور الواحد تؤدي إلى «زمن تعرّض أطول وجرعة أكبر للمريض من الأشعة الليّنة منخفضة الطاقة». الكلفة العالية عيب مولّد الأطوار الثلاثة.", "kind": "suggested"}, {"q_en": "High-frequency generators are often preferred for mobile (portable) X-ray units because:", "q_ar": "تُفضَّل مولّدات التردد العالي غالباً في أجهزة الأشعة المتنقّلة لأنها:", "options": [{"en": "They need a costly three-phase power line installation", "ar": "تحتاج تمديد خط قدرة ثلاثي الطور مكلفاً"}, {"en": "They produce two pulsations per cycle with 100% ripple", "ar": "تُنتج نبضتين في الدورة بتموّج 100%"}, {"en": "They work directly on the 220 V supply without any transformer", "ar": "تعمل مباشرةً على 220 فولت دون أي محوّل"}, {"en": "They are smaller and more efficient than three-phase generators", "ar": "أصغر حجماً وأكثر كفاءة من مولّدات الأطوار الثلاثة"}], "answer": 3, "why": "المحاضرة (سؤال مقترح): مولّدات التردد العالي «أصغر وأكثر كفاءة من مولّدات الأطوار الثلاثة»، ومن أسباب انتشارها «أصغر تصميماً» (Smaller in design).", "kind": "suggested"}, {"q_en": "When using a Three-phase or High-frequency generator, the exposure time can be significantly reduced because:", "q_ar": "عند استعمال مولّد ثلاثي الطور أو عالي التردد يمكن تقليل زمن التعرّض كثيراً لأن:", "options": [{"en": "The voltage stays nearly constant, giving more photon output per mAs", "ar": "الجهد يبقى شبه ثابت، فيعطي إنتاجاً أكبر من الفوتونات لكل mAs"}, {"en": "The voltage drops to zero 120 times per second, as in single-phase", "ar": "الجهد يهبط إلى الصفر 120 مرة في الثانية كما في الطور الواحد"}, {"en": "More low-energy soft X-rays are produced, darkening the image faster", "ar": "تُنتج أشعة ليّنة منخفضة الطاقة أكثر فتُعتّم الصورة أسرع"}, {"en": "The filament is heated by a lower current, so less heat is produced", "ar": "الفتيلة تُسخَّن بتيار أقل، فتتولّد حرارة أقل"}], "answer": 0, "why": "المحاضرة (سؤال مقترح): بالطاقة ثلاثية الطور يبقى الجهد شبه ثابت ولا يهبط إلى الصفر، فيزيد إنتاج الفوتونات لكل وحدة كهربائية (mR/mAs)؛ والتردد العالي جهده شبه ثابت ويتيح أقصر زمن تعرّض.", "kind": "suggested"}, {"q_en": "How does a High-frequency generator affect the \"Mean Photon Energy\" of the X-ray beam compared to a Single-phase unit?", "q_ar": "كيف يؤثر مولّد التردد العالي في متوسط طاقة فوتونات الحزمة مقارنةً بمولّد الطور الواحد؟", "options": [{"en": "It is lower, because more soft X-rays are produced", "ar": "يكون أقل، لأن أشعة ليّنة أكثر تُنتج"}, {"en": "It is higher, giving a more penetrating beam", "ar": "يكون أعلى، فتصبح الحزمة أعلى قدرة اختراق"}, {"en": "It stays the same, because the selected kVp is the same", "ar": "يبقى كما هو، لأن kVp المختار نفسه"}, {"en": "It falls to zero between the voltage pulses", "ar": "يهبط إلى الصفر بين نبضات الجهد"}], "answer": 1, "why": "المحاضرة (سؤال مقترح): مولّدات التردد العالي تعطي «أعلى متوسط طاقة (فعّالة) للأشعة» وحزمة أعلى طاقة تزيد قدرة الاختراق.", "kind": "suggested"}, {"q_en": "High-frequency generators allow for significantly shorter exposure times (ms). How does this technical capability specifically impact \"Image Detail\" in chest or pediatric radiography?", "q_ar": "تتيح مولّدات التردد العالي أزمنة تعرّض قصيرة جداً (ملي ثانية). كيف يؤثر هذا في تفاصيل الصورة بتصوير الصدر أو الأطفال؟", "options": [{"en": "It increases geometric blurring from the focal spot", "ar": "يزيد التغبيش الهندسي من البؤرة"}, {"en": "It increases scatter and so lowers image contrast", "ar": "يزيد الإشعاع المتشتّت فيقلّ التباين"}, {"en": "It reduces motion blur from patient movement", "ar": "يقلّل التغبيش الناتج عن حركة المريض"}, {"en": "It has no effect, since detail depends only on kVp", "ar": "لا يؤثر، لأن التفاصيل تعتمد على kVp فقط"}], "answer": 2, "why": "سؤال مقترح من الأستاذ بهذه المحاضرة، لكن جوابه مكتوب في المحاضرة الأولى (لوحة التحكم، قسم المؤقّت): زمن التعرّض القصير يقلّل آثار حركة المريض الإرادية واللاإرادية فيحافظ على تفاصيل الصورة. أما هذه المحاضرة فتذكر فقط أن مولّدات التردد العالي تعطي «أقصر زمن تعرّض». والصدر يتحرك بالتنفس والقلب، والأطفال يتحركون.", "kind": "suggested"}, {"q_en": "A high-voltage transformer has a turns ratio of 600, and its primary voltage is 150 V. What is the secondary voltage?", "q_ar": "محوّل جهد عالٍ نسبة لفّاته 600، وجهده الابتدائي 150 V. ما الجهد الثانوي؟", "options": [{"en": "4 kV", "ar": "4 kV"}, {"en": "0.25 kV", "ar": "0.25 kV"}, {"en": "90 kV", "ar": "90 kV"}, {"en": "750 kV", "ar": "750 kV"}], "answer": 2, "why": "Vs ÷ Vp = Ns ÷ Np، إذن Vs = 150 × 600 = 90,000 V = 90 kV.", "kind": "apply"}, {"q_en": "The primary current of a step-up transformer is 70 A, and its turns ratio is 700. What is the current in the secondary (tube) side?", "q_ar": "التيار الابتدائي لمحوّل رافع 70 A، ونسبة لفّاته 700. ما التيار في الجانب الثانوي (جانب الأنبوب)؟", "options": [{"en": "49,000 A", "ar": "49,000 A"}, {"en": "10 A", "ar": "10 A"}, {"en": "700 mA", "ar": "700 mA"}, {"en": "100 mA", "ar": "100 mA"}], "answer": 3, "why": "الجهد يرتفع بنسبة اللفّات والتيار ينخفض بالنسبة نفسها: 70 ÷ 700 = 0.1 A = 100 mA.", "kind": "apply"}, {"q_en": "An engineer removes the rectifier unit from the high-voltage circuit. What problem would this cause for the X-ray tube?", "q_ar": "أزال مهندس وحدة التقويم من دائرة الجهد العالي. ما المشكلة التي يسبّبها ذلك لأنبوب الأشعة؟", "options": [{"en": "The tube would get AC, but it needs DC", "ar": "سيتلقى الأنبوب تياراً متناوباً، وهو يحتاج تياراً مستمراً"}, {"en": "The tube would get a lower kVp only", "ar": "سيتلقى الأنبوب كيلوفولتاً أقل فقط"}, {"en": "The filament could no longer be heated", "ar": "لن يمكن تسخين الفتيلة"}, {"en": "The kVp could no longer be selected", "ar": "لن يمكن اختيار الكيلوفولت"}], "answer": 0, "why": "المحوّلات تعمل بالتيار المتناوب، أما أنبوب الأشعة فيحتاج تياراً مستمراً؛ والتقويم بالثنائيات هو الذي يحوّل المتناوب إلى مستمر.", "kind": "apply"}, {"q_en": "Generator A works with 100% voltage ripple, and generator B with only a few percent ripple. Which one produces X-rays more efficiently, and why?", "q_ar": "المولّد A يعمل بتموّج جهد 100%، والمولّد B بتموّج بضعة بالمئة فقط. أيّهما يُنتج الأشعة بكفاءة أعلى، ولماذا؟", "options": [{"en": "A, as more ripple gives more photons", "ar": "المولّد A، لأن التموّج الأكبر يعطي فوتونات أكثر"}, {"en": "Both, since the set kVp is the same", "ar": "الاثنان متساويان، لأن الكيلوفولت المضبوط نفسه"}, {"en": "B, as less ripple wastes less voltage", "ar": "المولّد B، لأن التموّج الأقل يهدر جهداً أقل"}, {"en": "Neither; ripple changes only the mA", "ar": "لا فرق؛ التموّج يغيّر الملي أمبير فقط"}], "answer": 2, "why": "التموّج هو هبوط الجهد عن الذروة، ويمثّل كفاءة إنتاج الأشعة: كلما زاد التموّج قلّت الكفاءة؛ فالمولّد B ذو التموّج الأقل يبقى جهده قريباً من الذروة وهو الأكفأ.", "kind": "apply"}, {"q_en": "A single-phase generator is set to 80 kVp. Because its ripple is 100%, during each pulse the voltage across the tube falls to:", "q_ar": "مولّد أحادي الطور مضبوط على 80 kVp. ولأن تموّجه 100%، ينخفض الجهد على الأنبوب في كل نبضة إلى:", "options": [{"en": "About 70 kV", "ar": "نحو 70 kV"}, {"en": "About 40 kV and never lower", "ar": "نحو 40 kV ولا ينخفض أكثر"}, {"en": "Zero", "ar": "صفر"}, {"en": "It never falls; it stays at 80 kV", "ar": "لا ينخفض أبداً؛ يبقى 80 kV"}], "answer": 2, "why": "التموّج 100% يعني أن الجهد يهبط من الذروة حتى الصفر؛ «A kVp of zero accompanies 100% ripple».", "kind": "apply"}, {"q_en": "A new general room needs the shortest exposure times and a longer x-ray tube life. Based on the lecture, which generator type fits best?", "q_ar": "غرفة عامة جديدة تحتاج إلى أقصر أزمنة تعرّض وعمر أطول لأنبوب الأشعة. بحسب المحاضرة، أيّ نوع من المولّدات أنسب؟", "options": [{"en": "Single-phase half-wave generator", "ar": "مولّد أحادي الطور بتقويم نصف موجي"}, {"en": "Single-phase full-wave generator", "ar": "مولّد أحادي الطور بتقويم موجي كامل"}, {"en": "A generator without rectification", "ar": "مولّد بلا تقويم"}, {"en": "High-frequency generator", "ar": "المولّد عالي التردد"}], "answer": 3, "why": "من أسباب انتشار المولّدات عالية التردد: أقصر زمن تعرّض، وزيادة عمر أنبوب الأشعة، وموجة جهد شبه ثابتة.", "kind": "apply"}, {"q_en": "An X-ray unit produces too little tube current because its filament is not heated enough. Which component controls the filament temperature?", "q_ar": "جهاز أشعة يُنتج تيار أنبوب قليلاً جداً لأن فتيلته لا تسخن بما يكفي. أيّ مكوّن يتحكم بدرجة حرارة الفتيلة؟", "options": [{"en": "The mA selector (rheostat) in the filament circuit", "ar": "منتقي الملي أمبير (مقاومة متغيّرة) في دائرة الفتيلة"}, {"en": "The rectifier unit in the secondary circuit", "ar": "وحدة التقويم في الدائرة الثانوية"}, {"en": "The step-up transformer in the secondary circuit", "ar": "المحوّل الرافع في الدائرة الثانوية"}, {"en": "The autotransformer in the primary circuit", "ar": "المحوّل الذاتي في الدائرة الابتدائية"}], "answer": 0, "why": "منتقي mA مقاومة متغيّرة تتحكم بحرارة الفتيلة، وهذه تحدد عدد الإلكترونات المنبعثة أي تيار الأنبوب.", "kind": "apply"}, {"q_en": "When the radiographer sets the kVp on the console, which component of the primary circuit is being adjusted?", "q_ar": "عندما يضبط المصوّر قيمة kVp على لوحة التحكم، أيّ مكوّن من مكوّنات الدائرة الابتدائية يُعدَّل؟", "options": [{"en": "The filament step-down transformer", "ar": "محوّل الفتيلة الخافض"}, {"en": "The autotransformer", "ar": "المحوّل الذاتي"}, {"en": "The rectifier unit", "ar": "وحدة التقويم"}, {"en": "The exposure timer", "ar": "مؤقّت التعرّض"}], "answer": 1, "why": "المحوّل الذاتي يعدّل الجهد الداخل إلى المحوّل الرافع، فيسمح للمصوّر بضبط الكيلوفولت المطلوب.", "kind": "apply"}, {"q_en": "A department replaces a single-phase unit with a high-frequency unit and keeps the same kVp and mA. What change in photon output should be expected?", "q_ar": "استبدل قسمٌ جهازاً أحادي الطور بجهاز عالي التردد مع الكيلوفولت والملي أمبير نفسيهما. ما التغيّر المتوقّع في عدد الفوتونات؟", "options": [{"en": "Lower photon quantity, so more mAs is needed", "ar": "عدد فوتونات أقل، فنحتاج mAs أكثر"}, {"en": "No change, because kVp and mA are the same", "ar": "لا تغيير، لأن kVp وmA متساويان"}, {"en": "Higher photon quantity, so less mAs may be needed", "ar": "عدد فوتونات أكبر، فقد نحتاج mAs أقل"}, {"en": "More soft x-rays and a higher patient dose", "ar": "أشعة لينة أكثر وجرعة أعلى للمريض"}], "answer": 2, "why": "بالعوامل الفنية نفسها تنتج المولّدات عالية التردد كمية فوتونات أكبر من المولّدات الأقل طوراً، فتقلّ الحاجة إلى mAs عالٍ.", "kind": "apply"}, {"q_en": "The hospital supplies an X-ray unit with 220 V AC, but the tube needs about 80 kV to accelerate electrons. Which unit performs this conversion?", "q_ar": "يغذّي المستشفى جهاز الأشعة بجهد متناوب 220 V، لكن الأنبوب يحتاج إلى نحو 80 kV لتسريع الإلكترونات. أيّ وحدة تقوم بهذا التحويل؟", "options": [{"en": "The line compensator alone", "ar": "معوّض جهد الخط وحده"}, {"en": "The filament step-down transformer", "ar": "محوّل الفتيلة الخافض"}, {"en": "The exposure timer", "ar": "مؤقّت التعرّض"}, {"en": "The high voltage generator", "ar": "مولّد الجهد العالي"}], "answer": 3, "why": "مولّد الجهد العالي هو وحدة القدرة الأساسية: يحوّل الجهد المنخفض الداخل (120–440 VAC) إلى جهد عالٍ (30–150 kV طبياً) لتسريع الإلكترونات.", "kind": "apply"}, {"q_en": "Look at the circuit and the output waveform in this drawing. Which type of rectification does it show?", "q_ar": "انظر إلى الدائرة وشكل الموجة الخارجة في هذا الرسم. أيّ نوع من التقويم يبيّن؟", "options": [{"en": "Full-wave rectification", "ar": "التقويم الموجي الكامل"}, {"en": "Three-phase six-pulse power", "ar": "القدرة ثلاثية الطور بست نبضات"}, {"en": "Half-wave rectification", "ar": "التقويم بنصف موجة"}, {"en": "High-frequency output", "ar": "خرج عالي التردد"}], "answer": 2, "why": "المحاضرة: في التقويم بنصف موجة يُحذف الجهد العكسي ولا يُسمح للجهد بالنزول خلال النصف السالب، وHalf – wave rectification is accomplished with two diodes.", "kind": "image", "img": {"src": "assets/quiz-img/equipment-t02/equipment-t02-eab65e.jpg", "alt_ar": "رسم دائرة تقويم مع شكل الموجة الخارجة منها", "alt_en": "Rectifier circuit drawing with its output waveform", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "This circuit has four diodes, and the output pulses follow each other with no gap. What happens to the negative half-cycle here?", "q_ar": "تحتوي هذه الدائرة على أربعة صمامات ثنائية، والنبضات الخارجة متتالية بلا فراغ. ماذا يحدث لنصف الدورة السالب هنا؟", "options": [{"en": "It is removed, leaving a gap in each cycle", "ar": "يُحذف فيبقى فراغ في كل دورة"}, {"en": "It is reversed so it stays positive", "ar": "يُعكس فيبقى موجباً"}, {"en": "It is stored in the autotransformer windings", "ar": "يُخزَّن في ملفّات المحوّل الذاتي"}, {"en": "It becomes the filament heating current", "ar": "يصبح تيار تسخين الفتيلة"}], "answer": 1, "why": "المحاضرة: دائرة التقويم الكامل فيها أربعة صمامات على الأقل، وthe negative half – cycle … is reversed so that a positive voltage is always directed across the x – ray tube.", "kind": "image", "img": {"src": "assets/quiz-img/equipment-t02/equipment-t02-7f3929.jpg", "alt_ar": "دائرة: محوّل ثم أربعة صمامات ثنائية وأنبوب الأشعة، والنبضات متتالية بلا فراغ", "alt_en": "Circuit: transformer, four diodes and the X-ray tube; pulses follow each other with no gap", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "The high-voltage transformer of the X-ray machine is the type in the top drawing. Why does it raise the voltage?", "q_ar": "محوّل الجهد العالي في جهاز الأشعة من نوع الرسم العلوي. لماذا يرفع الجهد؟", "options": [{"en": "Its primary coil has more windings than its secondary", "ar": "لأن ملفّه الابتدائي أكثر لفّات من الثانوي"}, {"en": "It works on direct current", "ar": "لأنه يعمل بالتيار المستمر"}, {"en": "Its secondary coil has more windings than its primary", "ar": "لأن ملفّه الثانوي أكثر لفّات من الابتدائي"}, {"en": "It has a single winding on the iron core", "ar": "لأن له ملفاً واحداً على القلب الحديدي"}], "answer": 2, "why": "المحاضرة: محوّل الجهد العالي رافع للجهد because the number of secondary windings is greater than the number of primary windings، والجهد يزيد بنسبة اللفّات.", "kind": "image", "img": {"src": "assets/quiz-img/equipment-t02/equipment-t02-f27416.jpg", "alt_ar": "رسم لمحوّلَين: الأعلى رافع للجهد والأسفل خافض له، مع معادلة نسبة اللفات", "alt_en": "Step-up (top) and step-down (bottom) transformers with the turns-ratio equation", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "In this comparison of generator waveforms, which generator gives the lowest voltage ripple?", "q_ar": "في هذه المقارنة بين أشكال موجات المولّدات، أيّ مولّد يعطي أقل تموّج في الجهد؟", "options": [{"en": "Three-phase twelve-pulse", "ar": "ثلاثي الطور باثنتي عشرة نبضة"}, {"en": "Single-phase full-wave", "ar": "أحادي الطور بتقويم كامل"}, {"en": "Three-phase six-pulse", "ar": "ثلاثي الطور بست نبضات"}, {"en": "High-frequency", "ar": "عالي التردد"}], "answer": 3, "why": "المحاضرة: موجة المولّد عالي التردد بعد التقويم والتنعيم has less than 1 % ripple، وهو أفضل من القدرة ثلاثية الطور.", "kind": "image", "img": {"src": "assets/quiz-img/equipment-t02/equipment-t02-e7e8ae.jpg", "alt_ar": "أشكال الموجة لخمسة أنواع من المولّدات مع نسبة التموّج", "alt_en": "Waveforms of five generator types with their ripple", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}, {"q_en": "In this figure, the half-wave and full-wave outputs fall well below peak kVp in every pulse. According to the lecture, what kind of X-ray beam does such a voltage produce?", "q_ar": "في هذا الشكل، خرج نصف الموجة والموجة الكاملة يهبط كثيراً تحت ذروة الكيلوفولت في كل نبضة. بحسب المحاضرة، أيّ نوع من حزم الأشعة ينتج عن هذا الجهد؟", "options": [{"en": "Photons all at the peak energy", "ar": "فوتونات كلها بطاقة الذروة"}, {"en": "Photons with a wide energy spectrum", "ar": "فوتونات بطيف واسع من الطاقات"}, {"en": "Photons with a higher mean energy", "ar": "فوتونات بمتوسط طاقة أعلى"}, {"en": "No photons between the peaks at all", "ar": "لا فوتونات أبداً بين القمم"}], "answer": 1, "why": "المحاضرة: الجهد الذي يهبط تحت ذروة الكيلوفولت يُنتج فوتونات بطيف واسع من الطاقات، ومتوسط طاقتها أقل من الذروة؛ لذلك يكون متوسط الطاقة في المولّد أحادي الطور أقل.", "kind": "image", "img": {"src": "assets/quiz-img/equipment-t02/equipment-t02-e7e8ae.jpg", "alt_ar": "أشكال الموجة لخمسة أنواع من المولّدات مع نسبة التموّج", "alt_en": "Waveforms of five generator types with their ripple", "credit": "محاضرة الأستاذ", "credit_en": "the lecture"}}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/أجهزة الأشعة التقليدية/نظري/م02 - مولّدات الجهد العالي"}</script>

// 👤 «مساحتي»: تتبّع خفيف + 📝 ملاحظة من مكانها + مزامنة الحساب إذا الطالب مسجّل.
document.addEventListener("DOMContentLoaded", () => {
  Track.start();
  const man0 = document.querySelector('link[rel="manifest"]'), rootP = man0 ? new URL(".", man0.href).pathname : "/";   // 🌿 v3 حي: من جذر الموقع (مو بس /preview/)
  const p0 = location.pathname.startsWith(rootP) ? location.pathname.slice(rootP.length) : location.pathname;
  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");
  const L = (() => { try { return JSON.parse(document.body.dataset.lecture || "null"); } catch (e) { return null; } })();
  if (/^(learn|quiz)\/[^/]+\/[^/]+\/\d+\/$/.test(rel) || /^atlas\/[^/]+\/[^/]+\/$/.test(rel))   // 📍 وين وصلت (نفس شكل tools.js)
    try { localStorage.setItem("t:last", JSON.stringify({ url: rel, title: (L && L.title) || document.title.split("—")[0].trim(), sub: L ? L.sub : "", tab: rel.startsWith("quiz") ? "quiz" : "read", t: Date.now() })); } catch (e) {}
  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {
    let b = h.querySelector(":scope > .nadd");   // ⚡ (30/10) الزر مرسوم بالـ HTML من البناء (بلا قفزة)؛ إذا مو موجود نسوّيه مثل قبل
    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "tnote"; b.textContent = "📝"; b.setAttribute("aria-label", "ملاحظة على المصطلح " + t);
    (pop.querySelector(".pb") || pop).appendChild(b);
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق
      if (!dock) { dock = document.createElement("div"); dock.className = "nqdock"; document.body.appendChild(dock); }
      const sec = document.querySelector(`.tm[data-k="${CSS.escape(k.k)}"]`);
      const ctx = Object.assign(Notes.context(sec) || {}, { kind: L ? "lecture" : "term", key: k.k, title: L ? L.title : t });
      Notes.quick(dock, { into: dock, ctx, links: [{ type: "term", key: k.k, title: t }], prefill: t + ": ", forId: "term:" + k.k, returnTo: document.querySelector(".tm.on") || sec });
    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
