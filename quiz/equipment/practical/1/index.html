ي المساء ينخفض جهد المستشفى عن 220 فولت. أي جزء في لوحة التحكم يرجّع الجهد إلى 220 فولت بالضبط؟", "options": [{"en": "The line compensator, using a voltmeter and a control", "ar": "معوّض الخط، بفولتميتر وأداة ضبط"}, {"en": "The rectifier unit of the secondary circuit", "ar": "وحدة التقويم في الدائرة الثانوية"}, {"en": "The filament step-down transformer", "ar": "محوّل الفتيلة الخافض"}, {"en": "The exposure timer of the primary circuit", "ar": "مؤقّت التعرّض في الدائرة الابتدائية"}], "answer": 0, "why": "المحاضرة: لأن جهد المستشفى قد يتذبذب، يضبط معوّض الخط الجهد إلى 220 فولت بالضبط باستعمال فولتميتر لقياسه وأداة لضبطه.", "kind": "apply"}, {"q_en": "A thick body part needs a more penetrating beam. Which setting should the radiographer increase?", "q_ar": "جزء سميك من الجسم يحتاج حزمة أعلى قدرة اختراق. أي إعداد يرفعه المصوّر الشعاعي؟", "options": [{"en": "mA only, keeping kVp unchanged", "ar": "mA فقط مع بقاء kVp كما هو"}, {"en": "kVp", "ar": "kVp"}, {"en": "Exposure time only", "ar": "زمن التعرّض فقط"}, {"en": "Line compensation above 220 V", "ar": "معاوضة الخط فوق 220 فولت"}], "answer": 1, "why": "المحاضرة: kVp يتحكم بقدرة اختراق الحزمة (النوعية)، وmAs يتحكم بالكمية؛ فلزيادة قدرة الاختراق نرفع kVp.", "kind": "apply"}, {"q_en": "To double the number of X-rays without changing beam penetration, the radiographer should:", "q_ar": "لمضاعفة عدد الأشعة دون تغيير قدرة اختراق الحزمة، على المصوّر الشعاعي أن:", "options": [{"en": "Double the kVp and keep the mAs the same", "ar": "يضاعف kVp ويُبقي mAs كما هو"}, {"en": "Halve the exposure time and keep the mA the same", "ar": "ينصّف زمن التعرّض ويُبقي mA كما هو"}, {"en": "Double the mAs and keep the kVp the same", "ar": "يضاعف mAs ويُبقي kVp كما هو"}, {"en": "Lower the line voltage from 220 V to 110 V", "ar": "يخفّض جهد الخط من 220 إلى 110 فولت"}], "answer": 2, "why": "المحاضرة: kVp = النوعية (قدرة الاختراق)، وmAs = الكمية؛ فمضاعفة mAs تضاعف كمية الأشعة وقدرة الاختراق تبقى كما هي.", "kind": "apply"}, {"q_en": "A radiographer selects 200 mA and an exposure time of 0.1 s. The mAs is:", "q_ar": "اختار المصوّر الشعاعي 200 mA وزمن تعرّض 0.1 ثانية. قيمة mAs هي:", "options": [{"en": "2 mAs", "ar": "2 mAs"}, {"en": "200 mAs", "ar": "200 mAs"}, {"en": "2000 mAs", "ar": "2000 mAs"}, {"en": "20 mAs", "ar": "20 mAs"}], "answer": 3, "why": "المحاضرة: mAs = mA مضروباً في زمن التعرّض، أي 200 × 0.1 = 20 mAs.", "kind": "apply"}, {"q_en": "When the mA selector is set higher, what happens inside the tube?", "q_ar": "عند رفع منتقي mA، ماذا يحدث داخل الأنبوب؟", "options": [{"en": "The filament gets hotter and emits more electrons, so more X-rays are produced", "ar": "الفتيلة تسخن أكثر وتبعث إلكترونات أكثر، فتُنتج أشعة أكثر"}, {"en": "The electrons travel faster and the wavelength becomes shorter", "ar": "الإلكترونات تسرع أكثر ويقصر الطول الموجي"}, {"en": "The voltage rises from 40 kV to 150 kV", "ar": "الجهد يرتفع من 40 إلى 150 كيلوفولت"}, {"en": "The rectifier changes more AC into DC for a harder beam", "ar": "المقوّم يحوّل تياراً متناوباً أكثر إلى مستمر لحزمة أصلب"}], "answer": 0, "why": "المحاضرة: منتقي mA يتحكم بحرارة الفتيلة؛ حرارة أعلى ← إلكترونات أكثر ← أشعة أكثر وحزمة أقوى. أما سرعة الإلكترونات وقِصر الموجة فتأثير kVp.", "kind": "apply"}, {"q_en": "Using a low kilovoltage produces which type of X-rays?", "q_ar": "استعمال جهد كيلوفولت منخفض يُنتج أي نوع من الأشعة؟", "options": [{"en": "Hard X-rays: short wavelength and high penetration", "ar": "أشعة صلبة: طول موجي قصير وقدرة اختراق عالية"}, {"en": "Soft X-rays: long wavelength and low penetration", "ar": "أشعة ليّنة: طول موجي طويل وقدرة اختراق منخفضة"}, {"en": "Hard X-rays: low frequency and high energy", "ar": "أشعة صلبة: تردد منخفض وطاقة عالية"}, {"en": "Soft X-rays: high frequency and high penetration", "ar": "أشعة ليّنة: تردد عالٍ وقدرة اختراق عالية"}], "answer": 1, "why": "المحاضرة: كلما ارتفع kV قصر الطول الموجي (أشعة صلبة)؛ والجهد المنخفض يعطي أشعة ليّنة: طول موجي أطول وتردد وطاقة وقدرة اختراق منخفضة.", "kind": "apply"}, {"q_en": "Which order follows the electrical path from the hospital supply to the x-ray tube?", "q_ar": "أي ترتيب يتبع مسار الكهرباء من مصدر المستشفى إلى أنبوب الأشعة؟", "options": [{"en": "Rectifier → step-up transformer → line compensator → autotransformer → tube", "ar": "المقوّم ← المحوّل الرافع ← معوّض الخط ← المحوّل الذاتي ← الأنبوب"}, {"en": "Step-up transformer → line compensator → rectifier → autotransformer → tube", "ar": "المحوّل الرافع ← معوّض الخط ← المقوّم ← المحوّل الذاتي ← الأنبوب"}, {"en": "Line compensator → autotransformer → step-up transformer → rectifier → tube", "ar": "معوّض الخط ← المحوّل الذاتي ← المحوّل الرافع ← المقوّم ← الأنبوب"}, {"en": "Autotransformer → rectifier → line compensator → step-up transformer → tube", "ar": "المحوّل الذاتي ← المقوّم ← معوّض الخط ← المحوّل الرافع ← الأنبوب"}], "answer": 2, "why": "المحاضرة: الدائرة الابتدائية فيها معوّض الخط ثم المحوّل الذاتي الذي يضبط الجهد للمحوّل الرافع؛ وفي الدائرة الثانوية المحوّل الرافع (40–150 kV) ثم وحدة التقويم التي تحوّل المتناوب إلى مستمر قبل الأنبوب.", "kind": "apply"}], "_dir": "/Users/mohammedalmusawy/Desktop/المحاضرات/أجهزة الأشعة التقليدية/عملي/م01 - منظومة جهاز الأشعة السينية (التجربتان 1 و2)"}</script>

});
