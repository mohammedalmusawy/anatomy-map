", "ar": "أنابيب الأشعة متعددة الأغراض"}, {"en": "High-intensity CT scanners", "ar": "أجهزة المفراس عالية الشدة"}, {"en": "Fluoroscopy only", "ar": "التنظير فقط"}], "answer": 0, "why": "المحاضرة: الأنود الثابت يُستعمل في أجهزة الأسنان والأجهزة المحمولة والأنظمة منخفضة القدرة."}, {"q_en": "Under standard techniques, the anode disc rotates at:", "q_ar": "بالتقنيات القياسية يدور قرص الأنود بسرعة:", "options": [{"en": "3,200 rpm", "ar": "3,200 دورة/دقيقة"}, {"en": "320 rpm", "ar": "320 دورة/دقيقة"}, {"en": "10,000 rpm", "ar": "10,000 دورة/دقيقة"}, {"en": "60 rpm", "ar": "60 دورة/دقيقة"}], "answer": 0, "why": "المحاضرة: قرص الأنود يدور 3,200 دورة/دقيقة بالتقنيات القياسية، وأكثر من 5,000 بالإعدادات العالية."}, {"q_en": "In rotating anodes, the target is:", "q_ar": "في الأنود الدوّار يكون الهدف:", "options": [{"en": "A small tungsten insert in copper", "ar": "قطعة تنغستن صغيرة في النحاس"}, {"en": "The focusing cup", "ar": "كأس التركيز"}, {"en": "The entire rotating disc", "ar": "القرص الدوّار كله"}, {"en": "The glass envelope", "ar": "الغلاف الزجاجي"}], "answer": 2, "why": "المحاضرة: في الأنود الدوّار يعمل القرص الدوّار كله هدفاً."}, {"q_en": "Tungsten is alloyed with rhenium to provide:", "q_ar": "يُخلط التنغستن مع الرينيوم ليعطي:", "options": [{"en": "A lower atomic number", "ar": "عدداً ذرياً أقل"}, {"en": "Additional mechanical strength under high rotational stress", "ar": "قوة ميكانيكية إضافية تحت إجهاد الدوران العالي"}, {"en": "Better electron emission from the filament", "ar": "انبعاثاً أفضل للإلكترونات من الفتيلة"}, {"en": "Electrical insulation", "ar": "عزلاً كهربائياً"}], "answer": 1, "why": "المحاضرة: يُخلط التنغستن مع الرينيوم ليعطي قوة ميكانيكية إضافية تحت إجهاد الدوران العالي."}, {"q_en": "The atomic number of tungsten is:", "q_ar": "العدد الذري للتنغستن:", "options": [{"en": "29", "ar": "29"}, {"en": "42", "ar": "42"}, {"en": "74", "ar": "74"}, {"en": "82", "ar": "82"}], "answer": 2, "why": "المحاضرة: العدد الذري للتنغستن 74، لذلك ينتج الأشعة بكفاءة أعلى."}, , {"en": "The size of the filament", "ar": "حجم الفتيلة"}, {"en": "The size of the tube window", "ar": "حجم نافذة الأنبوب"}], "answer": 0, "why": "المحاضرة: البؤرة الفعّالة هي حجم البؤرة الظاهري كما يُرى من مستقبِل الصورة، وتحدّده زاوية الأنود."}, {"q_en": "The common anode angle is:", "q_ar": "زاوية الأنود الشائعة:", "options": [{"en": "24°", "ar": "24 درجة"}, {"en": "12°", "ar": "12 درجة"}, {"en": "45°", "ar": "45 درجة"}, {"en": "90°", "ar": "90 درجة"}], "answer": 1, "why": "المحاضرة: زاوية الأنود الشائعة 12 درجة."}, {"q_en": "A smaller anode angle gives:", "q_ar": "زاوية الأنود الأصغر تعطي:", "options": [{"en": "A smaller EFS and a sharper image", "ar": "بؤرة فعّالة أصغر وصورة أوضح"}, {"en": "A larger EFS and a less sharp image", "ar": "بؤرة فعّالة أكبر وصورة أقل وضوحاً"}, {"en": "Better heat distribution only", "ar": "توزيع حرارة أفضل فقط"}, {"en": "No change in image sharpness", "ar": "لا تغيّر في حدّة الصورة"}], "answer": 0, "why": "المحاضرة: زاوية أصغر ← بؤرة فعّالة أصغر ← صورة أوضح."}, {"q_en": "In the anode heel effect, the higher intensity is on the:", "q_ar": "في تأثير الكعب تكون الشدة الأعلى في جهة:", "options": [{"en": "Anode side", "ar": "الأنود"}, {"en": "Window side only", "ar": "النافذة فقط"}, {"en": "Center and anode equally", "ar": "المركز والأنود بالتساوي"}, {"en": "Cathode side", "ar": "الكاثود"}], "answer": 3, "why": "المحاضرة: جهة الكاثود شدتها أعلى (حزمة أقوى)، وجهة الأنود أقل."}, {"q_en": "Clinically, the cathode side should be positioned over:", "q_ar": "سريرياً، توضع جهة الكاثود فوق:", "options": [{"en": "The thinnest anatomy", "ar": "الجزء الأرق من الجسم"}, {"en": "The image receptor edge", "ar": "حافة مستقبِل الصورة"}, {"en": "The denser anatomy", "ar": "الجزء الأكثف من الجسم"}, {"en": "The operator", "ar": "العامل"}], "answer": 2, "why": "المحاضرة: توضع جهة الكاثود فوق الجزء الأكثف حيث نحتاج اختراقاً أكبر."}, {"q_en": "A larger anode angle leads to:", "q_ar": "زاوية الأنود الأكبر تؤدي إلى:", "options": [{"en": "Reduced heel effect", "ar": "تأثير كعب أقل"}, {"en": "Larger heel effect", "ar": "تأثير كعب أكبر"}, {"en": "Smaller effective focal spot", "ar": "بؤرة فعّالة أصغر"}, {"en": "No heel effect at all", "ar": "انعدام تأثير الكعب تماماً"}], "answer": 0, "why": "المحاضرة: زاوية أنود أكبر ← بؤرة فعّالة أكبر ← تأثير كعب أقل."}, {"q_en": "The vacuum inside the tube envelope:", "q_ar": "الفراغ داخل غلاف الأنبوب:", "options": [{"en": "Increases heat production", "ar": "يزيد إنتاج الحرارة"}, {"en": "Ensures free movement of electrons from cathode to anode", "ar": "يضمن حركة حرة للإلكترونات من الكاثود إلى الأنود"}, {"en": "Decreases electron flow", "ar": "يقلّل تدفّق الإلكترونات"}, {"en": "Shortens tube life", "ar": "يقصّر عمر الأنبوب"}], "answer": 1, "why": "المحاضرة: الفراغ يضمن حركة حرة للإلكترونات من الكاثود إلى الأنود، ويقلّل الحرارة ويطيل العمر."}, {"q_en": "Compared with the glass envelope, the metal envelope:", "q_ar": "مقارنةً بالغلاف الزجاجي، الغلاف المعدني:", "options": [{"en": "Gets coated with tungsten vapor and causes arcing", "ar": "يتغطّى ببخار التنغستن ويسبّب التقوّس"}, {"en": "Shortens tube life", "ar": "يقصّر عمر الأنبوب"}, {"en": "Maintains stable electric potential and prevents arcing", "ar": "يحافظ على جهد ثابت ويمنع التقوّس"}, {"en": "Cannot maintain a vacuum", "ar": "لا يحافظ على الفراغ"}], "answer": 2, "why": "المحاضرة: الغلاف المعدني يحافظ على جهد ثابت فيمنع التقوّس ويطيل عمر الأنبوب."}, {"q_en": "The tube window is a thin section of the envelope of about:", "q_ar": "نافذة الأنبوب جزء رقيق من الغلاف مساحته نحو:", "options": [{"en": "50 cm²", "ar": "50 سم²"}, {"en": "5 cm²", "ar": "5 سم²"}, {"en": "0.5 mm²", "ar": "0.5 مم²"}, {"en": "500 cm²", "ar": "500 سم²"}], "answer": 1, "why": "المحاضرة: نافذة الأنبوب جزء رقيق مساحته نحو 5 سم² تخرج منه الحزمة المفيدة."}, {"q_en": "The protective housing is lined with:", "q_ar": "الغطاء الواقي مبطّن بـ:", "options": [{"en": "Copper", "ar": "النحاس"}, {"en": "Lead", "ar": "الرصاص"}, {"en": "Glass", "ar": "الزجاج"}, {"en": "Thorium", "ar": "الث ament is caused by:", "q_ar": "سبب تبخّر الفتيلة:", "options": [{"en": "Low filament current", "ar": "تيار فتيلة منخفض"}, {"en": "Metal bellows", "ar": "المنفاخ المعدني"}, {"en": "Excessive heating of the filament for a long period", "ar": "تسخين مفرط للفتيلة لمدة طويلة"}, {"en": "A large anode angle", "ar": "زاوية أنود كبيرة"}], "answer": 2, "why": "المحاضرة: سبب تبخّر الفتيلة تسخينها المفرط لمدة طويلة."}, {"q_en": "The remedy for kinking of the target material is:", "q_ar": "علاج التواء مادة الهدف:", "options": [{"en": "Adding 10% rhenium to 90% tungsten and slits in the target surface", "ar": "إضافة 10% رينيوم إلى 90% تنغستن وشقوق في سطح الهدف"}, {"en": "Adding 1-2% thorium to the filament", "ar": "إضافة 1–2% ثوريوم إلى الفتيلة"}, {"en": "Using a glass envelope", "ar": "استعمال غلاف زجاجي"}, {"en": "Using the highest power", "ar": "استعمال أعلى قدرة"}], "answer": 0, "why": "المحاضرة: العلاج إضافة 10% رينيوم إلى 90% تنغستن، وشقوق في سطح الهدف."}, {"q_en": "Roughening and pitting of the anode surface results in:", "q_ar": "تخشّن سطح الأنود وتنقّره يؤدي إلى:", "options": [{"en": "Higher x-ray output", "ar": "ناتج أشعة أعلى"}, {"en": "Sharper images", "ar": "صور أوضح"}, {"en": "Lower heat production", "ar": "حرارة أقل"}, {"en": "Diminished x-ray output", "ar": "نقص ناتج الأشعة"}], "answer": 3, "why": "المحاضرة: تخشّن الأنود يسبّب تشتّت الأشعة وامتصاص الهدف لها، فيقلّ ناتج الأشعة."}, {"q_en": "Glass/metal envelope failure (loss of vacuum) is caused by:", "q_ar": "سبب فشل الغلاف الزجاجي/المعدني (فقدان الفراغ):", "options": [{"en": "Using thoriated tungsten", "ar": "استعمال التنغستن المُضاف إليه الثوريوم"}, {"en": "Crazing of the glass due to different expansion coefficients of glass and metal", "ar": "تشعّر الزجاج بسبب اختلاف معاملات تمدّد الزجاج والمعدن"}, {"en": "Low exposure time", "ar": "زمن تعرّض قصير"}, {"en": "Proper shielding", "ar": "التدريع المناسب"}], "answer": 1, "why": "المحاضرة: سبب فشل الغلاف تشعّر الزجاج لاختلاف معاملات تمدّد الزجاج والمعدن."}, {"q_en": "The anode should be warmed up if the system was off for:", "q_ar": "يجب تسخين الأنود إذا كان الجهاز مطفأً لمدة:", "options": [{"en": "≥ 10 minutes", "ar": "10 دقائق أو أكثر"}, {"en": "≥ 2 hours", "ar": "ساعتين أو أكثر"}, {"en": "≥ 2 days only", "ar": "يومين أو أكثر فقط"}, {"en": "Any time, even 1 minute", "ar": "أي مدة حتى دقيقة واحدة"}], "answer": 1, "why": "المحاضرة: سخّن الأنود إذا كان الجهاز مطفأً ساعتين أو أكثر لمنع الصدمة الحرارية."}, {"q_en": "To preserve the tube, the lecture recommends:", "q_ar": "للمحافظة على الأنبوب توصي المحاضرة بـ:", "options": [{"en": "Lower mA and longer exposure time to reach the desired mAs", "ar": "mA أقل وزمن تعرّض أطول للوصول إلى mAs المطلوب"}, {"en": "Higher mA and shorter exposure time", "ar": "mA أعلى وزمن أقصر"}, {"en": "Long filament boost time", "ar": "زمن تعزيز طويل للفتيلة"}, {"en": "Skipping anode warm-up", "ar": "إهمال تسخين الأنود"}], "answer": 0, "why": "المحاضرة: التيار العالي يبخّر التنغستن، فنستعمل ملي أمبير أقل وزمن تعرّض أطول للوصول إلى القيمة المطلوبة."}]}</script>

  const rel = p0.replace(/^preview\//, "").replace(/index\.html$/, "");
  const L = (() => { try { return JSON.parse(document.body.dataset.lecture || "null"); } catch (e) { return null; } })();
  if (/^(learn|quiz)\/[^/]+\/[^/]+\/\d+\/$/.test(rel) || /^atlas\/[^/]+\/[^/]+\/$/.test(rel))   // 📍 وين وصلت (نفس شكل tools.js)
    try { localStorage.setItem("t:last", JSON.stringify({ url: rel, title: (L && L.title) || document.title.split("—")[0].trim(), sub: L ? L.sub : "", tab: rel.startsWith("quiz") ? "quiz" : "read", t: Date.now() })); } catch (e) {}
  // 📝 بكل قسم من المحاضرة
  document.querySelectorAll("section[id^='r-s'][data-sec] > h2").forEach((h) => {
    let b = h.querySelector(":scope > .nadd");   // ⚡ (30/10) الزر مرسوم بالـ HTML من البناء (بلا قفزة)؛ إذا مو موجود نسوّيه مثل قبل
    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "nadd"; b.textContent = "📝";
      b.setAttribute("aria-label", "ملاحظة على هالقسم"); b.title = "ملاحظة على هالقسم"; h.appendChild(b); }
    b.addEventListener("click", (ev) => { ev.stopPropagation(); Notes.quick(h, { ctx: Notes.context(b), returnTo: b, forId: h.parentNode.id }); });
  });
  // 📝 ببطاقة المصطلح (listen.js) — زر يضاف للبطاقة بس، بدون أي تعديل على listen.js
  let dock = null;
  const addTermBtn = (pop) => {
    if (pop.hidden || pop.querySelector(".tnote")) return;
    const k = (pop.querySelector("[data-k]") || {}).dataset, t = (pop.querySelector("b") || {}).textContent || "";
    if (!k || !k.k) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "tnote"; b.textContent = "📝"; b.setAttribute("aria-label", "ملاحظة على المصطلح " + t);
    (pop.querySelector(".pb") || pop).appendChild(b);
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const x = pop.querySelector(".tclose"); if (x) x.click(); else pop.hidden = true;   // البطاقة تتسد حتى ما تغطي الصندوق
      if (!dock) { dock = document.createElement("div"); dock.className = "nqdock"; document.body.appendChild(dock); }
      const sec = document.querySelector(`.tm[data-k="${CSS.escape(k.k)}"]`);
      const ctx = Object.assign(Notes.context(sec) || {}, { kind: L ? "lecture" : "term", key: k.k, title: L ? L.title : t });
      Notes.quick(dock, { into: dock, ctx, links: [{ type: "term", key: k.k, title: t }], prefill: t + ": ", forId: "term:" + k.k, returnTo: document.querySelector(".tm.on") || sec });
    });
  };
  new MutationObserver(() => { const p = document.getElementById("tpop"); if (p) addTermBtn(p); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  if (window.Sync) Sync.start();
});
</script><!--/me-hook--><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../../../sw.js", { updateViaCache: "none" });</script></body></html>
