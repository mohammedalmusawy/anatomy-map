<header class="top"><a class="back" href="../">‹ اختبر نفسك</a><span class="crumb"></span></header>
<h1>📕 أخطائي</h1><p class="sub">الأسئلة اللي غلطت بيها. تنشال وحدها لما تجاوبها صح مرتين ورا بعض. محفوظة على جهازك بس.</p>
<p id="empty" class="hint hidden">🎉 ماكو أخطاء محفوظة هسه. اختبر نفسك بأي محاضرة، والأسئلة اللي تغلط بيها تجي هنا.</p>
<section id="play">
  <div class="progress"><span id="count"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="q"><div class="qen" id="qen"></div><div class="qar" id="qar"></div></div>
  <div class="opts" id="opts"></div>
  <div class="fb hidden" id="fb"></div>
  <button class="next hidden" id="next">السؤال التالي</button>
</section>
<section id="result" class="result hidden">
  <div class="score" id="score"></div>
  <p class="msg" id="msg"></p>
  <div class="actions">
    <button class="btn" id="retry-wrong">أعد الأسئلة التي أخطأت فيها</button>
    <button class="btn ghost" id="retry-all">أعد الاختبار</button>
    <a class="btn plain" href="../">ارجع لـ«اختبر نفسك»</a>
  </div>
</section>
</div>
