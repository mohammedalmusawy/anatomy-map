<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم التشريح</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#f6f7fb);
  --card:var(--tg-theme-secondary-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#14161c);
  --hint:var(--tg-theme-hint-color,#7a8090);
  --accent:var(--tg-theme-button-color,#2f7cf6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --line:color-mix(in srgb,var(--hint) 22%,transparent);
  --body:color-mix(in srgb,var(--hint) 34%,var(--card));
  --bone:#e9dcc3; --muscle:#e26d5a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:var(--tg-theme-bg-color,#101318);--card:var(--tg-theme-secondary-bg-color,#1a1e26);
  --text:var(--tg-theme-text-color,#eef0f4);--hint:var(--tg-theme-hint-color,#8a91a2);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.en{font-family:Inter,system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.view{display:none}.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header h1{font-size:22px;margin:4px 0 2px;font-weight:700}
header p{margin:0;color:var(--hint);font-size:14px}

/* خريطة الجسم */
.mapwrap{position:relative;margin:14px 0 0;background:var(--card);border-radius:22px;padding:14px 8px 8px}
svg.body{display:block;width:100%;height:auto;max-height:66vh}
.rg{fill:var(--body);stroke:var(--card);stroke-width:1.5;transition:fill .2s}
.rg.live{fill:var(--accent);fill-opacity:.62;cursor:pointer}
.rg.live:hover,.rg.live.sel{fill-opacity:1;animation:none}
.rg.soon{cursor:pointer}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{fill-opacity:.95}}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--hint);margin:10px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:0;background:var(--card);color:var(--text);padding:10px 14px;border-radius:14px;font:inherit;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:baseline;gap:7px}
.chip b{font-weight:600}.chip .en{color:var(--hint);font-size:12px}

/* نافذة الاختيار */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s}
.sheet{position:fixed;inset-inline:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.open .sheet{transform:none}.open .sheet-bg{opacity:1;pointer-events:auto}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0;font-size:20px}.sheet .en.big{font-size:15px;color:var(--hint);display:block;margin-top:2px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pick button{border:0;border-radius:18px;padding:16px 10px;font:inherit;cursor:pointer;color:#2a1a10;text-align:center}
.pick .b{background:var(--bone)}.pick .m{background:var(--muscle);color:#fff}
.pick .ic{font-size:30px;display:block}.pick b{display:block;font-size:17px;margin-top:4px}
.pick .en{display:block;font-size:13px;opacity:.75}

/* صفحة الدرس */
.top{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;flex:none}
.top h1{margin:0;font-size:20px}.top .en{color:var(--hint);font-size:13px;display:block}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-size:14px;padding:9px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-text);font-weight:600}
.modes{display:flex;gap:6px;margin:-4px 0 12px;overflow-x:auto}
.modes button{flex:1;white-space:nowrap;border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:13px;padding:8px 10px;border-radius:999px;cursor:pointer}
.modes button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.modes button[hidden]{display:none}
.pane{display:none}.pane.on{display:block}
/* مسرح المجسّم: خلفية استوديو فاتحة مثل الأطالس */
.stage{position:relative;height:min(68vh,560px);border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 38%,#ffffff 0%,#eef0f3 45%,#cfd4dc 100%);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#5d6675;font-size:14px}
.tag{position:absolute;top:10px;inset-inline:10px;background:rgba(20,26,36,.88);backdrop-filter:blur(8px);color:#fff;border-radius:14px;
  padding:9px 14px;display:none;flex-direction:column;gap:2px;text-align:center;z-index:3}
.tag.on{display:flex}.tag b{font-size:16px}.tag span{font-size:14px;opacity:.8}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.lines line{stroke:#2b3442;stroke-width:1}.lines circle{fill:#fff;stroke:#2b3442;stroke-width:1.4}
.lines .sel line{stroke:#d4900a;stroke-width:1.6}.lines .sel circle{fill:#ffcc33;stroke:#9a6500}
.labels{position:absolute;inset:0;pointer-events:none;z-index:2;direction:ltr}
.lbl{position:absolute;transform:translateY(-50%);font:600 11px/1.15 Inter,system-ui,sans-serif;color:#1d2530;white-space:nowrap;
  pointer-events:auto;cursor:pointer;padding:2px 4px;border-radius:5px;background:rgba(255,255,255,.72)}
.lbl.r{text-align:left}.lbl.l{text-align:right;transform:translate(-100%,-50%)}
.lbl.sel{background:#ffcc33;color:#3b2a00}
.tools3d{position:absolute;bottom:10px;left:10px;display:flex;gap:6px;z-index:3}
.tools3d button{width:38px;height:38px;border:0;border-radius:11px;background:rgba(20,26,36,.78);color:#fff;font-size:17px;cursor:pointer}
.tools3d button.on{background:#2f7cf6}
.view-name{position:absolute;bottom:16px;right:12px;font:500 11px Inter,system-ui,sans-serif;color:#5d6675;z-index:3;direction:ltr}
.hint{font-size:13px;color:var(--hint);margin:8px 2px 0}
.term{cursor:pointer}.term.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.term .dot{width:10px;height:10px;border-radius:3px;flex:none}
.term .l{display:flex;align-items:center;gap:10px}
.photos{display:grid;gap:12px}
.photo{background:var(--card);border-radius:18px;overflow:hidden;cursor:zoom-in}
.photo img{display:block;width:100%;height:auto;background:#111}
.photo .cap{padding:10px 14px}.photo .cap b{display:block;font-size:15px}.photo .cap span{font-size:13px;color:var(--hint)}
.photo .credit{padding:0 14px 10px;margin:0}
.fig{background:#fff;border-radius:18px;overflow:hidden;cursor:zoom-in;position:relative}
.fig img{display:block;width:100%;height:auto}
.fig .zoomhint{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 9px;border-radius:9px}
.credit{font-size:11px;color:var(--hint);margin:6px 2px 0;direction:ltr;text-align:left}
.credit a{color:inherit}
.grp{margin-top:18px}
.grp h3{font-size:14px;color:var(--hint);margin:0 4px 8px;font-weight:600}
.terms{background:var(--card);border-radius:16px;overflow:hidden}
.term{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.term .en{font-weight:600;font-size:15px}
.term .ar{color:var(--hint);font-size:14px;text-align:left}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px;line-height:1.7}

/* تكبير الصورة */
.zoom{position:fixed;inset:0;background:#000;display:none;z-index:9}
.zoom.on{display:block}
.zoom .sc{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y pinch-zoom;direction:ltr}
.zoom img{display:block;background:#fff;width:200%;max-width:none}
.zoom .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2;border:0;width:42px;height:42px;border-radius:21px;
  background:rgba(0,0,0,.72);color:#fff;font-size:22px;cursor:pointer}
.zoom .zb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.zoom .zb button{border:0;width:46px;height:46px;border-radius:23px;background:rgba(0,0,0,.72);color:#fff;font-size:22px;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;
  font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <!-- ١. خريطة الجسم -->
  <section class="view on" id="v-map">
    <header>
      <h1>تعلّم التشريح</h1>
      <p>اضغط على أي جزء من الجسم، واختر العظام أو العضلات.</p>
    </header>
    <div class="mapwrap">
      <svg class="body" viewBox="0 0 200 420" aria-label="خريطة جسم الإنسان">
        <g id="half">
          <path class="rg soon" data-r="head" d="M100 12c14 0 23 11 23 26s-9 28-23 28-23-13-23-28 9-26 23-26z"/>
          <path class="rg soon" data-r="neck" d="M91 64h18l2 14H89z"/>
          <path class="rg soon" data-r="chest" d="M89 78h22l29 6c4 8 4 24 0 38l-6 30H66l-6-30c-4-14-4-30 0-38z"/>
          <path class="rg soon" data-r="abdomen" d="M66 154h68l-3 46H69z"/>
          <path class="rg soon" data-r="pelvis" d="M69 202h62l5 30H64z"/>
          <path class="rg live pulse" data-r="arm" d="M59 85c-11 3-17 12-19 25l-5 50 16 2 7-42z"/>
          <path class="rg live pulse" data-r="forearm" d="M35 164l16 2-4 60-15-1z"/>
          <path class="rg live pulse" data-r="hand" d="M31 228l16 1 3 18c1 8-1 16-5 19-3 3-9 3-12 0-4-4-5-12-4-20z"/>
          <path class="rg soon" data-r="thigh" d="M64 234h35l-2 88H75z"/>
          <path class="rg soon" data-r="leg" d="M75 326h22l-2 66H80z"/>
          <path class="rg soon" data-r="foot" d="M79 395h17l5 13c0 3-2 4-5 4H76c-3 0-4-2-3-5z"/>
        </g>
      </svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>متاح الآن</span><span><i style="background:var(--body)"></i>قريبًا</span></div>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- ٢. الدرس -->
  <section class="view" id="v-lesson">
    <div class="top">
      <button class="back" id="back" aria-label="رجوع">→</button>
      <div><h1 id="l-title"></h1><span class="en" id="l-en"></span></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-k="bones">🦴 العظام</button>
      <button data-k="muscles">💪 العضلات</button>
    </div>
    <div class="modes" id="modes">
      <button data-m="3d">🧊 مجسّم</button>
      <button data-m="photo">📷 صور حقيقية</button>
      <button data-m="fig">📖 رسم مؤشّر</button>
    </div>

    <!-- مجسّم ثلاثي الأبعاد -->
    <div class="pane" id="p-3d">
      <div class="stage" id="stage">
        <div class="loading" id="loading">جارٍ تحميل المجسّم…</div>
        <div class="tag" id="tag"><b class="en" id="tag-en"></b><span id="tag-ar"></span></div>
        <svg class="lines" id="lines"></svg>
        <div class="labels" id="labels"></div>
        <div class="tools3d">
          <button id="t-reset" title="المنظر الأمامي">⟲</button>
          <button id="t-flip" title="المنظر الخلفي">↻</button>
          <button id="t-labels" title="إظهار التأشيرات" class="on">🏷</button>
        </div>
        <div class="view-name" id="view-name">Anterior view · منظر أمامي</div>
      </div>
      <p class="hint">اسحب لتدوير المجسّم، وكبّره بإصبعين، واضغط على أي جزء لمعرفة اسمه.</p>
      <div class="credit">3D model: BodyParts3D, © The Database Center for Life Science · CC BY-SA 2.1 JP</div>
    </div>

    <!-- صور حقيقية -->
    <div class="pane" id="p-photo"></div>

    <!-- رسم مؤشّر -->
    <div class="pane" id="p-fig">
      <div class="fig" id="fig"><img id="l-img" alt=""><span class="zoomhint">اضغط للتكبير</span></div>
      <div class="credit" id="l-credit"></div>
    </div>

    <div id="l-note"></div>
    <div id="l-groups"></div>
  </section>
</main>

<div id="sheet"><div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet" role="dialog">
    <div class="grab"></div>
    <h2 id="s-title"></h2><span class="en big" id="s-en"></span>
    <div class="pick">
      <button class="b" data-k="bones"><span class="ic">🦴</span><b>العظام</b><span class="en">Bones</span></button>
      <button class="m" data-k="muscles"><span class="ic">💪</span><b>العضلات</b><span class="en">Muscles</span></button>
    </div>
  </div>
</div>

<div class="zoom" id="zoom"><button class="x" id="zx" aria-label="إغلاق">×</button>
  <div class="sc"><img id="z-img" alt=""></div>
  <div class="zb"><button id="z-out">−</button><button id="z-in">+</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const CREDIT = {
  "804": ["OpenStax College, Anatomy & Physiology", "CC BY 3.0", "https://commons.wikimedia.org/wiki/File:804_Humerus_and_Elbow.jpg"],

const REGIONS = {

      groups: [

    muscles: { img: "img/forearm-muscles.jpg", src: "1120",

      groups: [
        ["عظام الرسغ (Carpals) — الصف الداني", [["Scaphoid","الزورقي"],["Lunate","الهلالي"],["Triquetrum","المثلثي"],["Pisiform","الحِمَّصي"]]],
        ["عظام الرسغ (Carpals) — الصف القاصي", [["Trapezium","المربع المنحرف"],["Trapezoid","شبه المنحرف"],["Capitate","الكبير (الرأسي)"],["Hamate","الكُلّابي"]]],
        ["عظام المشط (Metacarpals 1–5)", [["Base","القاعدة"],["Shaft","الجسم"],["Head","الرأس"]]],
        ["السُّلاميات (Phalanges)", [["Proximal phalanx","السلامى الدانية"],["Middle phalanx","السلامى الوسطى"],["Distal phalanx","السلامى القاصية"],["Thumb (pollex)","الإبهام"]]]
      ]},
    muscles: { img: "img/hand-muscles.jpg", src: "1121",
      groups: [
        ["بارزة الإبهام (Thenar)", [["Abductor pollicis brevis","المبعِدة القصيرة للإبهام"],["Flexor pollicis brevis","المثنية القصيرة للإبهام"],["Opponens pollicis","المقابِلة للإبهام"],["Adductor pollicis","المقرِّبة للإبهام"]]],
        ["بارزة الخنصر (Hypothenar)", [["Abductor digiti minimi","المبعِدة للخنصر"],["Flexor digiti minimi brevis","المثنية القصيرة للخنصر"],["Opponens digiti minimi","المقابِلة للخنصر"]]],
        ["العضلات الوسطى", [["Lumbrical muscles","العضلات الدودية"],["Palmar interossei","بين العظام الراحية"],["Dorsal interossei","بين العظام الظهرية"]]],
        ["أربطة", [["Pisometacarpal ligament","الرباط الحِمَّصي المشطي"]]]
      ]}
  }
};
const SOON = {head:"الرأس",neck:"الرقبة",chest:"الصدر",abdomen:"البطن",pelvis:"الحوض",thigh:"الفخذ",leg:"الساق",foot:"القدم"};

// النص الثاني من الجسم: نسخة معكوسة من نفس المناطق (حتى يبقى الضغط عليها شغّال)
(() => { const h=document.getElementById("half"), m=h.cloneNode(true); m.removeAttribute("id");
  m.setAttribute("transform","translate(200 0) scale(-1 1)");
  m.querySelectorAll('[data-r="head"],[data-r="neck"],[data-r="chest"],[data-r="abdomen"],[data-r="pelvis"]').forEach(e=>e.remove());
  h.after(m); })();
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);
let cur = null, kind = "bones";

function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("on"),1600); }
function haptic(){ try{ tg && tg.HapticFeedback.selectionChanged(); }catch(e){} }

function openSheet(r){
  cur=r; $("s-title").textContent=REGIONS[r].ar; $("s-en").textContent=REGIONS[r].en;
  document.querySelectorAll(".rg").forEach(p=>p.classList.toggle("sel",p.dataset.r===r));
  $("sheet").classList.add("open"); haptic();
}
function closeSheet(){ $("sheet").classList.remove("open"); document.querySelectorAll(".rg.sel").forEach(p=>p.classList.remove("sel")); }

function show(view){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===view));
  window.scrollTo(0,0);
  if (tg) view==="v-lesson" ? tg.BackButton.show() : tg.BackButton.hide();
}
// صور عظام حقيقية (ويكيميديا، مجموعات متاحف وكليات): [الملف، الإنكليزي، العربي، الحقوق، الرابط]
const PHOTOS = {
  arm: [
    ["humerus-ant","Humerus — anterior view","عظم العضد — منظر أمامي","MAKY.OREL · CC0","Humerus_-_anterior.jpg"],
    ["humerus-post","Humerus — posterior view (two specimens)","عظم العضد — منظر خلفي (عيّنتان)","MAKY.OREL · CC0","Humerus_-_posterior_2.jpg"],
    ["elbow-articulated","Elbow: humerus, radius and ulna — anterior","المرفق: العضد والكعبرة والزند — منظر أمامي","Brian C. Goss · Public domain","AnteriorHumerusRadiusUlnaArticulated.jpg"]
  ],
  forearm: [
    ["radius-ant","Radius — anterior view (two specimens)","الكعبرة — منظر أمامي (عيّنتان)","MAKY.OREL · CC0","Radius_-_anterior.jpg"],
    ["radius-post","Radius — posterior view (two specimens)","الكعبرة — منظر خلفي (عيّنتان)","MAKY.OREL · CC0","Radius_-_posterior.jpg"],
    ["ulna","Ulna — anterolateral view (three specimens)","الزند — منظر أمامي وحشي (ثلاث عيّنات)","MAKY.OREL · CC0","Ulna_-_lateral,_anterior.jpg"]
  ],
  hand: [
    ["hand-skeleton","Bones of the hand — real skeleton","عظام اليد — هيكل حقيقي","Raul654 · CC BY-SA 3.0","Hand-bones.jpg"],
    ["wrist-carpals","Wrist: carpals with distal radius and ulna","الرسغ: عظام الرسغ مع نهايتي الكعبرة والزند","Brian C. Goss · Public domain","RightHumanAnteriorDistalRadiusUlnaCarpals.jpg"]
  ]
};
const GRP = {bone:"العظام",membrane:"الأغشية","carpal-p":"عظام الرسغ — الصف الداني","carpal-d":"عظام الرسغ — الصف القاصي",
  metacarpal:"عظام المشط (Metacarpals)",phalanx:"السُّلاميات (Phalanges)",anterior:"المجموعة الأمامية",posterior:"المجموعة الخلفية",
  thenar:"بارزة الإبهام (Thenar)",hypothenar:"بارزة الخنصر (Hypothenar)",central:"العضلات الوسطى"};
let mode="3d", PARTS=null;
const partsReady=fetch("models/parts.json").then(r=>r.json()).then(j=>PARTS=j);

function termList(groups, pick){
  $("l-groups").innerHTML=groups.map(([h,items])=>`<div class="grp"><h3>${h}</h3><div class="terms">`+
    items.map(t=>`<div class="term" data-key="${t.key||""}"><span class="l">${t.color?`<i class="dot" style="background:${t.color}"></i>`:""}<span class="en">${t.en}</span></span><span class="ar">${t.ar}</span></div>`).join("")+`</div></div>`).join("");
  if (pick) $("l-groups").querySelectorAll(".term").forEach(e=>e.addEventListener("click",()=>{ pick(e.dataset.key); $("stage").scrollIntoView({behavior:"smooth",block:"center"}); }));
}
function markTerm(key){
  document.querySelectorAll("#l-groups .term").forEach(e=>e.classList.toggle("sel",e.dataset.key===key));
}

async function lesson(r,k,m){
  cur=r; kind=k; mode=m||mode; const R=REGIONS[r], L=R[k], c=CREDIT[L.src];
  if (mode==="photo" && k!=="bones") mode="3d";
  $("l-title").textContent=R.ar+" · "+(k==="bones"?"العظام":"العضلات");
  $("l-en").textContent=R.en+" — "+(k==="bones"?"Bones":"Muscles");
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  document.querySelectorAll("#modes button").forEach(b=>{ b.classList.toggle("on",b.dataset.m===mode); b.hidden=b.dataset.m==="photo"&&k!=="bones"; });
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+mode));
  $("l-note").innerHTML=L.note&&mode!=="3d"?`<div class="note">${L.note}</div>`:"";
  show("v-lesson");

  if (mode==="fig"){
    $("l-img").src=L.img; $("l-img").alt=R.en;
    $("l-credit").innerHTML=`Figure: ${c[0]} · ${c[1]} · <a href="${c[2]}" target="_blank" rel="noopener">source</a>`;
    termList(L.groups.map(([h,items])=>[h,items.map(([en,ar])=>({en,ar}))]));
  } else if (mode==="photo"){
    $("p-photo").innerHTML=`<div class="photos">`+PHOTOS[r].map(([f,en,ar,by,src])=>`<div class="photo" data-img="img/real/${f}.jpg">
      <img src="img/real/${f}.jpg" alt="${en}" loading="lazy"><div class="cap"><b class="en">${en}</b><span>${ar}</span></div>
      <div class="credit">Photo: ${by} · <a href="https://commons.wikimedia.org/wiki/File:${src}" target="_blank" rel="noopener">source</a></div></div>`).join("")+`</div>`;
    $("p-photo").querySelectorAll(".photo").forEach(e=>e.addEventListener("click",ev=>{ if(ev.target.tagName!=="A") openZoom(e.dataset.img); }));
    $("l-groups").innerHTML=`<div class="note">قارن الصورة الحقيقية بالرسم المؤشّر والمجسّم حتى تثبت المعالم بذهنك.</div>`;
  } else {
    await partsReady;
    if (!window.Viewer3D) await new Promise(res=>addEventListener("viewer3d-ready",res,{once:true}));
    const key=r+"-"+k, list=PARTS[key];
    const groups=[]; list.forEach(p=>{ const g=GRP[p.grp]||p.grp; let e=groups.find(x=>x[0]===g); if(!e) groups.push(e=[g,[]]); e[1].push({...p,color:window.Viewer3D?.color(k,p.grp,p.key)}); });
    termList(groups, key2=>window.Viewer3D.select(key2));
    window.Viewer3D.show(key, k, list, p=>{ markTerm(p&&p.key); haptic(); });
  }
}

document.querySelectorAll(".rg").forEach(p=>p.addEventListener("click",()=>{
  const r=p.dataset.r; REGIONS[r] ? openSheet(r) : toast((SOON[r]||"هذا الجزء")+" — قريبًا");
}));
$("chips").innerHTML=Object.entries(REGIONS).map(([k,v])=>`<button class="chip" data-r="${k}"><b>${v.ar}</b><span class="en">${v.en.split(" (")[0]}</span></button>`).join("");
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.r)));
$("sheet-bg").addEventListener("click",closeSheet);
document.querySelectorAll(".pick button").forEach(b=>b.addEventListener("click",()=>{ closeSheet(); lesson(cur,b.dataset.k); }));
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{ haptic(); lesson(cur,b.dataset.k); }));
document.querySelectorAll("#modes button").forEach(b=>b.addEventListener("click",()=>{ haptic(); lesson(cur,kind,b.dataset.m); }));
const goBack=()=>{ if($("zoom").classList.contains("on")) return closeZoom(); show("v-map"); };
$("back").addEventListener("click",goBack);
if (tg) tg.BackButton.onClick(goBack);

let zw=200;
function setZoom(w){ zw=Math.max(100,Math.min(500,w)); $("z-img").style.width=zw+"%"; }
function openZoom(src){ $("z-img").src=src; setZoom(200); $("zoom").classList.add("on"); }
$("fig").addEventListener("click",()=>openZoom($("l-img").src));
function closeZoom(){ $("zoom").classList.remove("on"); }
$("zx").addEventListener("click",closeZoom);
$("z-in").addEventListener("click",()=>setZoom(zw+60));
$("z-out").addEventListener("click",()=>setZoom(zw-60));
</script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
// عارض المجسّمات بأسلوب الأطالس: إضاءة استوديو، مواد عظم وعضلة، وتأشيرات بخطوط جانبية
// كل جزء بالـ GLB عقدة باسم مفتاحه (p0, p1…)، والعظام المرجعية بمشهد العضلات اسمها ctx…
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// ألوان قريبة من الأطالس: عظم عاجي، وعضلة حمراء، وكل مجموعة بدرجة
const COLORS = {
  bones: {bone:"#ece2cc",membrane:"#b9cfe6","carpal-p":"#f2dcae","carpal-d":"#e9cf9a",metacarpal:"#ece2cc",phalanx:"#e4d8bd"},
  muscles: {anterior:"#c4402f",posterior:"#a8382c",thenar:"#c4402f",hypothenar:"#b23a3a",central:"#cf5a3c"}
};
const CTX = "#e9e1cf";
// عظام الرسغ الثمانية كل وحدة بلون، مثل الأطالس (بنفس ترتيب القائمة: الصف الداني ثم القاصي)
const CARPAL = {p0:"#e8b04a",p1:"#7fb3d5",p2:"#9ccc65",p3:"#f48fb1",p4:"#ffb74d",p5:"#4db6ac",p6:"#ba68c8",p7:"#e57373"};
const tint = (kind,grp,key) => kind==="bones"&&grp&&grp.startsWith("carpal")&&CARPAL[key] ? CARPAL[key] : COLORS[kind][grp];
const $id = id => document.getElementById(id);
const stage=$id("stage"), tag=$id("tag"), linesEl=$id("lines"), labelsEl=$id("labels");

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(30,1,0.01,50);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff,0x9aa3b0,0.6));
const keyL=new THREE.DirectionalLight(0xffffff,1.5); keyL.position.set(-1.5,2.5,3);
const rimL=new THREE.DirectionalLight(0xdfe8ff,0.7); rimL.position.set(2,1,-2.5);
camera.add(keyL,rimL); scene.add(camera);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.enablePan=false; controls.minDistance=0.8; controls.maxDistance=9;

const loader=new GLTFLoader(), cache={};
let root=null, meta={}, list=[], onPick=null, selected=null, curKind="bones", showLabels=true;

function fit(){
  const w=stage.clientWidth, h=stage.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
function view(back){
  const box=new THREE.Box3().setFromObject(root), size=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
  const t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  // مسافة تخلي الجزء بالنص، وتترك مجال على الجانبين للتأشيرات
  const d=Math.max(size.y/(2*t), size.x/(2*t)/camera.aspect*(showLabels?2.1:1))*1.12+size.z/2;
  controls.target.copy(c); camera.position.set(c.x,c.y,c.z+(back?-d:d)); controls.update();
  $id("view-name").textContent=back?"Posterior view · منظر خلفي":"Anterior view · منظر أمامي";
}
function material(o){
  const m=meta[o.name];
  const bone=curKind==="bones"||!m;
  o.material=new THREE.MeshPhysicalMaterial({
    color:m?tint(curKind,m.grp,o.name):CTX, roughness:bone?0.62:0.42, metalness:0,
    clearcoat:bone?0.08:0.35, clearcoatRoughness:0.5, sheen:bone?0.3:0.6, sheenColor:new THREE.Color(bone?"#fff6e0":"#ff9a8a"),
    envMapIntensity:0.55
  });
}
function paint(){
  root.traverse(o=>{ if(!o.isMesh) return; const m=meta[o.name], isSel=selected&&o.name===selected;
    o.material.color.set(isSel?"#ffcc33":m?tint(curKind,m.grp,o.name):CTX);
    o.material.emissive.set(isSel?"#3d2c00":"#000000");
    // العظام المرجعية بمشهد العضلات تبقى ظاهرة، وتخفت ويّا الباقي لما ينختار جزء
    const op=selected&&!isSel?(m?0.22:0.12):1;
    o.material.opacity=op; o.material.transparent=op<1; o.material.depthWrite=op===1; o.material.needsUpdate=true;
  });
}
function select(k){
  selected=k&&meta[k]?k:null; paint();
  if(selected){ $id("tag-en").textContent=meta[k].en; $id("tag-ar").textContent=meta[k].ar; tag.classList.add("on"); }
  else tag.classList.remove("on");
  onPick&&onPick(selected?meta[selected]:null);
}

// التأشيرات: دبّوس على الجزء، وخط لعمود الأسماء يمين أو يسار (مثل الأطالس)
const v3=new THREE.Vector3(), seen={}, occ=new THREE.Raycaster();
let frame=0, lastCam="";
// الأسماء الطويلة تنختصر على المجسّم بس (مثل الأطالس)، والاسم الكامل بالقائمة وبالبطاقة
const ABBR=[[" brachii",""],["Extensor ","Ext. "],["Flexor ","Flex. "],["Abductor ","Abd. "],["Adductor ","Add. "],[" digitorum"," dig."],
  [" pollicis"," poll."],[" radialis"," rad."],[" ulnaris"," uln."],[" superficialis"," superf."],[" profundus"," prof."],[" digiti minimi"," dig. min."],
  ["Proximal phalanx","Prox. phalanx"],["Distal phalanx","Dist. phalanx"],["Middle phalanx","Mid. phalanx"]];
const short=t=>ABBR.reduce((s,[a,b])=>s.split(a).join(b),t);
// الدبّوس يبين بس إذا جزءه مو مغطّى بجزء ثاني من هذي الزاوية
function updateSeen(){
  const meshes=[]; root.traverse(o=>{ if(o.isMesh&&meta[o.name]) meshes.push(o); });
  for(const p of list){
    v3.set(...p.pin); const dist=camera.position.distanceTo(v3);
    occ.set(camera.position, v3.clone().sub(camera.position).normalize());
    const hit=occ.intersectObjects(meshes,false)[0];
    seen[p.key]=!hit||hit.object.name===p.key||hit.distance>dist-0.02;
  }
}
function layout(){
  const W=stage.clientWidth, H=stage.clientHeight;
  if(!root||!showLabels){ linesEl.innerHTML=""; labelsEl.innerHTML=""; return; }
  const cam=camera.position.toArray().map(x=>x.toFixed(2)).join();
  if(cam!==lastCam||frame++%30===0){ updateSeen(); lastCam=cam; }
  const items=(selected?list.filter(p=>p.key===selected):list.filter(p=>seen[p.key])).map(p=>{
    v3.set(...p.pin).project(camera);
    return {p,x:(v3.x+1)/2*W,y:(1-v3.y)/2*H,front:v3.z<1};
  }).filter(i=>i.front&&i.x>0&&i.x<W&&i.y>0&&i.y<H);
  const cx=W/2, gap=Math.max(15,Math.min(24,(H-40)/Math.max(1,Math.ceil(items.length/2))));
  const cols={l:items.filter(i=>i.x<cx).sort((a,b)=>a.y-b.y), r:items.filter(i=>i.x>=cx).sort((a,b)=>a.y-b.y)};
  let svg="", html="";
  for(const side of ["l","r"]){
    let last=12-gap; const col=cols[side], lx=side==="l"?14:W-14;
    // توزيع عمودي بدون تداخل
    col.forEach(i=>{ i.ly=Math.max(i.y,last+gap); last=i.ly; });
    const over=last-(H-14); if(over>0) col.forEach(i=>i.ly-=over*(i.ly/last));
    col.forEach(i=>{
      const s=i.p.key===selected?" sel":"", ex=side==="l"?lx+4:lx-4;
      svg+=`<g class="${s}"><line x1="${i.x}" y1="${i.y}" x2="${ex}" y2="${i.ly}"/><circle cx="${i.x}" cy="${i.y}" r="3"/></g>`;
      html+=`<div class="lbl ${side==="l"?"r":"l"}${s}" data-k="${i.p.key}" style="left:${side==="l"?lx+6:lx-6}px;top:${i.ly}px">${short(i.p.en)}</div>`;
    });
  }
  linesEl.setAttribute("viewBox",`0 0 ${W} ${H}`); linesEl.innerHTML=svg; labelsEl.innerHTML=html;
}
labelsEl.addEventListener("click",e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k) select(selected===k?null:k); });

async function show(name, kind, parts, cb){
  curKind=kind; onPick=cb; list=parts; meta=Object.fromEntries(parts.map(p=>[p.key,p])); selected=null; tag.classList.remove("on");
  showLabels=parts.length<=20; $id("t-labels").classList.toggle("on",showLabels);
  $id("loading").style.display="grid"; linesEl.innerHTML=""; labelsEl.innerHTML="";
  if(root) scene.remove(root);
  const gltf=cache[name]||(cache[name]=await loader.loadAsync(`models/${name}.glb`));
  root=gltf.scene; root.traverse(o=>{ if(o.isMesh) material(o); });
  scene.add(root); paint(); fit(); view(false);
  $id("loading").style.display="none";
}

// الضغط بدون سحب = اختيار الجزء
const ray=new THREE.Raycaster(), down={x:0,y:0,on:false};
renderer.domElement.addEventListener("pointerdown",e=>{down.x=e.clientX;down.y=e.clientY;down.on=true;});
renderer.domElement.addEventListener("pointerup",e=>{
  if(!down.on) return; down.on=false;
  if(!root||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6) return;
  const r=renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},camera);
  const hit=ray.intersectObjects(root.children,true).find(h=>meta[h.object.name]);
  select(hit?hit.object.name:null);
});
$id("t-reset").addEventListener("click",()=>{ select(null); view(false); });
$id("t-flip").addEventListener("click",()=>{ select(null); view(true); });
$id("t-labels").addEventListener("click",()=>{ showLabels=!showLabels; $id("t-labels").classList.toggle("on",showLabels); view(false); });
new ResizeObserver(fit).observe(stage);
renderer.setAnimationLoop(()=>{ controls.update(); renderer.render(scene,camera); layout(); });

window.Viewer3D={show,select,color:tint};
window.dispatchEvent(new Event("viewer3d-ready"));
</script>
