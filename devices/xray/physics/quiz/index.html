<script type="application/json" id="quiz-data">{"questions": [{"q_en": "Which part of the X-ray tube releases electrons?", "q_ar": "أي جزء من أنبوب الأشعة يطلق الإلكترونات؟", "options": [{"en": "Anode", "ar": "الأنود"}, {"en": "Cathode filament", "ar": "سلك الكاثود"}, {"en": "Collimator", "ar": "المحدِّد"}, {"en": "Grid", "ar": "الشبكة"}], "answer": 1, "why": "سلك الكاثود يُسخَّن فيطلق الإلكترونات (thermionic emission)."}, {"q_en": "Most of the electron energy in the tube becomes:", "q_ar": "معظم طاقة الإلكترونات في الأنبوب تتحول إلى:", "options": [{"en": "X-rays", "ar": "أشعة سينية"}, {"en": "Light", "ar": "ضوء"}, {"en": "Heat", "ar": "حرارة"}, {"en": "Sound", "ar": "صوت"}], "answer": 2, "why": "حوالي 99% حرارة وحوالي 1% فقط أشعة سينية، لذلك يحتاج الأنود إلى تبريد."}, {"q_en": "Why does bone appear white on a radiograph?", "q_ar": "لماذا يظهر العظم أبيض في صورة الأشعة؟", "options": [{"en": "It absorbs more X-rays", "ar": "يمتص أشعة أكثر"}, {"en": "It contains air", "ar": "يحتوي هواء"}, {"en": "It emits light", "ar": "يطلق ضوءاً"}, {"en": "It is less dense", "ar": "كثافته أقل"}], "answer": 0, "why": "العظم كثيف ويمتص الأشعة (توهين عالٍ) فلا يصل منها إلا القليل إلى الكاشف."}, {"q_en": "The lungs look dark on a chest X-ray because they contain:", "q_ar": "تبدو الرئتان داكنتين في صورة الصدر لأنها تحتوي:", "options": [{"en": "Calcium", "ar": "كالسيوم"}, {"en": "Fat", "ar": "دهون"}, {"en": "Muscle", "ar": "عضلات"}, {"en": "Air", "ar": "هواء"}], "answer": 3, "why": "الهواء يمرّر معظم الأشعة فيصل الكثير منها إلى الكاشف فيظهر أسود."}, {"q_en": "Reduction of the X-ray beam as it passes through tissue is called:", "q_ar": "نقصان شدة الحزمة أثناء مرورها في النسيج يسمى:", "options": [{"en": "Emission", "ar": "الانبعاث"}, {"en": "Attenuation", "ar": "التوهين"}, {"en": "Resonance", "ar": "الرنين"}, {"en": "Echo", "ar": "الصدى"}], "answer": 1, "why": "التوهين (Attenuation) هو نقص شدة الأشعة بسبب الامتصاص والتشتت في النسيج."}]}</script>
