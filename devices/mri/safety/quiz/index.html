<script type="application/json" id="quiz-data">{"questions": [{"q_en": "What is the main danger of bringing a ferromagnetic oxygen cylinder into the MRI room?", "q_ar": "ما الخطر الرئيسي لإدخال أسطوانة أوكسجين حديدية إلى غرفة الرنين؟", "options": [{"en": "It becomes a projectile", "ar": "تتحوّل إلى قذيفة تُسحب نحو الجهاز"}, {"en": "It reduces image contrast", "ar": "تقلّل وضوح الصورة"}, {"en": "It increases radiation dose", "ar": "تزيد جرعة الإشعاع"}, {"en": "It cools the magnet", "ar": "تبرّد المغناطيس"}], "answer": 0, "why": "المغناطيس يعمل دائماً ويسحب الأجسام الحديدية بقوة فتصير قذيفة تصيب من في طريقها."}, {"q_en": "A device labelled 'MR Conditional' means:", "q_ar": "الجهاز المكتوب عليه «MR Conditional» يعني:", "options": [{"en": "It is never allowed in MRI", "ar": "ممنوع دائماً في الرنين"}, {"en": "It is safe in all MRI conditions", "ar": "آمن بكل الظروف"}, {"en": "It is safe only under specified conditions", "ar": "آمن فقط بشروط محددة"}, {"en": "It must be removed by surgery", "ar": "يجب نزعه جراحياً"}], "answer": 2, "why": "MR Conditional آمن بشروط مكتوبة (قوة المجال، نوع الفحص، برمجة الجهاز…)، أما MR Unsafe فممنوع."}, {"q_en": "A welder needs an MRI. What should be done first?", "q_ar": "عامل لحام يحتاج فحص رنين. ماذا نفعل أولاً؟", "options": [{"en": "Give gadolinium", "ar": "نعطيه صبغة الغادولينيوم"}, {"en": "Ask him to fast", "ar": "نطلب منه الصيام"}, {"en": "Scan feet first", "ar": "نُدخله بالقدمين أولاً"}, {"en": "Screen for metal fragments in the eye (orbit X-ray)", "ar": "نتأكد من عدم وجود شظايا معدنية بالعين (أشعة للحجاج)"}], "answer": 3, "why": "الشظية الحديدية في العين قد تتحرك بالمغناطيس وتسبب نزفاً أو عمى، لذلك تُفحص بأشعة سينية للحجاج قبل الرنين."}, {"q_en": "Which ACR zone is the scanner room itself?", "q_ar": "أي منطقة من مناطق ACR هي غرفة الجهاز نفسها؟", "options": [{"en": "Zone I", "ar": "Zone I"}, {"en": "Zone IV", "ar": "Zone IV"}, {"en": "Zone II", "ar": "Zone II"}, {"en": "Zone III", "ar": "Zone III"}], "answer": 1, "why": "Zone IV هي غرفة المغناطيس، وZone III غرفة التحكم المقيّدة، وZone II الاستقبال، وZone I المنطقة العامة."}, {"q_en": "How can RF burns be prevented during MRI?", "q_ar": "كيف نمنع الحروق (RF burns) أثناء الرنين؟", "options": [{"en": "Increase room temperature", "ar": "نرفع حرارة الغرفة"}, {"en": "Give a sedative", "ar": "نعطي مهدّئاً"}, {"en": "Avoid skin-to-skin contact and cable loops, use pads", "ar": "نمنع تلامس الجلد بالجلد وحلقات الأسلاك ونستعمل وسادات عازلة"}, {"en": "Use earplugs", "ar": "نستعمل سدادات الأذن"}], "answer": 2, "why": "تلامس الجلد بالجلد وحلقات الأسلاك تكوّن دائرة يسخن فيها التيار المستحث، والوسادات تعزل الجلد."}]}</script>
