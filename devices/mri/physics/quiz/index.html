<script type="application/json" id="quiz-data">{"questions": [{"q_en": "Which nucleus is mainly used to make MRI images?", "q_ar": "أي نواة تُستعمل أساساً لتكوين صورة الرنين؟", "options": [{"en": "Carbon", "ar": "الكربون"}, {"en": "Calcium", "ar": "الكالسيوم"}, {"en": "Hydrogen (protons)", "ar": "الهيدروجين (البروتونات)"}, {"en": "Iron", "ar": "الحديد"}], "answer": 2, "why": "الهيدروجين كثير في الماء والدهون، وبروتوناته هي مصدر الإشارة."}, {"q_en": "On a T2-weighted image, fluid (e.g. CSF) is:", "q_ar": "في صورة T2 يظهر السائل (مثل السائل الدماغي الشوكي):", "options": [{"en": "Bright", "ar": "أبيض (ساطع)"}, {"en": "Black", "ar": "أسود"}, {"en": "Same as bone", "ar": "مثل العظم"}, {"en": "Invisible", "ar": "لا يظهر"}], "answer": 0, "why": "في T2 السوائل ساطعة، لذلك يفيد في كشف الوذمة والالتهاب."}, {"q_en": "On a T1-weighted image, fat is:", "q_ar": "في صورة T1 تظهر الدهون:", "options": [{"en": "Dark", "ar": "داكنة"}, {"en": "Grey like fluid", "ar": "رمادية مثل السائل"}, {"en": "Not seen", "ar": "لا تظهر"}, {"en": "Bright", "ar": "ساطعة"}], "answer": 3, "why": "الدهون تستعيد مغنطتها بسرعة فتكون ساطعة في T1."}, {"q_en": "What is sent into the patient to excite the protons?", "q_ar": "ماذا يُرسل إلى المريض لإثارة البروتونات؟", "options": [{"en": "X-rays", "ar": "أشعة سينية"}, {"en": "Radiofrequency (RF) pulse", "ar": "نبضة راديوية (RF)"}, {"en": "Sound waves", "ar": "موجات صوتية"}, {"en": "Radioactive tracer", "ar": "مادة مشعة"}], "answer": 1, "why": "نبضة الراديو (RF) تغيّر اتجاه البروتونات، وعند رجوعها تُطلق الإشارة."}, {"q_en": "A key safety point in MRI is:", "q_ar": "أهم نقطة أمان في الرنين:", "options": [{"en": "Lead apron", "ar": "مريلة الرصاص"}, {"en": "Radiation dose limit", "ar": "حد جرعة الإشعاع"}, {"en": "Screening for metal and implants", "ar": "فحص المعادن والأجهزة المزروعة"}, {"en": "Fasting for 24 hours", "ar": "صيام 24 ساعة"}], "answer": 2, "why": "المغناطيس قوي جداً ويجذب المعادن، ولا توجد أشعة مؤيِّنة."}]}</script>
