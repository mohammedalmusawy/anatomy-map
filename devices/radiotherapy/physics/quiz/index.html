<script type="application/json" id="quiz-data">{"questions": [{"q_en": "What machine is most used for external beam radiotherapy?", "q_ar": "ما الجهاز الأكثر استعمالاً للعلاج الإشعاعي الخارجي؟", "options": [{"en": "MRI scanner", "ar": "جهاز الرنين"}, {"en": "Ultrasound", "ar": "السونار"}, {"en": "Linear accelerator", "ar": "المعجّل الخطي"}, {"en": "DEXA", "ar": "جهاز كثافة العظام"}], "answer": 2, "why": "المعجّل الخطي (LINAC) ينتج أشعة عالية الطاقة لعلاج الأورام."}, {"q_en": "The multileaf collimator (MLC) is used to:", "q_ar": "المحدِّد متعدد الشرائح (MLC) يُستعمل لـ:", "options": [{"en": "Shape the beam to the tumour", "ar": "تشكيل الحزمة بشكل الورم"}, {"en": "Cool the machine", "ar": "تبريد الجهاز"}, {"en": "Inject the tracer", "ar": "حقن المادة المشعة"}, {"en": "Make sound waves", "ar": "إنتاج موجات صوتية"}], "answer": 0, "why": "شرائح معدنية تتحرك لتطابق حدود الورم وتحمي ما حوله."}, {"q_en": "Why are beams aimed from several angles?", "q_ar": "لماذا تُوجَّه الحزم من عدة زوايا؟", "options": [{"en": "To make the image clearer", "ar": "لتوضيح الصورة"}, {"en": "To shorten each session to 1 second", "ar": "لتقصير الجلسة إلى ثانية"}, {"en": "To heat the skin", "ar": "لتسخين الجلد"}, {"en": "To give a high dose at the tumour and less to normal tissue", "ar": "لتجتمع الجرعة العالية في الورم وتقل حوله"}], "answer": 3, "why": "الحزم تلتقي عند الورم، وكل حزمة وحدها تمرّ بجرعة قليلة في النسيج السليم."}, {"q_en": "Fractionation means:", "q_ar": "معنى Fractionation:", "options": [{"en": "One very large dose", "ar": "جرعة واحدة كبيرة جداً"}, {"en": "Dividing the total dose into small daily sessions", "ar": "تقسيم الجرعة الكلية إلى جلسات يومية صغيرة"}, {"en": "Using sound waves", "ar": "استعمال الموجات الصوتية"}, {"en": "Removing the tumour surgically", "ar": "استئصال الورم جراحياً"}], "answer": 1, "why": "التقسيم يعطي الخلايا السليمة وقتاً لإصلاح نفسها بين الجلسات."}, {"q_en": "Radiotherapy kills tumour cells mainly by:", "q_ar": "العلاج الإشعاعي يقتل الخلايا السرطانية أساساً عن طريق:", "options": [{"en": "Freezing them", "ar": "تجميدها"}, {"en": "Magnetizing them", "ar": "مغنطتها"}, {"en": "Damaging their DNA", "ar": "إتلاف الـDNA فيها"}, {"en": "Blocking blood with gel", "ar": "سد الدم بالجل"}], "answer": 2, "why": "الأشعة عالية الطاقة تتلف DNA الخلية فتفقد قدرتها على الانقسام."}]}</script>
