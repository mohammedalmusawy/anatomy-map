<script type="application/json" id="quiz-data">{"questions": [{"q_en": "What does DEXA mainly measure?", "q_ar": "ماذا يقيس فحص DEXA أساساً؟", "options": [{"en": "Bone mineral density", "ar": "كثافة المعادن في العظم"}, {"en": "Bone blood flow", "ar": "تدفق الدم في العظم"}, {"en": "Bone marrow cells", "ar": "خلايا نخاع العظم"}, {"en": "Joint fluid", "ar": "سائل المفصل"}], "answer": 0, "why": "DEXA يقيس كثافة المعادن في العظم (BMD) بوحدة g/cm²."}, {"q_en": "A T-score of −2.7 in a 60-year-old postmenopausal woman means:", "q_ar": "قيمة T-score = −2.7 لامرأة عمرها 60 بعد سن اليأس تعني:", "options": [{"en": "Normal", "ar": "طبيعي"}, {"en": "Osteopenia", "ar": "نقص الكتلة العظمية"}, {"en": "Osteoporosis", "ar": "هشاشة العظام"}, {"en": "Below expected for age", "ar": "أقل من المتوقع للعمر"}], "answer": 2, "why": "أي قيمة ≤ −2.5 تعني هشاشة العظام حسب تصنيف WHO."}, {"q_en": "Which score is used for a 30-year-old man?", "q_ar": "أي قيمة نستعمل لرجل عمره 30 سنة؟", "options": [{"en": "T-score", "ar": "T-score"}, {"en": "Z-score", "ar": "Z-score"}, {"en": "Hounsfield unit", "ar": "وحدة هاونسفيلد"}, {"en": "SUV", "ar": "SUV"}], "answer": 1, "why": "للرجال تحت 50 سنة والنساء قبل سن اليأس والأطفال نستعمل Z-score."}, {"q_en": "Which forearm region is used for diagnosis?", "q_ar": "أي منطقة من الساعد تُستعمل للتشخيص؟", "options": [{"en": "Ultradistal radius", "ar": "النهاية البعيدة جداً للكعبرة"}, {"en": "Distal ulna", "ar": "النهاية البعيدة للزند"}, {"en": "Scaphoid", "ar": "العظم الزورقي"}, {"en": "33% radius", "ar": "منطقة 33% من الكعبرة"}], "answer": 3, "why": "ISCD يوصي بمنطقة 33% (الثلث) من كعبرة الساعد غير المسيطر، ولا يوصي بغيرها."}, {"q_en": "Which vertebrae are used for spine BMD?", "q_ar": "أي فقرات تُستعمل لقياس كثافة العمود الفقري؟", "options": [{"en": "T10–T12", "ar": "T10–T12"}, {"en": "C3–C7", "ar": "C3–C7"}, {"en": "L1–L4", "ar": "L1–L4"}, {"en": "S1–S3", "ar": "S1–S3"}], "answer": 2, "why": "يُقاس العمود القطني L1–L4، ونستبعد فقط الفقرة المتأثرة بتشوه أو أداة معدنية."}, {"q_en": "Before DEXA, the patient should usually stop:", "q_ar": "قبل الفحص يُطلب من المريض عادةً إيقاف:", "options": [{"en": "Calcium supplements", "ar": "مكمّلات الكالسيوم"}, {"en": "Drinking water", "ar": "شرب الماء"}, {"en": "All food for 12 hours", "ar": "كل الطعام 12 ساعة"}, {"en": "Walking", "ar": "المشي"}], "answer": 0, "why": "حبوب الكالسيوم غير المذابة قد تظهر على الصورة وتغيّر القياس، ولا يحتاج الفحص صياماً."}, {"q_en": "How is the leg positioned for a hip scan?", "q_ar": "كيف توضع الساق عند فحص الورك؟", "options": [{"en": "Externally rotated", "ar": "مدوّرة للخارج"}, {"en": "Flexed at the knee", "ar": "مثنية من الركبة"}, {"en": "Abducted 45°", "ar": "مبعدة 45°"}, {"en": "Internally rotated 15–25°", "ar": "مدوّرة للداخل 15–25°"}], "answer": 3, "why": "التدوير للداخل يجعل عنق الفخذ موازياً للطاولة فيظهر بطوله الكامل."}, {"q_en": "When is the forearm measured?", "q_ar": "متى نقيس الساعد؟", "options": [{"en": "In every patient routinely", "ar": "لكل مريض روتينياً"}, {"en": "In hyperparathyroidism", "ar": "عند فرط نشاط جارات الدرق"}, {"en": "Only in children", "ar": "للأطفال فقط"}, {"en": "After hip measurement is normal", "ar": "إذا كان الورك طبيعياً"}], "answer": 1, "why": "الساعد يُقاس عند فرط نشاط جارات الدرق، أو تعذّر قياس العمود/الورك، أو تجاوز حد وزن الطاولة."}, {"q_en": "Osteoporosis T-score + fragility fracture is called:", "q_ar": "قيمة هشاشة مع كسر هشاشة تسمى:", "options": [{"en": "Osteopenia", "ar": "نقص الكتلة العظمية"}, {"en": "Normal", "ar": "طبيعي"}, {"en": "Severe (established) osteoporosis", "ar": "هشاشة شديدة (مؤكدة)"}, {"en": "Osteomalacia", "ar": "لين العظام"}], "answer": 2, "why": "T-score ≤ −2.5 مع كسر هشاشة = هشاشة شديدة (مؤكدة)."}, {"q_en": "What is VFA?", "q_ar": "ما هو VFA؟", "options": [{"en": "Lateral spine image on the DEXA machine to find vertebral fractures", "ar": "صورة جانبية للعمود على جهاز DEXA لكشف كسور الفقرات"}, {"en": "A blood test for vitamin D", "ar": "تحليل دم لفيتامين D"}, {"en": "An MRI sequence for the spine", "ar": "مقطع رنين للعمود الفقري"}, {"en": "A nuclear medicine bone scan", "ar": "مسح عظمي بالطب النووي"}], "answer": 0, "why": "VFA = Vertebral Fracture Assessment، صورة جانبية بجهاز الكثافة نفسه لكشف كسور الفقرات."}]}</script>
