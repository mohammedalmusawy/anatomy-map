", "ar": "مقطع رنين للعمود الفقري"}, {"en": "A nuclear medicine bone scan", "ar": "مسح عظمي بالطب النووي"}], "answer": 0, "why": "VFA = Vertebral Fracture Assessment، صورة جانبية بجهاز الكثافة نفسه لكشف كسور الفقرات."}]}</script>
