<script type="application/json" id="quiz-data">{"questions": [{"q_en": "DEXA separates bone from soft tissue by using:", "q_ar": "يفصل DEXA العظم عن الأنسجة الرخوة باستعمال:", "options": [{"en": "A magnet", "ar": "مغناطيس"}, {"en": "Sound waves", "ar": "موجات صوتية"}, {"en": "Two X-ray energies", "ar": "طاقتين من الأشعة السينية"}, {"en": "A radioactive tracer", "ar": "مادة مشعة"}], "answer": 2, "why": "اسمه Dual-energy: طاقتان تُمتصان بشكل مختلف في العظم والنسيج الرخو."}, {"q_en": "What does the 'D' in DEXA stand for?", "q_ar": "إلى ماذا يرمز حرف D في DEXA؟", "options": [{"en": "Digital", "ar": "رقمي"}, {"en": "Dual-energy", "ar": "ثنائي الطاقة"}, {"en": "Density", "ar": "كثافة"}, {"en": "Doppler", "ar": "دوبلر"}], "answer": 1, "why": "DEXA = Dual-Energy X-ray Absorptiometry."}, {"q_en": "The main result of a DEXA scan is:", "q_ar": "الناتج الأساسي لفحص DEXA هو:", "options": [{"en": "Bone mineral density in g/cm²", "ar": "كثافة العظم بوحدة g/cm²"}, {"en": "Hounsfield units", "ar": "وحدات هاونسفيلد"}, {"en": "Blood flow velocity", "ar": "سرعة تدفق الدم"}, {"en": "T2 signal", "ar": "إشارة T2"}], "answer": 0, "why": "الفحص يعطي رقماً هو BMD بوحدة g/cm²."}, {"q_en": "Compared with a chest X-ray, the DEXA dose is:", "q_ar": "مقارنة بصورة الصدر، جرعة DEXA:", "options": [{"en": "Ten times higher", "ar": "أعلى بعشر مرات"}, {"en": "The same", "ar": "نفسها"}, {"en": "Higher than CT", "ar": "أعلى من المفراس"}, {"en": "Much lower", "ar": "أقل بكثير"}], "answer": 3, "why": "جرعة DEXA بضعة ميكروسيفرت، وصورة الصدر حوالي 100 ميكروسيفرت."}, {"q_en": "Why does DEXA need two energies instead of one?", "q_ar": "لماذا يحتاج DEXA طاقتين بدل واحدة؟", "options": [{"en": "To make the image colored", "ar": "لتلوين الصورة"}, {"en": "To remove the soft-tissue part and leave bone", "ar": "لحذف جزء الأنسجة الرخوة وإبقاء العظم"}, {"en": "To shorten the scan to 1 second", "ar": "لتقصير الفحص إلى ثانية"}, {"en": "To heat the tissue", "ar": "لتسخين النسيج"}], "answer": 1, "why": "طاقة واحدة لا تفرّق بين امتصاص العظم والنسيج الرخو، وطاقتان تسمحان بحذف النسيج الرخو."}]}</script>
