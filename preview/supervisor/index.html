.tm-grid{display:grid;gap:12px;margin:8px 0 16px}
@media (min-width:720px){.tm-grid{grid-template-columns:1fr 1fr}}
.tm-card{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tm-av{flex:none;width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.tm-mono{display:inline-flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);font:800 1.6rem var(--title-font)}
.tm-card b{display:block;font-family:var(--title-font);font-size:var(--t-lg);line-height:1.45}
.tm-role{display:inline-block;margin:4px 0 6px;padding:1px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font:700 var(--t-xs)/1.9 var(--title-font)}
.tm-card p{margin:0;color:var(--muted);font-size:var(--t-sm)}
.tm-thanks{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:4px 0 16px;color:var(--ink)}
.tm-thanks b{font-family:var(--title-font)}
.tm-foot{color:var(--muted);font-size:var(--t-xs);text-align:center}
.tm-foot a{color:var(--brand)}
.tm-f{display:grid;gap:4px;width:100%}
.tm-f span{font-size:var(--t-sm);color:var(--muted)}
.tm-f input,.tm-f select,.tm-f textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:inherit;padding:8px 12px;box-sizing:border-box}
.tm-row{display:flex;flex-wrap:wrap;gap:8px}
.tm-msg{margin:0;font-size:var(--t-sm);min-height:1.4em}.tm-msg.ok{color:var(--ok,var(--brand))}.tm-msg.bad{color:var(--bad,var(--accent))}
.tm-hello{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0}
.tm-exp,.tm-req{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:0 0 10px;display:grid;gap:6px}
.tm-exp small,.tm-req small{display:block;color:var(--muted);font-size:var(--t-xs)}
.tm-chips{display:flex;flex-wrap:wrap;gap:6px}
.tm-chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:var(--t-xs);line-height:2;background:var(--bg)}
.tm-chip.ok{background:var(--brand-soft);color:var(--brand)}.tm-chip.miss{background:var(--accent-soft);color:var(--accent)}
.tm-chip.next{border-style:dashed}
