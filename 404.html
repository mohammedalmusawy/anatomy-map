<meta name="viewport" content="width=device-width, initial-scale=1"><title>الصفحة غير موجودة</title>
<script>
(function () {
  try {
    var p = decodeURIComponent(location.pathname);
    if (/[À-ÿ]/.test(p)) {
      var bytes = new Uint8Array([].map.call(p, function (c) { return c.charCodeAt(0) & 255; }));
      var fixed = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      if (fixed !== p) { location.replace(encodeURI(fixed) + location.search + location.hash); return; }
    }
  } catch (e) {}
})();
</script>
