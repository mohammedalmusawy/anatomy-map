<script type="application/json" id="quiz-data">{"questions": [{"q_en": "Which CT is the investigation of choice for suspected renal colic (ureteric stone)?", "q_ar": "ما هو فحص المفراس المفضّل عند الاشتباه بمغص كلوي (حصاة حالب)؟", "options": [{"en": "Portal venous phase CT", "ar": "مفراس بالطور الوريدي البابي"}, {"en": "CT pulmonary angiography", "ar": "تصوير الشرايين الرئوية بالمفراس"}, {"en": "Non-contrast low-dose CT KUB", "ar": "مفراس الكلى والحالب والمثانة بدون صبغة وبجرعة منخفضة"}, {"en": "Delayed phase CT only", "ar": "مفراس بالطور المتأخر فقط"}], "answer": 2, "why": "الحصاة عالية الكثافة بطبيعتها، والصبغة قد تخفيها داخل الحالب الممتلئ بالصبغة؛ لذلك يُجرى بدون صبغة."}, {"q_en": "Approximately when is the late arterial phase acquired after IV injection through an arm vein?", "q_ar": "متى يُؤخذ الطور الشرياني المتأخر تقريباً بعد الحقن في وريد الذراع؟", "options": [{"en": "About 30–40 seconds", "ar": "بعد نحو 30–40 ثانية"}, {"en": "About 70–90 seconds", "ar": "بعد نحو 70–90 ثانية"}, {"en": "About 5–10 minutes", "ar": "بعد نحو 5–10 دقائق"}, {"en": "Before the injection", "ar": "قبل الحقن"}], "answer": 0, "why": "الطور الشرياني المتأخر نحو 30–40 ثانية؛ أما 70–90 ثانية فهو الطور الوريدي البابي، و5–10 دقائق الطور الإفرازي."}, {"q_en": "Liver metastases (hypovascular) are best detected in which phase?", "q_ar": "النقائل الكبدية قليلة التروية تُكشف بأفضل شكل في أي طور؟", "options": [{"en": "Non-contrast phase", "ar": "الطور بدون صبغة"}, {"en": "Early arterial phase", "ar": "الطور الشرياني المبكر"}, {"en": "Excretory phase", "ar": "الطور الإفرازي"}, {"en": "Portal venous phase", "ar": "الطور الوريدي البابي"}], "answer": 3, "why": "في الطور الوريدي البابي يكون الكبد في أعلى تعزيزه، فتظهر النقائل قليلة التروية داكنة بوضوح."}, {"q_en": "The excretory (urographic) phase is usually acquired about:", "q_ar": "الطور الإفرازي (البولي) يُؤخذ عادةً بعد نحو:", "options": [{"en": "10 seconds", "ar": "10 ثوانٍ"}, {"en": "5–10 minutes", "ar": "5–10 دقائق"}, {"en": "35 seconds", "ar": "35 ثانية"}, {"en": "24 hours", "ar": "24 ساعة"}], "answer": 1, "why": "تحتاج الكلية دقائق حتى تُرشّح الصبغة وتُفرزها إلى الكؤوس والحالب، لذلك يتأخر المسح 5–10 دقائق."}, {"q_en": "What is the purpose of bolus tracking in CT angiography?", "q_ar": "ما الغرض من تتبّع البلعة (bolus tracking) في تصوير الأوعية بالمفراس؟", "options": [{"en": "To reduce the contrast dose to zero", "ar": "لإلغاء الحاجة إلى الصبغة"}, {"en": "To start the scan when contrast peaks in the target artery", "ar": "لبدء المسح عندما تبلغ الصبغة ذروتها في الشريان المطلوب"}, {"en": "To prevent allergic reactions", "ar": "لمنع التفاعلات التحسسية"}, {"en": "To replace the scout image", "ar": "ليحل محل الصورة الاستكشافية"}], "answer": 1, "why": "تُوضع منطقة قياس (ROI) على الشريان، وعندما تصل كثافة الصبغة إلى العتبة يبدأ المسح تلقائياً في التوقيت الأمثل."}, {"q_en": "Which injection rate is typical for CT angiography?", "q_ar": "ما سرعة الحقن المعتادة في تصوير الأوعية بالمفراس؟", "options": [{"en": "0.5 mL/s", "ar": "0.5 مل/ثانية"}, {"en": "1 mL/min", "ar": "1 مل/دقيقة"}, {"en": "About 4–5 mL/s", "ar": "نحو 4–5 مل/ثانية"}, {"en": "Hand injection over 5 minutes", "ar": "حقن يدوي خلال 5 دقائق"}], "answer": 2, "why": "الأوعية تحتاج بلعة مركّزة وسريعة حتى تمتلئ الشرايين بصبغة كثيفة في لحظة المسح."}, {"q_en": "In CTPA with bolus tracking, where is the region of interest (ROI) usually placed?", "q_ar": "في تصوير الشرايين الرئوية بتتبّع البلعة، أين توضع منطقة القياس (ROI) عادةً؟", "options": [{"en": "Pulmonary trunk", "ar": "جذع الشريان الرئوي"}, {"en": "Abdominal aorta", "ar": "الأبهر البطني"}, {"en": "Portal vein", "ar": "الوريد البابي"}, {"en": "Urinary bladder", "ar": "المثانة"}], "answer": 0, "why": "الهدف امتلاء الشرايين الرئوية، لذلك يُقاس وصول الصبغة في جذع الشريان الرئوي."}, {"q_en": "Which phase of CT urography best shows the ureters filled with contrast?", "q_ar": "أي طور في تصوير الجهاز البولي بالمفراس يُظهر الحالبين ممتلئين بالصبغة؟", "options": [{"en": "Non-contrast phase", "ar": "الطور بدون صبغة"}, {"en": "Arterial phase", "ar": "الطور الشرياني"}, {"en": "Nephrographic phase", "ar": "الطور الكلوي النسيجي"}, {"en": "Excretory phase", "ar": "الطور الإفرازي"}], "answer": 3, "why": "في الطور الإفرازي تكون الكليتان قد أفرزتا الصبغة إلى الكؤوس والحالبين والمثانة."}, {"q_en": "Below which eGFR value is a patient considered at high risk of post-contrast acute kidney injury after IV contrast?", "q_ar": "تحت أي قيمة لمعدّل الترشيح الكبيبي (eGFR) يُعدّ المريض عالي الخطر للإصابة الكلوية بعد الصبغة الوريدية؟", "options": [{"en": "120 mL/min/1.73 m²", "ar": "120"}, {"en": "90 mL/min/1.73 m²", "ar": "90"}, {"en": "30 mL/min/1.73 m²", "ar": "30"}, {"en": "200 mL/min/1.73 m²", "ar": "200"}], "answer": 2, "why": "أغلب الإرشادات (ACR و ESUR) تعدّ eGFR أقل من 30 خطراً عالياً يحتاج موازنة وترطيباً."}, {"q_en": "A diabetic patient on metformin has eGFR 25. What is the usual advice for IV contrast CT?", "q_ar": "مريض سكري يتناول الميتفورمين ومعدّل eGFR لديه 25. ما النصيحة المعتادة قبل مفراس بالصبغة الوريدية؟", "options": [{"en": "Double the metformin dose", "ar": "مضاعفة جرعة الميتفورمين"}, {"en": "Continue as normal with no follow-up", "ar": "الاستمرار عادياً بلا متابعة"}, {"en": "Give oral contrast instead of IV in all cases", "ar": "إعطاء صبغة فموية بدل الوريدية دائماً"}, {"en": "Stop metformin at the time of the scan and for 48 hours, then recheck renal function", "ar": "إيقاف الميتفورمين عند الفحص و48 ساعة بعده ثم إعادة فحص الكلى"}], "answer": 3, "why": "مع eGFR أقل من 30 يُوقف الميتفورمين مؤقتاً لتجنّب الحماض اللبني إذا تدهورت الكلى، ويُعاد بعد التأكد من سلامتها."}, {"q_en": "What is the first step when contrast extravasation is noticed during a power injection?", "q_ar": "ما أول خطوة عند ملاحظة تسرّب الصبغة أثناء الحقن بالحاقن الآلي؟", "options": [{"en": "Increase the injection rate", "ar": "زيادة سرعة الحقن"}, {"en": "Stop the injection immediately", "ar": "إيقاف الحقن فوراً"}, {"en": "Continue and finish the scan", "ar": "الاستمرار وإكمال الفحص"}, {"en": "Inject again in the same cannula", "ar": "إعادة الحقن في نفس الكانيولا"}], "answer": 1, "why": "يُوقف الحقن فوراً ويُرفع الطرف ويُبلّغ الطبيب ويُوثّق الحادث، ثم يُتابع المريض لعلامات الخطورة."}, {"q_en": "Which symptom after contrast injection is a normal physiological effect, not an allergy?", "q_ar": "أي عرض بعد حقن الصبغة يُعدّ تأثيراً طبيعياً وليس حساسية؟", "options": [{"en": "Warm feeling and metallic taste", "ar": "الإحساس بالحرارة وطعم المعدن"}, {"en": "Wheeze and difficulty breathing", "ar": "أزيز وصعوبة تنفس"}, {"en": "Swelling of the face and lips", "ar": "تورّم الوجه والشفتين"}, {"en": "Widespread hives", "ar": "شرى منتشر"}], "answer": 0, "why": "الحرارة وطعم المعدن شائعان وعابران بسبب الصبغة نفسها؛ أما الأزيز والتورّم والشرى فهي علامات تفاعل."}], "title_en": "CT contrast — patient preparation", "title_ar": "تحضير المريض"}</script>
