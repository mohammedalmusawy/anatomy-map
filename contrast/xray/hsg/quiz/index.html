<script type="application/json" id="quiz-data">{"questions": [{"q_en": "When in the menstrual cycle is HSG best performed?", "q_ar": "متى يُفضَّل إجراء تصوير الرحم والأنابيب في الدورة الشهرية؟", "options": [{"en": "During menstrual bleeding", "ar": "أثناء نزف الدورة"}, {"en": "Days 6–12: after bleeding stops and before ovulation", "ar": "اليوم 6–12: بعد توقّف النزف وقبل الإباضة"}, {"en": "Days 20–25", "ar": "اليوم 20–25"}, {"en": "Any day of the cycle", "ar": "أي يوم من الدورة"}], "answer": 1, "why": "في الطور التكاثري تكون البطانة رقيقة فيتضح التجويف، ويقلّ احتمال وجود حمل مبكر (Radiopaedia)."}, {"q_en": "Which finding proves that the fallopian tubes are patent?", "q_ar": "أي علامة تثبت أن قناتي فالوب سالكتان؟", "options": [{"en": "Filling of the cervical canal", "ar": "امتلاء قناة عنق الرحم"}, {"en": "A triangular uterine cavity", "ar": "تجويف رحم مثلثي"}, {"en": "Free spill of contrast into the peritoneal cavity", "ar": "انسكاب حرّ للصبغة في تجويف البريتون"}, {"en": "Contrast in the pelvic veins", "ar": "صبغة في أوردة الحوض"}], "answer": 2, "why": "خروج الصبغة من نهاية الأنبوب إلى البريتون بحرية هو دليل النفاذية؛ أما الصبغة في الأوردة فهي مضاعفة (Radiopaedia)."}, {"q_en": "Which contrast agent is routinely used for HSG?", "q_ar": "ما الصبغة المستعملة عادةً في تصوير الرحم والأنابيب؟", "options": [{"en": "Barium sulfate", "ar": "كبريتات الباريوم"}, {"en": "Gadolinium", "ar": "الغادولينيوم"}, {"en": "Air", "ar": "الهواء"}, {"en": "Water-soluble iodinated contrast", "ar": "صبغة يودية ذائبة بالماء"}], "answer": 3, "why": "تُحقن صبغة يودية ذائبة بالماء ببطء تحت التنظير الشعاعي؛ الباريوم لا يُحقن في الرحم (Radiopaedia)."}, {"q_en": "Which is a contraindication to HSG?", "q_ar": "أيّ مما يلي يمنع إجراء الفحص؟", "options": [{"en": "Pregnancy", "ar": "الحمل"}, {"en": "Infertility", "ar": "العقم"}, {"en": "Recurrent miscarriage", "ar": "الإجهاض المتكرر"}, {"en": "A previous normal HSG", "ar": "فحص سابق طبيعي"}], "answer": 0, "why": "الحمل مانع أساسي؛ أما العقم والإجهاض المتكرر فهما من دواعي الفحص (Radiopaedia، GLOWM)."}, {"q_en": "A patient has active pelvic inflammatory disease. What is done?", "q_ar": "مريضة عندها التهاب حوض نشط. ماذا نفعل؟", "options": [{"en": "Postpone HSG until the infection is treated", "ar": "يؤجَّل الفحص حتى يُعالَج الالتهاب"}, {"en": "Do HSG immediately", "ar": "يُجرى الفحص فوراً"}, {"en": "Use barium instead", "ar": "يُستعمل الباريوم بدلاً منه"}, {"en": "Double the contrast volume", "ar": "تُضاعَف كمية الصبغة"}], "answer": 0, "why": "التهاب الحوض النشط أو الحديث مانع للفحص، لأن الحقن قد ينشر الالتهاب (GLOWM)."}, {"q_en": "On HSG the angle between two uterine horns is 69°. Which anomaly is favoured?", "q_ar": "على HSG الزاوية بين قرني الرحم 69 درجة. أي تشوه هو الأرجح؟", "options": [{"en": "Bicornuate uterus", "ar": "الرحم ذو القرنين"}, {"en": "Septate uterus", "ar": "الرحم ذو الحاجز"}, {"en": "Uterus didelphys", "ar": "الرحم المزدوج"}, {"en": "Arcuate uterus", "ar": "الرحم المقوّس"}], "answer": 1, "why": "الزاوية أقل من 75 درجة ترجّح الحاجز، وأكثر من 105 درجة ترجّح ذا القرنين، مع تداخل كبير بينهما (Radiopaedia)."}, {"q_en": "Why can HSG alone not reliably separate a septate from a bicornuate uterus?", "q_ar": "لماذا لا يكفي HSG وحده للتمييز بين الرحم ذي الحاجز وذي القرنين؟", "options": [{"en": "The contrast is too dense", "ar": "لأن الصبغة كثيفة جداً"}, {"en": "The tubes hide the uterus", "ar": "لأن الأنبوبين يغطّيان الرحم"}, {"en": "It does not show the outer contour of the uterine fundus", "ar": "لأنه لا يُظهر الحافة الخارجية لقاع الرحم"}, {"en": "The septum absorbs the contrast", "ar": "لأن الحاجز يمتص الصبغة"}], "answer": 2, "why": "HSG يرى التجويف من الداخل فقط؛ الرنين أو السونار ثلاثي الأبعاد يُظهران الحافة الخارجية (دقّة HSG وحده نحو 55%) (Radiopaedia)."}, {"q_en": "A single banana-shaped cavity draining into one fallopian tube suggests:", "q_ar": "تجويف واحد بشكل الموزة ينتهي بأنبوب واحد يدلّ على:", "options": [{"en": "T-shaped uterus", "ar": "الرحم على شكل T"}, {"en": "Arcuate uterus", "ar": "الرحم المقوّس"}, {"en": "Unicornuate uterus", "ar": "الرحم وحيد القرن"}, {"en": "Bicornuate uterus", "ar": "الرحم ذو القرنين"}], "answer": 2, "why": "الرحم وحيد القرن يظهر بتجويف مغزلي مائل لجهة مع أنبوب واحد (Radiopaedia)."}, {"q_en": "Two cervical canals leading to two separate, non-communicating cavities:", "q_ar": "قناتا عنق تؤديان إلى تجويفين منفصلين بلا اتصال:", "options": [{"en": "Septate uterus", "ar": "الرحم ذو الحاجز"}, {"en": "Bicornuate uterus", "ar": "الرحم ذو القرنين"}, {"en": "Arcuate uterus", "ar": "الرحم المقوّس"}, {"en": "Uterus didelphys", "ar": "الرحم المزدوج"}], "answer": 3, "why": "في الرحم المزدوج عنقان ورحمان منفصلان، وكل تجويف ينتهي بأنبوب واحد (Radiopaedia)."}, {"q_en": "The T-shaped uterus is classically linked to:", "q_ar": "الرحم على شكل حرف T يرتبط تقليدياً بـ:", "options": [{"en": "Genital tuberculosis", "ar": "سلّ الجهاز التناسلي"}, {"en": "In-utero diethylstilbestrol (DES) exposure", "ar": "تعرّض الجنين لعقار DES داخل الرحم"}, {"en": "An intrauterine device", "ar": "اللولب الرحمي"}, {"en": "Caesarean section", "ar": "الولادة القيصرية"}], "answer": 1, "why": "هو أشهر تشوه مرتبط بالتعرّض لـ DES داخل الرحم، وقد يحدث بلا هذا التعرّض أيضاً (Radiopaedia)."}, {"q_en": "Multiple irregular linear filling defects and a poorly distensible cavity after curettage suggest:", "q_ar": "عيوب امتلاء خطية غير منتظمة وتجويف لا يتمدّد جيداً بعد كحت الرحم تدلّ على:", "options": [{"en": "Adenomyosis", "ar": "العضال الغدي"}, {"en": "Hydrosalpinx", "ar": "توسّع الأنبوب بالسائل"}, {"en": "Arcuate uterus", "ar": "الرحم المقوّس"}, {"en": "Asherman syndrome (intrauterine adhesions)", "ar": "متلازمة أشرمان (التصاقات داخل الرحم)"}], "answer": 3, "why": "الالتصاقات داخل الرحم تظهر كعيوب امتلاء خطية غير منتظمة، وقد تعطي نمطاً «جيبياً» (Radiopaedia)."}, {"q_en": "Many small contrast-filled outpouchings from the isthmic part of both tubes:", "q_ar": "جيوب صغيرة متعددة مملوءة بالصبغة تخرج من الجزء البرزخي للأنبوبين:", "options": [{"en": "Hydrosalpinx", "ar": "توسّع الأنبوب بالسائل"}, {"en": "Venous intravasation", "ar": "دخول الصبغة إلى الأوردة"}, {"en": "Salpingitis isthmica nodosa", "ar": "التهاب البرزخ العُقدي"}, {"en": "Tubal spasm", "ar": "تقلّص الأنبوب"}], "answer": 2, "why": "التهاب البرزخ العُقدي يُعطي رتوجاً صغيرة في البرزخ، وغالباً في الجهتين، ويرتبط بالعقم والحمل خارج الرحم (Radiopaedia)."}, {"q_en": "A dilated distal fallopian tube that fills but does not spill:", "q_ar": "أنبوب متوسّع في جزئه البعيد يمتلئ لكن لا تنسكب منه الصبغة:", "options": [{"en": "Hydrosalpinx (distal occlusion)", "ar": "توسّع الأنبوب بالسائل (انسداد بعيد)"}, {"en": "Normal tube", "ar": "أنبوب طبيعي"}, {"en": "Proximal (cornual) block", "ar": "انسداد قريب عند القرن"}, {"en": "Venous intravasation", "ar": "دخول الصبغة إلى الأوردة"}], "answer": 0, "why": "انسداد النهاية البعيدة يجمع السوائل فيتوسّع الأنبوب؛ وأشيع أسبابه التصاقات بعد التهاب الحوض (Radiopaedia)."}, {"q_en": "One tube does not fill at the cornu. What should the technologist remember?", "q_ar": "أنبوب واحد لا يمتلئ عند القرن. ماذا يتذكّر الفني؟", "options": [{"en": "It always means a true blockage", "ar": "يعني دائماً انسداداً حقيقياً"}, {"en": "It always means a unicornuate uterus", "ar": "يعني دائماً رحماً وحيد القرن"}, {"en": "It can be tubal spasm or contrast leak — interpret with caution", "ar": "قد يكون تقلّصاً في الأنبوب أو تسرّباً للصبغة — يُفسَّر بحذر"}, {"en": "It means active infection", "ar": "يعني التهاباً نشطاً"}], "answer": 2, "why": "عدم الامتلاء القريب قد يكون تقلّصاً وظيفياً، أو نقص ضغط بسبب تسرّب الصبغة من العنق، فيعطي انسداداً كاذباً (Radiopaedia، GLOWM)."}, {"q_en": "A fine lace-like network of contrast around the uterus and in pelvic veins is:", "q_ar": "شبكة دقيقة من الصبغة حول الرحم وفي أوردة الحوض هي:", "options": [{"en": "Free peritoneal spill", "ar": "انسكاب حرّ في البريتون"}, {"en": "Adenomyosis", "ar": "العضال الغدي"}, {"en": "Hydrosalpinx", "ar": "توسّع الأنبوب بالسائل"}, {"en": "Venous intravasation", "ar": "دخول الصبغة إلى الأوردة"}], "answer": 3, "why": "دخول الصبغة إلى الأوردة مضاعفة معروفة؛ قليلة الخطورة مع الصبغة الذائبة بالماء، وخطرها أكبر مع الصبغة الزيتية (Radiopaedia، GLOWM)."}], "title_en": "HSG (hysterosalpingography) — quiz", "title_ar": "تصوير الرحم والأنابيب بالصبغة"}</script>
