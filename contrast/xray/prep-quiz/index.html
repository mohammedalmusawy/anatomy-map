usually used for the overhead films of a barium follow-through?", "q_ar": "أي وضعية تُستعمل عادةً لصور متابعة مرور الباريوم؟", "options": [{"en": "Erect lateral", "ar": "جانبي قائم"}, {"en": "Prone PA", "ar": "خلفي أمامي بالانبطاح"}, {"en": "Lateral decubitus", "ar": "استلقاء جانبي بأشعة أفقية"}, {"en": "Lithotomy", "ar": "وضعية الولادة"}], "answer": 1, "why": "الانبطاح يضغط البطن ويفرّق عُرى الأمعاء الدقيقة فلا تتراكب."}, {"q_en": "What should the patient be told about the length of a barium follow-through?", "q_ar": "ماذا يُخبَر المريض عن مدة فحص متابعة مرور الباريوم؟", "options": [{"en": "It finishes in 5 minutes", "ar": "ينتهي في 5 دقائق"}, {"en": "It needs an overnight stay", "ar": "يحتاج مبيتاً في المستشفى"}, {"en": "It may take one to two hours or more", "ar": "قد يستغرق ساعة إلى ساعتين أو أكثر"}, {"en": "It lasts exactly 10 minutes", "ar": "يستغرق 10 دقائق بالضبط"}], "answer": 2, "why": "الفحص ينتظر وصول الباريوم إلى الأعور، ويختلف هذا الوقت من مريض لآخر."}, {"q_en": "Which contrast is preferred for a swallow when oesophageal perforation is suspected?", "q_ar": "أي تباين يُفضّل في بلع المريء عند الاشتباه بانثقاب المريء؟", "options": [{"en": "Water-soluble iodinated contrast", "ar": "تباين يودي ذائب بالماء"}, {"en": "High-density barium", "ar": "باريوم عالي الكثافة"}, {"en": "Air only", "ar": "هواء فقط"}, {"en": "Gadolinium", "ar": "الغادولينيوم"}], "answer": 0, "why": "التباين الذائب بالماء يُمتص إذا تسرّب، أما الباريوم فيسبب التهاباً خطيراً في المنصف."}, {"q_en": "Before giving Gastrografin, the radiographer must ask about:", "q_ar": "قبل إعطاء الغاستروغرافين يجب أن يسأل المصوّر عن:", "options": [{"en": "Blood group", "ar": "فصيلة الدم"}, {"en": "Previous allergy to iodinated contrast", "ar": "حساسية سابقة من التباين اليودي"}, {"en": "Last menstrual period only", "ar": "آخر دورة شهرية فقط"}, {"en": "Eye colour", "ar": "لون العين"}], "answer": 1, "why": "الغاستروغرافين مادة تباين يودية، فالسؤال عن تفاعل سابق من التباين اليودي ضروري قبل إعطائها."}, {"q_en": "Why is a strong laxative given the day before a double-contrast barium enema?", "q_ar": "لماذا يُعطى مليّن قوي في اليوم السابق لحقنة الباريوم بالتباين المزدوج؟", "options": [{"en": "To dilute the barium", "ar": "لتخفيف الباريوم"}, {"en": "To prevent allergy", "ar": "لمنع الحساسية"}, {"en": "To reduce radiation dose", "ar": "لتقليل جرعة الإشعاع"}, {"en": "Retained faeces can mimic or hide polyps", "ar": "البراز المتبقي قد يشبه السلائل أو يخفيها"}], "answer": 3, "why": "القولون النظيف ضروري لرؤية السلائل الصغيرة بوضوح."}, {"q_en": "Which drug is commonly injected to relax the colon during a double-contrast enema?", "q_ar": "أي دواء يُحقن عادةً لإرخاء القولون في الحقنة بالتباين المزدوج؟", "options": [{"en": "Insulin", "ar": "الأنسولين"}, {"en": "Buscopan (hyoscine butylbromide)", "ar": "Buscopan"}, {"en": "Heparin", "ar": "الهيبارين"}, {"en": "Adrenaline", "ar": "الأدرينالين"}], "answer": 1, "why": "Buscopan يرخي العضلات الملساء فيقلل التقلص ويتوسع القولون بالهواء بشكل أفضل."}, {"q_en": "Which projection is most important to detect a low rectal anastomotic leak?", "q_ar": "أي إسقاط هو الأهم لكشف تسرّب خياطة المستقيم المنخفضة؟", "options": [{"en": "PA chest", "ar": "صدر خلفي أمامي"}, {"en": "Lateral skull", "ar": "جمجمة جانبي"}, {"en": "Lateral rectum", "ar": "مستقيم جانبي"}, {"en": "AP knee", "ar": "ركبة أمامي خلفي"}], "answer": 2, "why": "التسرّب الخلفي إلى ما أمام العجز يظهر بوضوح في الصورة الجانبية للمستقيم."}, {"q_en": "Which patients need special care with hyperosmolar Gastrografin enema?", "q_ar": "أي المرضى يحتاجون حذراً خاصاً مع حقنة الغاستروغرافين عالية الأسمولية؟", "options": [{"en": "Dehydrated infants", "ar": "الرضّع المصابون بالجفاف"}, {"en": "Young athletes", "ar": "الرياضيون الشباب"}, {"en": "Patients with glasses", "ar": "من يلبسون النظارات"}, {"en": "Patients with tattoos", "ar": "من لديهم وشم"}], "answer": 0, "why": "التباين عالي الأسمولية يسحب الماء إلى الأمعاء فيزيد جفاف الرضيع."}, {"q_en": "Which preparation is avoided before a contrast enema for suspected Hirschsprung disease?", "q_ar": "أي تحضير يُتجنّب قبل الحقنة الشرجية الملونة عند الاشتباه بداء هيرشسبرونغ؟", "options": [{"en": "Explaining the test to the parents", "ar": "شرح الفحص للأهل"}, {"en": "Checking the child's identity", "ar": "التأكد من هوية الطفل"}, {"en": "Bowel cleansing with laxatives or washout", "ar": "تنظيف القولون بالملينات أو الغسيل"}, {"en": "Removing the nappy", "ar": "نزع الحفاض"}], "answer": 2, "why": "تنظيف القولون قد يُخفي منطقة الانتقال (transition zone) التي يبحث عنها الفحص."}, {"q_en": "How long before a barium enema should a low-residue diet usually start?", "q_ar": "متى يبدأ الطعام قليل الألياف عادةً قبل حقنة الباريوم الشرجية؟", "options": [{"en": "2–3 days before", "ar": "قبل 2–3 أيام"}, {"en": "1 hour before", "ar": "قبل ساعة"}, {"en": "One month before", "ar": "قبل شهر"}, {"en": "It is not needed", "ar": "لا حاجة إليه"}], "answer": 0, "why": "تقليل الألياف أياماً قبل الفحص يقلل البراز المتبقي الذي قد يشبه الأورام أو السلائل."}, {"q_en": "What bowel preparation is usually given the day before enteroclysis?", "q_ar": "ما تحضير الأمعاء الذي يُعطى عادةً في اليوم السابق لحقنة الأمعاء الدقيقة؟", "options": [{"en": "A high-fibre meal", "ar": "وجبة عالية الألياف"}, {"en": "Iodine tablets", "ar": "أقراص اليود"}, {"en": "Nothing at all", "ar": "لا شيء"}, {"en": "A laxative with low-residue diet", "ar": "مليّن مع طعام قليل الألياف"}], "answer": 3, "why": "تنظيف القولون يسمح للتباين بالوصول إلى نهاية اللفائفي والقولون دون عوائق."}, {"q_en": "Before enteroclysis, the patient must be told that:", "q_ar": "قبل حقنة الأمعاء الدقيقة يجب إخبار المريض بأن:", "options": [{"en": "A tube will be passed through the nose into the small bowel", "ar": "أنبوباً سيُدخل من الأنف إلى الأمعاء الدقيقة"}, {"en": "He will drink 2 litres of iodine", "ar": "سيشرب لترين من اليود"}, {"en": "An injection will be given in the spine", "ar": "حقنة ستُعطى في العمود الفقري"}, {"en": "He will be fully anaesthetised", "ar": "سيُخدّر تخديراً عاماً"}], "answer": 0, "why": "شرح إدخال الأنبوب وأخذ الموافقة يقلل خوف المريض ويزيد تعاونه."}, {"q_en": "Why is oral barium often given about one hour before defaecating proctography?", "q_ar": "لماذا يُعطى الباريوم بالفم غالباً قبل تصوير التغوّط بساعة تقريباً؟", "options": [{"en": "To clean the rectum", "ar": "لتنظيف المستقيم"}, {"en": "To show small bowel loops and detect an enterocele", "ar": "لإظهار عُرى الأمعاء الدقيقة وكشف قيلة الأمعاء"}, {"en": "To relax the anal sphincter", "ar": "لإرخاء العاصرة الشرجية"}, {"en": "To reduce pain", "ar": "لتقليل الألم"}], "answer": 1, "why": "عُرى الأمعاء الدقيقة الملونة تُظهر إن كانت تنزل بين المستقيم والمهبل (enterocele)."}, {"q_en": "Which bowel preparation is usually needed before defaecating proctography?", "q_ar": "ما تحضير الأمعاء المطلوب عادةً قبل تصوير التغوّط؟", "options": [{"en": "Usually none", "ar": "عادةً لا شيء"}, {"en": "Strong laxative for 3 days", "ar": "مليّن قوي 3 أيام"}, {"en": "Fasting for 24 hours", "ar": "صيام 24 ساعة"}, {"en": "Iodine tablets", "ar": "أقراص اليود"}], "answer": 0, "why": "الفحص يدرس عملية الإفراغ الطبيعية، لذلك لا يحتاج عادةً تنظيفاً للأمعاء."}, {"q_en": "Which blood test is checked before an IVU?", "q_ar": "أي فحص دم يُراجع قبل تصوير المسالك البولية الوريدي؟", "options": [{"en": "Haemoglobin only", "ar": "الهيموغلوبين فقط"}, {"en": "Blood sugar only", "ar": "سكر الدم فقط"}, {"en": "Renal function (creatinine / eGFR)", "ar": "وظيفة الكلى (creatinine / eGFR)"}, {"en": "Liver enzymes only", "ar": "إنزيمات الكبد فقط"}], "answer": 2, "why": "التباين اليودي يُطرح عن طريق الكلى، والكلية الضعيفة معرّضة لاعتلال بسبب التباين."}, {"q_en": "Why is a control (plain) KUB taken before injecting contrast in IVU?", "q_ar": "لماذا تؤخذ صورة بطن قبل حقن التباين في تصوير المسالك الوريدي؟", "options": [{"en": "To warm up the X-ray tube", "ar": "لتسخين أنبوب الأشعة"}, {"en": "To detect calcifications/stones that contrast may hide", "ar": "لكشف التكلّسات والحصى التي قد يخفيها التباين"}, {"en": "To measure the patient's height", "ar": "لقياس طول المريض"}, {"en": "It is not needed", "ar": "لا حاجة إليها"}], "answer": 1, "why": "الحصاة قد تختفي داخل التباين الأبيض، فتُرى أولاً على الصورة البسيطة."}, {"q_en": "Which condition must be excluded before an MCUG?", "q_ar": "أي حالة يجب استبعادها قبل تصوير المثانة أثناء التبول؟", "options": [{"en": "Active urinary tract infection", "ar": "التهاب بولي نشط"}, {"en": "Short stature", "ar": "قصر القامة"}, {"en": "Mild cough", "ar": "سعال خفيف"}, {"en": "Dental caries", "ar": "تسوّس الأسنان"}], "answer": 0, "why": "القثطرة والارتجاع قد ينقلان العدوى النشطة إلى الكلى."}, {"q_en": "Does a child need to fast before an MCUG?", "q_ar": "هل يحتاج الطفل إلى الصيام قبل تصوير المثانة أثناء التبول؟", "options": [{"en": "Yes, 12 hours", "ar": "نعم، 12 ساعة"}, {"en": "Yes, from the day before", "ar": "نعم، من اليوم السابق"}, {"en": "Yes, because of general anaesthesia always", "ar": "نعم، لأن التخدير العام دائم"}, {"en": "No, fasting is not needed", "ar": "لا، لا يحتاج صياماً"}], "answer": 3, "why": "التباين يدخل المثانة عبر القثطرة وليس الجهاز الهضمي، فلا حاجة للصيام."}, {"q_en": "Which preparation is usually needed before a RUG?", "q_ar": "ما التحضير المطلوب عادةً قبل تصوير الإحليل الراجع؟", "options": [{"en": "Fasting for 8 hours", "ar": "صيام 8 ساعات"}, {"en": "No special preparation; empty the bladder", "ar": "لا تحضير خاص؛ إفراغ المثانة"}, {"en": "Bowel cleansing", "ar": "تنظيف الأمعاء"}, {"en": "General anaesthesia", "ar": "تخدير عام"}], "answer": 1, "why": "التباين يدخل الإحليل مباشرةً فلا يحتاج صياماً ولا تنظيفاً للأمعاء."}, {"q_en": "What is the usual patient position for a RUG?", "q_ar": "ما الوضعية المعتادة للمريض في تصوير الإحليل الراجع؟", "options": [{"en": "Prone", "ar": "منبطح"}, {"en": "Erect PA", "ar": "قائم خلفي أمامي"}, {"en": "30–45° oblique", "ar": "مائل 30–45 درجة"}, {"en": "Sitting", "ar": "جالس"}], "answer": 2, "why": "الوضع المائل يمنع تراكب الإحليل على نفسه فيظهر بطوله كاملاً."}, {"q_en": "Why must the patient fast before retrograde pyelography?", "q_ar": "لماذا يصوم المريض قبل تصوير الحويضة الراجع؟", "options": [{"en": "The procedure is usually done under anaesthesia", "ar": "لأن الإجراء غالباً تحت التخدير"}, {"en": "To empty the colon", "ar": "لتفريغ القولون"}, {"en": "Contrast is given orally", "ar": "لأن التباين يُعطى بالفم"}, {"en": "To reduce radiation", "ar": "لتقليل الإشعاع"}], "answer": 0, "why": "الصيام قبل التخدير يمنع استنشاق محتوى المعدة."}, {"q_en": "Which condition should be excluded before retrograde pyelography?", "q_ar": "أي حالة يجب استبعادها قبل تصوير الحويضة الراجع؟", "options": [{"en": "Myopia", "ar": "قصر النظر"}, {"en": "Flat feet", "ar": "تسطّح القدم"}, {"en": "Hair loss", "ar": "تساقط الشعر"}, {"en": "Active urinary tract infection", "ar": "التهاب بولي نشط"}], "answer": 3, "why": "إدخال المنظار والقثطرة مع التهاب نشط قد ينشر العدوى إلى الدم."}, {"q_en": "In a trauma patient, what must be done before passing a urethral catheter for cystography?", "q_ar": "عند مريض الرضّ، ماذا يجب قبل إدخال القثطرة الإحليلية لتصوير المثانة؟", "options": [{"en": "Exclude urethral injury (RUG)", "ar": "استبعاد إصابة الإحليل (تصوير الإحليل الراجع)"}, {"en": "Give a laxative", "ar": "إعطاء مليّن"}, {"en": "Fast for 12 hours", "ar": "صيام 12 ساعة"}, {"en": "Do a barium meal", "ar": "عمل وجبة باريوم"}], "answer": 0, "why": "إدخال القثطرة في إحليل ممزّق قد يزيد الإصابة."}, {"q_en": "Which film is important to detect a posterior leak in cystography?", "q_ar": "أي صورة مهمة لكشف التسرّب الخلفي في تصوير المثانة؟", "options": [{"en": "Pre-contrast skull", "ar": "جمجمة قبل التباين"}, {"en": "Chest PA", "ar": "صدر خلفي أمامي"}, {"en": "Lateral cervical spine", "ar": "رقبة جانبي"}, {"en": "Post-drainage film", "ar": "صورة بعد تفريغ المثانة"}], "answer": 3, "why": "المثانة الممتلئة قد تُخفي التسرّب خلفها، فيظهر بعد تفريغها."}, {"q_en": "Which test is essential before antegrade pyelography?", "q_ar": "أي فحص ضروري قبل تصوير الحويضة الأمامي؟", "options": [{"en": "Visual acuity", "ar": "حدّة البصر"}, {"en": "Clotting profile", "ar": "فحص تخثّر الدم"}, {"en": "Hearing test", "ar": "فحص السمع"}, {"en": "Lung function", "ar": "وظيفة الرئة"}], "answer": 1, "why": "الوخز عبر الجلد إلى الكلية قد يسبب نزيفاً إذا كان تخثّر الدم ضعيفاً."}, {"q_en": "In which position is the patient usually placed for antegrade pyelography?", "q_ar": "ما الوضعية المعتادة للمريض في تصوير الحويضة الأمامي؟", "options": [{"en": "Erect", "ar": "قائم"}, {"en": "Lithotomy", "ar": "وضعية الولادة"}, {"en": "Prone", "ar": "منبطح"}, {"en": "Sitting", "ar": "جالس"}], "answer": 2, "why": "الكلية تُوخز من الظهر، لذلك يكون المريض منبطحاً."}, {"q_en": "When in the menstrual cycle is HSG usually performed?", "q_ar": "متى يُجرى تصوير الرحم والأنابيب عادةً في الدورة الشهرية؟", "options": [{"en": "During menstruation", "ar": "أثناء الدورة"}, {"en": "Day 20–25", "ar": "اليوم 20–25"}, {"en": "After menstruation ends and before ovulation (about day 6–12)", "ar": "بعد انتهاء الدورة وقبل الإباضة (اليوم 6–12 تقريباً)"}, {"en": "Any day, timing does not matter", "ar": "أي يوم، التوقيت غير مهم"}], "answer": 2, "why": "في الطور التكاثري تكون البطانة رقيقة فيتضح التجويف، ويقلّ احتمال وجود حمل مبكر (Radiopaedia)."}, {"q_en": "Which instruction is given to the patient before HSG?", "q_ar": "أي تعليمات تُعطى للمريضة قبل تصوير الرحم والأنابيب؟", "options": [{"en": "Drink 1 litre of barium", "ar": "شرب لتر من الباريوم"}, {"en": "Avoid unprotected intercourse from the start of the cycle until the test", "ar": "تجنّب الجماع غير المحمي من بداية الدورة حتى الفحص"}, {"en": "Stop all water for 24 hours", "ar": "منع الماء 24 ساعة"}, {"en": "Take a strong laxative for 3 days", "ar": "مليّن قوي 3 أيام"}], "answer": 1, "why": "الهدف منع إجراء الفحص على حمل مبكر غير معروف."}, {"q_en": "Why must air bubbles be removed before injecting contrast in T-tube cholangiography?", "q_ar": "لماذا يجب إخراج فقاعات الهواء قبل حقن المادة الظليلة في تصوير أنبوب T؟", "options": [{"en": "To reduce radiation dose", "ar": "لتقليل جرعة الإشعاع"}, {"en": "Air bubbles لألم"}, {"en": "To keep the foot warm", "ar": "لتدفئة القدم"}], "answer": 1, "why": "الرباط يضغط الأوردة السطحية فتنتقل المادة الظليلة إلى الأوردة العميقة المراد فحصها."}, {"q_en": "Where is the cannula placed for lower-limb ascending venography?", "q_ar": "أين توضع الكانيولا في تصوير أوردة الطرف السفلي؟", "options": [{"en": "Femoral artery", "ar": "الشريان الفخذي"}, {"en": "Antecubital vein", "ar": "وريد ثنية المرفق"}, {"en": "Dorsal vein of the foot", "ar": "وريد بظهر القدم"}, {"en": "Jugular vein", "ar": "الوريد الوداجي"}], "answer": 2, "why": "يُحقن في وريد بظهر القدم لأن المادة تصعد مع جريان الدم نحو الساق والفخذ والحوض."}, {"q_en": "What is the most important precaution during arthrography injection?", "q_ar": "ما أهم احتياط أثناء حقن المفصل في التصوير الظليل؟", "options": [{"en": "Strict aseptic technique", "ar": "التعقيم الكامل"}, {"en": "Fasting for 12 hours", "ar": "الصيام 12 ساعة"}, {"en": "Bowel preparation", "ar": "تنظيف الأمعاء"}, {"en": "Full bladder", "ar": "امتلاء المثانة"}], "answer": 0, "why": "الإبرة تدخل مباشرة إلى تجويف المفصل، وأي تلوث قد يسبب التهاب المفصل الصديدي."}, {"q_en": "Which condition is a contraindication to arthrography?", "q_ar": "أي حالة تمنع إجراء تصوير المفصل الظليل؟", "options": [{"en": "Previous fracture", "ar": "كسر سابق"}, {"en": "Joint pain", "ar": "ألم المفصل"}, {"en": "Skin infection over the puncture site", "ar": "التهاب جلدي فوق مكان الوخز"}, {"en": "Age over 40", "ar": "العمر فوق 40"}], "answer": 2, "why": "الوخز عبر جلد ملتهب قد ينقل الجرثومة إلى داخل المفصل."}, {"q_en": "Which type of contrast is used for myelography?", "q_ar": "ما نوع المادة الظليلة المستخدمة في تصوير النخاع؟", "options": [{"en": "Barium sulphate", "ar": "كبريتات الباريوم"}, {"en": "Ionic iodinated contrast", "ar": "مادة يودية أيونية"}, {"en": "Oil-based contrast", "ar": "مادة زيتية"}, {"en": "Non-ionic iodinated contrast approved for intrathecal use", "ar": "مادة يودية non-ionic مرخّصة للحقن داخل القراب"}], "answer": 3, "why": "المادة الأيونية سامة للجهاز العصبي، لذلك تُستعمل فقط المواد non-ionic المرخّصة للحقن داخل القراب."}, {"q_en": "What is the most common complication after myelography?", "q_ar": "ما أشيع مضاعفة بعد تصوير النخاع؟", "options": [{"en": "Post-dural puncture headache", "ar": "صداع ما بعد البزل القطني"}, {"en": "Fracture", "ar": "كسر"}, {"en": "Pneumothorax", "ar": "استرواح الصدر"}, {"en": "Renal colic", "ar": "مغص كلوي"}], "answer": 0, "why": "تسرّب السائل الدماغي الشوكي من ثقب الإبرة يسبب صداعاً يزداد بالوقوف."}, {"q_en": "Why is a metallic marker placed on the skin opening before sinography?", "q_ar": "لماذا توضع علامة معدنية على فتحة الجلد قبل تصوير الجيب؟", "options": [{"en": "To sterilise the opening", "ar": "لتعقيم الفتحة"}, {"en": "To show the site of the external opening on the image", "ar": "لإظهار مكان الفتحة الخارجية على الصورة"}, {"en": "To reduce the radiation dose", "ar": "لتقليل جرعة الإشعاع"}, {"en": "To stop the discharge", "ar": "لإيقاف الإفرازات"}], "answer": 1, "why": "العلامة تحدد مكان الفتحة الخارجية فيُعرف اتجاه المسار وعمقه بالنسبة لها."}, {"q_en": "Which contrast type is preferred for sinography/fistulography?", "q_ar": "ما نوع المادة الظليلة المفضلة في تصوير الجيب والناسور؟", "options": [{"en": "Barium sulphate", "ar": "كبريتات الباريوم"}, {"en": "Carbon dioxide", "ar": "ثاني أوكسيد الكاربون"}, {"en": "Water-soluble iodinated contrast", "ar": "مادة يودية ذائبة بالماء"}, {"en": "Gadolinium only", "ar": "الغادولينيوم فقط"}], "answer": 2, "why": "المسار قد يتصل بتجويف البطن أو الأنسجة، والمادة الذائبة بالماء تمتص بأمان، أما الباريوم فيبقى ويسبب التهاباً."}, {"q_en": "Why are scout (plain) films taken before injecting contrast in sialography?", "q_ar": "لماذا تُؤخذ صور أولية قبل حقن المادة في تصوير الغدد اللعابية؟", "options": [{"en": "To detect radio-opaque stones that contrast might hide", "ar": "لكشف الحصى الظاهرة التي قد تخفيها المادة الظليلة"}, {"en": "To measure blood flow", "ar": "لقياس جريان الدم"}, {"en": "To check the teeth for caries", "ar": "لفحص تسوس الأسنان"}, {"en": "To reduce the dose", "ar": "لتقليل الجرعة"}], "answer": 0, "why": "المادة الظليلة البيضاء قد تغطي الحصاة، فتُكشف الحصى أولاً على الصورة البسيطة."}, {"q_en": "Which item must be removed before sialography?", "q_ar": "ما الذي يجب رفعه قبل تصوير الغدد اللعابية؟", "options": [{"en": "Shoes", "ar": "الحذاء"}, {"en": "Wristwatch", "ar": "ساعة اليد"}, {"en": "Belt", "ar": "الحزام"}, {"en": "Dentures", "ar": "طقم الأسنان"}], "answer": 3, "why": "طقم الأسنان والمعادن في الفم تتراكب على الغدة والقنوات وتخفي التفاصيل."}, {"q_en": "What is applied to the eye before dacryocystography?", "q_ar": "ماذا يوضع على العين قبل تصوير الجهاز الدمعي؟", "options": [{"en": "Mydriatic drops", "ar": "قطرة موسّعة للحدقة"}, {"en": "Topical anaesthetic drops", "ar": "قطرة مخدّر موضعي"}, {"en": "Antibiotic ointment only", "ar": "مرهم مضاد حيوي فقط"}, {"en": "Eye patch for 24 hours", "ar": "غطاء للعين 24 ساعة"}], "answer": 1, "why": "القطرة المخدرة تقلل الألم عند إدخال القثطار في الفتحة الدمعية."}, {"q_en": "Which condition is a contraindication to dacryocystography?", "q_ar": "أي حالة تمنع إجراء تصوير الجهاز الدمعي؟", "options": [{"en": "Epiphora", "ar": "الدموع المستمرة"}, {"en": "Old age", "ar": "كبر السن"}, {"en": "Acute dacryocystitis", "ar": "التهاب الكيس الدمعي الحاد"}, {"en": "Wearing glasses", "ar": "لبس النظارة"}], "answer": 2, "why": "الحقن أثناء الالتهاب الحاد يؤلم وقد ينشر الالتهاب، أما الدموع المستمرة فهي سبب إجراء الفحص."}], "title_en": "X-ray contrast — patient preparation", "title_ar": "تحضير المريض"}</script>
