<script type="application/json" id="quiz-data">{"questions": [{"q_en": "On which sequence does gadolinium make enhancing tissue appear bright?", "q_ar": "على أي تسلسل تجعل صبغة الغادولينيوم النسيج المتعزّز أبيض؟", "options": [{"en": "T2", "ar": "T2"}, {"en": "T1", "ar": "T1"}, {"en": "DWI", "ar": "DWI"}, {"en": "STIR", "ar": "STIR"}], "answer": 1, "why": "الغادولينيوم يقصّر زمن T1، فيظهر التعزيز أبيض على صور T1 بعد الحقن (T1 C+)."}, {"q_en": "Which question is essential before giving gadolinium?", "q_ar": "أي سؤال مهم قبل إعطاء صبغة الغادولينيوم؟", "options": [{"en": "Last meal time only", "ar": "موعد آخر وجبة فقط"}, {"en": "Blood group", "ar": "فصيلة الدم"}, {"en": "History of kidney disease or dialysis", "ar": "وجود مرض كلوي أو غسيل كلوي"}, {"en": "Eye colour", "ar": "لون العين"}], "answer": 2, "why": "الغادولينيوم يُطرح بالكلية، وخطر NSF يكون عند القصور الكلوي الشديد."}, {"q_en": "Nephrogenic systemic fibrosis (NSF) after gadolinium mainly occurs in patients with:", "q_ar": "التليّف الجهازي كلوي المنشأ (NSF) بعد الغادولينيوم يحدث غالباً عند المرضى المصابين بـ:", "options": [{"en": "Asthma", "ar": "الربو"}, {"en": "Diabetes with normal kidneys", "ar": "السكري مع كلى طبيعية"}, {"en": "Claustrophobia", "ar": "رهاب الأماكن المغلقة"}, {"en": "Severe renal impairment", "ar": "قصور كلوي شديد"}], "answer": 3, "why": "الصبغة تبقى بالجسم مدة أطول عند القصور الكلوي الشديد (eGFR < 30) أو الحاد أو الغسيل، فيزداد خطر NSF."}, {"q_en": "A breastfeeding mother receives gadolinium. According to ACR:", "q_ar": "أمّ مرضعة أخذت صبغة الغادولينيوم. حسب ACR:", "options": [{"en": "She may continue breastfeeding", "ar": "يمكنها الاستمرار بالرضاعة"}, {"en": "She must stop for one week", "ar": "يجب أن توقف أسبوعاً"}, {"en": "The baby needs a blood test", "ar": "الطفل يحتاج تحليل دم"}, {"en": "She needs dialysis", "ar": "تحتاج غسيلاً كلوياً"}], "answer": 0, "why": "كمية قليلة جداً تصل للحليب ويُمتص منها أقل من 1% من أمعاء الطفل، فلا داعي لإيقاف الرضاعة، والإيقاف 12–24 ساعة اختياري للأم."}, {"q_en": "In CE-MRA, image timing is set with:", "q_ar": "في CE-MRA يُضبط توقيت التصوير بواسطة:", "options": [{"en": "Barium swallow", "ar": "بلع الباريوم"}, {"en": "Bolus tracking or test bolus", "ar": "تتبّع الحقنة (bolus tracking) أو حقنة اختبار"}, {"en": "Fasting for 12 hours", "ar": "صيام 12 ساعة"}, {"en": "A full bladder", "ar": "مثانة ممتلئة"}], "answer": 1, "why": "يجب التقاط الصور لحظة وصول الصبغة للشرايين (الطور الشرياني)، ويُحدَّد ذلك بتتبّع الحقنة أو حقنة اختبار."}], "title_en": "MRI contrast — patient preparation", "title_ar": "تحضير المريض"}</script>
